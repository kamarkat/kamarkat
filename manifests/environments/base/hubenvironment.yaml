apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-environment
spec:
  # spec.environment is GONE (ADR-111 Revision 7): the hub has no workload
  # environment, so there was no value for it to carry and no rule left for it to
  # key. What it used to gate -- the env-as-zone domain rules -- was already
  # replaced by a declared subdomain in ADR-051's Amendment 2026-09-18.
  # Domain is sourced from hub-bootstrap-config ConfigMap
  domain: nutgraf.in
  # The logical hub: this box, for as long as it exists (ADR-111 ss1). Templated
  # per box like clusterName below, and never equal to it by rule -- the two are
  # separate because they have separate lifetimes, and a successor hub carries a
  # new clusterName under the same boxId.
  boxId: prod-hetzner
  # The cluster this box is, as CAPI names it and as the escrow keys
  # CLUSTER-scoped artefacts by: the admin kubeconfig and the at-rest encryption
  # key, which are replaced along with the cluster. What must outlive the cluster
  # is keyed by boxId above.
  #
  # Declared because the operator will not infer it: metadata.name is the
  # singleton "hub-environment" on every box, and keying the escrow by that put
  # every box's master keys at one shared path and looked for the admin
  # kubeconfig at platform-capi/hub-environment-kubeconfig, which CAPI never
  # creates. Templated per box like the domain above.
  clusterName: prod-hetzner
  tls:
    issuer: letsencrypt-prod
    email: ops@nutgraf.in
  observability:
    victoriaMetrics:
      retentionPeriod: 90d
    grafanaAlloy:
      scrapeInterval: 15s
  database:
    # The BOOTSTRAP cluster, not a shared one: every application role names its own
    # (ADR-112). This is the cluster Infisical's database is on, which is the one the
    # operator itself depends on -- Day-0 waits for it, the generated bootstrap secrets
    # address it, and its CA is what Infisical is handed.
    clusterRef: infisical-db
    namespace: platform-data
    roles:
    # Declare a role here ONLY if its credential Secret is delivered. RoleManager
    # iterates this list and returns on the first failure, so a role whose Secret never
    # arrives skips every role after it -- and the symptom is the LAST application in
    # the list failing to authenticate, which names neither this file nor the role that
    # actually broke.
    #
    # `infisical` is deliberately absent. It is a bootstrap role owned by CNPG
    # (infisical-db spec.managed.roles, ADR-023 addendum), not an application role.
    # RoleManager reads each role's credential from an ESO-synced Secret sourced from
    # Infisical, so it cannot be the thing that lets Infisical start, and listing it
    # here would also give one role two controllers. See
    # manifests/hub-core-services/infisical/database/infisical-db.yaml.

    # The identity provider's role (ADR-060).
    #
    # It OWNS its database rather than holding DML grants on one: Zitadel runs its own
    # schema migrations at startup (its init and setup Jobs), so it needs DDL. Ownership
    # is set on the Database CR; the permissions below are the DML floor the role
    # manager applies to every declared role.
    - name: hub_zitadel
      database: zitadel
      # ADR-112: the application's OWN cluster, which is where it connects. A role
      # provisioned on any other cluster is a role the application cannot use, and
      # RoleManager would report success for it.
      clusterRef: zitadel-db
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE

    # The Credit Authority's ledger role (ADR-109). Declared on EVERY box, with
    # its credential delivered by the database prerequisites
    # (hub-credits-db-credentials), because this list is not capability-aware
    # and stops at the first role whose Secret is missing: a role present only
    # while the capability ran would block every role after it on boxes that
    # leave credits off. It owns the credits database, as hub_zitadel owns
    # zitadel's; the ledger service itself runs only when the capability is on.
    - name: hub_credits
      database: credits
      # ADR-112: the application's OWN cluster, which is where it connects. A role
      # provisioned on any other cluster is a role the application cannot use, and
      # RoleManager would report success for it.
      clusterRef: credits-db
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE

    # The hub Grafana (ADR-078 add.5 §6). It owns the grafana database, as
    # hub_credits owns credits, because Grafana runs its own schema migrations.
    - name: hub_grafana
      database: grafana
      # ADR-112: the application's OWN cluster, which is where it connects. A role
      # provisioned on any other cluster is a role the application cannot use, and
      # RoleManager would report success for it.
      clusterRef: grafana-db
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
  oauth:
    clients:
    - clientId: mcp-server
      clientName: "MCP Server"
      # WS4 / ADR-051: base declares spec.domain: nutgraf.in (the production apex),
      # so this redirect URI must be the apex too. It previously read
      # mcp.dev.nutgraf.in — a DEV callback. dev overrides oauth with localhost and
      # stg had no oauth patch, so the dev literal was inherited only by stg and
      # prod: a production authorization code would redirect to a dev-controlled
      # host. Interim value; C7 derives this from spec.domain into a generated
      # artifact, after which no environment declares it directly.
      redirectUris:
      - "https://mcp.nutgraf.in/callback"
      grantTypes:
      - authorization_code
      - refresh_token
      responseTypes:
      - code
  secrets:
    infisical:
      # ProjectSlug is sourced from hub-bootstrap-config ConfigMap.
      projectSlug: hub-platform
      # The MANAGEMENT secret scope (ADR-111 Revision 7): the Infisical environment
      # holding this hub's own credentials, not a workload environment.
      #
      # A placeholder, like boxId and clusterName above: templated per box from the
      # one declared input, `management.infisicalEnvironmentSlug`. It read `dev`
      # while a CEL rule pinned it equal to spec.environment, which is what made the
      # hub's secret scope a workload environment by construction.
      environmentSlug: PLACEHOLDER_MANAGEMENT_SCOPE
