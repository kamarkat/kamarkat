# Every third-party and platform artefact a bundle version ships, described once.
#
# scripts/package/inventory.py lists what a release installs and joins each
# artefact to an entry here by `match` (an exact key, or a prefix ending in *).
# An artefact with no entry fails the release: a component is published only
# with a description, a licence and a layer, so the inventory a tenant reads is
# complete by construction rather than by someone remembering to update it.
#
# Keys: a container repository; pkg:<apt or versioned download>; url:<unversioned
# download>; os:<image>; tool:<CLI binary>.
#
#   layer: machinery                 every box runs it
#          capability                a platform tool a tenant selects
#          workload-infrastructure   what applications rest on
#
# license is the SPDX identifier of the upstream project. An empty value means
# it has not been verified, and the docs say so rather than guessing.
#
# repo is where the component's title links: owner/name for a GitHub repository,
# or a URL. track says where its versions are published, so the docs can show the
# newest one as of each bundle's release date:
#
#   releases   GitHub releases of repo; the default for an owner/name repo
#   tags       Git tags of repo, for a project that tags but publishes no releases
#   dockerhub  the artefact's own Docker Hub tags
#   ghcr       the artefact's own GHCR package, compared by digest; for images
#              the platform builds itself
#   ubuntu     Ubuntu's LTS releases
#   file       a version written in `file` of repository `from`, at its newest release
#
# tag is the pattern a version is read from, its groups joined with dots; the
# default is v1.2.3. repos gives an artefact from another project its own repo
# (and, written as a mapping, its own track, tag, file and from), keyed like match.
# Every component is tracked: an entry whose versions cannot be found fails the
# docs sync rather than showing no version.
#
# behind explains why the shipped version is not the newest upstream release.
# The docs show it on the release page, behind an info icon on each red version.
# It is a list; an item covers the shipped versions it names, exactly as the
# release page's Version column shows them (v1.31.6, 15-alpine, digest-pinned):
#
#   versions    the shipped versions this reason covers
#   status      held | scheduled | not assessed | declined
#   reason      one or two sentences a box operator can read
#   blocked_by  optional: the catalog entry it waits on
#   target      optional: the release it moves in
#   ref         optional: an ADR, plan or issue
#
# A red version with no reason fails the docs sync. Update the item when you
# change the pin: a reason is for the version it names. A target must be a release
# version, and a release that still ships the version fails its check when the
# target is that release or an earlier one: land the change, or retarget it.

components:
  # ── Nodes ───────────────────────────────────────────────────────────────
  - name: Ubuntu
    description: The node operating system, the provider's stock image.
    license: "Per package; see /usr/share/doc/<package>/copyright on the node"
    repo: https://launchpad.net/ubuntu
    track: ubuntu
    layer: machinery
    match: ["os:ubuntu"]
    behind:
      - versions: ["24.04"]
        status: held
        reason: >-
          The node image is the provider's own published system image, named by the exact
          string the provider uses. Whether the newest release is published in the cloud
          catalogue, and under what name, is not readable without provider credentials and has
          not been confirmed. The newest image may also be built for a narrower processor
          baseline than the machine types in use, which is a separate question from
          availability.
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: containerd
    description: The container runtime on every node.
    license: Apache-2.0
    repo: containerd/containerd
    layer: machinery
    match: ["pkg:containerd"]

  - name: runc
    description: The low-level runtime containerd starts containers with.
    license: Apache-2.0
    repo: opencontainers/runc
    layer: machinery
    match: ["pkg:runc"]

  - name: Kubernetes node tools
    description: kubelet runs the node's pods; kubeadm joins it to the cluster; kubectl is the command-line client.
    license: Apache-2.0
    repo: kubernetes/kubernetes
    layer: machinery
    match: ["pkg:kubelet", "pkg:kubeadm", "pkg:kubectl"]
    behind:
      - versions: ["1.35.10"]
        status: held
        reason: Follows the node's Kubernetes version
        blocked_by: Kubernetes
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: Tailscale
    description: Joins the node to the tailnet when a tailnet hostname is configured for it.
    license: BSD-3-Clause
    repo: tailscale/tailscale
    layer: machinery
    match: ["pkg:tailscale"]
    behind:
      - versions: ["1.104.4"]
        status: not assessed
        reason: One patch behind; installed by the node bootstrap

  # ── Kubernetes control plane ────────────────────────────────────────────
  - name: Kubernetes
    description: The control plane kubeadm runs at the pinned Kubernetes version.
    license: Apache-2.0
    repo: kubernetes/kubernetes
    repos:
      registry.k8s.io/pause:
        repo: https://github.com/kubernetes/kubernetes/tree/master/build/pause
        track: file
        from: kubernetes/kubernetes
        file: build/pause/Makefile
        tag: '^TAG \?= (\d+)\.(\d+)(?:\.(\d+))?$'
    layer: machinery
    match: ["registry.k8s.io/kube-apiserver", "registry.k8s.io/kube-controller-manager",
            "registry.k8s.io/kube-scheduler", "registry.k8s.io/kube-proxy", "registry.k8s.io/pause"]
    behind:
      - versions: ["v1.35.10"]
        status: held
        reason: Policy engine supports 1.33-1.35 only
        blocked_by: Kyverno
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
      - versions: ["3.10.1"]
        status: held
        reason: Pause image chosen by kubeadm, not pinned here
        blocked_by: Kubernetes
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: etcd
    description: The control plane's key-value store.
    license: Apache-2.0
    repo: etcd-io/etcd
    layer: machinery
    match: ["registry.k8s.io/etcd"]
    behind:
      - versions: ["3.6.6-0"]
        status: held
        reason: Chosen by kubeadm, not pinned here
        blocked_by: Kubernetes
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: CoreDNS
    description: Cluster DNS.
    license: Apache-2.0
    repo: coredns/coredns
    layer: machinery
    match: ["registry.k8s.io/coredns/*"]
    behind:
      - versions: ["v1.13.1"]
        status: held
        reason: Chosen by kubeadm, not pinned here
        blocked_by: Kubernetes
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  # ── Cluster lifecycle ───────────────────────────────────────────────────
  - name: Cluster API
    description: Declarative cluster lifecycle. Creates, scales and replaces the management cluster and managed clusters.
    license: Apache-2.0
    repo: kubernetes-sigs/cluster-api
    repos:
      registry.k8s.io/capi-operator/*: kubernetes-sigs/cluster-api-operator
    layer: machinery
    match: ["registry.k8s.io/cluster-api/*", "registry.k8s.io/capi-operator/*", "tool:clusterctl"]
    behind:
      - versions: ["v1.13.7"]
        status: held
        reason: Infrastructure provider is tested to 1.13 only
        blocked_by: Cluster API provider for Hetzner
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
      - versions: ["v0.29.0"]
        status: held
        reason: The newer operator moves to CAPI 1.14
        blocked_by: Cluster API
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: Cluster API provider for Hetzner
    description: Creates cluster machines, networks and load balancers in the cloud account.
    license: Apache-2.0
    repo: syself/cluster-api-provider-hetzner
    layer: machinery
    match: ["ghcr.io/syself/caph*"]
  - name: cert-manager
    description: Issues and renews the TLS certificates for every gateway and webhook.
    license: Apache-2.0
    repo: cert-manager/cert-manager
    layer: machinery
    match: ["quay.io/jetstack/*"]
  - name: cert-manager DNS-01 webhook
    description: Proves domain ownership for certificates through the provider's DNS.
    license: Apache-2.0
    repo: hetzner/cert-manager-webhook-hetzner
    layer: machinery
    match: [docker.io/hetzner/cert-manager-webhook-hetzner]
    behind:
      - versions: ["v0.9.0"]
        status: not assessed
        reason: >-
          A patch release behind, in a vendored render. Nobody has assessed the move.
  # ── GitOps and composition ──────────────────────────────────────────────
  - name: Argo CD
    description: The GitOps engine. Reconciles every cluster to the GitOps repository and the pinned bundle.
    license: Apache-2.0
    repo: argoproj/argo-cd
    repos:
      ghcr.io/dexidp/*: dexidp/dex
      public.ecr.aws/docker/library/redis: redis/redis
      ecr-public.aws.com/docker/library/redis: redis/redis
      docker.io/library/haproxy:
        repo: haproxy/haproxy
        track: dockerhub
    layer: machinery
    match: ["quay.io/argoproj/argocd", "ghcr.io/dexidp/*", "public.ecr.aws/docker/library/redis", "ecr-public.aws.com/docker/library/redis", "docker.io/library/haproxy"]
    behind:
      - versions: ["v3.5.7"]
        status: held
        reason: Newest chart ships 3.5.7
  - name: Argo CD agent
    description: Connects each managed cluster's GitOps engine to the management cluster over an outbound channel.
    license: Apache-2.0
    repo: argoproj-labs/argocd-agent
    layer: machinery
    match: ["quay.io/argoprojlabs/*"]
  - name: Argo Rollouts
    description: Progressive delivery for application workloads.
    license: Apache-2.0
    repo: argoproj/argo-rollouts
    layer: workload-infrastructure
    match: ["quay.io/argoproj/argo-rollouts"]
    behind:
      - versions: ["v1.9.1"]
        status: not assessed
        reason: A minor behind. Nobody has assessed the move.
  - name: capi2argo
    description: Registers each cluster Cluster API creates with the GitOps engine.
    license: Apache-2.0
    repo: dntosas/capi2argo-cluster-operator
    layer: machinery
    match: ["ghcr.io/dntosas/*"]

  - name: Crossplane
    description: Composition. Turns one declaration into the set of resources behind it.
    license: Apache-2.0
    repo: crossplane/crossplane
    layer: machinery
    match: ["xpkg.crossplane.io/crossplane/*"]
  - name: Crossplane Kubernetes provider
    description: Lets a composition create objects in any cluster the platform manages.
    license: Apache-2.0
    repo: crossplane-contrib/provider-kubernetes
    layer: machinery
    match: [xpkg.upbound.io/crossplane-contrib/provider-kubernetes]
  - name: Crossplane SQL provider
    description: Creates application databases and roles inside the platform database.
    license: Apache-2.0
    repo: crossplane-contrib/provider-sql
    layer: capability
    match: [xpkg.upbound.io/crossplane-contrib/provider-sql]
  - name: Patch and transform function
    description: The composition function the platform's compositions are written in.
    license: Apache-2.0
    repo: crossplane-contrib/function-patch-and-transform
    layer: machinery
    match: [xpkg.upbound.io/crossplane-contrib/function-patch-and-transform]
  - name: Reloader
    description: Restarts a workload when a secret or config map it reads changes.
    license: Apache-2.0
    repo: stakater/Reloader
    layer: machinery
    match: ["ghcr.io/stakater/*"]
  # ── Networking ──────────────────────────────────────────────────────────
  - name: Cilium
    description: Container networking, network policy and the Gateway API implementation.
    license: Apache-2.0
    repo: cilium/cilium
    layer: machinery
    match: ["quay.io/cilium/*"]
    # certgen is its own project, shipped by the Cilium chart and matched here by
    # the quay.io/cilium/* glob. Without its own repo it was compared against
    # Cilium's releases, so a current certgen read as far behind.
    repos:
      quay.io/cilium/certgen: cilium/certgen
  - name: agentgateway
    description: The gateway that serves application and platform routes.
    license: Apache-2.0
    repo: agentgateway/agentgateway
    layer: workload-infrastructure
    match: ["cr.agentgateway.dev/*"]
    behind:
      - versions: ["digest-pinned"]
        status: scheduled
        reason: >-
          DEFECT, not a hold: a third copy carries a digest with no tag, so its version is
          unreportable. A tag is restored alongside the digest in the next release.
        target: 0.1.16-rc.189
  - name: ExternalDNS
    description: Publishes DNS records for every public hostname.
    license: Apache-2.0
    repo: kubernetes-sigs/external-dns
    layer: machinery
    match: ["registry.k8s.io/external-dns/*"]
  - name: ExternalDNS provider webhook
    description: Connects ExternalDNS to the provider's DNS service.
    license: Apache-2.0
    repo: hetzner/external-dns-hetzner-webhook
    layer: machinery
    match: [docker.io/hetzner/external-dns-hetzner-webhook]
  - name: NodeLocal DNSCache
    description: A DNS cache on every node.
    license: Apache-2.0
    repo: kubernetes/dns
    layer: machinery
    match: ["registry.k8s.io/dns/*"]
  - name: Cluster proportional autoscaler
    description: Scales cluster DNS with the size of the cluster.
    license: Apache-2.0
    repo: kubernetes-sigs/cluster-proportional-autoscaler
    layer: machinery
    match: ["registry.k8s.io/cpa/*"]
  - name: NGINX
    description: Serves static pages and public assets.
    license: BSD-2-Clause
    repo: nginx/nginx
    tag: '^release-(\d+)\.(\d+)\.(\d+)$'
    layer: workload-infrastructure
    match: ["docker.io/nginxinc/*"]
    behind:
      - versions: ["1.27-alpine"]
        status: not assessed
        reason: >-
          Behind by several minors, in a vendored chart's values. Nobody has assessed the
          move.
  # ── Cloud integration and storage ───────────────────────────────────────
  - name: Hetzner cloud controller manager
    description: Node lifecycle and load balancers in the cloud account.
    license: Apache-2.0
    repo: syself/hetzner-cloud-controller-manager
    layer: machinery
    match: ["ghcr.io/syself/hetzner-cloud-controller-manager"]

  - name: Hetzner CSI driver
    description: Block-storage volumes for persistent data.
    license: MIT
    repo: hetznercloud/csi-driver
    layer: machinery
    match: ["docker.io/hetznercloud/*"]
    behind:
      - versions: ["v2.13.0"]
        status: not assessed
        reason: >-
          Behind by several minors. Nobody has assessed the move; the driver is delivered as a
          hand-assembled manifest, so its sidecars are pinned here rather than by a chart.
  - name: CSI sidecars
    description: The standard Kubernetes storage sidecars the CSI driver runs with.
    license: Apache-2.0
    repo: https://github.com/kubernetes-csi
    repos:
      registry.k8s.io/sig-storage/csi-attacher: kubernetes-csi/external-attacher
      registry.k8s.io/sig-storage/csi-node-driver-registrar: kubernetes-csi/node-driver-registrar
      registry.k8s.io/sig-storage/csi-provisioner: kubernetes-csi/external-provisioner
      registry.k8s.io/sig-storage/csi-resizer: kubernetes-csi/external-resizer
      registry.k8s.io/sig-storage/livenessprobe: kubernetes-csi/livenessprobe
    layer: machinery
    match: ["registry.k8s.io/sig-storage/*"]
    behind:
      - versions: ["v1.13.2", "v2.13.0", "v2.15.0", "v4.8.1", "v5.2.0"]
        status: not assessed
        reason: >-
          Five sidecars on five independent release series, pinned beside the storage driver's
          manifest. Each has its own newest release; none has been assessed.
        blocked_by: Hetzner CSI driver
  - name: Local path provisioner
    description: Node-local volumes on clusters without cloud block storage.
    license: Apache-2.0
    repo: rancher/local-path-provisioner
    layer: machinery
    match: ["docker.io/rancher/*"]
  # ── Policy and secrets ──────────────────────────────────────────────────
  - name: Kyverno
    description: Admission policy. Enforces the platform's rules on everything a cluster admits.
    license: Apache-2.0
    repo: kyverno/kyverno
    layer: machinery
    match: ["reg.kyverno.io/*", "ghcr.io/kyverno/*"]
    behind:
      - versions: ["latest"]
        status: scheduled
        reason: >-
          DEFECT, not a hold: the readiness-checker image is pinned to a moving tag, so what
          it runs is whatever the registry served last. It is pinned by digest in the next
          release.
        target: 0.1.16-rc.189
  - name: External Secrets
    description: Secret delivery. Copies each workload's secrets from the secret store into its namespace.
    license: Apache-2.0
    repo: external-secrets/external-secrets
    layer: machinery
    match: ["ghcr.io/external-secrets/*", "oci.external-secrets.io/*"]
  - name: Infisical
    description: The secret store. Holds every platform and application secret.
    license: "MIT (enterprise directory unused)"
    repo: Infisical/infisical
    layer: machinery
    match: ["docker.io/infisical/infisical"]
    behind:
      - versions: ["v0.160.11"]
        status: not assessed
        reason: >-
          Behind by several patch releases, in a vendored chart. Nobody has assessed the move,
          and it runs database migrations on start, so it needs its own validation.
  - name: Infisical PKI issuer
    description: Issues internal certificates from the secret store's certificate authority.
    license: MIT
    repo: Infisical/infisical-issuer
    layer: machinery
    match: ["docker.io/infisical/pki-issuer"]
  # ── Identity ────────────────────────────────────────────────────────────
  - name: ZITADEL
    description: The identity provider. Sign-in for people and identities for applications.
    license: AGPL-3.0-only
    repo: zitadel/zitadel
    layer: machinery
    match: ["ghcr.io/zitadel/*"]
    behind:
      - versions: ["v4.19.2"]
        status: held
        reason: Newest chart ships 4.19.2
  # ── Data ────────────────────────────────────────────────────────────────
  - name: CloudNativePG
    description: The database operator. Runs PostgreSQL clusters with backups and failover.
    license: Apache-2.0
    repo: cloudnative-pg/cloudnative-pg
    layer: capability
    match: ["ghcr.io/cloudnative-pg/cloudnative-pg"]
    behind:
      - versions: ["1.29.0"]
        status: held
        reason: >-
          The newest release supports Kubernetes 1.34 to 1.36, above what the nodes run, so
          the operator waits on the Kubernetes move. 1.29.x is already out of upstream
          support.
        blocked_by: Kubernetes
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: PostgreSQL
    description: The platform database and each application's database.
    license: PostgreSQL
    repo: postgres/postgres
    track: tags
    tag: '^REL_(\d+)_(\d+)$'
    layer: capability
    match: ["ghcr.io/cloudnative-pg/postgresql", docker.io/library/postgres]
    behind:
      - versions: ["15-alpine", "16-alpine"]
        status: declined
        reason: >-
          Each application selects the newest major it supports, so these differ on purpose.
          The newest major is declined where a consumer does not support it: the identity
          store documents support but has an unresolved fresh-install failure on it, and the
          secret store documents only a floor.
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
      - versions: ["17.11-standard-bookworm"]
        status: declined
        reason: Chosen per application; its consumers do not support 18
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: Redis
    description: The platform cache.
    license: "BSD-3-Clause (7.x); AGPL-3.0-only (8.x)"
    repo: redis/redis
    layer: capability
    match: [docker.io/library/redis]
    behind:
      - versions: ["8.6.4-alpine"]
        status: held
        reason: The GitOps chart's own cache; it moves when that chart does
        blocked_by: Argo CD
  # ── Observability ───────────────────────────────────────────────────────
  - name: Grafana Alloy
    description: Collects metrics and logs on every node and cluster.
    license: Apache-2.0
    repo: grafana/alloy
    layer: capability
    match: ["docker.io/grafana/alloy"]
  - name: Loki
    description: Log storage and search.
    license: AGPL-3.0-only
    repo: grafana/loki
    layer: capability
    match: ["docker.io/grafana/loki"]

  - name: Grafana
    description: Dashboards for metrics and logs.
    license: AGPL-3.0-only
    repo: grafana/grafana
    layer: capability
    match: ["docker.io/grafana/grafana"]
  - name: Grafana operator
    description: Manages dashboards and data sources as declarations.
    license: Apache-2.0
    repo: grafana/grafana-operator
    layer: capability
    match: ["ghcr.io/grafana/grafana-operator"]
    behind:
      - versions: ["v5.24.0"]
        status: not assessed
        reason: >-
          A minor behind. Nobody has assessed the move; it also sets the instance version
          today, which is the defect recorded against the instance.
  - name: VictoriaMetrics operator
    description: Runs the metrics stores.
    license: Apache-2.0
    repo: VictoriaMetrics/operator
    layer: capability
    match: ["docker.io/victoriametrics/operator"]
    behind:
      - versions: ["v0.75.0", "config-reloader-v0.75.0"]
        status: not assessed
        reason: >-
          Two patch releases behind, in the same vendored render as the stores. The operator
          and its config reloader move together because one render produces both.
  - name: VictoriaMetrics
    description: The metrics store, rule evaluation and the authenticating proxy in front of them, run by the VictoriaMetrics operator.
    license: Apache-2.0
    repo: VictoriaMetrics/VictoriaMetrics
    layer: capability
    match: ["docker.io/victoriametrics/*"]
    behind:
      - versions: ["v1.152.0"]
        status: not assessed
        reason: >-
          Behind by three patch releases, in a vendored render whose values are recorded in
          prose rather than a values file, so re-rendering has to be reconstructed before it
          can be trusted.
  - name: Alertmanager
    description: Routes the alerts rule evaluation raises, run by the VictoriaMetrics operator.
    license: Apache-2.0
    repo: prometheus/alertmanager
    layer: capability
    match: ["docker.io/prom/alertmanager"]
    behind:
      - versions: ["v0.34.1"]
        status: not assessed
        reason: >-
          A patch behind, delivered by the observability operator rather than pinned directly.
          Nobody has assessed the move.
  - name: kube-state-metrics
    description: Exposes the state of Kubernetes objects as metrics.
    license: Apache-2.0
    repo: kubernetes/kube-state-metrics
    layer: capability
    match: ["registry.k8s.io/kube-state-metrics/*"]
    behind:
      - versions: ["v2.19.1"]
        status: held
        reason: Newer builds target Kubernetes 1.36
        blocked_by: Kubernetes
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: metrics-server
    description: Resource metrics for autoscaling and `kubectl top`.
    license: Apache-2.0
    repo: kubernetes-sigs/metrics-server
    layer: machinery
    match: ["registry.k8s.io/metrics-server/*"]
    behind:
      - versions: ["v0.9.0"]
        status: held
        reason: Newest release has no chart yet
  - name: Headlamp
    description: The cluster console.
    license: Apache-2.0
    repo: headlamp-k8s/headlamp
    layer: machinery
    match: ["ghcr.io/headlamp-k8s/*"]
    behind:
      - versions: ["v0.45.0"]
        status: not assessed
        reason: A minor behind. Nobody has assessed the move.
  # ── Utilities ───────────────────────────────────────────────────────────
  - name: kubectl
    description: Runs one-off jobs against the cluster API.
    license: Apache-2.0
    repo: kubernetes/kubernetes
    layer: machinery
    match: ["registry.k8s.io/kubectl", "docker.io/bitnami/kubectl", "docker.io/bitnamilegacy/kubectl"]
    behind:
      - versions: ["v1.35.10"]
        status: held
        reason: Held within one minor of the API server
        blocked_by: Kubernetes
        ref: docs/plans/k8s-cnpg-upgrade-and-restore-drill.md
  - name: BusyBox
    description: Init steps that prepare a volume before its workload starts.
    license: GPL-2.0-only
    repo: https://git.busybox.net/busybox
    track: dockerhub
    layer: machinery
    match: [docker.io/library/busybox]
  - name: Agent sandbox controller
    description: Runs isolated, short-lived sandboxes for application jobs.
    license: Apache-2.0
    repo: kubernetes-sigs/agent-sandbox
    layer: workload-infrastructure
    match: ["registry.k8s.io/agent-sandbox/*"]
    behind:
      - versions: ["v0.5.0"]
        status: not assessed
        reason: >-
          The newest release is a major, crossing 1.0. Nobody has assessed what it changes for
          the sandbox resources the platform declares.
  - name: Kubernetes toolbox image
    description: A container image with kubectl and other Kubernetes tools; runs the node labeler.
    license: MIT
    repo: alpine-docker/k8s
    track: dockerhub
    layer: machinery
    match: ["docker.io/alpine/k8s"]
    behind:
      - versions: ["1.35.10"]
        status: held
        reason: Tracks the cluster's Kubernetes minor
        blocked_by: Kubernetes
