# The components the platform's architecture decisions name, and where each one
# actually lives.
#
# scripts/validate/architecture-consistency.py joins this to the ADRs and to the
# component descriptors. The join is the point: an ADR that names a runtime
# component the repository cannot resolve fails a release, and a directory under
# manifests/hub-core-services/ that nothing applies fails one too.
#
# Both halves of that were needed. ADR-013 named five components and four were
# never written -- that is the first half. The fifth, VictoriaMetrics, WAS
# written, reviewed and merged, and then referenced by no descriptor, so 577
# lines of operator, VMCluster, ingress and a working alert rule sat in the tree
# for four months without ever reaching a cluster -- that is the second.
#
#   status: shipped   built, and something applies it
#   status: planned   decided in an ADR, not built or not yet wired
#
# `planned` is deliberately cheap to write and expensive to keep: the gate
# refuses to let an ADR reach Accepted while anything it names is planned. That
# makes accepting a decision the moment its claims have to be true.

components:
  # ── Observability (ADR-078) ─────────────────────────────────────────────
  - name: grafana-alloy
    declared_by: [078-the-observability-capability.md]
    status: shipped
    path: manifests/hub-core-services/grafana-alloy
    note: >-
      A node DaemonSet and a clustered cluster StatefulSet on hub and spoke.
      Collects, buffers on persistent storage until delivered, and writes to
      the cluster's own two VMSingles and its Loki; the cluster agent also
      receives the evaluators' rule results (ADR-078 add.5).

  - name: platform-alerts
    declared_by: [078-the-observability-capability.md]
    status: shipped
    path: manifests/hub-core-services/platform-alerts
    note: >-
      The platform's PrometheusRules -- `platform-core-alerts` and the
      pipeline-health rules (ADR-078 add.3 §5) -- with the PrometheusRule CRD
      they are declared with. Each cluster's VMAlert evaluates them, converted
      to VMRule by the operator (add.5 §5). The spoke's are in
      manifests/spoke/spoke-catalog/infra/platform-alerts.

  # ── Required collection machinery (ADR-078 addendum 1, ADR-066 addendum 4) ─
  # Not part of the selectable `observability` capability. Both exporters stay
  # when a tenant disables the backend, because the Support Agent scrapes
  # kube-state-metrics for the node capacity ADR-067 names for upgrade
  # pre-flight -- and ADR-078 §8 forbids the observability capability from being
  # a dependency of support.
  - name: victoriametrics-operator
    declared_by: [078-the-observability-capability.md]
    status: shipped
    path: manifests/hub-core-services/victoriametrics-operator
    note: >-
      Reconciles each cluster's stores, evaluators, Alertmanager and query
      gateway (ADR-078 add.5). Vendored on the hub and in the spoke catalogue.

  - name: victoriametrics
    declared_by: [078-the-observability-capability.md]
    status: shipped
    path: manifests/hub-core-services/victoriametrics
    note: >-
      The hub's VMSingle x2, VMAuth, platform and tenant VMAlert and
      VMAlertmanager (ADR-078 add.5 §3, §5, §7). The spoke catalogue carries the
      same set under infra/victoriametrics.

  - name: loki
    declared_by: [078-the-observability-capability.md]
    status: shipped
    path: manifests/hub-core-services/loki
    note: >-
      Each cluster's log store: Loki 3.7.9 monolithic, S3-backed, compactor-ring
      retention with object-store deletion markers (ADR-078 add.5 §4). The spoke
      catalogue carries the same render under infra/loki.

  - name: platform-dashboards
    declared_by: [078-the-observability-capability.md, 021-boundary-driven-gitops-and-day-0-choreography.md]
    status: shipped
    path: manifests/hub-core-services/platform-dashboards
    note: >-
      The grafana-operator and its vendored CRDs, nothing else: the ownership
      anchor for the Grafana API (ADR-078 add.5 §6, ADR-021 amendment
      2026-10-29). CRDs apply at resource wave -5, the operator at 1, so the
      API is Established before the controller that serves it starts.

  - name: grafana
    declared_by: [078-the-observability-capability.md, 021-boundary-driven-gitops-and-day-0-choreography.md]
    status: shipped
    path: manifests/hub-core-services/grafana
    note: >-
      What the operator reconciles: the hub's Grafana (in-cluster, HA on the
      grafana database), its datasources, the platform folder, the public route
      and the generated dashboards. A separate Application from the operator
      because its readiness depends on the operator running (ADR-021 addendum
      2026-08-22).

  - name: kube-state-metrics
    declared_by: [078-the-observability-capability.md]
    status: shipped
    path: manifests/argocd/components/03/kube-state-metrics.yaml
    note: >-
      Upstream chart, no local manifests. It was absent on the hub AND on the
      spoke while the spoke's Alloy scraped it, so every kube_pod_* expression
      -- including the 211 lines of platform-core-alerts -- had no series to
      evaluate against.

  - name: node-exporter
    declared_by: [078-the-observability-capability.md]
    status: shipped
    path: manifests/hub-core-services/grafana-alloy
    note: >-
      Alloy's built-in `prometheus.exporter.unix`, running in the DaemonSet --
      which is the placement ADR-078 add.1 §5's table gives node-exporter, and
      the series are identical. A separate DaemonSet on every cluster would be a
      second workload to schedule, upgrade and stand behind at ADR-070's minimum
      box for no additional series, so the component is the exporter rather than
      the upstream deployment. Decided in ADR-078 add.1 §13a.

  # ── Support (ADR-077) ───────────────────────────────────────────────────
  - name: support-agent
    declared_by: [077-the-support-agent.md]
    status: shipped
    path: manifests/hub-core-services/support-agent
    note: >-
      Ships to every box and is inert until enrolled. Enrolment is the client
      certificate existing (ADR-077 addendum 1), so an unenrolled box runs the
      agent with nowhere to report and is not degraded. RBAC, NetworkPolicy,
      allowlist, Certificate and Deployment are all applied by the boundary-03
      descriptor, and four release gates hold the boundary.

# Directories deliberately not applied on their own. Each needs a reason,
# because a waiver without one is an orphan with paperwork -- and the gate
# rejects a waiver for something that IS applied, so the list cannot rot into a
# blanket exemption.
unreferenced:
  - path: manifests/hub-core-services/grafana/database-recovery
    reason: &database-recovery >-
      Break-glass. An overlay that rewrites its cluster's bootstrap to restore
      from the object-store archive, applied by hand against a named archive.
      Reconciling it continuously would re-create the cluster from an archive
      every time it drifted. One per application cluster (ADR-112).

  - path: manifests/hub-core-services/identity/zitadel/database-recovery
    reason: *database-recovery

  - path: manifests/hub-core-services/credit-authority/database-recovery
    reason: *database-recovery

  - path: manifests/hub-core-services/infisical/database-recovery
    reason: *database-recovery

# ── The bundle's capability declaration (ADR-066) ────────────────────────────
#
# ADR-066 said "catalogue" and ADR-071 says the platform publishes none. Its
# addendum 1 settles the word: this is the bundle's capability declaration, it
# travels inside the artefact it describes, and nothing is curated beside the
# platform. This file is that declaration.
#
#   kind: machinery   every box runs it; there is nothing to select. Without it
#                     a box cannot reconcile anything.
#   kind: selectable  a tenant chooses whether to run it. `enable` names the
#                     values path that chooses, and ADR-066 requires selection
#                     to be a value and never a version.
#
# Both kinds are platform. Selecting a capability does not make it the tenant's
# to maintain -- that is the whole proposition, and the reason the two questions
# ("what does a box cost" and "who is answerable when it breaks") have separate
# answers here.
#
#   lifecycle: declared | supported | deprecated | end-of-life | removed
#
# Every state but `removed` carries maintenance. `deprecated` and `end-of-life`
# must name a date, because ADR-069 makes the date the thing a tenant is owed.
#
#   status: shipped   the selection mechanism exists and works
#   status: planned   decided, not yet realised
#
# `planned` is deliberately cheap to write and expensive to keep: ADR-066 cannot
# reach Accepted while anything it declares is planned. Today six of seven
# selectable capabilities are planned, because only `onPrem.enabled` is a real
# toggle -- everything else is unconditionally on, which means "a tenant runs
# what it needs and does not carry the rest" is not yet true.

capabilities:
  # ── Machinery: not selectable, because a box without it reconciles nothing ──
  - name: gitops-engine
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]
    note: Reconciles every other capability, including its own definition.

  - name: cluster-lifecycle
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]
    note: Composition and cluster lifecycle -- Crossplane and Cluster API.

  - name: secret-delivery
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]
    note: >-
      Secrets never enter git (ADR-003). The escrow that makes a box recoverable
      by its owner alone is ADR-076.

  - name: certificate-issuance
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]

  - name: dns
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]

  - name: gateway
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]

  - name: admission-policy
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]

  - name: capacity-lifecycle
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]
    note: Node and capacity lifecycle, including autoscaling.

  - name: cache
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]
    note: >-
      Redis. Machinery rather than selectable: platform components depend on it,
      so a box without it does not lose a capability, it fails to reconcile.

  # ── Selectable ──────────────────────────────────────────────────────────────
  - name: on-prem-capacity
    kind: selectable
    enable: onPrem.enabled
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]
    note: >-
      ADR-075. The only capability whose selection is actually implemented. Off
      by default, because a box with no machines of its own has nothing to join.
      ADR-066: on-prem nodes carry capabilities and burst capacity, never
      cluster-machinery state.

  - name: database
    kind: required
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md, 112-each-platform-application-owns-its-postgresql-cluster.md]
    interacts_with: [metering, credits, billing]
    note: >-
      Required, not selectable (ADR-112). Each application owns its own PostgreSQL
      cluster, so there is no single component a flag could remove: switching this
      off would take the identity provider's users and the credit ledger with it.
      The platform maintains the capability -- operator
      reconciling, version supported, backups restorable, failover working. The
      schemas in it are the tenant's, and a slow query against a healthy Postgres
      is not a platform incident.

  - name: identity
    kind: machinery
    lifecycle: supported
    status: shipped
    declared_by: [066-the-platform-boundary.md]
    note: >-
      Machinery, not selectable -- reclassified rather than given a toggle.
      ADR-066's test for machinery is that a box cannot function without it, and
      the gateway (machinery) resolves an OIDC issuer from this: the auth proxy,
      ArgoCD's login and every relying party follow the same value. A box with
      identity switched off has a gateway that authenticates nobody, which is a
      supported-looking state nobody wants. Building the toggle would have
      produced that state; classifying it correctly removes the question.
      A Zitadel that will not start is the platform's; a misconfigured client
      registered in a healthy one is the tenant's.


  - name: observability
    kind: selectable
    enable: capabilities.observability.enabled
    lifecycle: declared
    status: shipped
    declared_by:
      - 078-the-observability-capability.md
      - 098-metering-sources-over-spoke-egress-and-records-in-lago.md
    components: [grafana-alloy, kube-state-metrics, node-exporter, platform-alerts, victoriametrics-operator, victoriametrics, loki, platform-dashboards, grafana]
    note: >-
      ADR-078 add.5. Collection, stores, evaluation, alerting and the hub's
      Grafana all ship in the box. Still `declared`: moving to `supported` is the
      maintenance promise (ADR-069) and is decided once a box has run it end to
      end.

  - name: support
    kind: selectable
    enable: capabilities.support.enabled
    lifecycle: declared
    status: shipped
    declared_by: [077-the-support-agent.md]
    components: [support-agent]
    note: >-
      ADR-077 addendum 3, decision 1. Default `true` like every other capability:
      the agent ships to every box and is inert until enrolled, so a box that
      never buys support carries a process that reports nowhere. Turning it off
      is how a tenant removes the agent after cancelling -- their GitOps prunes
      it, and no platform component ever does. Selection works, the image is
      published and pinned by digest, and both the hub and spoke agents are
      applied. `declared` rather than `supported` until a Support Plane exists to
      enrol against.

  - name: metering
    kind: selectable
    enable: metering.enabled
    lifecycle: declared
    status: planned
    declared_by:
      - 066-the-platform-boundary.md
      - 098-metering-sources-over-spoke-egress-and-records-in-lago.md
    interacts_with: [database]
    note: >-
      OpenMeter has been withdrawn: it required ClickHouse, Kafka and Svix for a
      capability the platform never deployed, which is a maintenance obligation
      out of all proportion to the box ADR-070 targets. The replacement is
      decided by ADR-098: a spoke metering-agent commits usage events to a
      single durable write-ahead log and a Vector sidecar ships them as
      objects into the platform's metering-events bucket; hub
      metering-ingest consumes the bucket behind a durable checkpoint and
      records them in the usage-analytics database (ADR-098, amendment
      2026-10-27), with internal execution costs from a tenant's
      coordinating product service. The record is not billable usage and
      feeds no invoice. Planned until the collection floor, agent, shipper,
      consumer and database ship -- see ADR-098.

  - name: credits
    kind: selectable
    enable: capabilities.credits.enabled
    lifecycle: declared
    status: planned
    declared_by:
      - 109-the-credit-authority.md
    interacts_with: [database]
    note: >-
      The Credit Authority: the box's credit ledger, run on the hub
      (hub-core-services/credit-authority) and reached only through the hub
      Gateway at credits.<hubDomain>. Its own PostgreSQL cluster, role and
      credential are prerequisites present on every box; the ledger, its
      AgentGateway sidecar and the route run only when enabled. The ledger
      listens on loopback and authenticates without authorising, so the
      sidecar binds the one caller (the application that declares
      capabilities.credits, and its organisation) and allows only the
      anchored transaction, account, balance and volume routes. It holds
      credits, never money, and determines no price. Planned until
      ADR-109's isolation proof passes and credits-db's recovery is
      qualified for financial records -- see ADR-109.

  - name: billing
    kind: selectable
    enable: capabilities.billing.enabled
    lifecycle: declared
    status: planned
    declared_by:
      - 113-the-billing-capability.md
    interacts_with: [database]
    note: >-
      The billing engine: Lago OSS, unmodified, run on the hub
      (hub-core-services/billing-engine) and reached only through the hub
      Gateway at billing.<hubDomain>. Its own PostgreSQL cluster (with
      pg_partman), role and credential are prerequisites present on every box;
      the engine, its loopback queue, its document renderer, its AgentGateway
      sidecar and the route run only when enabled. The sidecar binds the one
      caller (the application that declares capabilities.billing, and its
      organisation) and presents the engine's key for it, so no application
      holds that key. It records plans, subscriptions and invoices for the
      caller and collects nothing: payment is the caller's. Planned until
      ADR-113's isolation proof passes, billing-db's recovery is qualified,
      and the engine's encryption keys are escrowed -- see ADR-113.
