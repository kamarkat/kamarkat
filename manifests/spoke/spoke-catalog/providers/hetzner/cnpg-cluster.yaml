---
# ADR-014/ADR-046 §11: hetzner-cell CNPG overlay — Wave-1 state.
# Placement IS applied now: hcloud-volumes block devices attach to any hetzner
# worker in the zone, so the nodeSelector rolls the pod onto workers with its
# existing PVC (placement-only, no cutover). Backup contract per ADR-014.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-cnpg
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  # Declaratively manage crossplane_admin role
  managed:
    roles:
      - name: crossplane_admin
        ensure: present
        login: true
        createdb: true
        createrole: true
        # CNPG's own defaults, declared rather than left implicit.
        #
        # The operator writes these onto every managed role, and `roles` is a
        # LIST -- so a manifest that omits them does not merely under-specify,
        # it produces a list that never equals the live one. ArgoCD compares the
        # whole list, finds it different on every pass, and the Application sits
        # OutOfSync forever while the database is perfectly healthy. That is what
        # held platform-spoke-catalog OutOfSync after the CNPG recovery fields
        # were resolved, and it timed out every sync.
        #
        # Both values are what CNPG fills in (unlimited connections, inherited
        # privileges), so declaring them changes nothing about the role and makes
        # the desired state actually reachable.
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: crossplane-admin-credentials

  postgresql:
    parameters:
      max_connections: "500"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

    shared_preload_libraries:
      - "pg_stat_statements"
      - "vector"

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        - ALTER ROLE app WITH CREATEROLE;
  externalClusters:
    - name: shared-cnpg-v3
      barmanObjectStore:
        destinationPath: s3://spoke-pool-backups/
        serverName: shared-cnpg-v3
        endpointURL: https://hel1.your-objectstorage.com
        s3Credentials:
          accessKeyId:
            name: s3-credentials
            key: access-key-id
          secretAccessKey:
            name: s3-credentials
            key: secret-access-key
          region:
            name: s3-credentials
            key: region
        wal:
          compression: gzip
          maxParallel: 2
  storage:
    size: 100Gi
    storageClass: hcloud-volumes

  backup:
    barmanObjectStore:
      # Per-spoke prefix applied by the platform-spoke-catalog ApplicationSet
      # patch on /spec/backup/barmanObjectStore/destinationPath.
      destinationPath: s3://spoke-pool-backups/
      # serverName defaults to the CLUSTER name, which is stable across
      # recreations — so a rebuilt cluster lands on the previous incarnation's
      # WALs. barman-cloud-check-wal-archive then fails "Expected empty archive"
      # (it guards against two databases interleaving WALs under one server
      # name), ContinuousArchiving stays False, and CNPG blocks every base
      # backup behind it. That is why no backup had ever completed by
      # 2026-08-30 despite a ScheduledBackup running for days.
      #
      # Recreation is routine here: re-provisioning a node destroys its
      # local-path data (see .agents/spec/enhancements/2026-08-30.md items 1
      # and 13), so this collides every time unless the name is bumped.
      # BUMP THE SUFFIX whenever the cluster is recreated from initdb.
      # BUMPED v2 -> v3 on 2026-09-02. The dev spoke was rebuilt from initdb
      # that day while this still read v2, so the fresh cluster pointed at the
      # previous incarnation's WALs under this spoke's own prefix and barman
      # refused every archive:
      #   WAL archive check failed for server shared-cnpg-v2: Expected empty archive
      # ContinuousArchiving stayed False, which blocks every base backup behind
      # it, so shared-cnpg-daily sat in phase=walArchivingFailing and
      # lastSuccessfulBackup was None for the life of the cluster.
      #
      # destinationPath is already per-spoke (the platform-spoke-catalog patch
      # rewrites it to .../<spoke>/), so this name only ever collides with an
      # EARLIER incarnation of the SAME spoke — which is precisely what a
      # local-path rebuild produces every time.
      serverName: shared-cnpg-v3
      # ADR-014 backup contract: Hetzner Object Storage, hel1.
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
        region:
          name: s3-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      # CANONICAL FORM, and that is the whole reason it is not "2000m".
      #
      # 2000m and 2 are the same quantity, and Kubernetes serialises it as "2".
      # The apply path stored the literal this file carried while the SERVER-SIDE
      # DRY RUN -- which is how ArgoCD computes its diff -- returned the
      # canonical form. So the desired object said "2" and the live object said
      # "2000m" on every pass, and platform-spoke-catalog sat OutOfSync forever
      # with its own last sync reporting "successfully synced (all tasks run)".
      #
      # Nothing was wrong with the cluster and nothing a sync could do would fix
      # it: the two paths disagreed about spelling, not about value. Writing the
      # form the server canonicalises to removes the disagreement rather than
      # hiding it, which is why this is not an ignoreDifferences entry.
      cpu: "2"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      workload-location: hetzner
