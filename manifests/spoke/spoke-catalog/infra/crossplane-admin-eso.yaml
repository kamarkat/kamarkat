# ESO ExternalSecret for crossplane_admin credentials
# Syncs password from Infisical to Spoke cluster
# Pattern: <spokepool-cr-name>-crossplane-admin-password
# Example: spoke-pool-eu-prod-01-crossplane-admin-password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossplane-admin-credentials
  namespace: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-platform
    kind: ClusterSecretStore
  target:
    name: crossplane-admin-credentials
    creationPolicy: Owner  # ESO creates and owns (no Hub K8s secret)
    template:
      engineVersion: v2
      data:
        # PostgreSQL connection string for provider-sql ProviderConfig
        connectionString: |
          postgresql://crossplane_admin:{{ .password }}@shared-cnpg-rw.platform-data.svc.cluster.local:5432/postgres?sslmode=require
        # Individual fields for bootstrap Job and provider-sql
        username: crossplane_admin
        password: "{{ .password }}"
        endpoint: shared-cnpg-rw.platform-data.svc.cluster.local  # provider-sql uses 'endpoint' not 'host'
        host: shared-cnpg-rw.platform-data.svc.cluster.local
        port: "5432"
        database: postgres
  data:
  - secretKey: password
    remoteRef:
      # This cluster's platform scope; the cluster name is injected per spoke
      # (templated-fields.yaml, and the ApplicationSet on the unreleased path).
      key: spokes/PLACEHOLDER/platform
      property: crossplane-admin-password
