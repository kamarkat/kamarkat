# ADR-078 addendum 5 §5: VMAlertmanager, two replicas in staging and production.
# The operator runs two or more as a gossip cluster that deduplicates
# notifications; delivery is at least once.
#
# Routing is addendum 4's route tree, unchanged as content: PlatformHeartbeat to
# this cluster's external IRM heartbeat (its ABSENCE pages), warning and critical
# to email and IRM, everything else to email.
#
# The config holds no secret: credentials are files from the mounted
# `alertmanager-credentials` Secret (spec.secrets mounts it at
# /etc/vm/secrets/alertmanager-credentials/). Per-box addresses are substituted by
# templated-fields.yaml.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: platform
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: platform
    app.kubernetes.io/part-of: observability
    observability.platform.io/alertmanager: platform
spec:
  # Pinned (ADR-078 add.9). The operator chooses this image when it is unset, so
  # an operator bump moved the stores, the evaluators and the query gateway in one
  # step with nothing in Git recording the expectation. Set to what both clusters
  # already run, so declaring it changes nothing today and every later move is a
  # commit someone reviewed.
  image:
    tag: v0.34.1
  # ADR-047: single-node spokes run on the control-plane node. The catalogue's
  # toleration patch reaches only the objects it renders, not the pods the
  # operator creates, so each resource carries it.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # 2 in staging and production, 1 in development (templated-fields.yaml).
  replicaCount: 2
  disableSelfServiceScrape: true
  disableNamespaceMatcher: true
  selectAllByDefault: false
  secrets:
    - alertmanager-credentials
  podMetadata:
    labels:
      observability.platform.io/component: vmalertmanager
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          observability.platform.io/component: vmalertmanager
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  configRawYaml: |
    global:
      smtp_smarthost: 'smtp.resend.com:587'
      smtp_from: 'PLACEHOLDER_ALERT_EMAIL_FROM'
      smtp_auth_username: 'resend'
      smtp_auth_password_file: /etc/vm/secrets/alertmanager-credentials/smtp_password
      smtp_require_tls: true
    route:
      receiver: platform-email
      group_by: [cluster, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # PlatformHeartbeat IS ROUTED TO NOWHERE, DELIBERATELY, AND NOT LEFT TO FALL
        # THROUGH TO EMAIL.
        #
        # It is a dead-man's switch: always firing, and its ABSENCE is the signal. A
        # switch delivered by the path it tests proves nothing, so emailing it would
        # be worse than dropping it -- a silent cluster and a healthy one would send
        # the same number of mails, which is none.
        #
        # On this cluster nothing outside it can witness that silence. The HUB does,
        # over the read route ADR-078 add.8 gives it: this cluster publishes its
        # liveness as a recording-rule series and a hub-side rule pages when the
        # series goes absent (add.10 §5). The observer is outside the cluster it
        # watches, which is the property the switch needs; it is the hub rather than
        # a rented endpoint, because add.10 §1 keeps third-party cloud off a spoke.
        #
        # The hub's own VMAlertmanager keeps its irm-heartbeat receiver: nothing
        # inside the box can witness the whole box going quiet.
        - receiver: platform-heartbeat-is-observed-by-the-hub
          matchers: ['alertname="PlatformHeartbeat"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 50s
        # Critical and warning go to EMAIL ONLY on a spoke. The hub adds Grafana IRM
        # here; a spoke pages nobody through a third-party incident tool and holds no
        # credential for one (add.10 §4).
        - receiver: platform-email
          matchers: ['severity=~"critical|warning"']
    receivers:
      - name: platform-email
        email_configs:
          - to: 'PLACEHOLDER_ALERT_EMAIL_TO'
            send_resolved: true
      # Intentionally empty. Alertmanager requires a declared receiver for a route,
      # and this one must deliver nothing: see the route above.
      - name: platform-heartbeat-is-observed-by-the-hub
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-credentials
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-credentials
    creationPolicy: Owner
  data:
    # Cell-scoped keys (ADR-031): hub-operator copies the mail password and the
    # IRM alert URL into each cell; the heartbeat URL is this cell's own, seeded
    # per cell. The cell path is substituted by templated-fields.yaml.
    - secretKey: smtp_password
      remoteRef:
        key: /spoke-pool/PLACEHOLDER/shared/ALERT_SMTP_PASSWORD
    # ONE KEY. The two Grafana IRM entries that were here are the hub's.
    #
    # irm_alertmanager_url and irm_heartbeat_url read
    # /spoke-pool/<cluster>/shared/GRAFANA_IRM_* -- the box owner's own incident
    # integration, copied into every cluster's project. Removed with the receivers
    # that read them (ADR-078 add.10 §4): a spoke delivers its alerts by email and
    # pages nobody through a third-party tool.
    #
    # This also unblocks alert delivery. ESO is atomic across spec.data, so the
    # heartbeat key -- which nothing ever seeded, because no per-cell integration was
    # ever created -- kept this whole Secret from existing, and with it SMTP. An
    # optional credential was taking down the mandatory one.
