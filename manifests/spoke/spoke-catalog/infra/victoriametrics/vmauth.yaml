# ADR-078 addendum 5 §7: VMAuth is the only query entry. Reads fail over from
# platform-a to platform-b (`first_available`, retried on 5xx).
#
# TWO ROUTES, and they authenticate differently. The in-cluster SERVICE route is
# the VMAuth `platform` below: each caller holds its own bearer token, generated
# in-cluster by ESO's Password generator, and NetworkPolicy admits only the
# callers' pods. The external VIEWER route is the VMAuth `viewer` below, reached
# from the hub's Grafana over the box's public address space and authenticated by
# the signed-in person's own OIDC access token. It is built; it renders only once
# the box declares observability.viewer.audience.
#
# Read-only by construction: only query, series and label paths are routed.
# Ingestion, admin and delete APIs are never reachable through VMAuth.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: platform
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: platform
    app.kubernetes.io/part-of: observability
spec:
  # Pinned (ADR-078 add.9). The operator chooses this image when it is unset, so
  # an operator bump moved the stores, the evaluators and the query gateway in one
  # step with nothing in Git recording the expectation. Set to what both clusters
  # already run, so declaring it changes nothing today and every later move is a
  # commit someone reviewed.
  image:
    tag: v1.152.0
  # ADR-047: single-node spokes run on the control-plane node. The catalogue's
  # toleration patch reaches only the objects it renders, not the pods the
  # operator creates, so each resource carries it.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # 2 in staging and production, 1 in development (templated-fields.yaml).
  replicaCount: 2
  selectAllByDefault: false
  disableSelfServiceScrape: true
  userSelector:
    matchLabels:
      observability.platform.io/vmauth: platform
  podMetadata:
    labels:
      observability.platform.io/component: vmauth
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          observability.platform.io/component: vmauth
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
---
# The query paths every service route admits.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: vmalert
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: platform
    observability.platform.io/vmauth: platform
spec:
  tokenRef:
    name: vmauth-vmalert
    key: password
  load_balancing_policy: first_available
  retry_status_codes: [500, 502, 503, 504]
  targetRefs:
    - static:
        urls:
          - http://vmsingle-platform-a.platform-observability.svc:8429
          - http://vmsingle-platform-b.platform-observability.svc:8429
      paths:
        - /api/v1/query
        - /api/v1/query_range
        - /api/v1/series
        - /api/v1/labels
        - /api/v1/label/.+/values
        - /api/v1/read
---
# One generated token per service caller. Never leaves the cluster: the
# generator runs here, and nothing outside reads the Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vmauth-token
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmauth-vmalert
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # ADR-030 #1 mandates a non-zero refreshInterval for an ExternalSecret tied to a
  # Generator -- for drift detection, recovery from accidental deletion, and
  # readiness for time-based rotation. `refreshInterval: "0"` is ESO's "never
  # reconcile" setting and defeats all three: a Secret deleted by hand stayed
  # deleted, and VMAuth answered 401 until someone noticed.
  #
  # refreshPolicy CreatedOnce is how both halves hold at once (ESO v2.2.0, the API
  # served on this cluster): ESO keeps reconciling and recreates the Secret whenever
  # it does not exist, and does not rewrite it thereafter -- so the generator does
  # not mint a new token under running consumers every interval. Rotation becomes a
  # policy change to `Periodic`, which ADR-030 #3 then pairs with rolling-update
  # triggers on the consumers; it is not a manifest redesign.
  refreshInterval: 24h
  refreshPolicy: CreatedOnce
  target:
    name: vmauth-vmalert
    creationPolicy: Owner
  # An indexed `data` entry, not `dataFrom` (ADR-031). A spoke's ExternalSecrets are
  # patched per cell at `spec.data[N]`, and `dataFrom` offers no index for that patch
  # to target -- so a generated secret declared that way is the one shape a per-cell
  # patch cannot reach. The Password generator exposes a single `password` key, and
  # `data[].sourceRef.generatorRef` is served by the ExternalSecret v1 API this
  # platform runs (verified against the vendored CRD, eso-crd-03.yaml).
  data:
    - secretKey: password
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vmauth-token
      remoteRef:
        key: password
---
# ADR-078 add.5 §7: the VIEWER entry point, a second VMAuth and not a second user
# on the one above.
#
# Separate because exposure is the difference. VMAuth/platform answers only
# in-cluster callers holding generated bearer tokens, and those tokens never leave
# the cluster; publishing its Service would put that credential's authentication
# path on the internet, where a leaked token is a working query. This instance
# accepts one thing -- a JWT from the box's issuer -- and nothing it admits can
# authenticate against the other.
#
# Read-only by construction, as above: only query, series and label paths are
# routed, and the write, ingest, delete and admin APIs are absent from targetRefs
# rather than denied by a rule that could be edited.
#
# NOT PUBLISHED YET. No listener and no HTTPRoute exist for it: the hostname is
# declared only when the box's registry turns the query endpoint on, and that
# happens after the authentication path is proven against a real token. Until
# then this answers inside the cluster, where it can be tested without exposing
# anything (ADR-078 add.5 §7, 2026-10-31).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: viewer
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: platform
    app.kubernetes.io/part-of: observability
spec:
  # Pinned (ADR-078 add.9). The operator chooses this image when it is unset, so
  # an operator bump moved the stores, the evaluators and the query gateway in one
  # step with nothing in Git recording the expectation. Set to what both clusters
  # already run, so declaring it changes nothing today and every later move is a
  # commit someone reviewed.
  image:
    tag: v1.152.0
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # 1 in development, 2 in staging, 3 in production (templated-fields.yaml).
  replicaCount: 2
  # The selector is what isolates the two instances. VMAuth/platform selects
  # `vmauth: platform` and this one `vmauth: viewer`, and neither selects all --
  # a VMUser reaches an entry point only by carrying its label.
  selectAllByDefault: false
  disableSelfServiceScrape: true
  userSelector:
    matchLabels:
      observability.platform.io/vmauth: viewer
  podMetadata:
    labels:
      observability.platform.io/component: vmauth-viewer
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          observability.platform.io/component: vmauth-viewer
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
---
# The viewer identity: a person signed in at the box's issuer, whose access token
# Grafana forwards (oauthPassThru, ADR-083 add.1 §1).
#
# Verification is the operator's native JWT support, confirmed on this box before
# it was written: VMUser v1beta1 carries spec.jwt with oidc.issuer, matchClaims
# and publicKeyRefs (operator v0.75.0), and the OSS vmauth binary v1.152.0 has the
# jwt and vm_access_claim code paths compiled in.
#
#   issuer    oidc.issuer -- keys are fetched from the issuer's JWKS, so a token
#             signed by anything else fails signature verification. Expiry is
#             checked by the verifier itself.
#   audience  matchClaims aud -- a token minted for another client is refused
#             even though the issuer and signature are good.
#   role      matchClaims -- the viewer role. The claim NAME is the one value
#             that cannot be read off this repository: it comes from how the
#             viewer application is configured at the issuer, and Zitadel nests
#             project roles under a URN key rather than emitting a flat string.
#             It is substituted per box, and the rollout pins it against a real
#             token before the endpoint is published.
#
# skipVerify is absent, which means false: a verifier that does not verify is the
# one failure this design cannot survive.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: observability-viewer
  namespace: platform-observability
  labels:
    app.kubernetes.io/managed-by: platform
spec:
  # The spoke's :443 Gateway admits routes from its own namespace only (ADR-050
  # no-bypass), so the route to this endpoint lives in platform-ops and reaches
  # across. This grant is the other half of that reach, and it is written HERE,
  # beside the Service it exposes, because accepting a cross-namespace reference
  # is this namespace's decision to make and nobody else's.
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: platform-ops
  to:
    # ONE Service by name. Without `name` the grant would admit routes to every
    # Service in platform-observability -- the stores and Loki directly among
    # them, which is precisely the path VMAuth exists to be in front of.
    - group: ""
      kind: Service
      name: vmauth-viewer
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: viewer
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/managed-by: platform
    observability.platform.io/vmauth: viewer
spec:
  jwt:
    oidc:
      issuer: PLACEHOLDER_OIDC_ISSUER
    # vmauth requires every JWT it admits to carry a `vm_access` claim, and the
    # box's issuer does not emit one -- it has no notion of VictoriaMetrics
    # tenancy and no reason to acquire one. Absent this default, the two claims
    # matched below are evaluated, pass, and the request is refused anyway: the
    # authorized viewer is denied along with the attacker, and the endpoint is
    # simply dead. An empty value is the documented form, and empty is also what
    # is meant -- these are single-node stores with one tenant, so there is no
    # account or project here to name.
    defaultVMAccessClaim: {}
    matchClaims:
      # REPLACED WHOLE at package time (spoke-catalog/templated-fields.yaml).
      # Both entries are per-box and one of them is a per-box KEY, so the map is
      # declared there rather than here; what follows is the contract it must
      # satisfy.
      #
      # TWO CLAIMS, AND THE SECOND IS THE AUTHORIZATION.
      #
      # The audience alone is not one, and the comment that used to stand here
      # said it was. The reasoning was that this box's observability project
      # exists for nothing else, so a token naming it belongs to someone granted
      # access. That is false at the issuer: any client may add any project to
      # its own token's audience with the reserved scope
      # urn:zitadel:iam:org:project:id:<id>:aud, and the issuer does not check
      # that the requester holds a grant for it -- its own guidance is to
      # authorize on roles, not on `aud`. A tenant's application could therefore
      # mint a token this endpoint accepted, and every layer here would report
      # it working.
      #
      # So the role is matched, per project. vmauth traverses nested claims by
      # dot-notation (v1.138.0+) and treats values as regular expressions, which
      # is what makes the issuer's nested role claim reachable -- the objection
      # that removed the role match before. This spoke runs v1.152.0, which is
      # also past v1.148.4 and its fix for GHSA-f99m-22fh-qw96, an authorization
      # bypass in this exact matcher.
      #
      # The project-scoped claim is used, never urn:zitadel:iam:org:project:roles,
      # because role KEYS repeat across projects: every tenant project defines a
      # `viewer`, so the unscoped claim would admit tenant users.
      #
      # THE RESIDUAL, stated plainly: anyone holding the viewer role in this
      # box's observability project may read every spoke's telemetry. There is
      # one audience per box by decision, so the role is a box-level permission
      # and not a per-cluster one.
      aud: PLACEHOLDER_VIEWER_AUDIENCE
  load_balancing_policy: first_available
  retry_status_codes: [500, 502, 503, 504]
  targetRefs:
    # Metrics: /prometheus/... -> the stores' own /api/v1/...
    #
    # The prefix is dropped rather than rewritten per path: Grafana's prometheus
    # datasource appends its own paths to the datasource URL, so the endpoint
    # carries one extra segment that the backend must never see.
    - static:
        urls:
          - http://vmsingle-platform-a.platform-observability.svc:8429
          - http://vmsingle-platform-b.platform-observability.svc:8429
      drop_src_path_prefix_parts: 1
      paths:
        - /prometheus/api/v1/query
        - /prometheus/api/v1/query_range
        - /prometheus/api/v1/series
        - /prometheus/api/v1/labels
        - /prometheus/api/v1/label/.+/values
        - /prometheus/api/v1/metadata
        # Feature detection and exemplars. Grafana's Prometheus datasource calls
        # buildinfo when it initialises and decides which query features to
        # offer from the answer; refused, the datasource loads in a degraded
        # mode that reads as the spoke being broken rather than as a missing
        # route. Read-only, both of them.
        - /prometheus/api/v1/status/buildinfo
        - /prometheus/api/v1/query_exemplars
    # Logs: /logs/... -> Loki's own /loki/api/v1/...
    #
    # Loki, not VictoriaLogs: addendum 5 §4 made this cluster's log store Loki,
    # and the datasource that queries it is Grafana's `loki` type. §10's
    # victoriametrics-logs-datasource predates that decision and does not apply.
    - static:
        urls:
          - http://loki.platform-observability.svc:3100
      drop_src_path_prefix_parts: 1
      paths:
        - /logs/loki/api/v1/query
        - /logs/loki/api/v1/query_range
        - /logs/loki/api/v1/labels
        - /logs/loki/api/v1/label/.+/values
        - /logs/loki/api/v1/series
        - /logs/loki/api/v1/index/stats
        # What Grafana's Loki datasource calls beyond a bare query: the log
        # volume histogram above Explore's results, the field and label
        # detection that fills its sidebar, and buildinfo for the same feature
        # detection as above. Without them Explore returns logs and nothing
        # else works, which is a half-functioning datasource -- a worse answer
        # than a missing one, because it looks like the spoke's fault.
        - /logs/loki/api/v1/index/volume
        - /logs/loki/api/v1/index/volume_range
        - /logs/loki/api/v1/detected_fields
        - /logs/loki/api/v1/detected_labels
        - /logs/loki/api/v1/patterns
        - /logs/loki/api/v1/status/buildinfo
