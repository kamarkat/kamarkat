---
# ADR-052 burst placement, as two native Kyverno policies.
#
# WHY TWO. Mutation and refusal are different remedies. A sandbox that fails to
# match must not be stopped from being created -- it must be stopped from being
# UNPLACED. So one policy writes placement and the other refuses a pod whose
# placement is wrong, and the second one is what makes the first fail closed:
# admission evaluates every mutating policy before any validating one, so the
# validation sees the post-mutation pod and denies a sandbox the mutation did
# not reach.
#
# WHY THE MUTATION WRITES spec.priority AS WELL AS THE CLASS NAME.
#
# The in-tree Priority admission plugin runs BEFORE MutatingAdmissionPolicy and
# MutatingAdmissionWebhook -- Kubernetes v1.36.6,
# pkg/kubeapiserver/options/plugins.go: Priority, then
# MutatingAdmissionPolicy, then MutatingAdmissionWebhook, then the validating
# pair. On create it resolves the class present in the SUBMITTED object, errors
# if spec.priority disagrees with what it computed, and then sets spec.priority
# itself:
#
#   if pod.Spec.Priority != nil && *pod.Spec.Priority != priority {
#       return admission.NewForbidden(a, fmt.Errorf("the integer value of
#       priority (%d) must not be provided in pod spec; priority admission
#       controller computed %d from the given PriorityClass name", ...))
#   }
#   pod.Spec.Priority = &priority
#
# So it never sees the class this policy adds, and nothing re-checks the pair
# afterwards. Writing only priorityClassName would persist `burst-tenant`
# beside `priority: 0` -- admitted, and scheduled at the wrong preemption order
# with nothing reporting it. Both fields are written together, and the coupling
# to the PriorityClass value is asserted by
# scripts/validate/preflight/86-burst-node-identity.sh.
#
# An earlier comment here explained this as Priority running AFTER the policy
# and rejecting the conflict. That is not what the API server does; the remedy
# was right and the mechanism was not.
#
# WHY JSONPatch AND NOT ApplyConfiguration. Apply configurations may not modify
# atomic structs, maps or arrays, and both fields this writes are atomic in the
# Pod API: spec.nodeSelector is +mapType=atomic and spec.tolerations is
# +listType=atomic. JSONPatch is the only patch type that can write them.
#
# WHY CREATE ONLY. request.userInfo identifies the CURRENT request, not the
# pod's original creator, so an update by another controller would fail the
# identity test and be refused for carrying placement it legitimately has. It
# is safe to stop at create because the fields cannot be assembled later:
# ValidatePodUpdate permits only image changes, activeDeadlineSeconds, resize
# fields and ADDED tolerations, so nodeSelector, priorityClassName and priority
# are immutable after creation -- and a toleration appended to an
# already-scheduled pod does not relocate it.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: burst-placement-sandbox
  annotations:
    policies.kyverno.io/title: Burst placement for sandbox pods
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Writes ADR-052 burst placement onto sandbox pods in namespaces where the
      platform has enabled burst compute. Tenant execution runs on elastic cloud
      capacity; home-lab capacity is reserved for platform infrastructure.
spec:
  # A mutation that cannot be evaluated must not admit an unplaced pod.
  failurePolicy: Fail
  # Admission only. There is nothing to mutate in a background scan, and
  # request.userInfo -- the authorization below -- exists only at admission.
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  # Scope is declared here, never generated. Autogen defaults to true and would
  # synthesise rules for every pod controller, which is not what this governs.
  autogen:
    podControllers:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    # Capability opt-in, platform-rendered (ADR-047 Tier 2). A fleet declares
    # the request; the platform labels the namespace. A fleet cannot grant
    # itself burst capacity by labelling its own pods.
    namespaceSelector:
      matchLabels:
        compute.nutgraf.in/burst-compute: enabled
    # Selected on a label the UPSTREAM CONTROLLER sets, not one the fleet puts
    # in the CR. The SDK sets agents.x-k8s.io/sandbox: "true" in the Sandbox
    # CR's podTemplate and it does NOT survive: the controller owns the
    # agents.x-k8s.io/ label space and replaces it with
    # agents.x-k8s.io/sandbox-name-hash on the pod it creates.
    objectSelector:
      matchExpressions:
        - key: agents.x-k8s.io/sandbox-name-hash
          operator: Exists
  matchConditions:
    # THE AUTHORIZATION BOUNDARY. The label above says WHICH pods to place; it
    # does not establish WHO created them, and it cannot: a tenant's own
    # repository can carry any podTemplate label, ArgoCD applies it, and the
    # ReplicaSet controller stamps it onto the pods it creates. The one field no
    # manifest can set is the authenticated caller.
    - name: created-by-the-sandbox-controller
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:agent-sandbox-system:agent-sandbox-controller'
  variables:
    # The toleration must match register-with-taints in
    # spokepool-burst-bootstrap-v1 and the
    # capacity.cluster-autoscaler.kubernetes.io/taints annotation on the burst
    # MachineDeployment. Asserted by 86-burst-node-identity.sh.
    - name: burstToleration
      expression: >-
        {'key': 'workload-class', 'operator': 'Equal', 'value': 'burst',
         'effect': 'NoSchedule'}
    # THE COMPLETE TOLERATION, not just its key. Skipping the append because
    # some workload-class toleration exists would accept one with a different
    # operator, value or effect as satisfying the burst contract -- it does not
    # tolerate the burst taint, so the pod would carry placement it cannot use
    # and never schedule onto burst capacity. A conflicting entry is left where
    # it is and the correct one is appended beside it; tolerations are additive,
    # and the companion validation requires an exactly matching entry.
    - name: hasBurstToleration
      expression: >-
        has(object.spec.tolerations) &&
        object.spec.tolerations.exists(t,
          has(t.key) && t.key == 'workload-class'
          && has(t.operator) && t.operator == 'Equal'
          && has(t.value) && t.value == 'burst'
          && has(t.effect) && t.effect == 'NoSchedule')
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        # Conditional and idempotent. `add` fails when a path's parent is
        # absent, so the map and the list are each created when missing and
        # added to when present, and a pod that already carries the burst
        # toleration is not given a second one.
        #
        # The toleration is APPENDED rather than replacing the list. The legacy
        # strategic merge replaced it, which would discard tolerations
        # Kubernetes itself may have added before this runs; nothing about the
        # placement boundary depends on the list being ours alone, and the
        # validating policy below confirms the required entry is present.
        expression: >-
          (has(object.spec.nodeSelector)
            ? [
                JSONPatch{op: "add", path: "/spec/nodeSelector/workload-location", value: "hetzner"},
                JSONPatch{op: "add", path: "/spec/nodeSelector/" + jsonpatch.escapeKey("node-role.kubernetes.io/worker"), value: ""}
              ]
            : [
                JSONPatch{op: "add", path: "/spec/nodeSelector",
                          value: {"workload-location": "hetzner", "node-role.kubernetes.io/worker": ""}}
              ])
          +
          (!has(object.spec.tolerations)
            ? [ JSONPatch{op: "add", path: "/spec/tolerations", value: [variables.burstToleration]} ]
            : (variables.hasBurstToleration
                ? []
                : [ JSONPatch{op: "add", path: "/spec/tolerations/-", value: variables.burstToleration} ]))
          +
          [
            JSONPatch{op: "add", path: "/spec/priorityClassName", value: "burst-tenant"},
            JSONPatch{op: "add", path: "/spec/priority", value: -1000}
          ]
---
# The companion validating policy (ADR-052 §4), and the reason the mutation
# fails closed.
#
# It runs after every mutating policy, so it sees the pod as it will be
# persisted. Three branches, keyed on the AUTHENTICATED caller rather than on a
# label:
#
#   the sandbox controller   must have produced a completely placed pod. If the
#                            mutation was absent, disabled or did not match, the
#                            pod arrives bare and is DENIED rather than admitted
#                            onto home-lab capacity.
#   the EphemeralJob         exempt. Its placement was written by the operator
#   operator                 that authored the Job, which is platform code.
#   anyone else              may not declare platform-owned burst placement.
#
# The previous design excluded label-bearing pods from this check, so a tenant
# that copied either label into its own podTemplate was exempted outright. A
# label may select which rule applies; it must not grant an exemption.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: burst-placement-authorization
  annotations:
    policies.kyverno.io/title: Burst placement is platform-supplied
    policies.kyverno.io/subject: Pod
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  autogen:
    podControllers:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        compute.nutgraf.in/burst-compute: enabled
  variables:
    - name: isSandboxController
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:agent-sandbox-system:agent-sandbox-controller'
    - name: isEphemeralJobOperator
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:platform-ops:ephemeral-job-operator'
    - name: placedOnBurst
      expression: >-
        has(object.spec.nodeSelector)
        && 'workload-location' in object.spec.nodeSelector
        && object.spec.nodeSelector['workload-location'] == 'hetzner'
        && 'node-role.kubernetes.io/worker' in object.spec.nodeSelector
        && has(object.spec.tolerations)
        && object.spec.tolerations.exists(t,
             has(t.key) && t.key == 'workload-class'
             && has(t.value) && t.value == 'burst'
             && has(t.effect) && t.effect == 'NoSchedule')
        && has(object.spec.priorityClassName)
        && object.spec.priorityClassName == 'burst-tenant'
        && has(object.spec.priority) && object.spec.priority == -1000
    - name: declaresBurstPlacement
      expression: >-
        (has(object.spec.priorityClassName) && object.spec.priorityClassName == 'burst-tenant')
        || (has(object.spec.tolerations)
            && object.spec.tolerations.exists(t, has(t.key) && t.key == 'workload-class'))
  validations:
    - expression: >-
        variables.isSandboxController ? variables.placedOnBurst
          : (variables.isEphemeralJobOperator ? true : !variables.declaresBurstPlacement)
      message: >-
        Burst placement is platform-supplied (ADR-052 §4). A sandbox pod must carry the
        platform's complete burst placement -- workload-location=hetzner and the worker
        role, the workload-class=burst:NoSchedule toleration, priorityClassName
        burst-tenant and priority -1000; if it does not, the placement mutation did not
        reach it and admitting it would run tenant execution on home-lab capacity. Any
        other caller may not declare that placement: remove priorityClassName
        'burst-tenant' and the workload-class toleration, and request burst capacity
        through an EphemeralJob or a Sandbox instead.
