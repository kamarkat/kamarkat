---
# ADR-078 addendum 5 §5: every rule group evaluates at the platform interval.
#
# The platform's own rule groups are excluded. The legacy policy did that with
# an `exclude` block selecting on a label, which has no equivalent in
# matchConstraints.excludeResourceRules -- that field selects by resource, not
# by label. It is expressed as a negated matchCondition instead, which is
# faithful: a false matchCondition SKIPS evaluation rather than denying, so a
# platform-managed rule group is not governed, exactly as before.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: tenant-rule-interval
  labels:
    app.kubernetes.io/component: tenant-governance
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # NO SYNC WAVE. This was wave "5" -- after everything -- and that was the
    # liveness defect behind manual promotion syncs.
    #
    # ArgoCD completes a wave only when its resources are Healthy, so a wave AFTER
    # the workloads turns every workload's health into a precondition for the sync
    # operation finishing. One resource that cannot become Ready (its built-in
    # Deployment/StatefulSet assessment reports Progressing, never Degraded) kept
    # the operation Running, and ArgoCD will not start a new operation while one is
    # in flight -- so a promotion was seen and could not be applied.
    #
    # Nothing is lost by removing it. A fail-closed ValidatingPolicy denies nothing
    # on its own: Kyverno GENERATES the ValidatingWebhookConfiguration at runtime
    # (none is shipped in infra/kyverno/), so the policy object is inert until
    # Kyverno is serving, and admission is fail-closed from that moment whatever
    # order the objects arrived in. SkipDryRunOnMissingResource above already
    # covers the dry-run race.
    #
    # It is also stricter than before: governance now lands with the workloads
    # rather than after them, instead of a first sync applying everything ungoverned
    # and installing its policies last.
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - none
  matchConstraints:
    resourceRules:
      - apiGroups: ["monitoring.coreos.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["prometheusrules"]
      - apiGroups: ["operator.victoriametrics.com"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vmrules"]
  matchConditions:
    - name: not-platform-managed
      expression: >-
        !(has(object.metadata.labels)
          && 'app.kubernetes.io/managed-by' in object.metadata.labels
          && object.metadata.labels['app.kubernetes.io/managed-by'] == 'platform')
  validations:
    # The legacy pattern used a conditional anchor, =(interval): "30s" -- if the
    # field is present it must be 30s -- over every group in the list.
    - expression: >-
        !has(object.spec.groups)
        || object.spec.groups.all(g, !has(g.interval) || g.interval == '30s')
      message: >-
        Every rule group evaluates at 30s (ADR-078 addendum 5 §5). Leave
        `interval` unset, or set it to 30s.
