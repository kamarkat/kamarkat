---
# ADR-078 addendum 5 §5: every rule group evaluates at the platform interval.
#
# The platform's own rule groups are excluded. The legacy policy did that with
# an `exclude` block selecting on a label, which has no equivalent in
# matchConstraints.excludeResourceRules -- that field selects by resource, not
# by label. It is expressed as a negated matchCondition instead, which is
# faithful: a false matchCondition SKIPS evaluation rather than denying, so a
# platform-managed rule group is not governed, exactly as before.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: tenant-rule-interval
  labels:
    app.kubernetes.io/component: tenant-governance
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["monitoring.coreos.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["prometheusrules"]
      - apiGroups: ["operator.victoriametrics.com"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vmrules"]
  matchConditions:
    - name: not-platform-managed
      expression: >-
        !(has(object.metadata.labels)
          && 'app.kubernetes.io/managed-by' in object.metadata.labels
          && object.metadata.labels['app.kubernetes.io/managed-by'] == 'platform')
  validations:
    # The legacy pattern used a conditional anchor, =(interval): "30s" -- if the
    # field is present it must be 30s -- over every group in the list.
    - expression: >-
        !has(object.spec.groups)
        || object.spec.groups.all(g, !has(g.interval) || g.interval == '30s')
      message: >-
        Every rule group evaluates at 30s (ADR-078 addendum 5 §5). Leave
        `interval` unset, or set it to 30s.
