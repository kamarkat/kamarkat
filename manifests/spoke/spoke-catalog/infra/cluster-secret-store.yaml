# This workload cluster's secret store (ADR-117 §4): its hub's OpenBao, reached
# through the hub Gateway at openbao.<hubDomain> (a publicly trusted certificate).
#
# The cluster logs in with a ServiceAccount token its OWN API server signs. The
# hub's auth mount spoke-<cluster> trusts exactly this cluster's signing key, and
# its `platform` role binds this one ServiceAccount to a policy reading
# kv/data/spokes/<cluster>/platform and nothing else -- so a spoke cannot read
# another spoke's secrets, and there is no stored credential to leak or rotate.
# Tenant namespaces are excluded below: an application cannot read the cluster's
# platform credentials by naming this store.
# Tokens are minted per login for audience "openbao" and expire in 10 minutes.
#
# The mount name and hub domain are per cluster: templated-fields.yaml (released)
# and the ApplicationSet (unreleased) set them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-platform-reader
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-platform
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Platform namespaces only. A tenant namespace (labelled tenant-id) reads its own
  # scope through its own SecretStore and must not be able to name this one.
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: tenant-id
            operator: DoesNotExist
  provider:
    vault:
      server: "https://openbao.dev.nutgraf.in"
      path: kv
      version: v2
      auth:
        jwt:
          path: spoke-PLACEHOLDER
          role: platform
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: openbao-platform-reader
              namespace: external-secrets
            audiences: [openbao]
            expirationSeconds: 600
