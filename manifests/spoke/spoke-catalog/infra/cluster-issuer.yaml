---
# ADR-048: Spoke ClusterIssuer backed by Infisical PKI.
# Delivered by ClusterResourceSet lifecycle injection (spoke-identity-operator
# → {spoke}-cluster-issuer CRS wrapper → CAPI). This file is the authoritative
# reference for the CRS-delivered desired state; it is intentionally NOT in
# kustomization so ArgoCD never prunes or empties the CRS-delivered object.
#
# Ownership: ClusterResourceSet delivers; Git documents the expected state.
# To update: edit this file, commit, then apply to the spoke directly.
# SMI rotation will re-deliver if the wrapper hash changes.
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: infisical-fleet-issuer
#
# pki-issuer v1.x: an APPLICATION and a PROFILE, no project and no inline client
# id. The project is resolved by the hub's Infisical from the organisation's
# active Certificate Manager project, and both halves of the identity are read
# from the Secret the spoke already receives -- so this file no longer carries a
# project uuid or a client-id uuid, which is also why it no longer goes stale
# when the hub is rebuilt (ADR-111).
spec:
  url: "https://infisical.dev.nutgraf.in"
  application: "kamarkat"
  profile: "infrastructure-services"
  authentication:
    method: universal
    universal:
      clientIdRef:
        name: infisical-auth
        namespace: platform-security
        key: client-id
      clientSecretRef:
        name: infisical-auth
        namespace: platform-security
        key: client-secret
