---
# infisical-issuer CRDs and Controller
# Version: v0.1.0
# Manages InfisicalClusterIssuer resources on spoke clusters
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infisical-issuer
  namespace: cert-manager
  labels:
    app: infisical-issuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical-issuer
  template:
    metadata:
      labels:
        app: infisical-issuer
    spec:
      serviceAccountName: infisical-issuer
      containers:
      - name: infisical-issuer
        image: docker.io/infisical/pki-issuer:v1.1.0
        args:
        - --metrics-bind-address=:8443
        # NO SECRET_STORE_* ENV. pki-issuer v1.1.0 reads one variable from its
        # environment -- POD_NAMESPACE (cmd/main.go) -- and takes every credential
        # from the secret references on each ClusterIssuer
        # (internal/auth/universal.go resolves clientIdRef and clientSecretRef).
        #
        # Three variables lived here, carried over from v0.2.0, and they were worse
        # than inert: SECRET_STORE_CLIENT_ID and SECRET_STORE_CLIENT_SECRET handed
        # this pod the WORKLOAD identity's credential -- the one ESO authenticates
        # with -- for a consumer that never read it. The issuer authenticates as
        # its own identity, through infisical-pki-auth, and nothing else.
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-issuer
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infisical-issuer
rules:
- apiGroups: ["infisical-issuer.infisical.com"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates", "certificaterequests"]
  verbs: ["*"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificaterequests/status"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["secrets", "events", "configmaps"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infisical-issuer
subjects:
- kind: ServiceAccount
  name: infisical-issuer
  namespace: cert-manager
