    # Source: cilium/templates/hubble/peer-service.yaml
    apiVersion: v1
    kind: Service
    metadata:
      name: hubble-peer
      namespace: kube-system
      labels:
        k8s-app: cilium
        app.kubernetes.io/part-of: cilium
        app.kubernetes.io/name: hubble-peer
        helm.sh/chart: cilium-1.20.4

    spec:
      selector:
        k8s-app: cilium
