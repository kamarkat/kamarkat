        gateway.networking.k8s.io/channel: standard
      labels:
        gateway.networking.k8s.io/policy: Direct
      name: backendtlspolicies.gateway.networking.k8s.io
    spec:
      group: gateway.networking.k8s.io
      names:
        categories:
          - gateway-api
        kind: BackendTLSPolicy
