---
# Cilium CNI Addon Template for ClusterResourceSet
# This Secret contains the complete Cilium CNI manifest that will be applied to spoke pool clusters during bootstrap.
# Cilium v1.20.4 — Gateway-API secrets sync (enable-gateway-api-secrets-sync) delivers the tenant Gateway TLS secret
# to Envoy SDS (fixes empty /certs on 1.15.6). See ADR-049.
#
# Hubble TLS is owned by in-cluster certgen (hubble.tls.auto.method=cronJob), so this payload carries NO
# cilium-ca and NO hubble-server-certs. Each spoke generates and rotates its own CA, and no private key is
# committed. Until 1.20.4 the render owned them (method=helm): the CA and the Hubble server key were generated
# at render time and stored here, so every spoke from one bundle shared one CA and one key.
#
# Re-vendored with:
#   helm template cilium cilium/cilium --version 1.20.4 -n kube-system --kube-version 1.36.6 \
#     --set gatewayAPI.enabled=true --set envoy.enabled=false \
#     --set hubble.tls.auto.enabled=true --set hubble.tls.auto.method=cronJob
# then: drop the cilium-config ConfigMap, append the KUBERNETES_SERVICE_HOST/PORT env pair to the
# cilium-agent and cilium-operator containers, and add the wait-for-gateway-api-crds init container.
#
# ─── cilium-config is NOT in this payload (ADR-046 §24, ADR-048) ────────────
# The delivered `cilium-config` ConfigMap is rendered per-spoke by hub-operator,
# because `k8s-service-host`/`k8s-service-port` are the spoke's control-plane
# endpoint and are unknown until CAPH has created its load balancer. Shipping a
# static copy here as well would give the object two owners; the settings live in
# manifests/providers/hetzner/k8s/cilium-config-base.yaml and hub-operator is the single renderer.
#
# Without those two keys Cilium falls back to the in-cluster ClusterIP
# (10.96.0.1), which nothing can route on a fresh spoke: the ClusterClass deletes
# kube-proxy at init (§addendum 1) and Cilium — the intended replacement — cannot
# start until it reaches the API. That deadlock is what §24 records.

apiVersion: v1
kind: Secret
metadata:
  name: cilium-addon-template
  namespace: platform-capi
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/component: cni
    app.kubernetes.io/part-of: cluster-bios
type: addons.cluster.x-k8s.io/resource-set
stringData:
  # Gateway API CRDs travel WITH Cilium, ordered ahead of it.
  #
  # The spoke Cilium runs with enable-gateway-api=true, so its operator's init
  # container blocks until these CRDs exist. Delivering them through ArgoCD
  # (spoke-catalog) cannot work: that ApplicationSet uses a clusters generator
  # matching REGISTERED spokes, and a spoke cannot register until its node is
  # Ready, which needs the CNI that is waiting for these CRDs. Observed as
  # cilium-operator Init:CrashLoopBackOff with the node NotReady indefinitely.
  #
  # Keyed 00- so it is applied before cilium.yaml. Standard channel, pinned to
  # v1.5.1 (Cilium v1.17.x pairs with Gateway API v1.5.x). Source of truth is
  # internal/assets/manifests/addons/gateway-api-crds.yaml — the hub delivers
  # the same bundle through its own CRS addon; keep the two in step.
  00-gateway-api-crds.yaml: |
    ---
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      annotations:
        api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api/pull/4530
