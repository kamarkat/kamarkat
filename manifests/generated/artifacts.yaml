# ADR-045: Bootstrap-Generated GitOps Artifacts Registry
#
# Files a Day-0 phase writes into the box's GitOps repository and that a later
# phase reads through ArgoCD. [adr045-commit] validates each one, commits and
# pushes it before boundary 04, and waits for its consumedBy Application.
#
# Entry shape:
#   - file: manifests/environments/{env}/generated/<path>   # {env} = hub overlay
#     consumedBy: <Application that cannot converge without it>
#     requiredFields: [<dotted keys that must be non-empty>]
# In a tenant repository the path is rewritten to
# registry/clusters/<cluster>/generated/<path>. Every file listed here must be
# named by the code that writes it (TestEveryADR045ArtifactHasAWriter).
#
# gateway-dns-target.yaml is the one artifact left: the hub's public ingress
# address, read by environment-manager as hubIngressAddress and passed to the
# hub Gateway and its routes as their external-dns target. Without it in git,
# external-dns publishes nothing and every hub hostname is NXDOMAIN.
apiVersion: bootstrap.kamarkat.io/v1alpha1
kind: GeneratedArtifactRegistry
artifacts:
  - file: manifests/environments/{env}/generated/values/gateway-dns-target.yaml
    consumedBy: hub-gateway
    requiredFields:
      - hubIngressAddress
