{{- /*
ADR-035 / ADR-117: the hub's two private-PKI ClusterIssuers, both cert-manager's
own Vault issuer against the box's OpenBao. The intermediate is OpenBao's
pki_int, signed by the box's custody-held root (`kakt pki sign-intermediate`).

The PROFILE separates them: each signs through its own pki_int role, whose
max_ttl caps every certificate (internal/pki: infrastructure-services 7 days,
signing-keys 3650). Issuing a long-lived signing key through the short-lived
role is the mistake this split prevents. hub-operator reconciles the roles.

cert-manager authenticates as the openbao-issuer ServiceAccount (Kubernetes auth,
audience openbao); the OpenBao role cert-manager may only sign through these two
roles. The server is verified against the listener CA's public certificate.
*/ -}}
{{- range $name, $profile := dict "openbao-fleet" .Values.certificateProfile.fleet "openbao-signing" .Values.certificateProfile.signing }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name }}
spec:
  vault:
    server: {{ $.Values.openbao.server | quote }}
    path: pki_int/sign/{{ $profile }}
    caBundleSecretRef:
      name: openbao-listener-ca
      key: tls.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager
        serviceAccountRef:
          name: openbao-issuer
          audiences: [openbao]
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issuer
  namespace: cert-manager
---
# cert-manager mints this ServiceAccount's tokens to log in to OpenBao.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [openbao-issuer]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-issuer-token
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
