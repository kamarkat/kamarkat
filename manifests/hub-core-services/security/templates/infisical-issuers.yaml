{{- /*
ADR-035: the Hub's two Infisical-backed ClusterIssuers.

Both were previously assembled by Kustomize from a base holding placeholder
values, a Day-0-generated patch supplying the fleet identity, and `replacements`
copying three of the fleet issuer's fields onto the signing issuer. Reading
either issuer's effective configuration meant reading all three. They are
templated from values here so that what a cluster runs is stated in that
cluster's values file and nowhere else.

NOTHING PER-CLUSTER IS LEFT IN THEM, which is what pki-issuer v1.x changed.

v0.2.0 took a `projectId` and a `certificateTemplateName` and an inline
`clientId`, so each cluster's issuers carried that cluster's project and
identity -- written in by Day-0 (writeFleetPKIValues) and gated on both being
present, because rendering them early meant rendering the PREVIOUS cluster's
project id. v1.x takes an `application` and a `profile`, resolves the project
from the organisation's active Certificate Manager project, and reads the client
id from the same Secret that already holds the client secret.

So there is no unknown-yet state to gate on any more and no completeness check
to make: the application and the profiles are the platform's own names, the
Secret is created by Day-0 in the namespace below, and this component renders
identically on every cluster in the fleet. The issuers go Ready when Infisical
has the application -- cert-manager retries until it does, which is the same
convergence every other consumer of a not-yet-bootstrapped Infisical relies on.
*/ -}}
{{- $a := .Values.infisical.auth -}}
{{- $signing := .Values.infisical.signing | default dict -}}
---
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: infisical-fleet-issuer
spec:
  url: {{ .Values.infisical.url | quote }}
  application: {{ .Values.infisical.application | quote }}
  profile: {{ .Values.certificateProfile.fleet | quote }}
  authentication:
    method: universal
    {{- /* Both halves of the identity come from the one Secret Day-0 writes.
           The client id used to be an inline value in this file and in the
           box's values, which meant a rotation of the machine identity had to
           be applied in two places that nothing compared. */}}
    universal:
      clientIdRef:
        name: {{ $a.secretName | quote }}
        namespace: {{ $a.secretNamespace | quote }}
        key: {{ $a.clientIdKey | quote }}
      clientSecretRef:
        name: {{ $a.secretName | quote }}
        namespace: {{ $a.secretNamespace | quote }}
        key: {{ $a.clientSecretKey | quote }}
---
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: infisical-signing-issuer
spec:
  url: {{ .Values.infisical.url | quote }}
  {{- /* Empty signing values inherit the fleet application, which is what the
         Kustomize replacements did for the project. Stated here so the default
         is legible and so overriding it is a value rather than a change to the
         component. The PROFILE is what separates the two issuers: signing-keys
         is capped at 3650 days and infrastructure-services at 7 (internal/pki),
         and issuing a long-lived signing key through the short-lived profile is
         the mistake this split exists to prevent. */}}
  application: {{ ($signing.application | default .Values.infisical.application) | quote }}
  profile: {{ .Values.certificateProfile.signing | quote }}
  authentication:
    method: universal
    universal:
      clientIdRef:
        name: {{ $a.secretName | quote }}
        namespace: {{ $a.secretNamespace | quote }}
        key: {{ $a.clientIdKey | quote }}
      clientSecretRef:
        name: {{ $a.secretName | quote }}
        namespace: {{ $a.secretNamespace | quote }}
        key: {{ $a.clientSecretKey | quote }}
