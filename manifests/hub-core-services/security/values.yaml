# Coordinates of the Infisical instance this cluster's PKI issuers authenticate
# against.
#
# NOTHING HERE IS PER-CLUSTER, which pki-issuer v1.x is what made possible. Until
# then this file carried `fleet.projectId` and `fleet.clientId` -- that cluster's
# project and machine identity, written in by Day-0 and required by
# values.schema.json, so the component could not be published and a cluster
# rendered before Infisical existed got the previous cluster's project id.
#
# v1.x resolves the project server-side, from the organisation's active
# Certificate Manager project, and reads the identity from the Secret that
# already holds the client secret. What is left is the platform's own naming,
# identical on every cluster in the fleet.
infisical:
  # Reachable URL of the Infisical API from inside this cluster.
  #
  # A default rather than a supplied value: the infisical-issuer controller dials
  # this from inside the cluster, so the Service address is correct on every
  # provider and does not vary per cluster.
  url: "http://infisical-standalone-infisical.platform-security.svc:8080"

  # The PKI Application every Issuer issues through (ADR-035).
  #
  # Created by Day-0 in the cert-manager project, bound to the profiles
  # internal/pki declares (internal/kakt-cli/infisical/cert_profiles.go). One per
  # organisation: an application groups profiles, and the profiles are the
  # platform's, so a per-cluster application would put cluster identity back into
  # this file.
  application: "kamarkat"

  # The signing issuer's application, if it is ever a different one. Empty
  # inherits the application above, which is what the Kustomize replacements did
  # for the project. The two issuers are separated by their PROFILE, below.
  signing:
    application: ""

  # The Secret holding the machine identity. Both halves: v0.2.0 took the client
  # id inline in the issuer and the secret only for the client secret, so a
  # rotation had to be applied in two places that nothing compared.
  #
  # Written by Day-0 into platform-security (`kakt hub init-secrets`), never
  # rendered by this chart. v1.x requires a namespace on every reference.
  auth:
    secretName: infisical-auth
    secretNamespace: platform-security
    clientIdKey: client-id
    clientSecretKey: client-secret

# The certificate profiles each issuer issues with, by slug (internal/pki).
#
# Named `certificateProfile` rather than `certificateTemplate`: templates are the
# v0.2.0 vocabulary and the server's own routes are
# /api/v1/cert-manager/certificate-profiles. The TTL ceiling lives on the profile,
# which is why the two issuers differ only here -- 7 days for infrastructure
# services, 3650 for signing keys.
certificateProfile:
  fleet: infrastructure-services
  signing: signing-keys
