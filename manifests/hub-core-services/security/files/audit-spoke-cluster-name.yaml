---
# Spoke cluster Secrets must carry a non-empty cluster-name label.
#
# AUDIT, NOT DENY. A missing label is a platform wiring fault, and refusing the
# registration would remove the cluster rather than report the fault. The policy
# reports; the registration proceeds.
#
# Scoped to spoke registrations only. capi2argo names the ArgoCD cluster Secret
# after the CAPI Cluster, which is the SpokePool claim name, so spoke-pool-* is
# the set of Secrets that must carry a name. Any other cluster registration -- a
# manually added cluster, a non-spoke target -- is out of scope and must not be
# reported as a violation.
#
# The namespace and the name prefix are matchConditions rather than
# matchConstraints: those select by resource and by label, and neither of these
# is either. object.metadata.namespace is reconciled by the API server before
# admission and is always present on a stored object, so the same expressions
# hold in admission and in background reporting.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: audit-spoke-cluster-name
  labels:
    app.kubernetes.io/component: platform-governance
    app.kubernetes.io/managed-by: argocd
  annotations:
    # Kyverno itself syncs at wave -1 in boundary 01 and this Application at
    # wave 1, so the CRDs are established before this is applied. The wave here
    # orders it within this Application's own sync only.
    argocd.argoproj.io/sync-wave: "5"
    policies.kyverno.io/title: Audit spoke cluster Secrets for cluster-name
    policies.kyverno.io/category: Platform Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Secret
spec:
  failurePolicy: Fail
  validationActions: [Audit]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
    objectSelector:
      matchLabels:
        argocd.argoproj.io/secret-type: cluster
  matchConditions:
    - name: platform-ops-namespace
      expression: "object.metadata.namespace == 'platform-ops'"
    - name: spoke-pool-secret
      expression: "object.metadata.name.startsWith('spoke-pool-')"
  validations:
    # "?*" in the pattern this replaces required the key to exist AND be a
    # non-empty string. An empty value is the more dangerous case: the label is
    # present, so a presence check would pass, but matchLabels still matches
    # nothing.
    - expression: >-
        has(object.metadata.labels)
        && 'cluster-name' in object.metadata.labels
        && object.metadata.labels['cluster-name'] != ''
      messageExpression: >-
        'Spoke cluster Secret ' + object.metadata.name + ' has no non-empty cluster-name
        label. The fleet ApplicationSets (tenant-app-xr/spoke/workload-provisioning,
        tenant-public-tls) select spokes with a clusters generator on this label, so every
        tenant targeting this spoke will generate zero Applications while the
        ApplicationSet reports Healthy. Check that the CAPI Cluster carries both
        cluster-name and take-along-label.capi-to-argocd.cluster-name, and that capi2argo
        is running.'
