---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: spokepools.nutgraf.in
spec:
  # Crossplane v2: cluster-scoped, so the XR composes the cluster-scoped
  # resources this composition needs (Namespace, ClusterIssuer,
  # ClusterSecretStore, ProviderConfig). Namespaced would forbid them.
  # Claims are gone in v2; nothing ever created the *Claim kind.
  scope: Cluster
  group: nutgraf.in
  names:
    kind: SpokePool
    plural: spokepools
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              additionalProperties: true
              required:
                - provider
                - region
                - nodePool
                - maxTenantCapacity
              properties:
                provider:
                  type: string
                  minLength: 1
                  description: >
                    Infrastructure provider for this spoke cell (e.g., hetzner, hybrid, aws).
                    The platform maps this to the internal composition at admission time.
                    Changing the provider after provisioning requires a full teardown and
                    re-provision.
                region:
                  type: string
                  description: "Provider region (e.g., hel1, nbg1, hel1) or 'hybrid' for home-lab"
                nodePool:
                  type: object
                  required:
                    - count
                    - instanceType
                  properties:
                    count:
                      type: integer
                      description: "Number of Hetzner burst worker nodes in the pool. 0 is valid for the hybrid cell where home-lab workers provide default capacity."
                      minimum: 0
                      maximum: 10
                    instanceType:
                      type: string
                      description: "Provider-specific machine type for worker nodes"
                maxTenantCapacity:
                  type: integer
                  description: "Maximum number of tenant schemas this cell can host"
                  minimum: 1
                  maximum: 100
                  default: 100
            status:
              type: object
              properties:
                spokeKubeconfigBase64:
                  type: string
                  description: "Transient state bridging the kubeconfig from Execution Hub to Global Hub"
                caData:
                  type: string
                clientCert:
                  type: string
                clientKey:
                  type: string
                resolvedProvider:
                  type: string
                  description: "Platform-resolved provider from spec.provider after validation"
                resolvedComposition:
                  type: string
                  description: "Platform-resolved composition name used for Crossplane provisioning"
                conditions:
                  type: array
                  x-kubernetes-list-map-keys:
                  - type
                  x-kubernetes-list-type: map
                  items:
                    type: object
                    required:
                    - lastTransitionTime
                    - reason
                    - status
                    - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "Generation of the resource that was observed when this condition was set"
