# NOTHING IN THIS COMPOSITION IS TEMPLATED PER BOX ANY MORE.
#
# Two rules lived here, both for objects that have moved to universal-tenant's
# workload path (see the composition's own note where items 7 and 8 were):
#
#   - replaceAll dev.nutgraf.in -> global.hubDomain, for the tenant SecretStore's
#     hostAPI, the one name in this composition that anyone resolved;
#   - resources[8] ... secretsScope.environmentSlug -> the box's management scope,
#     addressed by index because the literal is the bare word `management`.
#
# Both are now the chart's: the ApplicationSet passes hubDomain as a parameter and
# the store declares the management scope directly. Keeping either rule here would
# fail the release rather than drift silently -- replaceAll raises on zero matches
# and assign() refuses a path that is not there -- which is how this file is
# supposed to behave and why removing the rules is part of moving the objects.
#
# NOT the API groups. spokepools.nutgraf.in, ainativesaases.nutgraf.in and
# nutgraf.in/v1alpha1 identify the platform's CRDs in the same sense as
# cluster.x-k8s.io; templating them would rename the API a cluster serves and
# leave every claim referencing a group nothing registers.
[]
