# Hub sizing is management-plane policy, not a workload environment's (ADR-111
# Revision 7 §3). The values below were conditional on the hub's environmentSlug,
# which made the management plane's capacity a function of a workload stage it does
# not have. They are now declared outright.
#
# They carry this box's CURRENT EFFECTIVE values deliberately: de-conditionalising
# is not the moment to change capacity. Raising them is a capacity decision made on
# measurements -- an unsatisfiable constraint does not fail loudly, it pends, and
# the service it governs silently never returns.
# Per-box and per-environment values for the hub Grafana (ADR-078 addendum 5 §6).
- kind: Grafana
  name: platform
  fields:
    - path: [spec, config, server, root_url]
      value: 'https://grafana.{{ .Values.global.hubDomain }}'
    - path: [spec, deployment, spec, replicas]
      type: int
      value: '1'
    - path: [spec, deployment, spec, template, spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: 'ScheduleAnyway'
    # The box's issuer (§7), from the ONE global every reader of it uses -- the
    # spoke's VMAuth validates a viewer's token against the same value, and an
    # issuer those two disagree about refuses the token as signed by somebody
    # else, with nothing in the refusal naming which of them was wrong.
    #
    # The three PATHS are Zitadel's, exactly as the JWKS path is in
    # environment-manager's _oidc-issuer.tpl. A box federating to an issuer that
    # is not Zitadel sets `oidcIssuer` and these are the next thing it has to
    # declare; nothing here guesses them from a discovery document, because a
    # value fetched at render time cannot be reviewed in a diff.
    - path: [spec, config, auth.generic_oauth, auth_url]
      value: '{{ .Values.global.oidcIssuer }}/oauth/v2/authorize'
    - path: [spec, config, auth.generic_oauth, token_url]
      value: '{{ .Values.global.oidcIssuer }}/oauth/v2/token'
    - path: [spec, config, auth.generic_oauth, api_url]
      value: '{{ .Values.global.oidcIssuer }}/oidc/v1/userinfo'
    # The scopes, with the box's own observability project named in two of them.
    #
    # The project is asked for explicitly rather than relied on as the client's
    # default audience: the issuer asserts the project-scoped role claim for the
    # projects in the token's audience, and the claim the spokes match is that
    # one. Relying on the default would make the authorization depend on a
    # behaviour not stated in the request.
    #
    # Empty audience keeps the base scopes, because this component renders on
    # every box and a box with no viewer identity still runs Grafana for its own
    # metrics. Sign-in works; there is simply no spoke to query.
    - path: [spec, config, auth.generic_oauth, scopes]
      value: 'openid profile email offline_access{{ with (dig "observability" "viewer" "audience" "" .Values.global) }} urn:zitadel:iam:org:projects:roles urn:zitadel:iam:org:project:id:{{ . }}:aud{{ end }}'

- kind: HTTPRoute
  name: grafana
  fields:
    - path: [spec, hostnames, 0]
      value: 'grafana.{{ .Values.global.hubDomain }}'

# The redirect URI the viewer client is registered with (ADR-078 add.5 §7). Same
# host as the route above, from the same value, so the two cannot disagree.
- kind: ConfigMap
  name: observability-viewer
  fields:
    - path: [data, grafanaUrl]
      value: 'https://grafana.{{ .Values.global.hubDomain }}'
