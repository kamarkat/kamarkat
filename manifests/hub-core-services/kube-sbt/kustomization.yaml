apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-ops

# ADR-060 amendment: the SMTP credential this service applies to the live issuer,
# without which tenant owners are created with no way to receive their
# initialisation mail.
resources:
- manager.yaml
- network-policy.yaml
- identity-credentials-es.yaml
- zitadel-smtp-password-es.yaml

images:
- digest: sha256:f705cd09a4d88b6a2c3c079b203c0341ac0d03c50eccd5415ad712f07a1044bd
  name: controller
  newName: ghcr.io/soloz-io/zero-ops/kube-sbt

labels:
- pairs:
    app.kubernetes.io/component: metering-api
    app.kubernetes.io/name: kube-sbt
    app.kubernetes.io/part-of: kube-sbt
