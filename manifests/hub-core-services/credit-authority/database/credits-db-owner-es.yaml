# credits-db's APPLICATION-OWNER credential, for CloudNativePG itself.
#
# ONE PASSWORD SOURCE INSIDE CNPG (ADR-023/ADR-112 amendment 2026-11-24).
#
# The owner's password had two authorities: CNPG, which reconciles the application
# user from the Secret GetApplicationSecretName() resolves -- refreshCredentialsFromSecret()
# -> reconcileUser() -> SetUserPassword() on every instance reconcile -- and
# hub-operator's RoleManager, which issued ALTER ROLE from the Infisical value.
# Whichever ran last won, and on nutgraf-mgmt-1794929668 the role ended up holding
# CNPG's generated bootstrap password while Zitadel presented Infisical's, so
# authentication failed directly AND through the pooler:
#
#   FATAL: password authentication failed for user "hub_credits"
#   FATAL: SASL authentication failed                       (via the pooler)
#
# This Secret is now that one source. The Cluster's bootstrap.initdb.secret names
# it, GetApplicationSecretName() therefore returns it instead of the generated
# credits-db-app, and CNPG reconciles the owner to this value continuously -- on a
# RUNNING cluster, not only at bootstrap. credits-db-app becomes unused.
#
# SEPARATE FROM THE CONSUMER'S SECRET, deliberately. A Secret's `type` is immutable,
# so converting the existing consumer Secret to basic-auth would mean deleting it
# and interrupting the application; and the consumer wants a DSN while CNPG wants
# exactly two keys. Two namespace-local Secrets carrying one authoritative value is
# the approved shape -- two password GENERATORS is what is not.
#
# CNPG's contract, all three parts required:
#   * type kubernetes.io/basic-auth -- CNPG ignores any other type
#   * username EQUAL to the Cluster's `owner`, because CNPG takes the role name from
#     the Secret when one is given. Written literally rather than from Infisical: a
#     renamed value there would otherwise silently repoint CNPG at another role.
#   * cnpg.io/reload so a rotation is picked up promptly rather than at the next
#     resync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credits-db-owner
  namespace: platform-data
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: credits-db-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          cnpg.io/reload: "true"
      data:
        username: "hub_credits"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hub-credits-db-password
