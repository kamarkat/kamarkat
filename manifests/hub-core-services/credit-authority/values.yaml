global:
  hubDomain: ""

# The box's issuer and its JWKS, set by environment-manager from the same values
# every other consumer of the issuer reads. No default: a gateway that cannot
# validate tokens must not start.
oidcIssuer: ""
oidcJwksUrl: ""

# The box's ledger and its bucket, created by the provisioner (ADR-109 §4).
# Letters, digits, `_` and `-` only: the gateway's path rules are built from it.
ledger:
  name: credits
  bucket: credits

# Pinned by digest by the platform, like every platform image (ADR-021). The tag
# is carried BESIDE the digest, not instead of it. The digest is what is pulled;
# the tag is what makes the version reportable -- a pin with no tag enters the
# release inventory as the literal string "digest-pinned", which no upstream
# version ever equals, so the component reads as permanently behind and the
# release cannot say which version it runs.
images:
  # Formance Ledger v2.4.17 (MIT). The scratch build: the binary and nothing else.
  ledger:
    repository: ghcr.io/formancehq/ledger
    tag: "v2.4.17"
    digest: "sha256:269cc7079a4375eaaad21dd3565563a0372437216cdda14c200619c647c07ea3"
  # The one-shot provisioner: a shell and an HTTP client (curl 8.23.0).
  provisioner:
    repository: docker.io/curlimages/curl
    tag: "8.23.0"
    digest: "sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93"
  # The gateway: the AgentGateway release every other copy runs (v1.7.0).
  gateway:
    repository: cr.agentgateway.dev/agentgateway
    tag: "v1.7.0"
    digest: "sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b"
