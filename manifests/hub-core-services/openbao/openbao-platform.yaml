# The OpenBao component's own resources beside the chart (ADR-117).
---
# LISTENER CA (ADR-117 §2). The CA's key is the Secret `openbao-listener-ca` in
# cert-manager's cluster-resource namespace, generated by the CLI at Day-0 and readable
# only by cert-manager. Consumers never read it: they trust the public certificate in
# the `openbao-listener-trust` ConfigMaps the CLI writes beside them. OpenBao's own PKI
# plays no part, so start, unseal and recovery work while that PKI is unavailable.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-listener
spec:
  ca:
    secretName: openbao-listener-ca
---
# 90 days, renewed 30 days before expiry. The CA is rolled over when it has under a
# year left, so this certificate never outlives it. The listener reloads the files in
# place (tls_auto_reload), so renewal needs no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-listener-tls
  namespace: platform-data
spec:
  secretName: openbao-listener-tls
  duration: 2160h
  renewBefore: 720h
  commonName: openbao.platform-data.svc
  dnsNames:
    - openbao
    - openbao.platform-data
    - openbao.platform-data.svc
    - openbao.platform-data.svc.cluster.local
    - openbao-active.platform-data.svc
    - openbao-standby.platform-data.svc
    # Pod addresses, for request forwarding between HA nodes (cluster_addr).
    - "*.openbao-internal"
    - "*.openbao-internal.platform-data.svc"
    - "*.openbao-internal.platform-data.svc.cluster.local"
  ipAddresses:
    - 127.0.0.1
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: openbao-listener
    kind: ClusterIssuer
    group: cert-manager.io
---
# THE NARROW IDENTITIES (ADR-117 §3, §6, §7). Each is bound to one Kubernetes-auth role
# by self-initialization. Nothing grants anyone `create serviceaccounts/token` on them,
# so only cluster administrators can mint their tokens.
#   openbao-trust-bootstrap  Day-0 recovery-key sequence; its role and policy delete
#                            themselves when done
#   openbao-pki-signing      kakt pki sign-intermediate (administrator session)
#   openbao-recovery         kakt recovery in ADR-092 recovery mode
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-trust-bootstrap
  namespace: platform-data
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-pki-signing
  namespace: platform-data
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-recovery
  namespace: platform-data
automountServiceAccountToken: false
---
# BASE ADMISSION, present in every mode: hub-operator, the OpenBao peers (request
# forwarding on 8201), and nothing else. kubectl port-forward used by the CLI reaches
# the pod over its own loopback and is not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-base
  namespace: platform-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hub-operator
      ports:
        - {protocol: TCP, port: 8200}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - {protocol: TCP, port: 8200}
        - {protocol: TCP, port: 8201}
---
# CONSUMER ADMISSION (ADR-117 §7). Steady state only: the recovery overlay
# (../openbao-recovery) removes it, so a restored store serves no consumer until its
# recovery record is complete and the administrator settles the manifest (ADR-092).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-consumers
  namespace: platform-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
  ingress:
    - from:
        # ESO (hub ClusterSecretStore) and cert-manager (Vault ClusterIssuers).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cert-manager
      ports:
        - {protocol: TCP, port: 8200}
---
# The hub Gateway (Cilium) reaches backends as the `ingress` entity, which a standard
# NetworkPolicy cannot select -- the same form the billing engine and credit authority
# use. Spoke ESO, issuers and tenant stores arrive this way. Steady state only, like
# openbao-consumers: the recovery overlay removes it too.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-consumers-gateway
  namespace: platform-data
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
# PRE-UPGRADE RECOVERY POINT (ADR-117 §7). Synced in an earlier wave than the
# StatefulSet, and healthy only when `completed`, so a new OpenBao version starts only
# after a fresh backup exists. The NAME is unique to the upgrade operation:
#   openbao-db-pre-<openbaoVersion>-<bundleVersion>-<serverName>
# A routine sync finds the same name already present and takes no backup; a version
# change, a new bundle or a restore (which bumps serverName) renders a new name.
# CloudNativePG never resets a completed Backup, so a reused name would be satisfied by
# an old one -- this naming is what prevents that. The serverName here must equal
# openbao-db's (database/openbao-db.yaml); a preflight check asserts they agree.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: openbao-db-pre-2-7-3-development-openbao-db-v1
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    kamarkat.io/openbao-target-version: "2.7.3"
    kamarkat.io/openbao-db-server-name: openbao-db-v1
spec:
  cluster:
    name: openbao-db
  method: barmanObjectStore
