# OpenBao, the box's only self-hosted secret store (ADR-117).
#
# Chart openbao 0.30.8 (appVersion v2.7.3), rendered by kustomize helmCharts.
#
# WHAT IS DELIBERATELY OFF
#   injector, csi       Secret delivery is ESO's alone (ADR-003); neither is used.
#   dataStorage         Storage is PostgreSQL (openbao-db, ADR-117 §2), not Raft.
#   standalone          HA mode is used at every replica count, so the PostgreSQL HA
#                       lock is always held and a second replica needs no reconfigure.
#   ui service          The UI is served through the hub Gateway, not its own Service.
#
# START NEEDS NOTHING FROM OPENBAO (ADR-117 §2, §3):
#   storage   client certificate from CloudNativePG (openbao-db-openbao-client-cert)
#   listener  certificate from cert-manager's openbao-listener ClusterIssuer, whose CA
#             the CLI generates at Day-0 -- never OpenBao's own PKI
#   seal      static seal, keys from Secret openbao-seal, delivered by the CLI from the
#             escrow (never ESO), as BAO_STATIC_SEAL_* environment variables
#             (kustomization.yaml patch)
global:
  tlsDisable: false

injector:
  enabled: false

csi:
  enabled: false

ui:
  enabled: false

server:
  image:
    registry: quay.io
    repository: openbao/openbao
    # Pinned explicitly rather than inherited from the chart's appVersion, so a chart
    # bump cannot move the box's secret store without saying so. A version change is
    # preceded by the openbao-db pre-upgrade Backup (ADR-117 §7).
    tag: "2.7.3"

  # RollingUpdate, not the chart's OnDelete: a configuration or version change must not
  # wait for someone to delete pods. Auto-unseal makes each restarted pod rejoin alone.
  updateStrategyType: RollingUpdate

  # GitLab's production floor for OpenBao (ADR-117 Consequences): memory limit equal to
  # the request (it crashes rather than degrades past it), CPU limit twice the request.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  dataStorage:
    enabled: false
  auditStorage:
    enabled: false
  standalone:
    enabled: false

  # Kubernetes authentication reviews hub ServiceAccount tokens (ADR-117 §4).
  authDelegator:
    enabled: true

  serviceAccount:
    create: true
    name: openbao

  # Worker nodes only (ADR-014); the placement class is per box (templated-fields.yaml).
  nodeSelector:
    node-role.kubernetes.io/worker: ""
    workload-location: PLACEHOLDER_PLACEMENT

  extraEnvironmentVars:
    # The local CLI inside the pod (readiness probe) verifies the listener with the
    # same CA its clients use.
    BAO_CACERT: /openbao/tls/listener/ca.crt

  volumes:
    - name: listener-tls
      secret:
        secretName: openbao-listener-tls
        defaultMode: 0440
    - name: storage-client-cert
      secret:
        secretName: openbao-db-openbao-client-cert
        defaultMode: 0440
    - name: storage-ca
      secret:
        secretName: openbao-db-ca
        items:
          - key: ca.crt
            path: ca.crt
        defaultMode: 0440
    # The database engine's per-application connections (ADR-117 §5): each mounts the
    # login role's OWN certificate, used only against the `postgres` database.
    - name: zitadel-db-cert
      secret:
        secretName: zitadel-db-hub-zitadel-client-cert
        defaultMode: 0440
    - name: zitadel-db-ca
      secret:
        secretName: zitadel-db-ca
        items: [{key: ca.crt, path: ca.crt}]
        defaultMode: 0440
    - name: credits-db-cert
      secret:
        secretName: credits-db-hub-credits-client-cert
        defaultMode: 0440
    - name: credits-db-ca
      secret:
        secretName: credits-db-ca
        items: [{key: ca.crt, path: ca.crt}]
        defaultMode: 0440
    - name: grafana-db-cert
      secret:
        secretName: grafana-db-hub-grafana-client-cert
        defaultMode: 0440
    - name: grafana-db-ca
      secret:
        secretName: grafana-db-ca
        items: [{key: ca.crt, path: ca.crt}]
        defaultMode: 0440

  # Whole-volume mounts, never subPath: kubelet updates them in place on renewal, and
  # the pinned pgx and the listener reload read the new files (ADR-117 §2).
  volumeMounts:
    - {name: listener-tls, mountPath: /openbao/tls/listener, readOnly: true}
    - {name: storage-client-cert, mountPath: /openbao/pg/client, readOnly: true}
    - {name: storage-ca, mountPath: /openbao/pg/ca, readOnly: true}
    - {name: zitadel-db-cert, mountPath: /openbao/db/zitadel-db/client, readOnly: true}
    - {name: zitadel-db-ca, mountPath: /openbao/db/zitadel-db/ca, readOnly: true}
    - {name: credits-db-cert, mountPath: /openbao/db/credits-db/client, readOnly: true}
    - {name: credits-db-ca, mountPath: /openbao/db/credits-db/ca, readOnly: true}
    - {name: grafana-db-cert, mountPath: /openbao/db/grafana-db/client, readOnly: true}
    - {name: grafana-db-ca, mountPath: /openbao/db/grafana-db/ca, readOnly: true}

  ha:
    enabled: true
    # Management-plane availability (ADR-111 Revision 7 §3): equal to openbao-db's
    # instance count. Raised only together with it, by a capacity decision.
    replicas: 1
    raft:
      enabled: false
    disruptionBudget:
      enabled: true
    config: |
      ui = true

      # Standby nodes forward rather than serve reads (ADR-117 §2).
      disable_standby_reads = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file   = "/openbao/tls/listener/tls.crt"
        tls_key_file    = "/openbao/tls/listener/tls.key"
        tls_auto_reload = true
      }

      storage "postgresql" {
        connection_url           = "postgres://openbao@openbao-db-rw.platform-data.svc:5432/openbao?sslmode=verify-full&sslrootcert=/openbao/pg/ca/ca.crt&sslcert=/openbao/pg/client/tls.crt&sslkey=/openbao/pg/client/tls.key"
        ha_enabled               = "true"
        skip_create_table        = "false"
        max_parallel             = "5"
        transaction_max_parallel = "3"
        max_idle_connections     = "2"
        max_connect_retries      = "0"
      }

      # Keys and key identifiers come from BAO_STATIC_SEAL_* (Secret openbao-seal).
      seal "static" {}

      service_registration "kubernetes" {}

      # SELF-INITIALIZATION (ADR-117 §3). Runs once, on empty storage, under a root
      # token OpenBao revokes afterwards. Everything here is box-independent; per-box
      # and per-cluster state (policies for tenants and spokes, PKI roles, static roles)
      # is hub-operator's, reconciled afterwards.
      initialize "audit" {
        request "stdout-audit" {
          operation = "update"
          path      = "sys/audit/stdout"
          data = {
            type        = "file"
            description = "Audit to stdout, collected by Alloy into Loki (ADR-117 §8)"
            options = {
              file_path = "stdout"
            }
          }
        }
      }

      initialize "mounts" {
        request "kv" {
          operation = "update"
          path      = "sys/mounts/kv"
          data = {
            type    = "kv"
            options = { version = "2" }
          }
        }
        request "pki-int" {
          operation = "update"
          path      = "sys/mounts/pki_int"
          data = {
            type   = "pki"
            config = { max_lease_ttl = "43800h" }
          }
        }
        request "database" {
          operation = "update"
          path      = "sys/mounts/database"
          data = {
            type = "database"
          }
        }
      }

      initialize "auth" {
        request "kubernetes" {
          operation = "update"
          path      = "sys/auth/kubernetes"
          data = {
            type   = "kubernetes"
            config = { max_lease_ttl = "10m", default_lease_ttl = "10m" }
          }
        }
        # In-cluster: reviewer token and CA read from the pod, so a successor hub needs
        # no reconfiguration (ADR-117 §7). kubernetes_ca_cert is deliberately unset.
        request "kubernetes-config" {
          operation = "update"
          path      = "auth/kubernetes/config"
          data = {
            kubernetes_host = "https://kubernetes.default.svc"
          }
        }
      }

      initialize "policies" {
        # hub-operator: reconciles desired authorization, KV generation, PKI and static
        # roles. It never holds recovery-key, root or token-sweep rights.
        request "hub-operator-policy" {
          operation = "update"
          path      = "sys/policies/acl/hub-operator"
          data = {
            policy = <<-EOP
              path "kv/data/*"                 { capabilities = ["create", "read", "update", "list"] }
              path "kv/metadata/*"             { capabilities = ["read", "list", "delete"] }
              path "sys/policies/acl/tenant-*" { capabilities = ["create", "read", "update", "delete", "list"] }
              path "sys/policies/acl/spoke-*"  { capabilities = ["create", "read", "update", "delete", "list"] }
              path "sys/policies/acl"          { capabilities = ["list"] }
              path "sys/auth"                  { capabilities = ["read"] }
              path "sys/auth/spoke-*"          { capabilities = ["create", "read", "update", "delete", "sudo"] }
              path "sys/mounts/auth/spoke-*/tune" { capabilities = ["read", "update"] }
              path "auth/spoke-*"              { capabilities = ["create", "read", "update", "delete", "list"] }
              path "auth/kubernetes/role/*"    { capabilities = ["create", "read", "update", "delete", "list"] }
              path "pki_int/roles/*"           { capabilities = ["create", "read", "update", "delete", "list"] }
              path "pki_int/issuers"           { capabilities = ["list"] }
              path "pki_int/issuer/*"          { capabilities = ["read"] }
              path "database/config/*"         { capabilities = ["create", "read", "update", "delete", "list"] }
              path "database/static-roles/*"   { capabilities = ["create", "read", "update", "delete", "list"] }
            EOP
          }
        }
        # ESO on the hub: platform secrets and hub static credentials only.
        request "eso-hub-policy" {
          operation = "update"
          path      = "sys/policies/acl/eso-hub"
          data = {
            policy = <<-EOP
              path "kv/data/hub/*"              { capabilities = ["read"] }
              path "kv/metadata/hub/*"          { capabilities = ["read", "list"] }
              path "database/static-creds/hub-*" { capabilities = ["read"] }
            EOP
          }
        }
        # Day-0 trust bootstrap (CI): the recovery-key sequence, then it deletes itself
        # (ADR-117 §3). Never the root, never signing.
        request "trust-bootstrap-policy" {
          operation = "update"
          path      = "sys/policies/acl/openbao-trust-bootstrap"
          data = {
            policy = <<-EOP
              path "sys/rotate/recovery/init"   { capabilities = ["create", "update", "read"] }
              path "sys/rotate/recovery/backup" { capabilities = ["read", "delete"] }
              path "sys/policies/acl/openbao-trust-bootstrap"   { capabilities = ["delete"] }
              path "auth/kubernetes/role/openbao-trust-bootstrap" { capabilities = ["delete"] }
            EOP
          }
        }
        # Administrator signing (kakt pki sign-intermediate): read the pending CSR, post
        # the chain, set the issuer's leaf_not_after_behavior. Tokens for its
        # ServiceAccount can be minted only by cluster administrators.
        request "pki-signing-policy" {
          operation = "update"
          path      = "sys/policies/acl/openbao-pki-signing"
          data = {
            policy = <<-EOP
              path "pki_int/keys"                           { capabilities = ["list"] }
              path "pki_int/key/*"                          { capabilities = ["read"] }
              path "pki_int/keys/generate/internal"         { capabilities = ["update"] }
              path "pki_int/intermediate/generate/existing" { capabilities = ["update"] }
              path "pki_int/intermediate/set-signed"        { capabilities = ["update"] }
              path "pki_int/issuers"                        { capabilities = ["list"] }
              path "pki_int/issuer/*"                       { capabilities = ["read", "update"] }
              path "pki_int/config/issuers"                 { capabilities = ["read", "update"] }
            EOP
          }
        }
        # `kakt app secrets` (administrator): tenant application secrets only.
        request "app-secrets-policy" {
          operation = "update"
          path      = "sys/policies/acl/openbao-app-secrets"
          data = {
            policy = <<-EOP
              path "kv/data/spokes/+/tenants/*"     { capabilities = ["create", "read", "update"] }
              path "kv/metadata/spokes/+/tenants/*" { capabilities = ["read", "list"] }
            EOP
          }
        }
        # Recovery (ADR-092 recovery mode, driven by kakt): token sweep, static-password
        # re-establishment and durable records. Never authorization changes.
        request "recovery-policy" {
          operation = "update"
          path      = "sys/policies/acl/openbao-recovery"
          data = {
            policy = <<-EOP
              path "auth/token/accessors"        { capabilities = ["list", "sudo"] }
              path "auth/token/lookup-accessor"  { capabilities = ["update"] }
              path "auth/token/revoke-accessor"  { capabilities = ["update"] }
              path "database/rotate-role/*"      { capabilities = ["update"] }
              path "database/static-roles/*"     { capabilities = ["read", "list"] }
              path "database/static-creds/*"     { capabilities = ["read"] }
              path "kv/data/platform/recovery/*" { capabilities = ["create", "read", "update"] }
              path "kv/metadata/platform/recovery/*" { capabilities = ["read", "list"] }
            EOP
          }
        }
      }

      initialize "roles" {
        request "hub-operator-role" {
          operation = "update"
          path      = "auth/kubernetes/role/hub-operator"
          data = {
            bound_service_account_names      = ["hub-operator"]
            bound_service_account_namespaces = ["platform-ops"]
            audience                         = "openbao"
            token_policies                   = ["hub-operator"]
            token_type                       = "service"
            token_ttl                        = "10m"
            token_max_ttl                    = "10m"
            token_explicit_max_ttl           = "10m"
          }
        }
        request "eso-hub-role" {
          operation = "update"
          path      = "auth/kubernetes/role/eso-hub"
          data = {
            # The identity the hub ClusterSecretStore logs in as (its serviceAccountRef),
            # not ESO's own controller account.
            bound_service_account_names      = ["eso-hub-reader"]
            bound_service_account_namespaces = ["platform-ops"]
            audience                         = "openbao"
            token_policies                   = ["eso-hub"]
            token_type                       = "service"
            token_ttl                        = "10m"
            token_max_ttl                    = "10m"
            token_explicit_max_ttl           = "10m"
          }
        }
        request "trust-bootstrap-role" {
          operation = "update"
          path      = "auth/kubernetes/role/openbao-trust-bootstrap"
          data = {
            bound_service_account_names      = ["openbao-trust-bootstrap"]
            bound_service_account_namespaces = ["platform-data"]
            audience                         = "openbao"
            token_policies                   = ["openbao-trust-bootstrap"]
            token_type                       = "service"
            token_ttl                        = "15m"
            token_max_ttl                    = "15m"
            token_explicit_max_ttl           = "15m"
          }
        }
        request "pki-signing-role" {
          operation = "update"
          path      = "auth/kubernetes/role/openbao-pki-signing"
          data = {
            bound_service_account_names      = ["openbao-pki-signing"]
            bound_service_account_namespaces = ["platform-data"]
            audience                         = "openbao"
            token_policies                   = ["openbao-pki-signing"]
            token_type                       = "service"
            token_ttl                        = "15m"
            token_max_ttl                    = "15m"
            token_explicit_max_ttl           = "15m"
          }
        }
        request "app-secrets-role" {
          operation = "update"
          path      = "auth/kubernetes/role/openbao-app-secrets"
          data = {
            bound_service_account_names      = ["openbao-app-secrets"]
            bound_service_account_namespaces = ["platform-data"]
            audience                         = "openbao"
            token_policies                   = ["openbao-app-secrets"]
            token_type                       = "service"
            token_ttl                        = "15m"
            token_max_ttl                    = "15m"
            token_explicit_max_ttl           = "15m"
          }
        }
        request "recovery-role" {
          operation = "update"
          path      = "auth/kubernetes/role/openbao-recovery"
          data = {
            bound_service_account_names      = ["openbao-recovery"]
            bound_service_account_namespaces = ["platform-data"]
            audience                         = "openbao"
            token_policies                   = ["openbao-recovery"]
            token_type                       = "service"
            token_ttl                        = "30m"
            token_max_ttl                    = "30m"
            token_explicit_max_ttl           = "30m"
          }
        }
      }

      # The intermediate's KEY is generated here, inside OpenBao, named, and never
      # leaves it (ADR-117 §6). Self-init discards responses, so no CSR is produced here:
      # `kakt pki sign-intermediate` asks for one over this existing key
      # (intermediate/generate/existing, key_ref = issuing-1), signs it with the
      # custody-held root, and posts back only the chain.
      initialize "pki" {
        request "intermediate-key" {
          operation = "update"
          path      = "pki_int/keys/generate/internal"
          data = {
            key_name = "issuing-1"
            key_type = "rsa"
            key_bits = 4096
          }
        }
      }

# The Prometheus Operator integrations are not used; the existing collectors scrape.
serverTelemetry:
  serviceMonitor:
    enabled: false
  prometheusRules:
    enabled: false
