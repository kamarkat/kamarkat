# Hub sizing is management-plane policy, not a workload environment's (ADR-111
# Revision 7 §3). The values below were conditional on the hub's environmentSlug,
# which made the management plane's capacity a function of a workload stage it does
# not have. They are now declared outright.
#
# They carry this box's CURRENT EFFECTIVE values deliberately: de-conditionalising
# is not the moment to change capacity. Raising them is a capacity decision made on
# measurements -- an unsatisfiable constraint does not fail loudly, it pends, and
# the service it governs silently never returns.
# Per-box values for the secret store's PostgreSQL cluster (ADR-112 §§2-3, ADR-117 §2).
#
# Read only when this directory is packaged as a component, so it is inert until a
# boundary-02 descriptor exists for it -- unlike a declaration left in the shared
# database overlay, which packaging refuses when the object it names is not rendered.
- kind: Cluster
  name: openbao-db
  fields:
    - path: [spec, backup, barmanObjectStore, destinationPath]
      value: 's3://{{ .Values.global.boxId }}/{{ .Values.global.clusterName }}/'
    # Management-plane availability (ADR-111 Revision 7 §3). Raising it is a capacity
    # decision, made together with `postgresql.synchronous` (ladder in openbao-db.yaml)
    # and OpenBao's replica count.
    - path: [spec, instances]
      type: int
      value: '1'
    # The placement-class fields (ADR-046 §11).
    # global.provider is the RESOLVED placement class when the boundary passes
    # placementGlobalValues (environment-manager.placementClass); a descriptor for this
    # component must use that helper, or these render the raw provider instead.
    - path: [spec, affinity, nodeSelector, workload-location]
      value: '{{ if eq .Values.global.provider "hybrid" }}on-prem{{ else }}hetzner{{ end }}'
    - path: [spec, storage, storageClass]
      value: '{{ if eq .Values.global.provider "hybrid" }}local-path{{ else }}hcloud-volumes{{ end }}'
