# The secret store's PostgreSQL cluster (ADR-117 §2, ADR-112 §1, §4), reconciled by
# BOUNDARY 02 so it exists before OpenBao (boundary 03) starts.
#
# THIS ONE CANNOT DEPEND ON OPENBAO TO START OR TO BE RECOVERED.
#   * No credential input: the owner's password is CloudNativePG's own (openbao-db-app)
#     and cannot be used to log in (pg_hba below); OpenBao authenticates as `openbao`
#     with a CloudNativePG-issued client certificate. Nothing here is read from OpenBao
#     or delivered by ESO.
#   * The archive credential is `s3-credentials-escrowed`, delivered from the escrow by
#     the CLI before boundary 02 (ADR-112 §6) -- never through OpenBao.
#
# OWNERSHIP (ADR-117 §2, §5):
#   CloudNativePG  the cluster, `openbao_owner` (initdb owner, inert password), the
#                  `openbao` login role's existence and client certificate
#   OpenBao        its storage schema: it creates its tables at start
#                  (skip_create_table=false) through `openbao`, which inherits
#                  `openbao_owner` and therefore CREATE on `public`
#
# NO POOLER (ADR-117 §2, an exception to ADR-112 §9): OpenBao's connection count is
# bounded by its replicas, not the fleet, and a CloudNativePG Pooler authenticates
# clients with md5 -- it cannot carry client-certificate authentication.
#
# REPLICATION (ADR-117 §2). The hub's replica count is management-plane availability
# policy (ADR-111 Revision 7 §3), declared in templated-fields.yaml, not an environment.
# The approved ladder keys synchronous replication to that count:
#   1 instance   no synchronous standby (asynchronous)
#   2 instances  one synchronous standby, dataDurability: preferred
#   3 instances  one synchronous standby, dataDurability: required
# It is 1 today; raising it is a capacity decision made on measurements, together with
# the matching `postgresql.synchronous` block and OpenBao's replica count.
#
# THE BOOTSTRAP METHOD DEPENDS ON THE OPERATION (ADR-092): `initdb` for a new box, as
# declared here; `recovery` for a rebuild from this cluster's archive, which is
# ../database-recovery/. Never defaulted.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openbao-db
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-bookworm@sha256:1d4180c155a2a7b4c59f4f13b7cdc5a1795bb8d85f3c92fd7647dae9e929f72e
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
  postgresql:
    parameters:
      shared_buffers: "64MB"
      effective_cache_size: "192MB"
      work_mem: "2MB"
      maintenance_work_mem: "32MB"
      max_connections: "50"
    # Order matters: CloudNativePG places these between its own fixed rules (local
    # socket, streaming_replica) and its final defaults, and the first match wins.
    pg_hba:
      # The owner's CloudNativePG-held password is inert: no login as the owner, ever.
      - host all openbao_owner all reject
      # OpenBao's storage connection: certificate only, TLS only.
      - hostssl openbao openbao all cert
      - hostnossl openbao openbao all reject
  storage:
    size: 15Gi
    storageClass: PLACEHOLDER_PLACEMENT
  affinity:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      workload-location: PLACEHOLDER_PLACEMENT
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: openbao
      owner: openbao_owner
  backup:
    barmanObjectStore:
      destinationPath: s3://PLACEHOLDER_BOX/PLACEHOLDER_CLUSTER/
      # Bumped only when a cluster is recreated (ADR-112 §6; the recovery overlay sets
      # -v2). The pre-upgrade Backup's name includes it (ADR-117 §7).
      serverName: openbao-db-v1
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials-escrowed
          key: access-key-id
        secretAccessKey:
          name: s3-credentials-escrowed
          key: secret-access-key
        region:
          name: s3-credentials-escrowed
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"
---
# OpenBao's runtime login. Existence, membership and certificate are CloudNativePG's;
# it has NO password (passwordSecret absent => CloudNativePG ignores it,
# roles/contract.go ApplyPassword). The certificate Secret is
# `openbao-db-openbao-client-cert`, mounted only into OpenBao's pods.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: openbao-db-openbao
  namespace: platform-data
spec:
  cluster:
    name: openbao-db
  name: openbao
  ensure: present
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  inRoles:
    - openbao_owner
  clientCertificate:
    enabled: true
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: openbao-db-openbao
  namespace: platform-data
spec:
  cluster:
    name: openbao-db
  name: openbao
  owner: openbao_owner
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: openbao-db-daily
  namespace: platform-data
spec:
  schedule: "0 15 3 * * *"
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: openbao-db
---
# Admits OpenBao's pods (same namespace, selected by label), the cluster's own
# instances and the operator, and the Support Agent on the metrics port only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-db-access
  namespace: platform-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: openbao-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: openbao-db
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: support-agent
      ports:
        - protocol: TCP
          port: 9187
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-db-metrics
  namespace: platform-data
  labels:
    cnpg.io/cluster: openbao-db
spec:
  selector:
    cnpg.io/cluster: openbao-db
  ports:
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
