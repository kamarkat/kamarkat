---
# NetworkPolicy for platform-redis
# Allows ingress from platform-billing namespace (kube-sbt)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-redis-access
  namespace: platform-data
spec:
  podSelector:
    matchLabels:
      app: platform-redis
  policyTypes:
    - Ingress
  ingress:
    # Allow from platform-billing namespace (kube-sbt)
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-billing
      ports:
        - protocol: TCP
          port: 6379
    # Allow from platform-data namespace (internal services)
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-data
      ports:
        - protocol: TCP
          port: 6379
