# Hub sizing is management-plane policy, not a workload environment's (ADR-111
# Revision 7 §3). The values below were conditional on the hub's environmentSlug,
# which made the management plane's capacity a function of a workload stage it does
# not have. They are now declared outright.
#
# They carry this box's CURRENT EFFECTIVE values deliberately: de-conditionalising
# is not the moment to change capacity. Raising them is a capacity decision made on
# measurements -- an unsatisfiable constraint does not fail loudly, it pends, and
# the service it governs silently never returns.
# Per-box and per-environment values for the hub's observability stores
# (ADR-078 addendum 5 §9). Replica counts are the only difference between
# environments: development runs one of each replicated component and prefers,
# rather than requires, spreading across nodes.
- kind: VMSingle
  name: platform-a
  fields:
    - path: [spec, nodeSelector, workload-location]
      value: '{{ if eq .Values.global.provider "hybrid" }}on-prem{{ else }}hetzner{{ end }}'
    - path: [spec, storage, storageClassName]
      value: '{{ if eq .Values.global.provider "hybrid" }}local-path{{ else }}hcloud-volumes{{ end }}'
    - path: [spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: 'ScheduleAnyway'

- kind: VMSingle
  name: platform-b
  fields:
    - path: [spec, nodeSelector, workload-location]
      value: '{{ if eq .Values.global.provider "hybrid" }}on-prem{{ else }}hetzner{{ end }}'
    - path: [spec, storage, storageClassName]
      value: '{{ if eq .Values.global.provider "hybrid" }}local-path{{ else }}hcloud-volumes{{ end }}'
    - path: [spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: 'ScheduleAnyway'

- kind: VMAuth
  name: platform
  fields:
    - path: [spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: 'ScheduleAnyway'
    - path: [spec, replicaCount]
      type: int
      value: '1'

- kind: VMAlert
  name: platform
  fields:
    - path: [spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: 'ScheduleAnyway'
    - path: [spec, replicaCount]
      type: int
      value: '1'

- kind: VMAlert
  name: tenant
  fields:
    - path: [spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: 'ScheduleAnyway'
    - path: [spec, replicaCount]
      type: int
      value: '1'

- kind: VMAlertmanager
  name: platform
  fields:
    - path: [spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: 'ScheduleAnyway'
    - path: [spec, replicaCount]
      type: int
      value: '1'
    - path: [spec, configRawYaml]
      replace:
        from: PLACEHOLDER_ALERT_EMAIL_FROM
        with: 'Platform alerts <no-reply@{{ .Values.global.hubDomain }}>'
    - path: [spec, configRawYaml]
      replace:
        from: PLACEHOLDER_ALERT_EMAIL_TO
        with: '{{ join ", " (dig "alerting" "emailTo" (list) .Values.global) }}'
