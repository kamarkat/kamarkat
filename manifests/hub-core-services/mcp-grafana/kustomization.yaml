apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# mcp-grafana (ADR-116 §1): Grafana's own MCP server, unmodified and read-only,
# beside the hub's Grafana. Applied only while capabilities.grafanaMcp.enabled.
# Reached only through kamarkat-mcp's /grafana, which authenticates the person
# and requires platform.observer.
resources:
- mcp-grafana.yaml
