apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-edge

resources:
- rbac.yaml
- deployment.yaml
- service.yaml
- ghcr-pull-secret-es.yaml

# Pinned by digest, not by tag. The auth-proxy workflow rewrites this line with
# `kustomize edit set image` after each build and commits it, so the running
# image is always an immutable reference to a specific build rather than whatever
# `latest` happened to point at when a pod last restarted.
images:
- digest: sha256:0656e3c5428f8bce5f79b7b5f72daed9016422cf24e91ca076b008c169f27250
  name: ghcr.io/kamarkat/kamarkat/auth-proxy
