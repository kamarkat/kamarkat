# The identity provider's PostgreSQL cluster (ADR-112 §1), beside Zitadel itself.
#
# CRITICAL STATE, and not because of row count: every column Zitadel writes is encrypted
# with the masterkey that is escrowed and NEVER rotated (ADR-111 §1,
# ArtifactZitadelMasterkey). A restore of this cluster without that key produces an
# identity database nothing can decrypt, so its recovery has two halves and the archive
# is only one of them.
#
# CREATED EMPTY, NOT IMPORTED. An earlier version carried
# migration and required the source quiesced first. There is no dev data to carry, so
# the cluster initialises its own database and the whole import ordering -- quiesce,
# snapshot, cutover, rollback window -- does not arise. A box that ever does need to
# carry data forward is a separate, deliberate operation, not this file.
#
# NAMESPACE platform-data, with the file here. ADR-014 puts CNPG clusters in
# platform-data; ADR-112 puts each application's database configuration with that
# application. Both hold: the object lands in platform-data, and it is declared next to
# the service that owns it rather than in a database folder of its own.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # 1 in development, 2 in staging, 3 in production (templated-fields.yaml). A replica
  # count is not availability: that needs instances on separate nodes, on storage that
  # survives the loss of one, with failover exercised (ADR-112 §3).
  instances: 1

  # Pinned, not left to the operator's default. The default moves with the
  # operator version, so an operator upgrade would otherwise change the
  # PostgreSQL major underneath a cluster that never asked for it.
  #
  # 17, not 18. ZITADEL documents 14-18, but a fresh install on 18 is reported to
  # fail at init step 34 creating UNLOGGED tables, and the report is unresolved.
  # A new box is exactly a fresh install, so 18 is the one case the defect hits.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-bookworm@sha256:1d4180c155a2a7b4c59f4f13b7cdc5a1795bb8d85f3c92fd7647dae9e929f72e

  # THE FLOOR, not a measurement. Four clusters replace one, so the shared cluster's
  # 2 GiB cannot simply be repeated four times. These are the smallest settings a CNPG
  # instance works at: shared_buffers at a quarter of the limit, the rest left to the
  # instance manager and a handful of backends.
  #
  # The risk this accepts is that autovacuum and maintenance have little headroom, so a
  # large table or a long transaction will press against the limit before a bigger
  # cluster would. The answer is to raise it from this cluster's own metrics once it
  # runs -- not to pre-emptively size it from a number nobody measured.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
  # THE POOLER'S NAME, IN THE SERVER CERTIFICATE.
  #
  # A PgBouncer pooler "reuses the same certificates as the PostgreSQL cluster"
  # (CNPG connection-pooling docs), and CNPG generates those with the cluster's
  # own service names only -- zitadel-db-rw, -r and -ro. A client that
  # connects through the pooler and verifies the hostname therefore meets a
  # certificate that does not name what it dialled, and the failure is at the
  # TLS layer rather than anywhere near this file:
  #
  #   ERR_TLS_CERT_ALTNAME_INVALID: Host: zitadel-db-pooler.platform-data.svc.
  #   is not in the cert's altnames: DNS:zitadel-db-rw, ...
  #
  # DB_HOST is exactly that name (components/secrets_database_impl.go), so the
  # names below are the four forms a client in this cluster can dial it by.
  #
  # The old single platform-db carried this block; the ADR-112 split into five
  # per-application clusters dropped it, and nothing noticed until a pooler was
  # first reached -- which took until the Pooler objects themselves became valid.
  certificates:
    serverAltDNSNames:
      - zitadel-db-pooler
      - zitadel-db-pooler.platform-data
      - zitadel-db-pooler.platform-data.svc
      - zitadel-db-pooler.platform-data.svc.cluster.local
  postgresql:
    parameters:
      shared_buffers: "64MB"
      effective_cache_size: "192MB"
      work_mem: "2MB"
      maintenance_work_mem: "32MB"
      max_connections: "50"
  storage:
    size: 4Gi
    # Rendered per box by templated-fields.yaml (ADR-046 §11).
    storageClass: PLACEHOLDER_PLACEMENT

  # Worker nodes only, never tolerating the control-plane taint (ADR-014, ADR-112 §3).
  affinity:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      # ADR-046 §11 placement class, rendered per box by templated-fields.yaml.
      workload-location: PLACEHOLDER_PLACEMENT

  # The superuser secret the platform's own machinery connects as.
  #
  # CNPG creates `<cluster>-superuser` only when this is true, and defaults it to FALSE.
  # Omitting it was a real break rather than a hardening choice: hub-operator's role
  # reconciliation and password rotation both open the superuser secret by that name, so
  # every rotation against this cluster would have failed looking for a Secret CNPG was
  # never asked to make.
  enableSuperuserAccess: true

  # Its own database and owner, created at initialisation.
  bootstrap:
    initdb:
      database: zitadel
      owner: hub_zitadel
      # THE AUTHORITATIVE CREDENTIAL, so CNPG has one password source for this role.
      #
      # GetApplicationSecretName() returns this name instead of the generated
      # zitadel-db-app, and CNPG reconciles the owner's password to it on every
      # instance reconcile (refreshCredentialsFromSecret -> reconcileUser ->
      # SetUserPassword), not only at initialisation. So CNPG is the sole SQL
      # writer for this role and hub-operator no longer issues ALTER ROLE for it
      # (ADR-023/ADR-112 amendment 2026-11-24).
      #
      # This field was deliberately omitted while the credential was believed to
      # arrive at boundary 04 -- blocking initdb on it would have deadlocked
      # against DatabaseRolesProvisioned. ADR-112's 2026-11-18 amendment moved the
      # credential into boundary 02, beside this Cluster, so that objection no
      # longer holds and the field is safe.
      #
      # username in zitadel-db-owner is `hub_zitadel`, matching owner above. CNPG takes the
      # role name from the Secret when one is given, so the two must agree.
      secret:
        name: zitadel-db-owner

  # This cluster's own archive identity (ADR-014 add.2, ADR-111 §2). destinationPath is
  # rendered per box by templated-fields.yaml; serverName carries THIS database and its
  # own incarnation, and is NOT templated -- it is bumped only when the cluster is
  # recreated from an empty database, never on a running one, because check-wal-archive
  # runs before a cluster's first archive and re-arming it against a non-empty prefix
  # stops archiving on a database that was working (ADR-092).
  backup:
    barmanObjectStore:
      destinationPath: s3://PLACEHOLDER_BOX/PLACEHOLDER_CLUSTER/
      serverName: zitadel-db-v1
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials-escrowed
          key: access-key-id
        secretAccessKey:
          name: s3-credentials-escrowed
          key: secret-access-key
        region:
          name: s3-credentials-escrowed
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: zitadel-db-zitadel
  namespace: platform-data
spec:
  cluster:
    name: zitadel-db
  name: zitadel
  owner: hub_zitadel
  ensure: present
---
# Daily, immediately on creation. `immediate: true` matters: until a base backup
# completes this cluster has no recovery point at all.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: zitadel-db-daily
  namespace: platform-data
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: zitadel-db
---
# This cluster's application, the operators that manage it, and this cluster's own
# peers. Nothing else.
#
# The shared cluster's policy admits SEVEN namespaces because one cluster serves them
# all; here the identity provider reaches only its own database. The peer selector is a bare
# `podSelector`, which means pods in THIS policy's namespace matching it, so
# `cnpg.io/cluster` admits this cluster's instances and nothing else in platform-data --
# a namespaceSelector would have admitted every workload there. The operator needs 5432
# and 8000 both.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-db-access
  namespace: platform-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: zitadel-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-identity
        # zitadel-db-pooler, which runs in platform-data rather than in the
        # application's namespace. Without this the pooler cannot reach its own
        # primary, and it reports Healthy while every connection through it fails.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-data
        # The hub-operator, which creates this cluster's roles and grants their
        # permissions over zitadel-db-rw -- the primary, so the peer is these instance
        # pods rather than the pooler. The pre-split platform-db-access rule
        # admitted the whole of platform-ops for it ("hub-operator, infisical setup
        # jobs", 4a086204^ database/network-policy.yaml) and the per-application
        # policies that replaced it dropped the peer. A dropped SYN is not a
        # refusal: every role-provisioning pass hung for ~135s and timed out with
        # no role created, on a cluster reporting Healthy.
        #
        # The namespace AND the operator's own label in ONE `from` element, as the
        # Support Agent rule below is -- two elements would readmit every pod in
        # platform-ops. Narrower than the rule it restores, which named the
        # namespace alone.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hub-operator
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: zitadel-db
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    # The Support Agent, for the backup evidence ADR-014 makes the platform
    # accountable for (ADR-077, collector backup-health-*). The METRICS port only:
    # 5432 is not in this rule, so the agent can see whether this cluster is
    # backing up and cannot reach its data.
    #
    # The namespace AND the agent's own label in ONE `from` element, which is AND.
    # As two elements it would be a namespace selector admitting every pod in
    # platform-ops to the exporter.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: support-agent
      ports:
        - protocol: TCP
          port: 9187
---
# The instance exporter, as a Service the Support Agent can name.
#
# CloudNativePG publishes its backup and archive series on each instance pod's
# :9187 and creates no Service for them, so a collector that reads a Service had
# nothing to read. Per cluster, because a scrape resolves to one endpoint: a
# Service spanning every CNPG pod here would report one arbitrary cluster's
# backup as though it covered all of them.
#
# No cluster-wide scrape config and no PodMonitor: this exists for the evidence
# path, which must keep working when a tenant declines the observability
# capability (ADR-078 Section 8).
apiVersion: v1
kind: Service
metadata:
  name: zitadel-db-metrics
  namespace: platform-data
  labels:
    cnpg.io/cluster: zitadel-db
spec:
  selector:
    cnpg.io/cluster: zitadel-db
  ports:
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
