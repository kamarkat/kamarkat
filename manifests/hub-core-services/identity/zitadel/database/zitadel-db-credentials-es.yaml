# hub_zitadel's login password (ADR-117 §7.3-7.5). OpenBao owns it through the
# static role hub-zitadel, which rotates it by authenticating AS hub_zitadel with a
# certificate; ESO reads the current value from database/static-creds/hub-zitadel
# on every refresh, and Reloader rolls the consumer when it changes.
#
# The identity reading it is this namespace's openbao-db-creds ServiceAccount,
# bound by the OpenBao role hub-zitadel-db to this one path and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-db-creds-zitadel
  namespace: platform-identity
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: hub-zitadel-db
  namespace: platform-identity
spec:
  method: GET
  path: database/static-creds/hub-zitadel
  resultType: Data
  provider:
    server: https://openbao.platform-data.svc:8200
    caProvider:
      type: ConfigMap
      name: openbao-listener-trust
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes
        role: hub-zitadel-db
        serviceAccountRef:
          name: openbao-db-creds-zitadel
          audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: platform-identity
spec:
  refreshInterval: 5m
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        dsn: "postgresql://{{ .username }}:{{ .password | urlquery }}@zitadel-db-pooler.platform-data.svc.cluster.local:5432/zitadel?sslmode=require"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: hub-zitadel-db
