# The credential for Zitadel's database ROLE, and therefore a database object.
#
# It lives with the DATABASE -- <service>/database/, packaged by boundary 02 --
# beside the role credentials of billing, credits and grafana, and not with the
# Zitadel component, which is a cycle:
#
#   boundary 04  requires  the platform's database roles
#     hub_zitadel role     needs platform-identity/zitadel-db-credentials
#       that Secret        shipped by components/04/zitadel-credentials
#
# Boundary 04 stays deny-gated waiting for a role that cannot be created until
# boundary 04 opens. The gate in hub-operator derives the credentials it waits
# for from the roles the HubEnvironment declares and waits for ALL of them
# (hubenvironment_controller.go, Phase 1b), so one misplaced Secret holds every
# other role whose Secret is present -- the whole platform's database access
# blocked on the placement of one file.
#
# ADR-112's split (4a086204) moved this file out of hub-core-services/database/
# and into the service's own directory, which put it back in boundary 04 and
# reproduced the deadlock on the first box built after it: ApplicationSecretsReady
# never left WaitingForESO. The same commit dropped the poolers' certificate SANs.
# A per-application layout has to keep asking which BOUNDARY an object belongs to;
# the directory a file reads naturally beside is not that answer.
#
# The other three roles follow the rule this restores: a role's credential ships
# with the DATABASE, not with the service that consumes it. The service and its
# credential have different lifetimes -- the role exists before anything can
# authenticate as it -- and putting them together makes the consumer's boundary a
# prerequisite of its own prerequisite.
#
# The target namespace is still platform-identity, where Zitadel reads it, even
# though the application delivering it lands in platform-data: a manifest naming
# its own namespace is applied there, which is how this Secret reached
# platform-identity from the shared `platform-database` app before the split.
# platform-namespaces creates that namespace in boundary 01, well before this.
#
# ONE Secret, not a copy per namespace. The role's password and the DSN Zitadel
# authenticates with are the same credential; a second ExternalSecret in
# platform-data would be a second delivery path for it, and the two would differ
# the first time one of them failed to refresh.
#
# Both keys below are produced by hub-operator
# (internal/infisical/secret_mappings.go), so this is not a consumer without a
# producer -- the failure mode that has cost this platform the most, most
# recently on 2026-09-02 when an ExternalSecret named keys nothing wrote and the
# workload could not start.
#
# The masterkey is a Secret of its own (../zitadel-masterkey-es.yaml), and stays
# with the service: it is not a database object, and its blast radius is
# different -- this password can be rotated, while the masterkey encrypts every
# secret column Zitadel has written and re-keying would orphan all of it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: platform-identity
spec:
  # Credential-bearing: shorter than the 1h default so a rotated value reaches
  # the workload promptly, matching the platform's other credential secrets.
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        # The DSN is assembled HERE, not in Helm values, so the password never
        # appears in a rendered manifest or an ArgoCD diff. The chart's
        # recommended wiring is a single DSN env var, and urlquery escapes a
        # password containing characters that would otherwise corrupt the URL —
        # string-concatenating one in a shell or a values file fails silently.
        # The identity provider's own cluster (ADR-112 §1), declared in
        # identity/zitadel/database/zitadel-db.yaml, beside Zitadel itself, reached
        # through database/zitadel-db-pooler.yaml. The pooler is session-pooled
        # rather than transaction-pooled, which is what makes this safe: Zitadel
        # runs its own setup and migration steps on boot, and those need a
        # dedicated backend for advisory locks and DDL.
        dsn: "postgresql://{{ .username }}:{{ .password | urlquery }}@zitadel-db-pooler.platform-data.svc.cluster.local:5432/zitadel?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: hub-zitadel-db-username
    - secretKey: password
      remoteRef:
        key: hub-zitadel-db-password
