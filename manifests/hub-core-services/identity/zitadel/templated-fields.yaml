# The platform-admin binding names the platform administrator -- the account
# kube-sbt's PLATFORM_ADMIN_EMAIL creates in the box's platform organisation --
# at the box's own domain. Unsubstituted, a tenant's cluster would grant
# cluster-admin to a subject in the PLATFORM's Zitadel and to no one in its own.
#
# The two ExternalSecrets alongside it carry no domain: they name Infisical keys,
# which the hub-operator produces per box.
- kind: ClusterRoleBinding
  name: platform-admin-oidc
  fields:
    - replaceAll:
        from: dev.nutgraf.in
        with: '{{ .Values.global.hubDomain }}'

# The SMTP fragment and the store that reads it (zitadel-smtp-es.yaml).
#
# Both carry this box's names in the file so the manifest is readable on its own,
# and both are substituted here so a second box renders its own. Without the first
# of these a new hub would read nutgraf's management folder; without the second it
# would send mail as nutgraf's sender and the issuer would reject the address for
# not matching its own domain.
- kind: ClusterSecretStore
  name: infisical-tenant-mgmt
  fields:
    - replaceAll:
        from: /nutgraf-mgmt
        with: '/{{ .Values.global.tenantId }}-mgmt'
    # The scope that folder is in. hub-operator writes the owner's credentials
    # through the box's declared management scope, so a store reading them with a
    # literal of its own is a reader and a writer that can disagree -- which is
    # silent in the direction that matters: the secret exists, in another scope,
    # and the ExternalSecret reports only that it could not get secret data.
    - path: [spec, provider, infisical, secretsScope, environmentSlug]
      value: '{{ .Values.global.management.infisicalEnvironmentSlug }}'

# zitadel-smtp-config is deliberately ABSENT here. It interpolates the password
# with ESO's `{{ .smtpPassword }}`, so it must be packaged verbatim; naming it
# here makes the packager escape those braces inside a quoted scalar and the chart
# then fails to parse. Its non-secret fields live in values.yaml instead.
