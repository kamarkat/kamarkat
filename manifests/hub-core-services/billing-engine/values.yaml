global:
  hubDomain: ""
  # The box's provider: it selects the storage class of the engine's volume.
  provider: ""

# The box's issuer and its JWKS, set by environment-manager from the same values
# every other consumer of the issuer reads. No default: a gateway that cannot
# validate tokens must not start.
oidcIssuer: ""
oidcJwksUrl: ""

# The organisation the engine seeds on its first migration: the one
# organisation its one caller bills through. The admin user exists because the
# engine requires one; nothing signs in as it.
organisation:
  name: Platform
  adminEmail: billing-admin@platform.invalid

# The engine's volume: invoice documents and the queue's append-only file.
storage:
  size: 2Gi

# Pinned by digest by the platform, like every platform image (ADR-021).
images:
  # Lago OSS v1.55.0 (AGPLv3), unmodified: API, worker, clock and migration.
  engine:
    repository: docker.io/getlago/api
    tag: v1.55.0
    digest: "sha256:8dd75237d977b757134b062b88943b0c8c76ae135997a49c0cd2572245b9695e"
  # The document renderer its v1.55.0 release pins. amd64 only, as is the fleet.
  pdf:
    repository: docker.io/getlago/lago-gotenberg
    # 7.8.2, the renderer the engine's v1.55.0 release pins -- not Gotenberg's
    # newest. It follows the engine, so it is named here rather than tracked.
    tag: "7.8.2"
    digest: "sha256:e8eef6fb4a92a3440c70d06598b385e7eb2ec7fb2d9b908ca4aa028741a0b270"
  # The engine's queue: the Redis the platform's tenant cache pins.
  queue:
    repository: docker.io/library/redis
    tag: "8.10.3-alpine"
    digest: "sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537"
  # The gateway: the AgentGateway release the Credit Authority runs (v1.7.0).
  gateway:
    repository: cr.agentgateway.dev/agentgateway
    tag: "v1.7.0"
    digest: "sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b"
