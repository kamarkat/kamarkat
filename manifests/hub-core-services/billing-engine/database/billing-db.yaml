# The billing engine's PostgreSQL cluster (ADR-112 §1, ADR-113 §3), beside the engine it serves.
#
# Shaped like credits-db, with three differences the engine imposes:
#
#   IMAGE      the engine's schema creates pg_partman on an empty database, so the
#              cluster runs PostgreSQL 18 with pg_partman added
#              (images/postgres-partman), pinned by digest by its workflow.
#   SUPERUSER  the schema drops and recreates its extensions, and pg_partman is not
#              a trusted extension: only a superuser may create or drop it. The
#              engine's role is made superuser once, at initialisation. The cluster
#              holds the engine's database and nothing else (ADR-112), so that
#              role's reach is this cluster.
#   NO ROLE MANAGER  the role is the initdb owner, its password the credential the
#              database prerequisites deliver (hub-billing-db-credentials). It is not
#              in HubEnvironment's roles: RoleManager grants DML on a database it
#              does not own, which is not what this role is.
#
# A LEDGER-LIKE RECORD: invoices and subscriptions cannot be re-derived, so the
# Database is retained when the capability is turned off, and retention is 90d.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: billing-db
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # 1 in development, 2 in staging, 3 in production (templated-fields.yaml).
  instances: 1

  # :unbuilt until the postgres-partman workflow pins its digest.
  imageName: ghcr.io/kamarkat/kamarkat/postgres-partman:18@sha256:4475d906627183ab11cc8ef70fe3f7b29d10c466bc876110e1225640634d66b2

  # The floor credits-db documents, raised once this cluster's metrics say so.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
  # THE POOLER'S NAME, IN THE SERVER CERTIFICATE.
  #
  # A PgBouncer pooler "reuses the same certificates as the PostgreSQL cluster"
  # (CNPG connection-pooling docs), and CNPG generates those with the cluster's
  # own service names only -- billing-db-rw, -r and -ro. A client that
  # connects through the pooler and verifies the hostname therefore meets a
  # certificate that does not name what it dialled, and the failure is at the
  # TLS layer rather than anywhere near this file:
  #
  #   ERR_TLS_CERT_ALTNAME_INVALID: Host: billing-db-pooler.platform-data.svc.
  #   is not in the cert's altnames: DNS:billing-db-rw, ...
  #
  # DB_HOST is exactly that name (components/secrets_database_impl.go), so the
  # names below are the four forms a client in this cluster can dial it by.
  #
  # The old single platform-db carried this block; the ADR-112 split into five
  # per-application clusters dropped it, and nothing noticed until a pooler was
  # first reached -- which took until the Pooler objects themselves became valid.
  certificates:
    serverAltDNSNames:
      - billing-db-pooler
      - billing-db-pooler.platform-data
      - billing-db-pooler.platform-data.svc
      - billing-db-pooler.platform-data.svc.cluster.local
  postgresql:
    parameters:
      shared_buffers: "64MB"
      effective_cache_size: "192MB"
      work_mem: "2MB"
      maintenance_work_mem: "32MB"
      max_connections: "50"
  storage:
    size: 4Gi
    # Rendered per box by templated-fields.yaml (ADR-046 §11).
    storageClass: PLACEHOLDER_PLACEMENT

  # Worker nodes only, never tolerating the control-plane taint (ADR-014, ADR-112 §3).
  affinity:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      # ADR-046 §11 placement class, rendered per box by templated-fields.yaml.
      workload-location: PLACEHOLDER_PLACEMENT

  # The superuser secret hub-operator's machinery opens by name (see credits-db).
  enableSuperuserAccess: true

  # Its own database and owner, created at initialisation, with the owner's
  # password from the database prerequisites. postInitSQL runs once, as the
  # instance superuser, after initdb: the owner becomes superuser (header).
  bootstrap:
    initdb:
      database: lago
      owner: hub_billing
      secret:
        name: hub-billing-db-credentials
      postInitSQL:
        - ALTER ROLE hub_billing SUPERUSER

  # This cluster's own archive identity (ADR-014 add.2, ADR-111 §2); see credits-db
  # for why serverName is not templated.
  backup:
    barmanObjectStore:
      destinationPath: s3://PLACEHOLDER_BOX/PLACEHOLDER_CLUSTER/
      serverName: billing-db-v1
      endpointURL: https://PLACEHOLDER_REGION.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials-escrowed
          key: access-key-id
        secretAccessKey:
          name: s3-credentials-escrowed
          key: secret-access-key
        region:
          name: s3-credentials-escrowed
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "90d"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: billing-db-lago
  namespace: platform-data
spec:
  cluster:
    name: billing-db
  name: lago
  owner: hub_billing
  ensure: present
  databaseReclaimPolicy: retain
---
# Daily, immediately on creation: until a base backup completes this cluster has
# no recovery point at all.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: billing-db-daily
  namespace: platform-data
spec:
  schedule: "0 45 3 * * *"
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: billing-db
---
# The billing engine, the operators that manage it, and this cluster's own peers.
# Nothing else
# (see credits-db for why each `from` is shaped as it is).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billing-db-access
  namespace: platform-data
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: billing-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-billing
          podSelector:
            matchLabels:
              app.kubernetes.io/name: billing-engine
        # billing-db-pooler, which runs in platform-data rather than in the
        # application's namespace. Without this the pooler cannot reach its own
        # primary, and it reports Healthy while every connection through it fails.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-data
        # The hub-operator, which creates this cluster's roles and grants their
        # permissions over billing-db-rw -- the primary, so the peer is these instance
        # pods rather than the pooler. The pre-split platform-db-access rule
        # admitted the whole of platform-ops for it ("hub-operator, infisical setup
        # jobs", 4a086204^ database/network-policy.yaml) and the per-application
        # policies that replaced it dropped the peer. A dropped SYN is not a
        # refusal: every role-provisioning pass hung for ~135s and timed out with
        # no role created, on a cluster reporting Healthy.
        #
        # The namespace AND the operator's own label in ONE `from` element, as the
        # Support Agent rule below is -- two elements would readmit every pod in
        # platform-ops. Narrower than the rule it restores, which named the
        # namespace alone.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hub-operator
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: billing-db
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    # The Support Agent, the metrics port only (ADR-077, collector backup-health-*).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
          podSelector:
            matchLabels:
              app.kubernetes.io/name: support-agent
      ports:
        - protocol: TCP
          port: 9187
---
# The instance exporter, as a Service the Support Agent can name (see credits-db).
apiVersion: v1
kind: Service
metadata:
  name: billing-db-metrics
  namespace: platform-data
  labels:
    cnpg.io/cluster: billing-db
spec:
  selector:
    cnpg.io/cluster: billing-db
  ports:
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
