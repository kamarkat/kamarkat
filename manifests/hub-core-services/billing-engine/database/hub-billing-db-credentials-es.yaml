# The billing engine's database role credential (ADR-113 §3): the initdb owner's
# password, which billing-db reads here (platform-data, hub-billing-db-credentials)
# when it is created. CloudNativePG requires a basic-auth Secret whose username is
# the owner.
#
# Generated by hub-operator on EVERY box with the other database credentials,
# and delivered with the database prerequisites rather than the service, so the
# cluster initialises whether or not the capability runs. The engine reads its
# own copy in platform-billing (billing-engine-db), from the same keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-billing-db-credentials
  namespace: platform-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hub-billing-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub-billing-db-username
    - secretKey: password
      remoteRef:
        key: hub-billing-db-password
