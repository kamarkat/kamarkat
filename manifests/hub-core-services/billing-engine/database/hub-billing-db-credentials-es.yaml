# The billing engine's database role credential (ADR-113 §3): the initdb owner's
# password, which billing-db reads here (platform-data, hub-billing-db-credentials)
# when it is created. CloudNativePG requires a basic-auth Secret whose username is
# the owner.
#
# Generated by hub-operator on EVERY box with the other database credentials,
# and delivered with the database prerequisites rather than the service, so the
# cluster initialises whether or not the capability runs. The engine reads its
# own copy in platform-billing (billing-engine-db), from the same keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-billing-db-credentials
  namespace: platform-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao-hub
    kind: ClusterSecretStore
  target:
    name: hub-billing-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      # cnpg.io/reload so a rotation is applied promptly rather than at the next
      # resync: CloudNativePG reconciles this role's password from this Secret and
      # is the only thing that writes it (ADR-023/ADR-112 amendment 2026-11-24).
      metadata:
        annotations:
          cnpg.io/reload: "true"
      engineVersion: v2
      mergePolicy: Replace
      data:
        # Literal, not {{ .username }}: CloudNativePG takes the role name from this

        # Secret, so a renamed Infisical value would silently repoint it at another

        # role. It must equal the Cluster\'s `owner`.

        username: "hub_billing"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub
        property: hub-billing-db-username
    - secretKey: password
      remoteRef:
        key: hub
        property: hub-billing-db-password
