# The capability's enablement, for hub-operator (ADR-113). Rendered only while
# capabilities.billing.enabled, so its presence provisions the capability's
# identity and keys, and its absence revokes the caller.
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-engine
  namespace: platform-billing
data:
  organisation: {{ .Values.organisation.name | quote }}
---
# The engine's copy of its database credential, from the keys the database
# prerequisites deliver (hub-billing-db-credentials). Only this namespace and
# platform-data hold it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-engine-db
  namespace: platform-billing
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: billing-engine-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: hub-billing-db-username
    - secretKey: password
      remoteRef:
        key: hub-billing-db-password
---
# The engine's own keys: what it encrypts its records with, the RSA key it signs
# its notifications with, and the organisation's API key and admin password.
# Generated once by hub-operator when the capability is first enabled and never
# rotated: the engine's encrypted records and the signatures its caller verifies
# depend on them. `Retain`, so turning the capability off loses none of them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-engine-keys
  namespace: platform-billing
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: billing-engine-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: billing-engine-secret-key-base
    - secretKey: LAGO_RSA_PRIVATE_KEY
      remoteRef:
        key: billing-engine-rsa-private-key
    - secretKey: LAGO_ENCRYPTION_PRIMARY_KEY
      remoteRef:
        key: billing-engine-encryption-primary-key
    - secretKey: LAGO_ENCRYPTION_DETERMINISTIC_KEY
      remoteRef:
        key: billing-engine-encryption-deterministic-key
    - secretKey: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
      remoteRef:
        key: billing-engine-encryption-key-derivation-salt
    - secretKey: LAGO_ORG_API_KEY
      remoteRef:
        key: billing-engine-org-api-key
    - secretKey: LAGO_ORG_USER_PASSWORD
      remoteRef:
        key: billing-engine-org-user-password
---
# The capability's project: the audience the gateway requires. Provisioned by
# hub-operator when the capability is enabled.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-engine-identity
  namespace: platform-billing
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: billing-engine-identity
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_PROJECT_ID
      remoteRef:
        key: billing-oidc-project-id
---
# The ONE caller the gateway admits and its organisation, published by
# hub-operator from the consuming application's declaration. `Delete`: with no
# declaration the keys and the Secret go, and a gateway starting after that
# admits nobody and does not start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-engine-caller
  namespace: platform-billing
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: billing-engine-caller
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: BILLING_CALLER_CLIENT_ID
      remoteRef:
        key: billing-caller-client-id
    - secretKey: BILLING_CALLER_ORG_ID
      remoteRef:
        key: billing-caller-org-id
---
# Ingress: the hub Gateway only, on the gateway's port. Nothing in any namespace
# reaches the pod except through billing.<hubDomain>; the API and the queue
# listen on loopback and are not reachable at all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: billing-engine-ingress
  namespace: platform-billing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: billing-engine
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# The document renderer: the engine only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: billing-pdf-ingress
  namespace: platform-billing
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: billing-pdf
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: billing-engine
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
