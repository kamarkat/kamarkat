apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-backend
spec:
  provider:
    infisical:
      # Keep base host only; ESO Infisical client appends API path segments.
      hostAPI: "http://infisical-standalone-infisical.platform-security.svc:8080"
      secretsScope:
        projectSlug: "hub-secrets"
        # The management scope (ADR-111 Revision 7 §2). Overwritten at render from
        # the box's declared management.infisicalEnvironmentSlug
        # (templated-fields.yaml beside this file), so this literal is the
        # un-templated default and names the same scope every box declares.
        environmentSlug: "management"
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-auth
            key: client-id
            namespace: platform-ops
          clientSecret:
            name: infisical-auth
            key: client-secret
            namespace: platform-ops
