# The hub's secret store (ADR-117): the box's OpenBao, KV v2 mount `kv`.
#
# Every hub ExternalSecret reads remoteRef.key `hub` (the hub scope, one KV
# secret) with property = the value's name. The store logs in through Kubernetes
# auth as eso-hub-reader, whose OpenBao policy reads kv/data/hub and nothing else;
# application database passwords are not here but in each consumer's own
# VaultDynamicSecret.
#
# The server is verified against the listener CA's public certificate, which the
# CLI writes into platform-ops at Day-0 (openbao-listener-trust).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-hub-reader
  namespace: platform-ops
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-hub
spec:
  provider:
    vault:
      server: https://openbao.platform-data.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-listener-trust
        namespace: platform-ops
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-hub
          serviceAccountRef:
            name: eso-hub-reader
            namespace: platform-ops
            audiences: [openbao]
