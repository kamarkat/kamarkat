{{- include "environment-manager.assertSupported" . -}}
---
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 02-platform-data
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          - appName: 'platform-redis'
            destinationNamespace: 'platform-data'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            # ADR-046 §11: the provider overlay supplies the placement class
            # (workload-location + matching storage class). The base under
            # hub-core-services/redis is provider-neutral and must not be
            # deployed directly. Same convention as
            # spoke-catalog/providers/<provider>.
            path: 'manifests/hub-core-services/providers/{{ include "environment-manager.placementClass" . }}/redis'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              # One artefact (ADR-063): enable this component and
              # give it the topology, or the distribution renders
              # nothing and reports the Application healthy.
              platform-redis:
                enabled: true
              # global.provider here is the PLACEMENT CLASS, not the box's
              # provider: the variant selector must follow where the data is
              # placed (ADR-046 §11, ADR-075). See placementGlobalValues.
              {{- include "environment-manager.placementGlobalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''

    # Components whose source is fixed in the repository are declared one file per
    # component under manifests/argocd/components/02/ and discovered here, the same way
    # boundary 03 discovers its own. The two elements above stay inline because their path
    # is a function of the placement class, which is ADR-061's test for where a component
    # is declared: a value known at chart render time and not at generator evaluation time.
    #
    # The per-application clusters (ADR-112) need no such substitution -- each has one
    # fixed path -- so each is a descriptor, and adding one is adding a file.
    {{- if $released }}
    # Released: the descriptors are files of this chart, so a cluster reconciling a
    # published bundle fetches nothing from the platform's repository to learn what its
    # own boundaries contain (ADR-063).
    - list:
        elements:
    {{- $descriptors := $.Files.Glob "descriptors/02/*.yaml" }}
    {{- if not $descriptors }}{{ fail "released bundle carries no descriptors for boundary 02: they are copied in at package time, and a chart without them would generate a data boundary holding no application databases and report it healthy" }}{{ end }}
    {{- range $path, $_ := $descriptors }}
{{- $d := $.Files.Get $path | fromYaml }}
          -{{ include "environment-manager.releasedElement" (dict "descriptor" $d "root" $) | nindent 12 }}
    {{- end }}
    {{- else }}
    - git:
        repoURL: {{ .Values.platformRepoURL | quote }}
        revision: {{ .Values.environmentRevision | quote }}
        # ADR-061: the git files generator injects a `path` parameter of its own and, with
        # goTemplate, writes it AFTER merging the file's contents -- silently overwriting
        # the `path` every descriptor declares. This prefix moves the generator's
        # parameters under .descriptorPath and leaves .path meaning what the descriptor says.
        pathParamPrefix: descriptorPath
        files:
          - path: 'manifests/argocd/components/02/*.yaml'
    {{- end }}

  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: boundary-02
      source:
        # This boundary's components are provider overlays: their path is a
        # function of .Values.provider, which ADR-061 gives as the reason they
        # are declared here rather than as descriptors.
        #
        # Published, that is a chart per component per provider, named for both.
        # The overlay differs from its base only in ADR-046 §11's placement
        # class -- a matched workload-location and storageClass -- so packaging
        # the overlay keeps that pair intact, where one chart selecting a
        # provider from a value would let the two drift apart, which is the
        # failure §11 exists to prevent.
{{- if $released }}
        repoURL: {{ .Values.bundleRegistry | quote }}
        targetRevision: {{ .Values.bundleVersion | quote }}
        path: ''
        # One artefact (ADR-063). The provider used to be part of the chart
        # name because each overlay was published separately; it now selects a
        # variant inside the distribution, so the name is the same everywhere
        # and adding a provider publishes nothing new.
        chart: 'platform'
{{- else }}
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ .Values.environmentRevision }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
{{- end }}
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 15
          backoff:
            duration: 30s
            maxDuration: 10m
  templatePatch: |
    {{"{{-"}} if has .appName (list "platform-redis") {{"}}"}}
    metadata:
      annotations:
        # Client-side diff for this Application only.
        #
        # Server-side diff is on controller-wide, because under ServerSideApply
        # it is the only thing that separates CRD defaulting from real drift.
        # It cannot be used on a StatefulSet whose spec differs in an immutable
        # field: the diff is a genuine dry-run apply, so the API server rejects
        # it outright with
        #
        #   Forbidden: updates to statefulset spec for fields other than
        #   'replicas', 'ordinals', 'template', 'updateStrategy', ...
        #
        # and the Application cannot be compared at all. A client-side diff
        # simply shows the difference, which is the honest outcome: the change
        # is still refused at sync, but it is refused as drift that needs a
        # recreate rather than hidden behind a comparison error.
        #
        # NOT related to the parseableType failures on the Crossplane XRs. Those
        # were a stale API schema in the controller and affected BOTH diff
        # strategies; they are handled by refreshArgoCDSchemaCache in the
        # bootstrap, not here.
        argocd.argoproj.io/compare-options: ServerSideDiff=false
    {{"{{-"}} end {{"}}"}}
{{- if not $released }}
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
{{- end }}
    spec:
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            - /spec/volumeClaimTemplates
---
