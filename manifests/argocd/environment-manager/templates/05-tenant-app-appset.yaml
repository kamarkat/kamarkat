---
# ADR-047: tenant application provisioning ApplicationSets.
#
# RENAMING ANY OF THESE IS NOT A SED. An ApplicationSet owns the Applications it
# generates, so a new name is a new owner: the old one is pruned, its deletion
# garbage-collects its Applications through their ownerReferences, and
# preserveResourcesOnDeletion below is false -- which is right in steady state
# and exactly wrong for the one sync that lands a rename. For the XR set that
# deletes the resource owning a tenant application's database.
#
# These were tenant-fleet-{xr,spoke,workload}-provisioning. The sequence that
# moves them without losing anything is docs/runbooks/rename-an-applicationset.md.
# Renaming this FILE, a pathParamPrefix, or a boundary's printed label has no
# effect on the box; only the resource names above do.
# Reconciles the three tenant lifecycle resources for each application:
#   {tenantId}-{appId}-{env}-xr    → AINativeSaaS XR on the Hub (Crossplane data plane)
#   {tenantId}-{appId}-{env}-spoke → namespace + Tier-2 platform-rendered capabilities on the spoke
#   tenant-{tenantId}-{appId}-...  → one Application per workload (Tier 3) on the spoke
# Application values are read from this box's own instance repository (ADR-062) at
# environments/<env>/values.yaml. Which repository that is comes from Day-0,
# never from a default: see _instance-repo.tpl.
# The env slug is derived from the matched path: environments/<env>/,
# so the environment is segment 1. Env-first keeps every application in one
# environment together, which is the axis promotion moves along (ADR-037).

---
# ApplicationSet for application XRs (deployed to Hub where Crossplane runs)
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-app-xr-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create the XR when BOTH the application's values exist in
    # Git AND the target spoke cell is registered in ArgoCD (by capi2argo).
    # This prevents generating an XR for an environment whose cell does not
    # exist (e.g. waypoint/prod before its spoke is provisioned).
    - matrix:
        generators:
          - matrix:
              generators:
                # Application DIRECTORIES, not a filename glob -- because `exclude`
                # exists on a directories generator and does NOT exist on a
                # files one (GitFileGeneratorItem declares only `path`).
                #
                # That asymmetry is the whole reason this is shaped like this.
                # `*` in either generator crosses `/`, so
                # `environments/*/*/values.yaml` matched a WORKLOAD's chart
                # values three levels down as readily as an application's declaration
                # two levels down. The workload file carries no `cellId`, the
                # cluster selector below interpolates one, and the generator
                # failed outright:
                #
                #   failed to execute go template {{"{{"}} .cellId {{"}}"}}:
                #   map has no entry for key "cellId"
                #
                # Nothing looked broken. Every Application already generated
                # stayed, kept syncing its own source and went on reporting
                # Healthy; what stopped was the platform's ability to create,
                # retarget or remove any of them.
                #
                # Setting `exclude` on the files generator instead is worse than
                # the bug: the field is not in the CRD, so server-side apply
                # REFUSES the ApplicationSet and the parent Application cannot
                # diff at all.
                #
                #   .spec.generators[0].matrix.generators[0].git.files[1]
                #   .exclude: field not declared in schema
                #
                # Depth is expressible here and only here.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    # Prefixed so it cannot collide with the `.path` the files
                    # generator below exports; downstream templates read that
                    # one, unchanged.
                    pathParamPrefix: appdir
                    directories:
                      - path: 'environments/*/*'
                      - path: 'environments/*/*/*'
                        exclude: true

                # That application's declaration, addressed exactly rather than
                # matched. Supplies tenantId, appId and cellId, and `.path`.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    files:
                      - path: '{{"{{"}} .appdir.path.path {{"}}"}}/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  # The cluster the application names, and a WORKLOAD cluster only.
                  #
                  # spoke-type pins the second half. cluster-name alone would
                  # also match the hub if anything published that label onto it,
                  # and a tenant's workloads generated onto the control plane is
                  # not a failure that announces itself. The platform's own
                  # catalogue selects on spoke-type for the same reason.
                  #
                  # The key was `cell-id`, which has always been patched from
                  # the cluster's own name, so placement was already by cluster
                  # identity in the vocabulary of policy groups. A cell is the
                  # policy group of ADR-064 and groups nothing here; both labels
                  # are published from the same claim name, so this selector
                  # moved without a window in which it matched nothing.
                  #
                  # Placement stays the application's declaration. Selecting on
                  # `environment` instead was tried and reverted: several
                  # clusters may serve one environment (ADR-082), and a
                  # replacement cluster exists beside the one it replaces for as
                  # long as the restore takes to verify (ADR-111) -- so an
                  # environment-keyed selector would deploy every staging
                  # application to both at once.
                  spoke-type: pool
                  # EVERY CLUSTER SERVING THIS ENVIRONMENT, which is the whole
                  # placement rule: cluster.environmentSlug == the environment
                  # directory the application is declared in.
                  #
                  # It was `cluster-name: .clusterName`, a field each application
                  # carried naming one cluster -- so the application's declaration
                  # WAS the placement decision. A second cluster serving the same
                  # environment received nothing until every application was
                  # edited, and removing a cluster meant editing the applications
                  # that named it. An environment's definitions are independent of
                  # any cluster's lifecycle now: adding a cluster deploys the
                  # environment to it, removing one takes only its own instances.
                  #
                  # `spoke-type: pool` is what excludes the management hub -- the
                  # SpokePool composition sets it and the hub has no claim -- and
                  # `environment` reaches the Argo CD cluster Secret through
                  # take-along-label.capi-to-argocd.environment on that same
                  # composition.
                  environment: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'

  template:
    metadata:
      # One instance per (environment, application, cluster), so the cluster is
      # part of the identity. Without it two clusters serving one environment
      # generate the same object name and the second silently replaces the first.
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} .appId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-{{"{{"}} .name {{"}}"}}-xr'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        app-id: '{{"{{"}} .appId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        provisioning-type: gitops
        resource-type: xr

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (only the XR template)
{{- if $released }}
        # Released: the chart that renders every tenant's platform-owned
        # infrastructure is published, so a tenant's own clusters do not reach
        # into the platform's repository to reconcile it.
        - repoURL: {{ .Values.bundleRegistry | quote }}
          targetRevision: {{ .Values.bundleVersion | quote }}
          # Not folded into the distribution, and the reason is a constraint
          # rather than a preference: this Application loads a tenant-authored
          # values file from the instance repository, and a values file lands at the
          # chart's root. As a subchart of the distribution its values would
          # have to nest under the subchart's name, so every tenant's file
          # would have to be rewritten and the file's shape is a published
          # interface tenants hold in their own repositories.
          #
          # ADR-063's test is whether an artefact is independently installable,
          # versioned, supported, and able to change without the bundle moving.
          # This is installed per tenant but is none of the other three, so it
          # does not pass -- it is published separately because a mechanism
          # forces it, which is worth revisiting rather than settling.
          chart: universal-tenant
{{- else }}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
{{- end }}
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "true"

        # Source 2: the instance repository's values file
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} .appId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

---
# ApplicationSet for application spoke resources (namespace + Tier-2 capabilities on spoke)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-app-spoke-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create applications when BOTH conditions are met:
    # 1. The application's values exist in Git (the instance repository)
    # 2. Target spoke cluster is registered in ArgoCD (by capi2argo) with the cell-id label
    - matrix:
        generators:
          - matrix:
              generators:
                # Application DIRECTORIES, not a filename glob -- because `exclude`
                # exists on a directories generator and does NOT exist on a
                # files one (GitFileGeneratorItem declares only `path`).
                #
                # That asymmetry is the whole reason this is shaped like this.
                # `*` in either generator crosses `/`, so
                # `environments/*/*/values.yaml` matched a WORKLOAD's chart
                # values three levels down as readily as an application's declaration
                # two levels down. The workload file carries no `cellId`, the
                # cluster selector below interpolates one, and the generator
                # failed outright:
                #
                #   failed to execute go template {{"{{"}} .cellId {{"}}"}}:
                #   map has no entry for key "cellId"
                #
                # Nothing looked broken. Every Application already generated
                # stayed, kept syncing its own source and went on reporting
                # Healthy; what stopped was the platform's ability to create,
                # retarget or remove any of them.
                #
                # Setting `exclude` on the files generator instead is worse than
                # the bug: the field is not in the CRD, so server-side apply
                # REFUSES the ApplicationSet and the parent Application cannot
                # diff at all.
                #
                #   .spec.generators[0].matrix.generators[0].git.files[1]
                #   .exclude: field not declared in schema
                #
                # Depth is expressible here and only here.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    # Prefixed so it cannot collide with the `.path` the files
                    # generator below exports; downstream templates read that
                    # one, unchanged.
                    pathParamPrefix: appdir
                    directories:
                      - path: 'environments/*/*'
                      - path: 'environments/*/*/*'
                        exclude: true

                # That application's declaration, addressed exactly rather than
                # matched. Supplies tenantId, appId and cellId, and `.path`.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    files:
                      - path: '{{"{{"}} .appdir.path.path {{"}}"}}/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  # The named cluster, on a workload cluster only: see the
                  # note in 05-tenant-app-appset.
                  spoke-type: pool
                  # EVERY CLUSTER SERVING THIS ENVIRONMENT, which is the whole
                  # placement rule: cluster.environmentSlug == the environment
                  # directory the application is declared in.
                  #
                  # It was `cluster-name: .clusterName`, a field each application
                  # carried naming one cluster -- so the application's declaration
                  # WAS the placement decision. A second cluster serving the same
                  # environment received nothing until every application was
                  # edited, and removing a cluster meant editing the applications
                  # that named it. An environment's definitions are independent of
                  # any cluster's lifecycle now: adding a cluster deploys the
                  # environment to it, removing one takes only its own instances.
                  #
                  # `spoke-type: pool` is what excludes the management hub -- the
                  # SpokePool composition sets it and the hub has no claim -- and
                  # `environment` reaches the Argo CD cluster Secret through
                  # take-along-label.capi-to-argocd.environment on that same
                  # composition.
                  environment: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'

  template:
    metadata:
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} .appId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-{{"{{"}} .name {{"}}"}}-spoke'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        app-id: '{{"{{"}} .appId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        provisioning-type: gitops
        resource-type: spoke

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (namespace, Tier-2 RBAC, ExternalSecrets)
{{- if $released }}
        # Released: the chart that renders every tenant's platform-owned
        # infrastructure is published, so a tenant's own clusters do not reach
        # into the platform's repository to reconcile it.
        - repoURL: {{ .Values.bundleRegistry | quote }}
          targetRevision: {{ .Values.bundleVersion | quote }}
          # Not folded into the distribution, and the reason is a constraint
          # rather than a preference: this Application loads a tenant-authored
          # values file from the instance repository, and a values file lands at the
          # chart's root. As a subchart of the distribution its values would
          # have to nest under the subchart's name, so every tenant's file
          # would have to be rewritten and the file's shape is a published
          # interface tenants hold in their own repositories.
          #
          # ADR-063's test is whether an artefact is independently installable,
          # versioned, supported, and able to change without the bundle moving.
          # This is installed per tenant but is none of the other three, so it
          # does not pass -- it is published separately because a mechanism
          # forces it, which is worth revisiting rather than settling.
          chart: universal-tenant
{{- else }}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
{{- end }}
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "false"
              # Environment-owned, never application-supplied (ADR-050). Passed as a
              # parameter so it overrides anything an application's values file might
              # set, rather than merging with it.
              # Derived from this box's hub domain when not set explicitly.
              # Read the raw value and these were empty on every box whose seed
              # is declared in its own repository -- see _oidc-issuer.tpl.
              - name: oidcIssuer
                value: {{ include "environment-manager.oidcIssuer" $ | quote }}
              - name: oidcJwksUrl
                value: {{ include "environment-manager.oidcJwksUrl" $ | quote }}
{{- if .Values.capabilities.credits.enabled }}
              # ADR-109: where an application that declares capabilities.credits reaches
              # the box's Credit Authority. The same hubDomain the route is built
              # from, so the two cannot disagree. Absent while the capability is
              # off, and an application declaring it then fails to render.
              - name: creditAuthorityUrl
                value: {{ printf "https://credits.%s" (include "environment-manager.hubDomain" $) | quote }}
{{- end }}
{{- if .Values.capabilities.billing.enabled }}
              # ADR-113: where an application that declares capabilities.billing reaches
              # the box's billing engine, built from the same hubDomain as its
              # route. Absent while the capability is off, and an application declaring
              # it then fails to render.
              - name: billingEngineUrl
                value: {{ printf "https://billing.%s" (include "environment-manager.hubDomain" $) | quote }}
{{- end }}
{{- if .Values.oidcScopes }}
            # A list, so it cannot go through `parameters` — those are flat
            # name/value strings.
            values: |
              oidcScopes:
{{- range .Values.oidcScopes }}
                - {{ . | quote }}
{{- end }}
{{- end }}

        # Source 2: the instance repository's values file
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          ref: values

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} .appId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/target/template/data
            - /status

---
# ApplicationSet for application application workloads (Tier 3).
# ADR-073: a workload is published as a versioned chart and consumed by this
# repository naming that version. Each application directory holds a Chart.yaml
# declaring one dependency at a version, and a values.yaml -- the same shape
# kubefirst renders at registry/environments/<env>/<app>/. No rendered workload
# state, no image digest and no overlay is written here by a build.
#
# ONE APPLICATION PER APPLICATION, not one per application. A single Application over
# the whole application directory gives a tenant's applications one sync, one
# health state and one blast radius: an unresolvable chart version in any of them
# leaves every other workload unreconciled, and ArgoCD reports the set degraded
# without naming which member caused it. It also puts every application's build
# on one Chart.yaml, which is the contention ADR-073 exists to remove.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-app-workload-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix: only generate an application when BOTH the application values file
    # exists in the instance repository AND the target spoke cluster is registered.
    #
    # Nested, because three facts are needed and a matrix takes two children. The
    # inner matrix pairs each application with each of its application directories; the
    # outer pairs that with the spoke the application's cellId selects. cellId is a
    # property of the application and the application name is a property of the
    # directory, so neither generator can supply both.
    - matrix:
        generators:
          - matrix:
              generators:
                # One entry per application per environment. Supplies tenantId and
                # cellId, and its path supplies the environment.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    files:
                      - path: 'environments/*/*/values.yaml'

                # One entry per application directory under that application. A
                # directory generator rather than a files generator over
                # Chart.yaml: what is needed here is the application's name, and
                # that is the directory. Reading the chart would also make every
                # Application re-generate whenever a version changed, which is
                # the thing builds change most often.
                #
                # The glob is every directory beside the environment's
                # values.yaml, which is a file and so never matches. Anything
                # added here as a DIRECTORY is generated as an application, so a
                # future per-environment concern belongs in values.yaml or in
                # another file, never in a sibling directory.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    # Both generators in this matrix are git generators, and both
                    # export `.path`. Without a prefix the two collide and the
                    # APPLICATION's path wins, so every Application is named for the
                    # environment instead of the application and sources the
                    # application directory -- which holds no chart, so it syncs
                    # nothing and reports Healthy. That is the false green this
                    # whole arrangement is meant to avoid, produced by the
                    # arrangement itself.
                    pathParamPrefix: app
                    directories:
                      - path: '{{"{{"}} .path.path {{"}}"}}/*'

          - clusters:
              selector:
                matchLabels:
                  # The named cluster, on a workload cluster only: see the
                  # note in 05-tenant-app-appset.
                  spoke-type: pool
                  # EVERY CLUSTER SERVING THIS ENVIRONMENT, which is the whole
                  # placement rule: cluster.environmentSlug == the environment
                  # directory the application is declared in.
                  #
                  # It was `cluster-name: .clusterName`, a field each application
                  # carried naming one cluster -- so the application's declaration
                  # WAS the placement decision. A second cluster serving the same
                  # environment received nothing until every application was
                  # edited, and removing a cluster meant editing the applications
                  # that named it. An environment's definitions are independent of
                  # any cluster's lifecycle now: adding a cluster deploys the
                  # environment to it, removing one takes only its own instances.
                  #
                  # `spoke-type: pool` is what excludes the management hub -- the
                  # SpokePool composition sets it and the hub has no claim -- and
                  # `environment` reaches the Argo CD cluster Secret through
                  # take-along-label.capi-to-argocd.environment on that same
                  # composition.
                  environment: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'

  template:
    metadata:
      # .path is the APPLICATION directory (environments/<env>/<app>), from the
      # files generator; .app.path is a WORKLOAD directory beneath it, from the
      # directories generator under its pathParamPrefix.
      #
      # `.app` is the prefix's name and now names a workload rather than an
      # app (ADR-088 moved the values file down a level). Renaming the prefix
      # would be clearer and is not worth a generator rewrite on a live application;
      # read it as "the thing under the values file".
      #
      # The appId segment is what stops two apps of one tenant colliding: both
      # have a `bff` workload in `dev`, and without it each pair generates one
      # Application name twice -- where the second silently replaces the first.
      name: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} .appId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-{{"{{"}} .app.path.basename {{"}}"}}-{{"{{"}} .name {{"}}"}}'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        app-id: '{{"{{"}} .appId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        workload: '{{"{{"}} .app.path.basename {{"}}"}}'
        resource-type: workload
        target-cluster: '{{"{{"}} .name {{"}}"}}'

    spec:
      project: tenant-workloads

      sources:
        # Single source: this box's own repository, at a path derived from the
        # application's identity rather than declared by it.
        #
        # ADR-047 rejected BYOWR, and the generator read `.workloads.gitRepo`
        # until 2026-09-05 anyway -- handing an application control over WHICH
        # repository's manifests ran in its namespace, with only the
        # tenant-workloads AppProject allowlist between that and arbitrary code.
        #
        # ADR-073 withdraws the field rather than continuing to ignore it, and
        # takes gitPath and gitRevision with it. A version identifies the
        # content; a path identifies only where a copy of it was put. The path is
        # a convention derived from the two facts the generator already holds, so
        # an application chooses neither repository, revision nor location -- it chooses
        # versions, in the Chart.yaml that path holds.
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          path: '{{"{{"}} .app.path.path {{"}}"}}'

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} .appId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
---
