---
{{- /* ADR-068: an uninjected build is unreleased and sources from the working
     tree; a build carrying a version sources from the bundle published under
     it. Known at render time, so the choice is made here rather than by ArgoCD
     per element. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 03-platform-services
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # ADR-046 incident (2026-08-18): preserveResourcesOnDeletion: false allowed
    # ArgoCD pruning to cascade-delete platform Namespaces (tracked in the
    # catalog) on app removal, which in turn cascade-deleted untracked
    # CRS-delivered Secrets (infisical-auth). Deletion must never be the
    # mechanism that removes platform state — rotate spokes instead.
    preserveResourcesOnDeletion: true
    # ADR-061: inventory is now discovered from a repository read that can
    # return nothing. create-update lets the generator create and update
    # Applications but never delete them, so an unreachable repository or a
    # malformed descriptor costs "no changes applied" rather than "every
    # Application in this boundary withdrawn". Removing a component is an
    # explicit act.
    #
    # Deliberately NOT applied to the spoke-catalog ApplicationSet below: its
    # inventory is registered clusters, where an Application must be withdrawn
    # when its spoke is deprovisioned.
    applicationsSync: create-update
  generators:
    # ADR-061: the boundary's inventory is the union of two sources.
    #
    # Components whose source is fixed in the repository are declared one file
    # per component under manifests/argocd/components/03/ and discovered here.
    # Adding one is adding a file; it no longer edits a list every other
    # component shares.
    #
    # The descriptors sit outside every deployed path on purpose: six components
    # in this boundary are recursive directory sources, so a descriptor stored
    # beside the content it describes would itself be applied to the cluster.
    {{- if $released }}
    # Released: the descriptors are files of this chart, so a cluster
    # reconciling a published bundle fetches nothing from the platform's
    # repository to learn what its own boundaries contain. Read from Git,
    # a bundle would be portable only in appearance (ADR-063).
    - list:
        elements:
    {{- $descriptors := $.Files.Glob "descriptors/03/*.yaml" }}
    {{- if not $descriptors }}{{ fail "released bundle carries no descriptors for boundary 03: they are copied in at package time, and a chart without them would generate an empty boundary and report it healthy" }}{{ end }}
    {{- range $path, $_ := $.Files.Glob "descriptors/03/*.yaml" }}
{{- $d := $.Files.Get $path | fromYaml }}
{{- if $released }}
          -{{ include "environment-manager.releasedElement" (dict "descriptor" $d "root" $) | nindent 12 }}
{{- else }}
          -{{ $d | toYaml | nindent 12 }}
{{- end }}
    {{- end }}
    {{- else }}
    - git:
        repoURL: {{ .Values.platformRepoURL | quote }}
        revision: {{ .Values.environmentRevision | quote }}
        # ADR-061: the git files generator injects a `path` parameter of its
        # own -- an object of basename/filename/segments -- and with goTemplate
        # it writes that key AFTER merging the file's contents, so it silently
        # overwrites the `path` every descriptor declares. The Application then
        # renders spec.source.path as that object and dies with "app path does
        # not exist", while chart-based components survive by accident because
        # chart takes precedence over path. This prefix moves the generator's
        # parameters under .descriptorPath and leaves .path meaning what the
        # descriptor says it means.
        pathParamPrefix: descriptorPath
        files:
          - path: 'manifests/argocd/components/03/*.yaml'
    {{- end }}

    # The three components below are NOT descriptors because they have no fixed
    # source: their path is a function of the environment slug, the provider or
    # the topology, which is ADR-037's directory-based promotion. Those values
    # exist at chart render time and not at generator evaluation time, so they
    # are declared here where they are in scope. Giving descriptors a
    # substitution language to cover three cases would make every descriptor a
    # template and hide the distinction rather than remove it.
    - list:
        elements:
          # The hub's public Gateway and its routes.
          #
          # Declared here rather than as a descriptor because its external-dns
          # target is environment-parameterised, which ADR-061 makes the test for
          # where a component is declared. It was a descriptor while that target
          # arrived as a Day-0-written Kustomize patch committed under
          # generated/; removing that is what moves it here.
          {{- if .Values.capabilities.credits.enabled }}
          # ADR-109: the box's Credit Authority -- its ledger, gateway and
          # provisioner. Its database, role and credential are not here: they are
          # platform prerequisites present on every box (hub-core-services/
          # database), so turning this off removes the service and keeps the
          # records. Inline for the reason support-agent is (ADR-066 addendum 2).
          - boundary: '03'
            appName: 'credit-authority'
            destinationNamespace: 'platform-credits'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/credit-authority'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              credit-authority:
                enabled: true
                oidcIssuer: {{ include "environment-manager.oidcIssuer" . | quote }}
                oidcJwksUrl: {{ include "environment-manager.oidcJwksUrl" . | quote }}
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- else }}
              oidcIssuer: {{ include "environment-manager.oidcIssuer" . | quote }}
              oidcJwksUrl: {{ include "environment-manager.oidcJwksUrl" . | quote }}
              {{- include "environment-manager.globalValues" . | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          {{- end }}
          {{- if .Values.capabilities.billing.enabled }}
          # ADR-113: the box's billing engine -- the engine, its queue, its
          # document renderer and its gateway. Its database, role and credential
          # are platform prerequisites present on every box (billing-engine/
          # database, boundary 02), so turning this off removes the service and
          # keeps the records. Inline for the reason the Credit Authority is.
          - boundary: '03'
            appName: 'billing-engine'
            destinationNamespace: 'platform-billing'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/billing-engine'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              billing-engine:
                enabled: true
                oidcIssuer: {{ include "environment-manager.oidcIssuer" . | quote }}
                oidcJwksUrl: {{ include "environment-manager.oidcJwksUrl" . | quote }}
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- else }}
              oidcIssuer: {{ include "environment-manager.oidcIssuer" . | quote }}
              oidcJwksUrl: {{ include "environment-manager.oidcJwksUrl" . | quote }}
              {{- include "environment-manager.globalValues" . | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          {{- end }}

          {{- if .Values.capabilities.support.enabled }}
          # ADR-077. Ships to every box and is inert until enrolled; enrolment is
          # the client certificate and the tenant-owned enrolment ConfigMap both
          # existing, neither of which this element creates.
          #
          # Inline rather than a descriptor because its presence is a function of
          # a value, and a descriptor gate takes effect in a released box and not
          # in a development one (ADR-066 addendum 2).
          - boundary: '03'
            appName: 'support-agent'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/support-agent'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              support-agent:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          {{- end }}

          {{- if .Values.capabilities.observability.enabled }}
          # ADR-078 add.5: the selectable observability BACKEND -- the stores, the
          # query gateway, the evaluators, Loki and Grafana. Collection itself is
          # required machinery and is declared as a descriptor, outside this gate
          # (ADR-066 add.4, ADR-021 amendment 2026-10-29).
          #
          # Declared here rather than as descriptors because their PRESENCE is a
          # function of a value, which is the same test ADR-061 applies to a
          # source that is. A descriptor cannot carry that test: the released
          # path globs descriptors out of the chart and the development path
          # reads them from git, and only the first could filter -- so a
          # capability gate on a descriptor would take effect in a released box
          # and not in a development one. ADR-068 is explicit that the two paths
          # must not diverge, and two defects have already reached clusters
          # through exactly that gap.
          #
          # ADR-078 add.5 §6: the Grafana Operator and its CRDs. Flat: the bundle
          # packages a directory component's top-level files only.
          {{- if not .Values.alerting.emailTo }}{{ fail "alerting.emailTo is required while observability is enabled: at least one address receives platform alerts (ADR-078 add.4, add.5 §5)" }}{{ end }}
          - boundary: '03'
            appName: 'platform-dashboards'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/platform-dashboards'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              platform-dashboards:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''

          # ADR-021 amendment 2026-10-29: the Grafana operator and its CRDs are the
          # ownership anchor above; what the operator RECONCILES is this Application --
          # the instance, its datasources, the folder, the route and the dashboards.
          # Separated because the readiness of every resource here depends on the
          # operator above being up, and ArgoCD treats one Application's sync as one
          # unit (ADR-021 addendum 2026-08-22). Inline rather than a descriptor because
          # its presence is selectable (ADR-066 add.2), as for the operator.
          - boundary: '03'
            appName: 'grafana'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/grafana'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              grafana:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''

          # ADR-078 add.5: the operator that reconciles the hub's stores, evaluators,
          # Alertmanager and query gateway. Its CRDs apply server-side.
          - boundary: '03'
            appName: 'victoriametrics-operator'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/victoriametrics-operator'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              victoriametrics-operator:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''

          # ADR-078 add.5: the hub's own stores (VMSingle x2), query gateway (VMAuth),
          # evaluators (platform, tenant) and Alertmanager. Its resources skip the
          # dry-run until the operator's CRDs exist, then reconcile.
          - boundary: '03'
            appName: 'victoriametrics'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/victoriametrics'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              victoriametrics:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''

          # ADR-078 add.5 §4: the hub's Loki (monolithic, S3-backed).
          - boundary: '03'
            appName: 'loki'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/loki'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              loki:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          {{- end }}

          {{- if include "environment-manager.burstSpokePool" $ }}
          # ADR-052 burst capacity. Watches ONE workload cluster, named by
          # burstSpokePool, because the clusterapi provider cannot discover it.
          #
          # Inline and value-gated rather than a descriptor, by the same test the
          # support agent above applies: its PRESENCE is a function of a value.
          # _burst-spoke-pool.tpl already states the contract -- "empty is legal
          # and means no burst capacity on this box; the autoscaler component is
          # simply not enabled then" -- but as a descriptor it shipped
          # unconditionally, and a descriptor gate would take effect in a
          # released box and not a development one (ADR-066 addendum 2).
          #
          # Unconditional, it did not fail loudly. Every templated field
          # resolved to the empty string and the Deployment installed anyway,
          # asking for a secret named "-kubeconfig":
          #
          #   --node-group-auto-discovery=clusterapi:clusterName=,namespace=platform-capi
          #   MountVolume.SetUp failed for volume "workload-kubeconfig":
          #     secret "-kubeconfig" not found
          #
          # x952 over 32h on nutgraf-hub, the pod ContainerCreating for 46h and
          # its Application the only Degraded one on the box -- the exact shape
          # ADR-052's 2026-09-02 amendment describes, where an ADR names an
          # owner for Burst Node Count and nothing creates one.
          - boundary: '03'
            appName: 'cluster-autoscaler'
            destinationNamespace: 'platform-capi'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/cluster-autoscaler'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              cluster-autoscaler:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          {{- end }}

          - boundary: '03'
            appName: 'hub-gateway'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/gateway'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              hub-gateway:
                enabled: true
                externalDns:
                  target: {{ .Values.hubIngressAddress | quote }}
                creditAuthority:
                  enabled: {{ .Values.capabilities.credits.enabled }}
                billingEngine:
                  enabled: {{ .Values.capabilities.billing.enabled }}
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- else }}
              externalDns:
                target: {{ .Values.hubIngressAddress | quote }}
              creditAuthority:
                enabled: {{ .Values.capabilities.credits.enabled }}
              billingEngine:
                enabled: {{ .Values.capabilities.billing.enabled }}
              {{- include "environment-manager.globalValues" . | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''

          - boundary: '03'
            appName: 'hub-environment'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/environments/management'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              hub-environment:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- else }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          - boundary: '03'
            appName: 'infrastructure-provider'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/providers/{{ .Values.provider }}'
            chart: ''
            directoryRecurse: 'false'
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              infrastructure-provider:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- else }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          # platform-spoke-pools is NOT a component here, and was.
          #
          # It rendered manifests/spoke/spoke-pools/<env>/<provider>, whose SpokePool
          # claim carried a literal name -- spoke-pool-eu-<env>-01 -- inside the
          # published bundle. Every box that pulled the bundle therefore provisioned
          # its workload cluster under the same name, and every identity derived from
          # that name collided across boxes. The CNPG archive prefix was the damaging
          # one: s3://spoke-pool-backups/<name>/ held a previous box's WALs, barman
          # refused the next box's with "Expected empty archive", and no backup
          # completed on any box for as long as this shipped.
          #
          # The name cannot be fixed by rendering it here. templated-fields refuses to
          # rewrite metadata.name -- renaming an object by value makes the resource
          # ArgoCD prunes depend on that value, and for a SpokePool that means
          # destroying and reprovisioning a cluster. A workload cluster's name has to
          # be written once, by the tenant, and never computed.
          #
          # So the claim is the tenant's, at clusters/<name>/infrastructure/, hydrated
          # by `kakt tenant add-cluster`: one management cluster per repository and as
          # many workload clusters as it declares -- kubefirst's layout, which
          # cmd/kakt/bootstrap.go already names as ours. The Application that CREATES
          # each one sits in the management cluster's own directory, addressed
          # in-cluster; everything that runs ON the cluster is addressed to it.
          #
          # UPGRADING ACROSS THIS CHANGE IS DESTRUCTIVE. This Application had
          # prune: true, so a box whose workload cluster came from the bundle must
          # declare that cluster in its own repository BEFORE taking a bundle that no
          # longer ships it. Otherwise the Application goes, the claim with it, and
          # the cluster is deleted.
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: boundary-03
      source:
        # An empty repoURL means "the platform's own repository", supplied here
        # from platformRepoURL rather than repeated in every descriptor. Same
        # treatment targetRevision gets on the line below, for the same reason:
        # ArgoCD keys credentials and its repo-server cache by the literal URL
        # string, so a repository named in 21 places is one that will eventually
        # be named 21 ways.
        #
        # The condition is emptiness, NOT the ownership flag. A component can be
        # platform-owned and still name its own chart registry, and keying on
        # the flag would silently retarget it at the platform repo. No component
        # is in that state today -- the one that was, the mail server, has been
        # removed -- so this is a guard rather than a live case.
        # Where the platform's own content comes from is decided here, once, from
        # the build's version (ADR-068) -- not named by each component. A
        # component pinned to a published chart could never be exercised from a
        # working tree, and one pinned to a path would never be exercised as
        # published; the distinction is a property of the build.
        #
        # An empty repoURL means "the platform's own content". A component that
        # names its own registry is third-party: its URL and version are pinned
        # by the descriptor, the descriptor is bundle content, and so those move
        # with the bundle without being resolved here.
        repoURL: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .repoURL {{"}}"}}{{"{{"}} else {{"}}"}}{{ if $released }}{{ .Values.bundleRegistry }}{{ else }}{{ .Values.platformRepoURL }}{{ end }}{{"{{"}} end {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ if $released }}{{ .Values.bundleVersion }}{{ else }}{{ .Values.environmentRevision }}{{ end }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
{{- if $released }}
        # Released: platform content is a chart in the bundle. Its path is
        # dropped -- an Application carrying both is rejected.
        #
        # The chart is named for the component unless the element names one
        # itself. A component whose source path varies by environment or
        # provider is packaged per combination, so it has to say which chart it
        # wants; falling back to the appName would name a chart no release
        # publishes, and the Application would resolve nothing.
        path: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .path {{"}}"}}{{"{{"}} end {{"}}"}}'
        # One artefact (ADR-063). A component naming its own repoURL keeps the
        # chart its descriptor pins; everything platform-owned resolves the
        # distribution and enables its own component through values.
        chart: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .chart {{"}}"}}{{"{{"}} else {{"}}"}}platform{{"{{"}} end {{"}}"}}'
{{- else }}
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
{{- end }}
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          # Single-quoted ON PURPOSE, and NOT a block scalar. This is inside
          # spec.template, which ArgoCD renders per FIELD VALUE: the parsed value
          # is the literal '{{ .helmValues }}' and substitution happens after
          # YAML parsing, so newlines in the result are never folded. The folding
          # bug is real only in templatePatch below, which is raw text parsed as
          # YAML AFTER substitution.
          #
          # A block scalar here is actively harmful: for the many apps with no
          # helm values it yields "\n            \n" instead of "", and a
          # non-empty helm block beside a directory block makes ArgoCD refuse the
          # app with "multiple application sources defined: Helm,Directory".
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        # Native failed-sync recovery, the only mechanism that exists between
        # independently reconciled Applications (ADR-021 amendment 2026-10-29).
        # An Application whose CRDs are owned by a different Application fails
        # until those CRDs are Established; unlimited attempts under a capped
        # backoff converge without a Git revision change or a manual sync, and
        # selfHeal alone is not a failed-sync retry policy. A permanent failure
        # stays visible: the Application reports it, and retries are not health.
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
  templatePatch: |
{{- if not $released }}
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} if ne .directoryInclude "" {{"}}"}}
          include: '{{"{{"}} .directoryInclude {{"}}"}}'
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} end {{"}}"}}
{{- end }}
    {{"{{-"}} if eq .ignoreDifferencesNamespace "true" {{"}}"}}
    spec:
      ignoreDifferences:
        - kind: Namespace
          name: '{{"{{"}} .destinationNamespace {{"}}"}}'
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
    {{"{{-"}} end {{"}}"}}
{{- if not $released }}
    {{- /*
      Unreleased only. templatePatch is applied after the template, so emitting
      `sources` here puts it beside the `source` the released template produced.
      ArgoCD does not treat that as a conflict: GetSources returns spec.sources
      whenever it is non-empty and never consults spec.source, so the Application
      resolves this array and silently ignores the single OCI source. Two of its
      entries name the platform repository, which is the runtime dependency
      ADR-063 forbids -- reintroduced on a cluster whose bundle is clean.
    */}}
    {{"{{-"}} if ne .extraManifestsPath "" {{"}}"}}
    spec:
      sources:
        # Same empty-means-platform fallback as spec.template above. Nothing
        # takes this branch today, so the fallback is unreachable -- it is here
        # so that the first platform-owned component to use extraManifestsPath
        # does not silently render an empty repoURL.
        - repoURL: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .repoURL {{"}}"}}{{"{{"}} else {{"}}"}}{{ .Values.platformRepoURL }}{{"{{"}} end {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            # Same folding bug as the single-source block above.
            values: |
              {{"{{-"}} .helmValues | nindent 14 {{"}}"}}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: '{{"{{"}} .extraManifestsPath {{"}}"}}'
    {{"{{-"}} end {{"}}"}}
{{- end }}
    {{"{{-"}} if eq .appName "platform-infisical" {{"}}"}}
    spec:
      ignoreDifferences:
        # ROOT CAUSE of recurring Infisical migration-lock failures.
        #
        # The chart stamps a wall-clock timestamp into the Deployment AND its pod
        # template (templates/infisical.yaml, 1.10.0+):
        #
        #     updatedAt: {{"{{"}} now | date "2006-01-01 MST 15:04:05" {{"}}"}}
        #
        # Every render therefore differs from the live object, so ArgoCD sees the
        # Deployment as permanently OutOfSync and self-heal rewrites it. Each rewrite
        # changes the pod template, producing a new ReplicaSet and killing the
        # running pod — observed as generation=4 within 28 minutes and a stream of
        # short-lived pods.
        #
        # That is fatal here because Infisical runs its schema migrations INSIDE the
        # app pod at boot. A pod killed mid-migration leaves
        # infisical_migrations_lock.is_locked = 1, and every later pod then refuses
        # to start with "Migration table is already locked". Nothing self-heals.
        #
        # On a hybrid hub the window is wide: the image lands on a home-lab node over
        # a domestic link and the pull alone ran past 4m26s, so a sync almost always
        # lands mid-pull or mid-migration.
        #
        # Ignoring the annotation makes the Deployment converge, which stops the
        # rollout loop at its source. The startupProbe patch in the infisical
        # kustomization handles the other half (readiness killing a slow migration);
        # the migration-unlock init container is the last-resort cleanup.
        - group: apps
          kind: Deployment
          name: infisical-standalone-infisical
          jsonPointers:
            - /metadata/annotations/updatedAt
            - /spec/template/metadata/annotations/updatedAt
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "infrastructure-provider" {{"}}"}}
    spec:
      ignoreDifferences:
        # NO ClusterClass RULE, deliberately. CAPI's defaulted namespaces and
        # empty metadata blocks are declared in the ClusterClass source instead,
        # so there is no diff to suppress.
        #
        # Ignoring them here was worse than redundant. This Application syncs
        # with RespectIgnoreDifferences=true, so an ignored path is taken from
        # the live object and folded into what is applied -- and for a path
        # inside a list, the live LIST ELEMENT is what carries over, because an
        # atomic CRD list cannot be merged field by field. Two of the seven
        # expressions reached inside .spec.workers.machineDeployments[], so the
        # live entries replaced the rendered ones and rc.186 applied the new
        # control-plane template while silently keeping both worker bootstrap
        # refs on the superseded v6. The sync reported success and the
        # Application sat OutOfSync on exactly the two fields it had discarded.
        #
        # A rule here must therefore never address a path inside a list. Prefer
        # declaring the defaulted value at the source, as the ClusterClass now
        # does.
        # External Secrets controller adds finalizers, defaulted fields and
        # status to ExternalSecrets after creation.
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .metadata.finalizers
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.creationPolicy
            - .spec.target.deletionPolicy
            - .spec.target.mergePolicy
            - .spec.target.template.engineVersion
            - .spec.binding
            - .status
    {{"{{-"}} end {{"}}"}}
---

---
# ADR-047: platform-spoke-catalog — deploys the platform's spoke capability
# catalog (CRDs, operators, cert-manager, infisical-issuer, ESO secret store,
# crossplane providers, CNPG, kyverno ABI, agent-sandbox, sandbox netpol) to
# every registered pool spoke.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-spoke-catalog
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # ADR-046 incident (2026-08-18): preserveResourcesOnDeletion: false allowed
    # ArgoCD pruning to cascade-delete platform Namespaces (tracked in the
    # catalog) on app removal, which in turn cascade-deleted untracked
    # CRS-delivered Secrets (infisical-auth). Deletion must never be the
    # mechanism that removes platform state — rotate spokes instead.
    preserveResourcesOnDeletion: true

  generators:
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool

  template:
    metadata:
      name: 'platform-spoke-catalog-{{"{{"}} .name {{"}}"}}'
      namespace: platform-ops
      labels:
        app.kubernetes.io/part-of: platform
        spoke-type: pool

    spec:
      project: boundary-03

      source:
{{- if $released }}
        repoURL: {{ .Values.bundleRegistry | quote }}
        targetRevision: {{ .Values.bundleVersion | quote }}
{{- else }}
        repoURL: {{ .Values.platformRepoURL | quote }}
        targetRevision: '{{ .Values.environmentRevision }}'
{{- end }}
        # ADR-046 §11: spoke-catalog is structured per environment and provider;
        # the CNPG overlay lives at manifests/spoke/spoke-catalog/providers/<provider>.
        # The cluster generator exposes labels under .metadata.labels; fail closed
        # on any provider other than hybrid/hetzner (index + fail primitive also
        # covers a spoke whose provider take-along label is missing).
{{- if $released }}
        # Released: the catalogue is a published chart per environment and
        # provider. The provider is still read from the cluster's own label, so
        # a spoke gets the catalogue matching what it actually is rather than
        # what the hub assumed.
        # One artefact (ADR-063). The spoke's own provider label still chooses
        # the content -- it selects a variant inside the distribution now
        # instead of a separate chart, so a spoke still gets the catalogue
        # matching what it is rather than what the hub assumed.
        chart: 'platform'
{{- else }}
        # PROVIDER only. The catalogue had an environment axis as well, and the
        # three environments were identical: cnpg-cluster.yaml and
        # scheduled-backup.yaml matched byte for byte across dev, stg and prod once
        # comments were stripped, and the only files unique to one of them --
        # ephemeral-vm-provisioner and tenant-identity-egress -- justify themselves
        # entirely by provider ("on hybrid spokes only", "a pure-Hetzner spoke has
        # no such conflict"). They sat under dev/ because dev was the only
        # environment that had a hybrid spoke, not because they were dev's.
        #
        # kubefirst splits platform content by provider and by nothing else; its
        # environment directories hold tenant workloads. ADR-051's amendment of
        # 2026-09-18 adopts that, and this is what it looks like in the path.
        path: 'manifests/spoke/spoke-catalog/providers/{{"{{"}} if eq (index .metadata.labels "provider") "hybrid" {{"}}"}}hybrid{{"{{"}} else if eq (index .metadata.labels "provider") "hetzner" {{"}}"}}hetzner{{"{{"}} else {{"}}"}}{{"{{"}} fail "unknown provider label: spoke-catalog path" {{"}}"}}{{"{{"}} end {{"}}"}}'
{{- end }}
{{- if $released }}
        # Released: the per-spoke fields are chart values, because ArgoCD
        # permits one source type per source and an Application naming a Helm
        # chart cannot also carry Kustomize patches -- it is refused with
        # "multiple application sources defined". The catalogue is packaged
        # with those objects as templates (ADR-063); the values below are the
        # same substitutions the patches made.
        helm:
          values: |
            platform-spoke-catalog:
              enabled: true
              spokeName: '{{"{{"}}.name{{"}}"}}'
            # The SPOKE's own environment AND provider, overriding the hub's --
            # passed INTO globalValues rather than appended after it.
            #
            # Both are facts about the cluster being rendered onto, and the hub
            # is not necessarily either of them: ADR-075 makes on-prem capacity a
            # capability rather than a property of a box, so a hetzner spoke
            # under a hybrid hub is supported and so is the reverse. Taking the
            # hub's provider gave such a spoke an on-prem nodeSelector and a
            # local-path storage class, which renders cleanly and then never
            # schedules.
            #
            # Independent of each other and of the cluster's name: provider,
            # environment, identity and cell-policy membership are four separate
            # declarations, and nothing here derives one from another.
            #
            # globalValues carries the hub's environmentSlug, and a workload
            # cluster reading it would take the environment of the cluster that
            # PROVISIONED it rather than the one it declares: a prod workload
            # cluster under a dev hub would read DEV secrets out of Infisical
            # (ADR-037). The label is written by the SpokePool composition from
            # the claim the tenant wrote, so this reads the cluster's own
            # declaration.
            #
            # It WAS a second `global:` block after globalValues, on the reasoning
            # that "last wins in Helm". That is true of a scalar and false of the
            # mapping around it: YAML has no merge for a duplicate key, so the
            # second block replaced the first outright and every other global --
            # provider, hubDomain, clusterName, tenantId, the Infisical ids --
            # arrived nil.
            #
            # global.provider nil meant the catalogue's provider-gated template
            # block rendered NOTHING, so ArgoCD pruned what that block owns --
            # VMSingle, VLogs and the query endpoint's ConfigMap were deleted as
            # no longer declared, while the Application reported Synced (354
            # synced, 11 pruned). Verified on nutgraf-01, 2026-09-20.
            #
            # No line here may end in a colon: these comments sit at the top
            # level of a values block, and application-specs.py reads that
            # position for enabled components.
            {{- include "environment-manager.globalValues" (dict "root" $ "environmentSlug" (printf "'%s index .metadata.labels \"environment\" %s'" "{{" "}}") "provider" (printf "'%s index .metadata.labels \"provider\" %s'" "{{" "}}")) | nindent 12 }}
{{- else }}
        kustomize:
          patches:
            # Inject the per-spoke crossplane-admin password key (ADR-003/tenant-db
            # bootstrap). The hub-operator generates <spoke>-crossplane-admin-password
            # in the hub-secrets project; the ExternalSecret remoteRef must match
            # that exact key for the spoke CNPG/provider-sql bootstrap to resolve.
            - target:
                kind: ExternalSecret
                name: crossplane-admin-credentials
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '{{"{{"}}.name{{"}}"}}-crossplane-admin-password'
            # ADR-014 backup contract: per-spoke barman prefix. destinationPath is
            # a Cluster property — ScheduledBackup has no destination fields and
            # inherits this configuration.
            - target:
                kind: Cluster
                name: shared-cnpg
              patch: |
                - op: replace
                  path: /spec/backup/barmanObjectStore/destinationPath
                  value: 's3://spoke-pool-backups/{{"{{"}}.name{{"}}"}}/'
            # The SAME per-spoke prefix on the RECOVERY source.
            #
            # externalClusters is a second, independent copy of the object-store
            # configuration, and it is the one a restore actually reads. Patching
            # only the backup path above leaves recovery pointing at the bucket
            # ROOT — s3://spoke-pool-backups/<incarnation>/ instead of
            # s3://spoke-pool-backups/<spoke>/<incarnation>/ — where no spoke has
            # ever written anything. CNPG then fails the restore with
            #
            #   Recovering from external cluster ... sourceName=shared-cnpg-v3
            #   Error while restoring a backup: no target backup found
            #
            # which names the source it could not find and says nothing about the
            # path it looked in, so it reads as a missing BACKUP rather than a
            # wrong PREFIX. Observed on the 2026-09-25 restore, against an archive
            # that was intact and listable the whole time.
            #
            # This is why externalClusters is declared in EVERY state, including
            # the steady one where bootstrap is initdb and nothing reads it. A
            # JSON-Patch op against an absent path fails the whole kustomization,
            # so a patch that only applied during a recovery would take every
            # spoke's sync down in between recoveries. An inert externalClusters
            # entry costs nothing and keeps this target always present.
            - target:
                kind: Cluster
                name: shared-cnpg
              patch: |
                - op: replace
                  path: /spec/externalClusters/0/barmanObjectStore/destinationPath
                  value: 's3://spoke-pool-backups/{{"{{"}}.name{{"}}"}}/'
            # ADR-014 backup contract: per-spoke S3 keys in the hub-secrets
            # project at /spoke-pool/<spoke>/shared/. The hcloud-token is an
            # HCloud API token, NOT a Hetzner Object Storage key — it fails with
            # InvalidAccessKeyId (verified live 2026-08-18).
            - target:
                kind: ExternalSecret
                name: s3-credentials
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/S3_ACCESS_KEY_ID'
                - op: replace
                  path: /spec/data/1/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/S3_SECRET_ACCESS_KEY'
            # ADR-031 cell-scoped authorisation. The cell Machine Identity may read
            # /spoke-pool/<cell-id>/ only, so every spoke ExternalSecret must resolve
            # inside that prefix. Both of these previously used ROOT-path keys and so
            # could never resolve on any spoke — the hub reads the same keys fine,
            # which is what made it look like a seeding gap rather than an
            # authorisation contract violation.
            #
            # S3_* and the alert-delivery keys are fleet credentials materialised into
            # each cell's own path — deliberate duplication, chosen over a privileged
            # cross-cell read path that would weaken ADR-031's invariant.
            #
            # The agentgateway-oidc-cookie-secret patch that stood here was removed
            # on 2026-09-02. d3b7303d moved the gateway to one instance per tenant,
            # so the spoke-catalog no longer renders that ExternalSecret and the
            # tenant chart reads its own per-tenant path directly. A kustomize patch
            # whose target does not exist is a BUILD error, so this did not merely
            # do nothing — it would fail the whole spoke-catalog Application.
            # ADR-078 add.5 §5: the spoke Alertmanager's credentials, in its own cell.
            - target:
                kind: ExternalSecret
                name: alertmanager-credentials
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/ALERT_SMTP_PASSWORD'
                - op: replace
                  path: /spec/data/1/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/GRAFANA_IRM_ALERTMANAGER_URL'
                - op: replace
                  path: /spec/data/2/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/GRAFANA_IRM_HEARTBEAT_URL'
            # ADR-078 add.5 §4: the spoke Loki's object-storage keys, in its own cell.
            - target:
                kind: ExternalSecret
                name: loki-object-storage
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/S3_ACCESS_KEY_ID'
                - op: replace
                  path: /spec/data/1/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/S3_SECRET_ACCESS_KEY'
            # WS3: external-dns blast-radius + record ownership.
            # --domain-filter scopes which zone this spoke may write, so a dev
            # spoke can never touch prod records. --txt-owner-id keys the TXT
            # registry; two spokes sharing an owner id would fight over records.
            # Both are args[0]/args[1] by contract (see external-dns.yaml) — they
            # are pinned first precisely so appended flags cannot shift the index.
            # environmentSlug is a Helm value resolved at bootstrap; .name is the
            # ArgoCD cluster name resolved per generated Application.
            - target:
                kind: Deployment
                name: external-dns
              patch: |
                - op: replace
                  path: /spec/template/spec/containers/0/args/0
                  # hubDomain already is the env-prefixed zone, or the apex in
                  # prod, so the conditional this replaces is now the value.
                  value: '--domain-filter={{ include "environment-manager.hubDomain" $ }}'
                - op: replace
                  path: /spec/template/spec/containers/0/args/1
                  value: '--txt-owner-id={{"{{"}}.name{{"}}"}}'
                # ADR-108: the preview domain, args[2] by the same contract.
                - op: replace
                  path: /spec/template/spec/containers/0/args/2
                  value: '--domain-filter={{ required "previewDomain is required: an empty --domain-filter matches every zone (ADR-108)" .Values.previewDomain }}'
            # ADR-108: the preview-access service's issuer and preview domain.
            # env[1..3] by contract (operators/ephemeral-job-operator/config/
            # preview-access/deployment.yaml pins the order).
            - target:
                kind: Deployment
                name: preview-access
              patch: |
                - op: replace
                  path: /spec/template/spec/containers/0/env/1/value
                  value: 'https://id.{{ include "environment-manager.hubDomain" $ }}'
                - op: replace
                  path: /spec/template/spec/containers/0/env/2/value
                  value: 'https://id.{{ include "environment-manager.hubDomain" $ }}/oauth/v2/keys'
                - op: replace
                  path: /spec/template/spec/containers/0/env/3/value
                  value: '{{ .Values.previewDomain }}'
            # Environment isolation (ADR-037). The spoke ClusterSecretStore ships
            # with environmentSlug hardcoded to "dev"
            # (manifests/spoke/spoke-catalog/infra/cluster-secret-store.yaml), so a
            # spoke reading it unchanged would read DEV secrets out of Infisical.
            # spoke-catalog is KUSTOMIZE-rendered, not Helm, so `{{ .Values.x }}`
            # cannot be written into the manifest itself -- the substitution has to
            # happen here.
            #
            # THE SPOKE'S OWN LABEL, not the hub's value (ADR-111 Revision 7). This
            # read .Values.environmentSlug -- the HUB's -- which is the hazard the
            # globalValues comment above this generator already names: a prod spoke
            # under a dev hub took the environment of the cluster that PROVISIONED
            # it. The label is written by the SpokePool composition from the claim
            # the tenant wrote, and is expanded per Application by ArgoCD, exactly
            # as globalValues does it.
            - target:
                kind: ClusterSecretStore
                name: infisical-backend
              patch: |
                - op: replace
                  path: /spec/provider/infisical/secretsScope/environmentSlug
                  value: '{{"{{"}} index .metadata.labels "environment" {{"}}"}}'

{{- end }}
      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: platform-ops

      # ADR-046 §11 (Wave C): .spec.bootstrap is intentionally ignored — the
      # declarative steady-state manifest cannot represent the historical
      # creation/bootstrap mechanism of an already-initialized CNPG cluster.
      # CNPG evaluates bootstrap only at creation time and never re-reconciles
      # it, so the recovery-state manifest (Wave B) returning to initdb (Wave C)
      # stays permanently Synced.
      #
      # externalClusters is ignored for the SAME reason, and leaving it out
      # blocked every sync on 2026-09-29. The two fields are one decision: what
      # this cluster was created from. Ignoring bootstrap alone freezes the live
      # object at `recovery.source: shared-cnpg-v<N>` while the settled manifest
      # applies `externalClusters: [shared-cnpg-v<N+1>]` -- so the reference the
      # frozen bootstrap depends on is pruned out from under it, and CNPG's
      # admission webhook refuses the whole object:
      #
      #   Cluster "shared-cnpg" is invalid: spec.bootstrap.recovery.source:
      #   Invalid value: "shared-cnpg-v3": External cluster shared-cnpg-v3 not found
      #
      # The database is healthy throughout; what fails is the Application, which
      # then carries every other object in the catalogue down with it.
      #
      # The manifest is not wrong and must not be "fixed" by adding the older
      # entry back: cnpg-bump-incarnation.sh declares exactly one
      # externalClusters entry and asserts it (steady == archive, recovering ==
      # archive - 1), and make cnpg-incarnation-check enforces that in CI. The
      # manifest describes what a NEW cluster is created from; an existing one
      # owns its own answer, which is precisely what ignoring means here.
      #
      # The five entries after externalClusters are a DIFFERENT problem with the
      # same shape, and they are why this Application sat OutOfSync while every
      # object in it was correct.
      #
      # CNPG writes them from its controller loop, not from a defaulting webhook
      # and not from CRD defaults. That distinction decides everything here:
      # ServerSideApply plus server-side diff absorbs a value admission adds,
      # because a dry-run apply produces it too -- but a dry-run cannot predict a
      # field the operator will write on its next reconcile. So the predicted
      # object lacks them, the live object has them, and the comparison reports
      # drift on every pass, forever.
      #
      # Verified rather than assumed, by rendering the chart at the deployed
      # version and diffing against the live object: every declared field matched,
      # including all fourteen postgresql.parameters and managed.roles, and the
      # ONLY differences were these five plus top-level scalars that
      # argocd-controller does not own (enablePDB, probes, replicationSlots,
      # postgresUID/GID, the delays) and which SSA therefore already ignores.
      #
      # This is not a way of hiding real drift. Each one is a field the manifest
      # never sets, so ignoring it cannot mask a change to anything declared --
      # a change to a declared value still diffs, because it is not listed here.
      ignoreDifferences:
        - group: postgresql.cnpg.io
          kind: Cluster
          name: shared-cnpg
          jsonPointers:
            - /spec/bootstrap
            - /spec/externalClusters
            # backup.target defaults to prefer-standby.
            - /spec/backup/target
            # affinity.podAntiAffinityType defaults to preferred.
            - /spec/affinity/podAntiAffinityType
            # monitoring gains the operator's own default query set.
            - /spec/monitoring/customQueriesConfigMap
            - /spec/monitoring/disableDefaultQueries
            # storage.resizeInUseVolumes defaults to true.
            - /spec/storage/resizeInUseVolumes

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
---
