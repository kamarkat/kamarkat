{{- if not .Values.deployXR }}
{{- /*
  THIS APPLICATION'S OWN SECRET STORE (ADR-117 §4).

  Rendered in the workload path, beside the ExternalSecrets that read it, so the
  two cannot diverge: whatever renders a reader renders its store. Not gated on
  any feature: the platform credentials every application needs are not
  conditional on a database.

  The store reads the box's OpenBao through the hub Gateway, as this namespace's
  openbao-secrets ServiceAccount, with a token this cluster's API server signs.
  The cluster's auth mount (spoke-<cluster>) trusts only that cluster's signing
  key, and the role tenant-<app> binds only this namespace's ServiceAccount to a
  policy reading spokes/<cluster>/tenants/<app> and nothing else. There is no
  stored credential: nothing to copy, leak or rotate.
*/}}
{{- $ns := include "universal-tenant.namespace" . -}}
{{- $cluster := required "clusterName must be supplied: this application's auth mount is its cluster's (ADR-082)" .Values.clusterName -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-secrets
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: universal-tenant
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-secret-store
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: universal-tenant
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
spec:
  provider:
    vault:
      # Required here rather than in the ApplicationSet: an empty value should
      # fail this object with a reason, not every application on the box.
      server: https://openbao.{{ required "hubDomain must be supplied: this application's SecretStore addresses the box's OpenBao by name, and a guessed hostname would point an application's secrets at another box" .Values.hubDomain }}
      path: kv
      version: v2
      auth:
        jwt:
          path: spoke-{{ $cluster }}
          role: tenant-{{ include "universal-tenant.appId" . }}
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: openbao-secrets
            audiences: [openbao]
            expirationSeconds: 600
{{- end }}
