{{- if not .Values.deployXR }}
{{- /*
  THIS APPLICATION'S OWN ESO SCOPE, and the credential it authenticates with.

  Both objects used to be built by the tenant-platform Crossplane composition
  (ainativesaas-starter-hetzner items 7 and 8). They are plain Kubernetes objects
  that need nothing from Crossplane, and being there gave them the WRONG LIFECYCLE:
  ainativesaas.yaml gates the whole XR on `database.enabled`, so an application
  declaring no database never got a SecretStore -- while workload-secrets.yaml,
  workload-oauth-secrets.yaml and agentgateway.yaml reference it regardless, and
  the platform credentials every application needs are not conditional on a
  database at all.

  nutgraf-waypoint-stg is exactly that application: `database.enabled: false`,
  `secrets: []`, and two platform ExternalSecrets sitting in SecretSyncedError
  with `SecretStore "tenant-secret-store" not found`. Nothing was misconfigured;
  a secret store's existence was tied to an unrelated feature flag.

  Rendered in the WORKLOAD path, beside the ExternalSecrets that consume it, so
  the two cannot diverge: whatever renders a reader renders its store.

  Scope: this reads the box's management environment of hub-secrets, with this
  application's own machine identity. That is a different project from the
  cluster's own secrets project (ADR-031) and a different identity from the
  spoke's -- the per-cluster boundary covers platform credentials, and an
  application's secrets are scoped by this store and this identity instead.
*/}}
{{- $ns := include "universal-tenant.namespace" . -}}
{{- $cell := required "clusterName must be supplied: this application's Infisical path is derived from the cluster it runs on (ADR-082)" .Values.clusterName -}}
{{- $credential := printf "%s-infisical-credentials" (include "universal-tenant.tenantId" .) -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $credential }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: universal-tenant
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
spec:
  refreshInterval: 1h
  # The SPOKE's store, which is what bootstraps this: the cluster's own
  # ClusterSecretStore is already present before any application syncs, so the
  # credential below can be read without the store this file also creates.
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: {{ $credential }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        client-id: '{{ `{{ index . "client-id" }}` }}'
        client-secret: '{{ `{{ index . "client-secret" }}` }}'
        project-id: '{{ `{{ index . "project-id" }}` }}'
  data:
    - secretKey: client-id
      remoteRef:
        key: /spoke-pool/{{ $cell }}/shared/infisical-credentials
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: /spoke-pool/{{ $cell }}/shared/infisical-credentials
        property: client-secret
    - secretKey: project-id
      remoteRef:
        key: /spoke-pool/{{ $cell }}/shared/infisical-credentials
        property: project-id
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: tenant-secret-store
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/managed-by: universal-tenant
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
spec:
  provider:
    infisical:
      # Required here rather than in the ApplicationSet: an empty value should
      # fail this object with a reason, not every application on the box.
      hostAPI: https://infisical.{{ required "hubDomain must be supplied: this application's SecretStore addresses the box's Infisical by name, and a guessed hostname would point an application's secrets at another box" .Values.hubDomain }}
      secretsScope:
        projectSlug: hub-secrets
        # The MANAGEMENT scope (ADR-111 Revision 7 §2). This store reads
        # /spoke-pool/<cluster>/tenants/<app>/..., which hub-operator writes
        # through the box's declared management scope -- so it follows that
        # scope and not the cluster's environment.
        environmentSlug: management
      auth:
        universalAuthCredentials:
          clientId:
            name: {{ $credential }}
            key: client-id
          clientSecret:
            name: {{ $credential }}
            key: client-secret
{{- end }}
