{{- if and (not .Values.deployXR) (eq ((.Values.registry).images | default "public") "private") }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: {{ include "universal-tenant.namespace" . }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
    tier: {{ .Values.tier }}
spec:
  refreshInterval: 1h
  # This application's own store: hub-operator copies the box's registry
  # credential into every tenant scope, so a tenant never needs the cluster's
  # platform store (which tenant namespaces are excluded from).
  secretStoreRef:
    name: tenant-secret-store
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      data:
        .dockerconfigjson: '{{ `{{ .dockerconfigjson }}` }}'
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        # THIS CLUSTER'S COPY, not the project root.
        #
        # It read `ghcr-pull-secret` at the root, which worked while every cluster
        # shared one Infisical project and the spoke identity could read all of it.
        # Under one project per cluster the identity is a viewer of its own project
        # alone, and what it may read is what hub-operator materialised into this
        # path -- so the root is both empty and outside the contract ADR-031
        # describes.
        #
        # The cluster name comes from the ApplicationSet's generator, which is why
        # it is here to build a path with: an application does not declare where it
        # runs (ADR-082).
        key: {{ include "universal-tenant.secretPrefix" . }}
        property: ghcr-pull-secret
        # Fix OutOfSync: Match ESO's injected defaults to prevent ArgoCD drift
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
