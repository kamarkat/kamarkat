apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "universal-tenant.namespace" . }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
    tier: {{ .Values.tier }}
    # ADR-021 Blocker 4: Pod Security Admission enforced at namespace level.
    # The admission controller mathematically guarantees PSA compliance for all
    # pods in this namespace — no workload can bypass it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
{{- if (.Values.burstCompute | default dict).enabled }}
    # ADR-052 §4: the capability grant. The burst placement policy matches on
    # this label, so a sandbox pod in this namespace is mutated onto burst
    # capacity — nodeSelector, toleration and priorityClassName written by the
    # platform, never by the fleet.
    #
    # The label is on the NAMESPACE and not on the pod, and that is the whole
    # control: a fleet authors pods, so a pod label would be self-granted. It
    # does not author its namespace.
    compute.nutgraf.in/burst-compute: enabled
{{- end }}
{{- if (.Values.previewAccess | default dict).enabled }}
{{- $origin := first (.Values.gateway.hostnames | default (list "")) }}
{{- if not $origin }}
{{- fail "previewAccess.enabled requires gateway.hostnames: the first hostname is the app origin previews are embedded in (ADR-108)" }}
{{- end }}
  annotations:
    # ADR-108: the one origin the preview codes endpoint accepts, and the only
    # one a preview refusal page posts its state to.
    preview-access.kamarkat.io/app-origin: {{ printf "https://%s" $origin | quote }}
{{- end }}
