# Converge this box on the bundle version its repository names.
#
# GIT IS THE SOURCE OF TRUTH, and this is the step that makes that true of a
# RUNNING cluster rather than only of the repository. `kakt release promote`
# rewrites every reference under registry/ and pushes; this runs on that push and
# does not finish until the box is actually on the new version.
#
# WHY IT EXISTS. Your control plane reconciles the new version by itself -- that
# is what makes this GitOps, and nothing here replaces it. What it does not do is
# TELL ANYONE when it cannot. A promotion written to git and never confirmed on
# the box is the failure that is hardest to see: the repository says the new
# version, every child Application stays on the old one, and ArgoCD reports
# Synced because each one matches what it was last told. This run is where that
# surfaces, at the moment the change was made, instead of weeks later.
#
# WHAT IT DOES NOT DO. It never provisions, and it never edits this repository.
# Creating a cluster is bootstrap-cluster.yml; this only drives and then confirms
# a convergence that the declaration has already asked for.
#
# ACCESS IS YOURS TO GRANT, and the same grant bundle-preflight.yml uses: one
# secret per cluster you want driven and confirmed.
#
#   KUBECONFIG_ACME_HUB   access to the cluster being converged. The name is the
#                         cluster's own, upper-cased with hyphens turned into
#                         underscores, so registry/clusters/acme-hub wants
#                         KUBECONFIG_ACME_HUB.
#
# Without it this run reports that the box will converge on its own and that
# nothing was confirmed -- which is the honest outcome, and not a failure,
# because the platform holds no credential for your cluster (ADR-065).
---
name: Bundle sync

on:
  push:
    branches: [main]
    # The bundle pin, which is what names the version a cluster pulls.
    paths:
      - 'registry/clusters/*/bundle.yaml'
  workflow_dispatch:
    inputs:
      cluster:
        description: The cluster to converge, as named under registry/clusters/
        required: true

permissions:
  contents: read

# One convergence at a time per box. Two overlapping hard syncs against one hub
# fight over the same Applications, and the loser reports a failure that is the
# other run's doing.
concurrency:
  group: bundle-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      clusters: ${{ steps.p.outputs.clusters }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Which cluster moved, and to what, read from the commit rather than from
      # an input -- the same reason bundle-preflight.yml reads its proposal from
      # the diff: a promotion is pushed by a command that passes nothing, and
      # restating what the commit already says is how the two drift apart.
      - name: Read what moved
        id: p
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_CLUSTER: ${{ inputs.cluster }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
              changed="registry/clusters/${DISPATCH_CLUSTER}/bundle.yaml"
              [ -f "$changed" ] || { echo "::error::no $changed in this repository"; exit 1; }
          else
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                  echo "::warning::no base commit to diff against; nothing was confirmed"
                  echo "clusters=[]" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              changed=$(git diff --name-only "$BEFORE" HEAD -- 'registry/clusters/*/bundle.yaml')
              count=$(printf '%s\n' "$changed" | grep -c . || true)
              if [ "$count" -eq 0 ]; then
                  echo "::notice::no cluster bundle changed in this push"
                  echo "clusters=[]" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
          fi

          # EVERY cluster the commit moved, not one. `kakt release promote`
          # rewrites the whole box in a single commit, so a box with more than
          # one cluster moves them together -- and each converges against its own
          # hub with its own credential, which is a job each rather than a choice
          # between them.
          clusters=""
          for f in $changed; do
              clusters="$clusters $(basename "$(dirname "$f")")"
          done
          entries=""
          for cluster in $clusters; do
              decl="registry/clusters/${cluster}/values.yaml"
              # The version the repository now names for this cluster. From
              # values.yaml, which is where the box records what it runs and what
              # `kakt release promote` rewrites.
              version=$(awk '/^environmentRevision:/ {print $2; exit}' "$decl")
              if [ -z "$version" ]; then
                  echo "::error::$decl declares no environmentRevision"
                  exit 1
              fi
              # A box pinned to "development" reads its platform content from a
              # branch and names no published version (ADR-068), so there is no
              # release to fetch a CLI from and nothing to converge to. It is
              # driven from a clone; this says so rather than failing on a
              # release tag that cannot exist.
              if [ "$version" = "development" ]; then
                  echo "::notice::$cluster pins development; it is driven from a clone, not from here"
                  continue
              fi
              # The name in the form a secret can be called, because a secret
              # name cannot be built inside a step's shell and still resolve.
              secret=$(printf '%s' "$cluster" | tr 'a-z-' 'A-Z_')
              entries="${entries}${entries:+,}{\"cluster\":\"${cluster}\",\"secret\":\"${secret}\",\"version\":\"${version}\"}"
              echo "::notice::$cluster is declared at $version"
          done
          echo "clusters=[${entries}]" >> "$GITHUB_OUTPUT"

  sync:
    needs: resolve
    if: needs.resolve.outputs.clusters != '[]'
    strategy:
      # One cluster at a time, and a failure stops the rest: a box whose first
      # cluster did not reach the version is not a box to drive the next one on.
      max-parallel: 1
      fail-fast: true
      matrix:
        box: ${{ fromJSON(needs.resolve.outputs.clusters) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CLI that carries the version being converged to, from the release
      # that published it -- not the one this repository was scaffolded with. The
      # question is whether the box reaches THIS version, and an older binary
      # drives an older shape (ADR-068).
      - name: Fetch the CLI for that version
        run: |
          set -euo pipefail
          gh release download "v${{ matrix.box.version }}" \
              --repo <PLATFORM_REPO_SLUG> --pattern 'kakt-linux-amd64' --output kakt
          chmod +x kakt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write the kubeconfig, if this repository holds one
        id: kc
        env:
          # Indexed rather than splatted: the secrets context cannot be expanded
          # into env wholesale, and a name built inside the shell would never be
          # resolved by the workflow.
          KUBECONFIG_VALUE: ${{ secrets[format('KUBECONFIG_{0}', matrix.box.secret)] }}
        run: |
          set -euo pipefail
          if [ -z "${KUBECONFIG_VALUE:-}" ]; then
              echo "held=no" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          # The runner's own private path, never the checkout: a kubeconfig
          # written into a working tree can be committed, uploaded as an
          # artifact, or picked up by a later step that had no business holding
          # cluster-admin. KAMARKAT_HOME is runner-local and discarded with the
          # job.
          kcdir="${KAMARKAT_HOME:-$HOME/.kamarkat}/run/kubeconfig"
          mkdir -p "$kcdir"
          kc="$kcdir/${{ matrix.box.cluster }}.kubeconfig"
          printf '%s' "$KUBECONFIG_VALUE" > "$kc"
          chmod 600 "$kc"
          echo "held=yes" >> "$GITHUB_OUTPUT"
          echo "path=$kc" >> "$GITHUB_OUTPUT"

      # Not verified is not converged, and this run says so rather than passing.
      # The box still reconciles on its own; what is missing is anyone finding
      # out when it does not.
      - name: Say that nothing was confirmed
        if: steps.kc.outputs.held != 'yes'
        run: |
          {
            echo "### ${{ matrix.box.cluster }} declared at ${{ matrix.box.version }}"
            echo
            echo "Your control plane will reconcile it. **Nothing here confirmed that it did.**"
            echo
            echo "This repository holds no \`KUBECONFIG_${{ matrix.box.secret }}\` secret, so this"
            echo "run cannot reach the cluster. Add one to have every promotion confirmed on the"
            echo "box, or confirm it yourself:"
            echo
            echo '```'
            echo "kakt verify --cluster ${{ matrix.box.cluster }} --timeout 15m"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Drive it, then confirm it. The sync asks the hub to reconcile now rather
      # than at its own next poll, and the verify is what decides the outcome of
      # this run: a sync that returns says the request was accepted, never that
      # the box arrived.
      - name: Converge the box on the declared version
        if: steps.kc.outputs.held == 'yes'
        run: |
          set -euo pipefail
          ./kakt reseed \
              --kubeconfig "${{ steps.kc.outputs.path }}" \
              --bundle-version "${{ matrix.box.version }}"
          ./kakt verify \
              --kubeconfig "${{ steps.kc.outputs.path }}" \
              --timeout 20m

      - name: Report what the box reached
        if: always() && steps.kc.outputs.held == 'yes'
        run: |
          {
            echo "### ${{ matrix.box.cluster }} -> ${{ matrix.box.version }}"
            echo
            echo "Outcome: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
