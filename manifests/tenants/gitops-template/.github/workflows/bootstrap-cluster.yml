# Bootstrap a cluster this repository declares.
#
# The work is done by the platform CLI at the version each cluster's bundle.yaml
# pins. This file resolves which cluster to build, fetches and verifies that
# release, runs its Day-0 command and keeps the record -- it holds no platform
# logic and no version of its own, so it does not go stale (ADR-072).
#
# Nothing here is pinned to a version, because the version is in git. This file
# used to call a reusable workflow at a ref substituted when the box was
# created: that ref never moved, so a box promoted to a later version still
# bootstrapped with the workflow of the version it was created on, and a fix to
# Day-0 could not reach it without someone editing this repository.
#
# It runs under this repository's own secrets, in this organisation's own
# runners. The platform holds neither (ADR-065).
#
# FIVE SECRETS, and the rest of this box's credentials are not here.
#
# Set these under Settings -> Secrets and variables -> Actions:
#
#   ESCROW_PROVIDER_URL, ESCROW_PROVIDER_PROJECT_ID,
#   ESCROW_PROVIDER_CLIENT_ID, ESCROW_PROVIDER_CLIENT_SECRET
#                   your escrow, on an Infisical you control. CI cannot read an
#                   escrow it cannot find, so these four say where it is -- and
#                   everything else this box is built with is read FROM there.
#
#   GITOPS_REPO_WRITE_TOKEN
#                   write access to this repository, so Day-0 can commit the
#                   artifacts it generates and ArgoCD can read them. It stays a
#                   GitHub secret because your own application builds read it
#                   from your organisation to pin a chart version here, and a
#                   build cannot reach an escrow.
#
# NOT HERE, AND DELIBERATELY. Each of these was once a secret on this repository.
# `kakt box init` escrows them under the box, and Day-0 reads them from the
# escrow:
#
#   the cloud credential         there is no HCLOUD_TOKEN to set. The credential
#                                that creates and destroys this box's
#                                infrastructure is escrowed, so a token that
#                                happens to be in an environment cannot
#                                authenticate perfectly and answer about someone
#                                else's provider project.
#   object storage for backups   there is no S3_ACCESS_KEY_ID or
#                                S3_SECRET_ACCESS_KEY. This file asked for both
#                                for months and forwarded neither, so a tenant
#                                who set them correctly got a Day-0 that refused
#                                for want of them.
#   your registry credential     there is no GHCR_USERNAME or GHCR_TOKEN.
#   where alerts page you        there is no GRAFANA_IRM_ALERTMANAGER_URL or
#                                GRAFANA_IRM_HEARTBEAT_URL (ADR-078 add.5 §5).
#   outbound mail                there is no IDENTITY_PROVIDER_SMTP_URL.
#   your tailnet key             there is no TS_AUTHKEY. On-premises nodes are a
#                                dev managed cluster's capacity (ADR-075), and
#                                that cluster's own declaration lists them.
#   the store administrator      there is no SECRET_STORE_ADMIN_EMAIL or
#                                SECRET_STORE_ADMIN_PASSWORD. It is generated at
#                                initialization and escrowed.
#
# The reason is the same for all of them: a GitHub secret cannot be read back, so
# a copy here can never be compared with the copy in use -- and a credential this
# file does not forward arrives as an empty string with nothing anywhere saying
# so. `kakt escrow enroll-*` rotates any of them; `kakt escrow verify` reports
# what the escrow holds.
#
name: Bootstrap cluster

on:
  push:
    branches: [main]
    # The declaration itself, which is what names the cluster and its shape.
    paths:
      - 'registry/clusters/*/values.yaml'
  workflow_dispatch:
    inputs:
      cluster:
        # No default. A box holds several clusters over its life and this
        # repository is created before any of them exists, so the one being
        # bootstrapped is named at dispatch rather than baked in at creation --
        # a default here was the first cluster's name forever, including on the
        # runs that replaced it.
        description: The cluster to bootstrap, as named under registry/clusters/
        required: true
      # AND NOTHING ELSE. A dispatch says WHICH cluster, never what it is made
      # of. This form also asked for provider, region, on-prem and tailnet --
      # two of them required -- and the resolver read every one of them from the
      # declaration and discarded the inputs. So an operator retyped four values
      # that could not take effect, and a dispatch could state a provider that
      # disagreed with git while appearing to have chosen it.

# GIT IS THE SOURCE OF TRUTH. Committing a management cluster's declaration to
# main is what builds it: this workflow resolves the cluster and its shape from
# the declaration itself, so what gets built is what the repository says, and
# there is no second place to state it.
#
# WHAT IT WILL NOT DO, because creating a cluster costs money and takes hours:
#
#   - It builds only a cluster this push ADDED. A commit that edits a cluster
#     already declared is reconciled by that cluster's own control plane, which
#     is where every change after Day-0 belongs.
#   - It builds only a cluster that Day-0 has no record of having started, or
#     one whose record says it stopped part way. That record is
#     .state/<cluster>.json, which Day-0 commits after every phase, and it is
#     the thing a re-run continues from.
#
#     NOT the generated/ directory, which is what this read before. Day-0
#     commits generated/ at adr045-commit -- after phase 11f, with boundary-04,
#     boundary-05, boundary-06, adr045-verify and finalize still to run -- so a
#     box that failed in any of those five was refused here as "already built"
#     with a fifth of the bootstrap never attempted, and the dispatch that
#     exists to continue it could not. It stays as the answer for a box that has
#     generated/ and NO state record: nothing can be resumed from, so a run
#     would start from phase 1 and provision a second set of servers.
#   - It builds only a MANAGEMENT cluster -- a declaration with no
#     environmentSlug. A managed cluster declares one, and is provisioned by the
#     management cluster reconciling it from git, not by a CI run.
#
# Each of those is a reason to do nothing, reported in the run rather than
# passing silently, so a push that was not meant to build says so.
#
# workflow_dispatch remains, for re-running a build that stopped part way -- which
# is resolved from .state/<cluster>.json above, so a failure in any phase can be
# continued -- and for replacing a management cluster whose declaration is already
# committed.
#
# Day-0 commits the artifacts it generates back into this repository, so the run
# needs write access to it.
#
# Declared here and not only in the workflow this calls. A called workflow's
# permissions may be the same or more restrictive than its caller's, never wider:
# a caller that declares none inherits this repository's default, and where that
# default is read-only the callee asking for `contents: write` exceeds it. GitHub
# rejects that before the job starts, as a `startup_failure` after a few seconds
# with no logs and no annotation naming the cause.
# ONE BOOTSTRAP AT A TIME FOR THIS BOX, which is what makes the one-management-
# cluster rule hold rather than merely be checked.
#
# `kakt bootstrap` asks the provider what this box already owns and then builds.
# Two dispatches that overlap can both read an empty inventory and both build, and
# no read-only check can prevent that by itself: the guarantee needs the two runs
# serialized, and this repository IS the box, so the repository is the scope.
#
# Queued rather than cancelled. A bootstrap is resumable, so a second dispatch of
# the SAME cluster waits and then continues the attempt already made; a dispatch
# of a DIFFERENT cluster waits and is then refused by admission, because by then
# the first run owns infrastructure. Cancelling instead would abandon a half-built
# control plane, which is the state that costs money and explains nothing.
concurrency:
  group: bootstrap-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # WHAT TO BUILD, READ FROM THE REPOSITORY. One job decides it for both events,
  # so a dispatch and a push build the same cluster the same way and there is no
  # second description of a cluster's shape to disagree with the declaration.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      clusters: ${{ steps.pick.outputs.clusters }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits, so a push can be diffed against what preceded it.
          fetch-depth: 2

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_CLUSTER: ${{ inputs.cluster }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
              # Named explicitly, and still read from the declaration below: the
              # dispatch says WHICH cluster, never what it is made of.
              candidates="$DISPATCH_CLUSTER"
          else
              # A push with no base establishes nothing, so it claims nothing.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                  echo "::warning::no base commit to diff against; nothing was resolved"
                  echo "clusters=[]" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              # ADDED, not modified. An edit to a cluster already declared is
              # reconciled by its own control plane.
              candidates=$(git diff --diff-filter=A --name-only "$BEFORE" HEAD -- \
                  'registry/clusters/*/values.yaml' \
                  | sed 's|/values.yaml$||' | sed 's|^registry/clusters/||' || true)
          fi

          CANDIDATES="$candidates" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re, sys, yaml

          # THE VERSION THIS CLUSTER PINS, from the platform chart's source and
          # only that. A cluster's bundle.yaml is a multi-source Application:
          # one source is the platform chart, another is THIS repository, whose
          # targetRevision names a branch. Taking the first match would read
          # "main" as a bundle version and fetch a CLI that does not exist.
          #
          # Anchored on the environment-manager chart line, the same anchoring
          # `kakt promote` uses when it rewrites these files -- and the CLI
          # re-reads it and refuses if the two disagree.
          PINNED = re.compile(r"chart:\s*environment-manager.*?targetRevision:\s*(\S+)", re.S)

          def pinned_version(name):
              bundle = pathlib.Path("registry/clusters") / name / "bundle.yaml"
              if not bundle.is_file():
                  return ""
              m = PINNED.search(bundle.read_text())
              return m.group(1).strip().strip("\"'") if m else ""

          picked, refused = [], []
          for name in os.environ["CANDIDATES"].split():
              decl = pathlib.Path("registry/clusters") / name / "values.yaml"
              if not decl.is_file():
                  refused.append(f"{name}: no declaration at {decl}")
                  continue
              values = yaml.safe_load(decl.read_text()) or {}
              # A managed cluster declares the workload environment it serves.
              # The management cluster has none, and that is the difference
              # between a cluster CI builds and one the hub provisions.
              if values.get("environmentSlug"):
                  refused.append(f"{name}: declares environmentSlug, so the management cluster provisions it")
                  continue
              # WHAT DAY-0 RECORDS ABOUT THIS CLUSTER, which is what decides
              # whether there is anything left to do.
              #
              # The state file is committed after every phase, so it exists for
              # any attempt that got past preflight and it names where that
              # attempt stopped. A record that reached `complete` is still sent
              # through: the CLI re-checks that phase's postconditions and
              # either refuses the run ("Cluster already bootstrapped") or
              # withdraws the records that do not hold and repairs them, and
              # refusing here would put that repair out of CI's reach -- the
              # same gap one phase later.
              record = pathlib.Path(".state") / f"{name}.json"
              phases, parsed = [], False
              if record.is_file():
                  try:
                      phases = (json.loads(record.read_text()) or {}).get("completedPhases") or []
                      parsed = True
                  except (ValueError, OSError) as exc:
                      # Unreadable is not absent. Falling through to "build it"
                      # on a corrupt record would start a box over from phase 1.
                      print(f"::error::{record} cannot be read ({exc}), so what this "
                            f"cluster has already done is unknown and it will not be built",
                            file=sys.stderr)
                      raise SystemExit(1)
              if not parsed and (pathlib.Path("registry/clusters") / name / "generated").is_dir():
                  refused.append(f"{name}: built (generated/ is present) with no "
                                 f"{record} to continue from, so a run would start from "
                                 f"phase 1 and provision a second set of servers")
                  continue
              if parsed and "complete" in phases:
                  print(f"::notice::{name}: recorded complete. Day-0 re-checks what each "
                        f"phase claims and either refuses this run or repairs only the "
                        f"claims that no longer hold", file=sys.stderr)
              elif parsed:
                  print(f"::notice::{name}: continuing an attempt that recorded "
                        f"{len(phases)} completed phase(s); Day-0 skips those and "
                        f"resumes at the first that is outstanding", file=sys.stderr)
              on_prem = (values.get("onPrem") or {})
              missing = [k for k in ("provider", "region") if not values.get(k)]
              if missing:
                  print(f"::error::{decl} declares no {' or '.join(missing)}, so this cluster cannot be built from git",
                        file=sys.stderr)
                  raise SystemExit(1)
              # NOT the worker count. It is declared in this same file and read
              # from there by Day-0, so resolving it here only to pass it back
              # was a second route to one value -- and the flag it became was
              # never accepted by the script that received it.
              version = pinned_version(name)
              if not version:
                  print(f"::error::registry/clusters/{name}/bundle.yaml pins no "
                        f"environment-manager version, so there is no release to build it with",
                        file=sys.stderr)
                  raise SystemExit(1)
              picked.append({
                  "cluster":  name,
                  "provider": str(values["provider"]),
                  "region":   str(values["region"]),
                  "on-prem":  bool(on_prem.get("enabled", False)),
                  "tailnet":  str(on_prem.get("tailnet") or ""),
                  # Read from git, never rendered into this file. The version a
                  # cluster is built with is the version it declares.
                  "version":  version,
              })

          for line in refused:
              print(f"::notice::not building {line}", file=sys.stderr)
          if not picked:
              print("::notice::nothing to build from this commit", file=sys.stderr)
          print("clusters=" + json.dumps(picked))
          PY
        # CANDIDATES is passed through the environment rather than interpolated
        # into the script, so a branch or cluster name cannot become shell.
        shell: bash

  bootstrap:
    needs: resolve
    if: needs.resolve.outputs.clusters != '[]'
    runs-on: ubuntu-24.04
    strategy:
      # One cluster at a time. Each build provisions servers, and a failure that
      # stops the others is the safer answer when the thing being created bills.
      max-parallel: 1
      fail-fast: true
      matrix:
        box: ${{ fromJSON(needs.resolve.outputs.clusters) }}
    steps:
      - uses: actions/checkout@v7

      # THE RELEASE THIS CLUSTER DECLARES, fetched and verified.
      #
      # The version comes from the cluster's own bundle.yaml, resolved above. It
      # is not written into this file: a rendered literal froze at the version
      # the box was created on, so a box promoted later still built with the old
      # one -- and the orchestration came from a reusable workflow pinned by ref,
      # which froze the same way and could not be updated without editing this
      # repository.
      #
      # Checksum first, then the binary's own account of itself. A release asset
      # that downloads and reports another version is not the release this
      # cluster declares.
      - name: Fetch the platform CLI this cluster declares
        env:
          VERSION: ${{ matrix.box.version }}
        run: |
          set -euo pipefail
          base="https://github.com/kamarkat/kamarkat/releases/download/v${VERSION}"
          # UNDER ITS PUBLISHED NAME, because that is the name the checksum file
          # uses. Saved as "kakt", every entry in SHA256SUMS named a file that
          # was not there, --ignore-missing ignored all four of them, and
          # sha256sum exited non-zero with "no file was verified" -- a
          # verification that checked nothing, reported as a checksum mismatch.
          asset="kakt-linux-amd64"
          if ! curl -fsSL --retry 3 --retry-connrefused -o "$asset" "${base}/${asset}"; then
            echo "::error::no ${asset} on release v${VERSION}"
            echo "::error::registry/clusters/${{ matrix.box.cluster }}/bundle.yaml pins"
            echo "::error::${VERSION}; a version with no published binary cannot build a cluster."
            exit 1
          fi
          if ! curl -fsSL --retry 3 -o SHA256SUMS "${base}/SHA256SUMS"; then
            echo "::error::release v${VERSION} publishes no SHA256SUMS; the download cannot be verified"
            exit 1
          fi
          # grep the asset's own line rather than trusting --ignore-missing to
          # have found something: a checksum file that does not mention this
          # asset would otherwise verify nothing and say so only in passing.
          grep -q " ${asset}\$" SHA256SUMS \
            || { echo "::error::SHA256SUMS for v${VERSION} does not list ${asset}"; exit 1; }
          grep " ${asset}\$" SHA256SUMS | sha256sum -c - \
            || { echo "::error::${asset} does not match the checksum published for v${VERSION}"; exit 1; }
          mv "$asset" kakt
          chmod +x kakt
          got="$(./kakt bundle-version)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the binary from v${VERSION} reports '${got}'"
            exit 1
          fi
          echo "kakt ${got}, verified against the release's checksum"

      # DAY-0, which is the released binary's own command.
      #
      # No platform checkout and no reusable workflow: the orchestration is
      # carried by the binary above and extracted from it, so what runs is what
      # that release contains and a file in this repository cannot stand in for
      # any of it (ADR-063, ADR-072).
      #
      # Re-running continues: the phase state lives under .state/ in this
      # repository, not in the job.
      - name: Build ${{ matrix.box.cluster }}
        env:
          # FIVE, and the escrow carries the rest.
          #
          # Day-0 reads this box's credentials from its escrow -- the cloud
          # token, the object-storage key, the registry credential, where alerts
          # page, outbound mail, the tailnet key. `kakt box init` enrolled them,
          # and nothing here has to name them one by one.
          #
          # That naming was the defect this replaces. Every credential had to be
          # listed in this block, and one the list omitted arrived as an empty
          # string with no warning anywhere: the object-storage pair was asked
          # for in this file's own header for months and forwarded by nothing,
          # so a tenant who set both secrets correctly got a Day-0 that refused
          # for want of them.
          GITOPS_REPO_WRITE_TOKEN: ${{ secrets.GITOPS_REPO_WRITE_TOKEN }}
          # Where this box's escrow is. Four values, and the only thing CI must
          # know before it can read everything else.
          ESCROW_PROVIDER_URL: ${{ secrets.ESCROW_PROVIDER_URL }}
          ESCROW_PROVIDER_PROJECT_ID: ${{ secrets.ESCROW_PROVIDER_PROJECT_ID }}
          ESCROW_PROVIDER_CLIENT_ID: ${{ secrets.ESCROW_PROVIDER_CLIENT_ID }}
          ESCROW_PROVIDER_CLIENT_SECRET: ${{ secrets.ESCROW_PROVIDER_CLIENT_SECRET }}
          # Test boxes only (ADR-117 G10): keep the dynamic-credential drill
          # identity. Unset on every other box, which Day-0 then retires.
          KAKT_CAPABILITY_DRILL: ${{ vars.KAKT_CAPABILITY_DRILL }}
        run: |
          set -euo pipefail
          ./kakt bootstrap --cluster "${{ matrix.box.cluster }}" --gitops-dir .

      # THE PHASE RECORDS, and deliberately not everything beside them.
      #
      # These say which phases ran, which gates passed and what was outstanding,
      # which is what a failed run needs read back. An artifact is downloadable
      # by anyone who can read this repository, so what goes into one is chosen
      # rather than swept up:
      #
      #   .state/logs/            NOT uploaded. Ten steps tee command output
      #                           there, and that output is not audited for the
      #                           tokens and kubeconfig contents it may quote.
      #                           It stays on the runner and in the workspace.
      #   .../generated/          NOT uploaded. This box's secret-store
      #                           coordinates and control-plane address. They are
      #                           the tenant's own and are committed to this
      #                           repository, so an artifact copy adds exposure
      #                           without adding information.
      #
      # The state that makes a re-run a continuation is in the repository either
      # way; this is for reading a failure, not for restoring one.
      - name: Keep the run's phase records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: day0-${{ matrix.box.cluster }}
          path: |
            .state/validation.json
            .state/bootstrap-mgmt.json
            .state/bootstrap-workload.json
            .state/${{ matrix.box.cluster }}.json
          if-no-files-found: ignore
          retention-days: 30
