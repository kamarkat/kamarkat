# Bootstrap a cluster this repository declares.
#
# The work is done by a workflow the platform maintains, pinned below to the
# bundle version this repository was scaffolded on. Pinned rather than tracking a
# branch: the execution logic is then fixed for this repository until someone
# here changes the pin, and a change to the platform's workflow cannot alter how
# this repository bootstraps without that decision being made (ADR-072).
#
# It runs under this repository's own secrets, in this organisation's own
# runners. The platform holds neither (ADR-065).
#
# Secrets this repository must hold. Set them under Settings -> Secrets and
# variables -> Actions.
#
# REQUIRED -- Day-0 refuses without them, rather than building a box that looks
# configured and is not:
#   HCLOUD_TOKEN    the cloud API token clusters are created with
#   GITOPS_REPO_WRITE_TOKEN
#                   write access to this repository, so Day-0 can commit the
#                   artifacts it generates for the cluster it creates, and so
#                   ArgoCD can read it. Your applications' builds inherit it
#                   from your organisation to pin a chart version here
#   GHCR_USERNAME   your container registry, for pulling YOUR private images.
#   GHCR_TOKEN      The platform's own images are public; your workloads are
#                   yours (ADR-066) and this is what runs them.
#   INFISICAL_ADMIN_EMAIL     the administrator of this box's own Infisical --
#   INFISICAL_ADMIN_PASSWORD  NOT the escrow's, which has no account here. The
#                             address is whoever scaffolded the box; the password
#                             is generated, escrowed as infisical-admin-credential
#                             and set here in one step, so a re-run reads back the
#                             one this instance was created with. No default: the
#                             one that existed was identical on every box.
#
# STRONGLY RECOMMENDED -- absent, the box bootstraps and runs, and says what it
# is missing:
#   INFISICAL_ESCROW_*   (4) where this box's master keys are kept. Without them,
#                        losing this cluster loses every secret it manages.
#   S3_ACCESS_KEY_ID     object storage for database backups. A production box
#   S3_SECRET_ACCESS_KEY without these has no backups.
#
# OPTIONAL -- where this box's alerts page you (ADR-078 add.5 §5): the IRM
# integration URL that critical and warning alerts go to, and the hub's IRM
# heartbeat, which pages when the hub stops reporting. Metrics, logs and
# dashboards run in the box and need no account.
#   GRAFANA_IRM_ALERTMANAGER_URL, GRAFANA_IRM_HEARTBEAT_URL
#
# OPTIONAL -- ZITADEL_SMTP_URL, this box's outbound mail: identity mail and
# alert email both send through it.
#
# TS_AUTHKEY is read only when this cluster accepts on-prem nodes (ADR-075).
name: Bootstrap cluster

on:
  push:
    branches: [main]
    # The declaration itself, which is what names the cluster and its shape.
    paths:
      - 'registry/clusters/*/values.yaml'
  workflow_dispatch:
    inputs:
      cluster:
        # No default. A box holds several clusters over its life and this
        # repository is created before any of them exists, so the one being
        # bootstrapped is named at dispatch rather than baked in at creation --
        # a default here was the first cluster's name forever, including on the
        # runs that replaced it.
        description: The cluster to bootstrap, as named under registry/clusters/
        required: true
      provider:
        required: true
        default: <CLOUD_PROVIDER>
      region:
        required: true
        default: <CLOUD_REGION>
      workers:
        description: Cloud worker nodes to provision. Defaults to this cluster's values.yaml.
        required: false
        default: '<WORKER_COUNT>'
      on-prem:
        description: Accept nodes on your own premises, joining over your tailnet.
        required: false
        type: boolean
        default: false
      tailnet:
        description: Your Tailscale tailnet, e.g. acme.ts.net. Required with on-prem.
        required: false
        default: ''

# GIT IS THE SOURCE OF TRUTH. Committing a management cluster's declaration to
# main is what builds it: this workflow resolves the cluster and its shape from
# the declaration itself, so what gets built is what the repository says, and
# there is no second place to state it.
#
# WHAT IT WILL NOT DO, because creating a cluster costs money and takes hours:
#
#   - It builds only a cluster this push ADDED. A commit that edits a cluster
#     already declared is reconciled by that cluster's own control plane, which
#     is where every change after Day-0 belongs.
#   - It builds only a cluster that has no generated/ directory. Day-0 writes
#     that directory, so its presence is the repository's own record that this
#     cluster has been built, and a re-added declaration does not bill twice.
#   - It builds only a MANAGEMENT cluster -- a declaration with no
#     environmentSlug. A managed cluster declares one, and is provisioned by the
#     management cluster reconciling it from git, not by a CI run.
#
# Each of those is a reason to do nothing, reported in the run rather than
# passing silently, so a push that was not meant to build says so.
#
# workflow_dispatch remains, for re-running a build that stopped part way and for
# replacing a management cluster whose declaration is already committed.
#
# Day-0 commits the artifacts it generates back into this repository, so the run
# needs write access to it.
#
# Declared here and not only in the workflow this calls. A called workflow's
# permissions may be the same or more restrictive than its caller's, never wider:
# a caller that declares none inherits this repository's default, and where that
# default is read-only the callee asking for `contents: write` exceeds it. GitHub
# rejects that before the job starts, as a `startup_failure` after a few seconds
# with no logs and no annotation naming the cause.
# ONE BOOTSTRAP AT A TIME FOR THIS BOX, which is what makes the one-management-
# cluster rule hold rather than merely be checked.
#
# `kakt bootstrap` asks the provider what this box already owns and then builds.
# Two dispatches that overlap can both read an empty inventory and both build, and
# no read-only check can prevent that by itself: the guarantee needs the two runs
# serialized, and this repository IS the box, so the repository is the scope.
#
# Queued rather than cancelled. A bootstrap is resumable, so a second dispatch of
# the SAME cluster waits and then continues the attempt already made; a dispatch
# of a DIFFERENT cluster waits and is then refused by admission, because by then
# the first run owns infrastructure. Cancelling instead would abandon a half-built
# control plane, which is the state that costs money and explains nothing.
concurrency:
  group: bootstrap-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # WHAT TO BUILD, READ FROM THE REPOSITORY. One job decides it for both events,
  # so a dispatch and a push build the same cluster the same way and there is no
  # second description of a cluster's shape to disagree with the declaration.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      clusters: ${{ steps.pick.outputs.clusters }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so a push can be diffed against what preceded it.
          fetch-depth: 2

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_CLUSTER: ${{ inputs.cluster }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
              # Named explicitly, and still read from the declaration below: the
              # dispatch says WHICH cluster, never what it is made of.
              candidates="$DISPATCH_CLUSTER"
          else
              # A push with no base establishes nothing, so it claims nothing.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                  echo "::warning::no base commit to diff against; nothing was resolved"
                  echo "clusters=[]" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              # ADDED, not modified. An edit to a cluster already declared is
              # reconciled by its own control plane.
              candidates=$(git diff --diff-filter=A --name-only "$BEFORE" HEAD -- \
                  'registry/clusters/*/values.yaml' \
                  | sed 's|/values.yaml$||' | sed 's|^registry/clusters/||' || true)
          fi

          CANDIDATES="$candidates" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys, yaml

          picked, refused = [], []
          for name in os.environ["CANDIDATES"].split():
              decl = pathlib.Path("registry/clusters") / name / "values.yaml"
              if not decl.is_file():
                  refused.append(f"{name}: no declaration at {decl}")
                  continue
              values = yaml.safe_load(decl.read_text()) or {}
              # A managed cluster declares the workload environment it serves.
              # The management cluster has none, and that is the difference
              # between a cluster CI builds and one the hub provisions.
              if values.get("environmentSlug"):
                  refused.append(f"{name}: declares environmentSlug, so the management cluster provisions it")
                  continue
              # Day-0's own record that this cluster exists.
              if (pathlib.Path("registry/clusters") / name / "generated").is_dir():
                  refused.append(f"{name}: already built (generated/ is present)")
                  continue
              on_prem = (values.get("onPrem") or {})
              missing = [k for k in ("provider", "region") if not values.get(k)]
              if missing:
                  print(f"::error::{decl} declares no {' or '.join(missing)}, so this cluster cannot be built from git",
                        file=sys.stderr)
                  raise SystemExit(1)
              picked.append({
                  "cluster":  name,
                  "provider": str(values["provider"]),
                  "region":   str(values["region"]),
                  # Day-0 sizes the cluster from this, and reads the declaration
                  # itself afterwards; absent means the chart's own default.
                  "workers":  "" if values.get("workers") is None else str(values["workers"]),
                  "on-prem":  bool(on_prem.get("enabled", False)),
                  "tailnet":  str(on_prem.get("tailnet") or ""),
              })

          for line in refused:
              print(f"::notice::not building {line}", file=sys.stderr)
          if not picked:
              print("::notice::nothing to build from this commit", file=sys.stderr)
          print("clusters=" + json.dumps(picked))
          PY
        # CANDIDATES is passed through the environment rather than interpolated
        # into the script, so a branch or cluster name cannot become shell.
        shell: bash

  bootstrap:
    needs: resolve
    if: needs.resolve.outputs.clusters != '[]'
    strategy:
      # One cluster at a time. Each build provisions servers, and a failure that
      # stops the others is the safer answer when the thing being created bills.
      max-parallel: 1
      fail-fast: true
      matrix:
        box: ${{ fromJSON(needs.resolve.outputs.clusters) }}
    uses: kamarkat/kamarkat/.github/workflows/tenant-bootstrap.yml@v<BUNDLE_VERSION>
    with:
      cluster: ${{ matrix.box.cluster }}
      provider: ${{ matrix.box.provider }}
      region: ${{ matrix.box.region }}
      bundle-version: <BUNDLE_VERSION>
      workers: ${{ matrix.box.workers }}
      on-prem: ${{ matrix.box.on-prem }}
      tailnet: ${{ matrix.box.tailnet }}
    secrets:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      GITOPS_REPO_WRITE_TOKEN: ${{ secrets.GITOPS_REPO_WRITE_TOKEN }}
      # The administrator of this box's own Infisical, set by the handover.
      INFISICAL_ADMIN_EMAIL: ${{ secrets.INFISICAL_ADMIN_EMAIL }}
      INFISICAL_ADMIN_PASSWORD: ${{ secrets.INFISICAL_ADMIN_PASSWORD }}
      # Read only when on-prem is enabled. Set it on this repository if this
      # cluster accepts nodes on your own premises: the control plane and those
      # nodes join your tailnet from this one key (ADR-046, ADR-075).
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      # The escrow, on an Infisical you control. It holds this box's master keys,
      # which cannot be kept inside the box they decrypt. Without these, losing
      # this cluster loses every secret the platform manages for it.
      INFISICAL_ESCROW_URL: ${{ secrets.INFISICAL_ESCROW_URL }}
      INFISICAL_ESCROW_PROJECT_ID: ${{ secrets.INFISICAL_ESCROW_PROJECT_ID }}
      INFISICAL_ESCROW_CLIENT_ID: ${{ secrets.INFISICAL_ESCROW_CLIENT_ID }}
      INFISICAL_ESCROW_CLIENT_SECRET: ${{ secrets.INFISICAL_ESCROW_CLIENT_SECRET }}
      # Your container registry, for pulling your OWN private images. Required:
      # the platform's images are public, but your workloads are yours (ADR-066)
      # and the pull secret built from these is what runs them.
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      # Object storage for database backups. Optional, and a production box
      # without it has no backups -- the bootstrap says so and continues.
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      # Where this box's alerts page you (ADR-078 add.5 §5). Optional: without
      # them alerts are emailed only, and nothing pages when the hub goes silent.
      GRAFANA_IRM_ALERTMANAGER_URL: ${{ secrets.GRAFANA_IRM_ALERTMANAGER_URL }}
      GRAFANA_IRM_HEARTBEAT_URL: ${{ secrets.GRAFANA_IRM_HEARTBEAT_URL }}
      # This box's outbound mail (smtps://user:key@host:port). Optional; without it
      # the issuer sends no verification or reset mail and alerts send no email.
      ZITADEL_SMTP_URL: ${{ secrets.ZITADEL_SMTP_URL }}
