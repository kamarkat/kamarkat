---
# The workload cluster this claim provisions.
#
# ONE FILE PER WORKLOAD CLUSTER, hydrated from this template into
# clusters/<name>/ and applied by the MANAGEMENT cluster's ArgoCD -- the layout
# kubefirst uses, where registry/clusters/WORKLOAD_CLUSTER_NAME/ holds the
# resource that creates that cluster. One repository, one management cluster,
# as many workload clusters as it declares.
#
# It lives here and not in the published bundle. The bundle shipped
# platform-spoke-pools-<env>-<provider> carrying the literal name
# spoke-pool-eu-<env>-01, so every box that ever pulled it provisioned a
# workload cluster under the same name, and every identity derived from that
# name collided across boxes -- the CNPG archive prefix most damagingly, where
# s3://spoke-pool-backups/<name>/ held a previous box's WALs and barman refused
# the next box's with "Expected empty archive", so no backup ever completed.
#
# It cannot be fixed by templating the packaged chart. templated-fields
# deliberately refuses to rewrite metadata.name, because "renaming an object by
# value makes the resource ArgoCD prunes depend on that value, so a change
# deletes and recreates rather than updates" -- and for a SpokePool that means
# destroying and reprovisioning a cluster. A workload cluster's name must be
# written once, by the tenant, and never computed at render time. That is what
# this template is.
#
# <CLUSTER_NAME> is what applications name to run here:
# validate-cluster-name-contract.sh records that the SpokePool composition
# derives metadata.labels.cluster-name from the claim name,
# so naming the claim names the cluster, and the application ApplicationSets
# select on it.
apiVersion: nutgraf.in/v1alpha1
kind: SpokePool
metadata:
  name: <CLUSTER_NAME>
  labels:
    spoke-type: pool
    environment: <ENVIRONMENT>
    provider: <CLOUD_PROVIDER>
  annotations:
    # Control-plane topology (patched into CAPI Cluster topology.controlPlane.replicas)
    control-plane-replicas: "1"
    # NODES ON YOUR OWN PREMISES, which this pool may admit when it serves dev.
    #
    # Your machines, joining this cluster over your tailnet, running the
    # workloads this cluster is for. They are worker capacity: they never carry
    # cluster-machinery state, so replacing one is a capacity operation
    # (ADR-014, ADR-075).
    #
    # DEV ONLY, and enforced rather than advised: hub-operator mints a join
    # token only for a pool whose environment label is dev, and says so in its
    # log when a pool asks for one and is not. A management cluster admits none
    # at all -- it runs on its cloud workers.
    #
    # LISTING A MACHINE IS THE DECISION. There is no enable flag: a cluster with
    # machines here admits them, one with an empty list runs on its cloud workers
    # (spec.nodePool.count below), and nothing is defaulted either way.
    #
    # Each entry is {"hostname":"...","tailnetHost":"...."}, and the tailnet is
    # read from those names rather than declared twice. Provision each machine
    # with scripts/hybrid/provision-flatcar-worker.sh --cluster spoke <this
    # cluster>; that script's home-lab.env is a second declaration of the same
    # hardware and nothing reconciles the two, so edit them together.
    home-workers: '[]'
    home-worker-ttl: "24h"
spec:
  # THE ONLY PROVIDER DECLARATION, and the tenant's whole say in the matter.
  #
  # There was a compositionSelector here naming the Crossplane composition's
  # labels. It was written for Crossplane v1, where an XR's machinery lived
  # directly under spec; v2 moved it to spec.crossplane for a cluster-scoped XR,
  # so the generated CRD stopped declaring the field and the API server pruned it
  # -- and ArgoCD, which builds a typed patch against that schema before it syncs,
  # refused the whole claim with ".spec.compositionSelector: field not declared in
  # schema". That is where nutgraf-stg-01 stopped on 2026-11-22.
  #
  # It is not moved, it is gone. Which composition builds a cluster is the
  # platform's to decide: hub-operator resolves this provider through its
  # registry and injects spec.crossplane.compositionRef at admission, and the XRD
  # refuses a SpokePool that arrives without one.
  provider: <CLOUD_PROVIDER>
  region: <CLOUD_REGION>
  nodePool:
    count: <WORKER_COUNT>
    instanceType: cx33
  maxTenantCapacity: 20
