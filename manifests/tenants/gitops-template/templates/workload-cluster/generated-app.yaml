# Day-0 artifacts for <CLUSTER_NAME>, applied by this cluster's own control plane.
#
# ADR-045 calls these bootstrap-generated artifacts: facts that do not exist
# until Day-0 runs -- Infisical coordinates, the control-plane address, trust
# material. ADR-062 makes them instance data, so they live in this repository
# rather than the platform's, and ADR-072 permits Day-0 to commit them here.
#
# They are applied by a separate Application rather than folded into values.yaml
# for two reasons. values.yaml is the tenant's file and the platform does not
# write it; these the platform's Day-0 does write. And they are whole Kubernetes
# objects rather than chart inputs, so a chart value would be the wrong shape for
# them even if the ownership were the same.
#
# The directory is empty until Day-0 populates it, and ships with a .gitkeep so
# that it EXISTS from the moment this Application does: an Application over an
# empty directory syncs nothing and reports healthy -- the one place in this
# platform where that state is not a defect -- but an Application over a path git
# does not carry is a ComparisonError, which is not that state at all.
#
# THIS FILE IS HYDRATED INTO THE MANAGEMENT CLUSTER'S DIRECTORY, like
# infrastructure-app.yaml beside it, as <CLUSTER_NAME>-generated.yaml. It has to
# be: the management cluster's root Application applies clusters/<mgmt>/ with
# recurse: false, and nothing applies clusters/<CLUSTER_NAME>/ at all. Left in
# this cluster's own directory -- where it was -- the Application was never
# created on any box, so every artifact Day-0 wrote into generated/ was in git and
# applied to nothing.
#
# It is the management cluster's ArgoCD that holds it, and the workload cluster
# that it is addressed to, which is the same split infrastructure-app.yaml
# describes: the object lives where the controller is, the destination names where
# the content goes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <CLUSTER_NAME>-generated
  namespace: platform-ops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: registry/clusters/<CLUSTER_NAME>/generated
    directory:
      recurse: true
      # An empty directory is the state before Day-0 writes, not an error.
      include: '*.yaml'
  # The WORKLOAD cluster, for the same reason as bundle.yaml beside it: these are
  # this cluster's Day-0 artifacts and they belong on this cluster, not on the
  # management cluster whose ArgoCD holds the Application.
  destination:
    name: <CLUSTER_NAME>
    namespace: platform-ops
  syncPolicy:
    automated:
      # prune is OFF for the same reason as the control plane's: this directory
      # can hold a CAPI Cluster, and pruning one destroys the machines it
      # describes. A stale generated artifact is the cheaper failure.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
