---
# Cilium CNI Addon — Hybrid Provider (ADR-046 §13 Flatcar-native)
# Flatcar home worker runs native Linux cgroups v2 + eBPF over the tailnet.
#
# Deliberate deltas vs. cilium-addon-template (hetzner clean base):
#   1. routing-mode: tunnel / tunnel-protocol: vxlan (ADR-046 §14). Cross-node
#      pod traffic is VXLAN-encapsulated between node tailnet IPs, so pod IPs
#      never reach the wire and Tailscale needs no podCIDR routes. Native
#      routing was tried and abandoned: it required subnet-route advertisement,
#      whose table-52 entries shadowed Cilium's own routes (§17.1).
#   2. devices: eth+ enp+ tailscale0. `direct-routing-device` and
#      `auto-direct-node-routes` are unset — they are native-routing settings
#      and must NOT be re-enabled (§14, §17.1).
#   3. mtu: 1200 — 1200 inner + 50B VXLAN = 1250B, inside tailscale0's 1280
#      (§6, §14). Anything larger fragments and the BPF datapath drops it.
#   4. Standard mount-cgroup init (native cgroup v2) — the legacy
#      fix-cgroup-mount / host-cgroup no-op hacks are removed.
#   5. Gateway API in hostNetwork mode on the control plane, with the
#      cilium-hostnetwork-mangle-guard DaemonSet that keeps Cilium's transparent
#      socket filter from diverting LB traffic into table 2004 (§8, §15).
#
# The settings above live in manifests/providers/hybrid/k8s/cilium-config-base.yaml,
# not in this file — see the ownership note below.
#
# Cilium v1.17.18 — Gateway-API secrets sync (enable-gateway-api-secrets-sync)
# delivers the waypoint TLS secret to Envoy SDS. See ADR-049.
# Envoy decoupled (ADR-046 addendum 10): standalone cilium-envoy DaemonSet.
#
# NOTE: cilium-ca / hubble-server-certs are the ORIGINAL bootstrap-issued certs
# (rotated exactly once, see ADR-046). Do NOT re-render this manifest through
# helm with certgen enabled — it regenerates these secrets and rotates the CA.
#
# ─── cilium-config is NOT in this payload (ADR-046 §24, ADR-048) ────────────
# The delivered `cilium-config` ConfigMap is rendered per-spoke by hub-operator,
# because `k8s-service-host`/`k8s-service-port` are the spoke's control-plane
# endpoint and are unknown until CAPH has created its load balancer. Shipping a
# static copy here as well would give the object two owners; the settings live in
# manifests/providers/hybrid/k8s/cilium-config-base.yaml and hub-operator is the single renderer.
#
# Without those two keys Cilium falls back to the in-cluster ClusterIP
# (10.96.0.1), which nothing can route on a fresh spoke: the ClusterClass deletes
# kube-proxy at init (§addendum 1) and Cilium — the intended replacement — cannot
# start until it reaches the API. That deadlock is what §24 records.

apiVersion: v1
kind: Secret
metadata:
  name: cilium-addon-hybrid
  namespace: platform-capi
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/component: cni
    app.kubernetes.io/part-of: cluster-bios
    platform.soloz.io/provider: hybrid
type: addons.cluster.x-k8s.io/resource-set
stringData:
  # Gateway API CRDs travel WITH Cilium, ordered ahead of it.
  #
  # This addon is what the HYBRID spoke's ClusterResourceSet actually
  # references (Secret/cilium-addon-hybrid); spoke-bootstrap/cilium-addon-template
  # serves the hetzner spokes. Both need the CRDs — the Cilium operator runs with
  # enable-gateway-api=true and its init container blocks until they exist, so the
  # node never reaches Ready. ArgoCD cannot deliver them: the spoke-catalog AppSet
  # matches REGISTERED spokes, and a spoke cannot register while its node is down.
  #
  # Keyed 00- so it applies before cilium.yaml. Standard channel, pinned v1.5.1
  # (Cilium v1.17.x pairs with Gateway API v1.5.x). Source of truth is
  # internal/assets/manifests/addons/gateway-api-crds.yaml — keep every copy in
  # step, and re-check the 1 MiB CRS Secret budget on any bump.
