# Cilium agent configuration — the STATIC half.
#
# ADR-046 §24 / ADR-048: the delivered `cilium-config` ConfigMap is rendered
# per-spoke by hub-operator, because two of its keys (`k8s-service-host` and
# `k8s-service-port`) are the spoke's control-plane endpoint and are unknown
# until CAPH has created the load balancer. This file is the provider-owned
# static base that renderer reads; it is NEVER delivered to a spoke.
#
# There is exactly one owner of the ConfigMap that reaches a spoke: hub-operator.
# The cilium addon Secret deliberately no longer carries a `cilium-config`
# document — see the note at the top of
# manifests/spoke/spoke-bootstrap/cilium-addon-template.yaml.
#
# Editing cilium settings: change them HERE. The addon Secret carries the
# DaemonSet, RBAC and Services only.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-config-base-hetzner
  namespace: platform-capi
  labels:
    platform.nutgraf.in/cilium-config-base: hetzner
data:
  identity-allocation-mode: crd
  identity-heartbeat-timeout: 30m0s
  identity-gc-interval: 15m0s
  cilium-endpoint-gc-interval: 5m0s
  nodes-gc-interval: 5m0s
  debug: 'false'
  debug-verbose: ''
  enable-policy: default
  policy-cidr-match-mode: ''
  proxy-prometheus-port: '9964'
  operator-prometheus-serve-addr: :9963
  enable-metrics: 'true'
  enable-envoy-config: 'true'
  envoy-config-retry-interval: 15s
  enable-gateway-api: 'true'
  enable-gateway-api-secrets-sync: 'true'
  enable-gateway-api-proxy-protocol: 'false'
  # Honour a backend Service's appProtocol (GEP-1911). Without it the Gateway's
  # Envoy speaks HTTP/1.1 to every backend, whatever the Service declares, so a
  # gRPC backend (zitadel: appProtocol kubernetes.io/h2c) receives the native
  # gRPC that Envoy's grpc_web filter produces over HTTP/1.1, does not treat it
  # as gRPC, and answers it as REST: 404 with no gRPC trailers. Browsers then
  # report "[Unknown] missing trailer" from the Zitadel console (2026-10-05).
  # Only Services that declare an appProtocol are affected.
  enable-gateway-api-app-protocol: 'true'
  enable-gateway-api-alpn: 'false'
  gateway-api-xff-num-trusted-hops: '0'
  gateway-api-service-externaltrafficpolicy: Cluster
  gateway-api-secrets-namespace: cilium-secrets
  gateway-api-hostnetwork-enabled: 'true'
  gateway-api-hostnetwork-nodelabelselector: node-role.kubernetes.io/control-plane=
  enable-policy-secrets-sync: 'true'
  policy-secrets-only-from-secrets-namespace: 'true'
  policy-secrets-namespace: cilium-secrets
  enable-ipv4: 'true'
  enable-ipv6: 'false'
  clean-cilium-state: 'false'
  clean-cilium-bpf-state: 'false'
  custom-cni-conf: 'false'
  enable-bpf-clock-probe: 'false'
  monitor-aggregation: medium
  monitor-aggregation-interval: 5s
  monitor-aggregation-flags: all
  bpf-map-dynamic-size-ratio: '0.0025'
  bpf-policy-map-max: '16384'
  bpf-lb-map-max: '65536'
  bpf-lb-external-clusterip: 'false'
  bpf-lb-source-range-all-types: 'false'
  bpf-lb-algorithm-annotation: 'false'
  bpf-lb-mode-annotation: 'false'
  bpf-distributed-lru: 'false'
  bpf-events-drop-enabled: 'true'
  bpf-events-policy-verdict-enabled: 'true'
  bpf-events-trace-enabled: 'true'
  preallocate-bpf-maps: 'false'
  cluster-name: default
  cluster-id: '0'
  routing-mode: tunnel
  tunnel-protocol: vxlan
  tunnel-source-port-range: 0-0
  service-no-backend-response: reject
  # 1200, not Cilium's stock 1230, on every box regardless of provider (ADR-075).
  #
  # 1230 + 50B VXLAN is a 1280-byte outer packet -- exactly tailscale0's MTU, with
  # zero headroom, which is what ADR-046 §6 recorded before dropping to 1200 for
  # the hybrid cell. 1200 gives 1250 and fits strictly inside.
  #
  # It is set here even where no node reaches the tailnet today, because MTU is the
  # one datapath setting that cannot change on a live cluster without restarting
  # every agent. Fixing it at the value that works everywhere is what lets a tenant
  # enable on-prem nodes later without a maintenance window; the cost is ~2.4% of
  # payload on a box that never does.
  mtu: '1200'
  enable-l7-proxy: 'true'
  enable-ipv4-masquerade: 'true'
  enable-ipv4-big-tcp: 'false'
  enable-ipv6-big-tcp: 'false'
  enable-ipv6-masquerade: 'true'
  enable-tcx: 'true'
  datapath-mode: veth
  enable-masquerade-to-route-source: 'false'
  enable-xt-socket-fallback: 'true'
  install-no-conntrack-iptables-rules: 'false'
  iptables-random-fully: 'false'
  auto-direct-node-routes: 'false'
  direct-routing-skip-unreachable: 'false'
  # Required by NodeLocal DNSCache (manifests/hub-core-services/dns/coredns-nodelocal.yaml).
  #
  # With kube-proxy-replacement on, the socket load balancer rewrites a ClusterIP
  # inside connect(), before a packet exists, so a node-local listener bound to the
  # kube-dns ClusterIP is never consulted. A CiliumLocalRedirectPolicy is the only
  # way to put a per-node backend in that path — and with this flag false the policy
  # is accepted and silently does nothing, leaving every pod's DNS on the
  # node-to-node overlay while the cache reports Ready and its Application Healthy.
  #
  # An ADR-046 datapath invariant for that reason: the failure it prevents is
  # intermittent EAI_AGAIN with no error naming a cause.
  enable-local-redirect-policy: 'true'
  # Named rather than detected, and tailscale0 is listed whether or not it exists
  # (ADR-075). A wildcard that matches nothing costs nothing, and an agent will not
  # use an interface that appeared after it started -- so a box that gains an
  # on-prem node later would otherwise need every agent restarted to see it.
  devices: eth+ enp+ tailscale0
  kube-proxy-replacement: 'true'
  kube-proxy-replacement-healthz-bind-address: ''
  bpf-lb-sock: 'false'
  nodeport-addresses: ''
  enable-health-check-nodeport: 'true'
  enable-health-check-loadbalancer-ip: 'false'
  node-port-bind-protection: 'true'
  enable-auto-protect-node-port-range: 'true'
  bpf-lb-acceleration: disabled
  enable-experimental-lb: 'false'
  enable-svc-source-range-check: 'true'
  enable-l2-neigh-discovery: 'true'
  arping-refresh-period: 30s
  k8s-require-ipv4-pod-cidr: 'false'
  k8s-require-ipv6-pod-cidr: 'false'
  enable-k8s-networkpolicy: 'true'
  enable-endpoint-lockdown-on-policy-overflow: 'false'
  write-cni-conf-when-ready: /host/etc/cni/net.d/05-cilium.conflist
  cni-exclusive: 'true'
  cni-log-file: /var/run/cilium/cilium-cni.log
  enable-endpoint-health-checking: 'true'
  enable-health-checking: 'true'
  health-check-icmp-failure-threshold: '3'
  enable-well-known-identities: 'false'
  enable-node-selector-labels: 'false'
  synchronize-k8s-nodes: 'true'
  operator-api-serve-addr: 127.0.0.1:9234
  enable-hubble: 'true'
  hubble-socket-path: /var/run/cilium/hubble.sock
  hubble-export-file-max-size-mb: '10'
  hubble-export-file-max-backups: '5'
  hubble-listen-address: :4244
  hubble-disable-tls: 'false'
  hubble-tls-cert-file: /var/lib/cilium/tls/hubble/server.crt
  hubble-tls-key-file: /var/lib/cilium/tls/hubble/server.key
  hubble-tls-client-ca-files: /var/lib/cilium/tls/hubble/client-ca.crt
  ipam: kubernetes
  ipam-cilium-node-update-rate: 15s
  default-lb-service-ipam: lbipam
  egress-gateway-reconciliation-trigger-interval: 1s
  enable-vtep: 'false'
  vtep-endpoint: ''
  vtep-cidr: ''
  vtep-mask: ''
  vtep-mac: ''
  enable-pmtu-discovery: 'true'
  procfs: /host/proc
  bpf-root: /sys/fs/bpf
  cgroup-root: /run/cilium/cgroupv2
  enable-k8s-terminating-endpoint: 'true'
  enable-sctp: 'false'
  remove-cilium-node-taints: 'true'
  set-cilium-node-taints: 'true'
  set-cilium-is-up-condition: 'true'
  # SECONDS WITH A UNIT, because the workloads delivered beside this config are
  # Cilium v1.20.4 (manifests/spoke/spoke-bootstrap/cilium-addon-template.yaml,
  # which is what HetznerDriver.CiliumAddonPath returns) and v1.20 parses this
  # field as a duration. Its chart renders `printf "%ds"` for exactly that
  # reason; v1.17's rendered a bare `"15"`, which is where this value came from.
  #
  # A bare 15 is fatal, not ignored: cilium-operator exits on boot with
  # `failed to unmarshal config struct unmanagedpods.Config: error decoding
  # 'UnmanagedPodWatcherInterval': time: missing unit in duration "15"`. The
  # agent still starts and the nodes still report Ready, so the cluster looks
  # built -- but with no operator there is no IPAM, every pod that is not
  # hostNetwork sits in ContainerCreating, and the first thing to need one was
  # ArgoCD's pre-install hook: 25 minutes of `Job in progress`, then a helm
  # timeout that named neither Cilium nor this line.
  unmanaged-pod-watcher-interval: '15s'
  dnsproxy-enable-transparent-mode: 'true'
  dnsproxy-socket-linger-timeout: '10'
  tofqdns-dns-reject-response-code: refused
  tofqdns-enable-dns-compression: 'true'
  tofqdns-endpoint-max-ip-per-hostname: '1000'
  tofqdns-idle-connection-grace-period: 0s
  tofqdns-max-deferred-connection-deletes: '10000'
  tofqdns-proxy-response-max-delay: 100ms
  agent-not-ready-taint-key: node.cilium.io/agent-not-ready
  mesh-auth-enabled: 'true'
  mesh-auth-queue-size: '1024'
  mesh-auth-rotated-identities-queue-size: '1024'
  mesh-auth-gc-interval: 5m0s
  proxy-xff-num-trusted-hops-ingress: '0'
  proxy-xff-num-trusted-hops-egress: '0'
  proxy-connect-timeout: '2'
  proxy-initial-fetch-timeout: '30'
  proxy-max-requests-per-connection: '0'
  proxy-max-connection-duration-seconds: '0'
  proxy-idle-timeout-seconds: '60'
  proxy-max-concurrent-retries: '128'
  http-retry-count: '3'
  external-envoy-proxy: 'false'
  envoy-base-id: '0'
  envoy-access-log-buffer-size: '4096'
  envoy-keep-cap-netbindservice: 'true'
  max-connected-clusters: '255'
  clustermesh-enable-endpoint-sync: 'false'
  clustermesh-enable-mcs-api: 'false'
  nat-map-stats-entries: '32'
  nat-map-stats-interval: 30s
  enable-internal-traffic-policy: 'true'
  enable-lb-ipam: 'true'
  enable-non-default-deny-policies: 'true'
  enable-source-ip-verification: 'true'
