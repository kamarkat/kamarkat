# THE BASELINE. One generation of each template, and no version suffixes.
#
# A KubeadmControlPlaneTemplate, KubeadmConfigTemplate or HetznerClusterTemplate
# has an immutable spec.template.spec: the webhook refuses an edit and says
# "create new resource instead" (ADR-046). The answer had been a version suffix
# per change -- control-plane v1..v5, worker and burst bootstrap v1..v7, cluster
# v1..v3 -- with the ClusterClass repointed at the newest and the older ones left
# DECLARED here, because a Cluster still referenced them until its roll finished.
#
# They were never removed afterwards. Twenty-three documents for seven live
# templates, and ArgoCD managed all of them -- so a change applied across this
# file still edited the superseded ones, and on a generation that already exists
# on a box with an older spec that edit is refused.
#
# rc.191 is what that costs. It raised Kubernetes 1.31.6 -> 1.35.10 at every
# KUBERNETES_VERSION here, control-plane v4 among them. The webhook denied the
# server-side dry-run, which ArgoCD reports as ComparisonError rather than a sync
# failure: it cannot diff the Application at all, so the Application never
# reaches Synced, the release never converges, and waiting does not help.
#
# Collapsed to a baseline because there is no tenant to roll: every template here
# is the newest generation's content, under its name without the suffix. The two
# ClusterClass names keep their v1 -- spokepool-v1 is named by both SpokePool
# compositions and driver_hybrid.go, hetzner-mgmt-ubuntu-v1 by six Go and config
# files -- so the baseline is v1 of the class, carrying unversioned templates.
#
# IMMUTABILITY DID NOT GO AWAY. The next change to any spec below still needs a
# new object, and on a box with tenants that still means a new name and a roll.
# What changed is the starting point and the rule that follows it: when a
# generation is superseded, DELETE IT IN THE SAME CHANGE. Every template defined
# here is referenced by the ClusterClass, and every reference resolves -- that is
# checkable, and it is what stops this file growing a second chain.
#
# The history of each template is kept in its own section header below. Those
# notes are why the content is what it is -- the drop-in that stops a worker
# joining, the LB port that cannot be 443, the SSH key that survives a dead API
# server -- and they are evidence, not changelog.
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: spokepool-v1
  namespace: platform-capi
# EVERY FIELD CAPI DEFAULTS IS DECLARED HERE, and that is not tidiness.
#
# The webhook adds `namespace` to each ref and an empty `metadata` to the
# control plane, each machineDeployment template and each variable. Those were
# previously left out and suppressed with ignoreDifferences instead. This
# Application syncs with RespectIgnoreDifferences=true, which means the ignored
# paths are taken from the LIVE object and folded into what is applied -- and for
# a path inside a LIST, what is carried over is the live list element, not the
# one field. `machineDeployments` is an atomic list in a CRD, so the live entry
# replaced the rendered one wholesale and the bootstrap ref never moved: rc.186
# applied a new control-plane template and left both worker bootstraps on their
# previous generation, reported "successfully synced (all tasks run)", and sat
# OutOfSync on exactly those two fields. Every new worker and burst node would
# have kept booting the superseded bootstrap -- the containerd and runc pins of
# 55cc83cf silently absent. (That is also why the version suffixes are gone: see
# the note at the top of this file.)
#
# Declaring the defaults removes the diff, so nothing needs ignoring and no live
# value is ever substituted into what is applied. A field CAPI starts or stops
# defaulting is then a visible diff here, which is the correct place to see it.
spec:
  controlPlane:
    metadata: {}
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: spokepool-control-plane
      namespace: platform-capi
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: spokepool-control-plane-machine
        namespace: platform-capi
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: spokepool-cluster
      namespace: platform-capi
  workers:
    machineDeployments:
    - class: default-worker
      template:
        metadata: {}
        bootstrap:
          ref:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: KubeadmConfigTemplate
            name: spokepool-worker-bootstrap
            namespace: platform-capi
        infrastructure:
          ref:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            name: spokepool-worker-machine
            namespace: platform-capi
    # ADR-052: the elastic tenant-execution pool. A SEPARATE class, not a
    # modification of default-worker.
    #
    # default-worker is shared: on a pure-hetzner spoke those nodes are the
    # general worker pool and carry workload-location=hetzner themselves.
    # Tainting that class to reserve it for burst work would make every
    # workload on a pure-hetzner spoke unschedulable. The two pools are
    # distinguished by workload CLASS, which is why the taint is keyed on
    # workload-class and not on location.
    - class: burst-worker
      template:
        metadata: {}
        bootstrap:
          ref:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: KubeadmConfigTemplate
            name: spokepool-burst-bootstrap
            namespace: platform-capi
        infrastructure:
          ref:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            name: spokepool-burst-machine
            namespace: platform-capi
  patches:
  - name: region
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/controlPlaneRegions
        valueFrom:
          template: '[{{ .region | quote }}]'
      - op: add
        path: /spec/template/spec/controlPlaneLoadBalancer/region
        valueFrom:
          variable: region
      - op: add
        path: /spec/template/spec/hcloudNetwork/networkZone
        valueFrom:
          template: '{{ if eq .region "hel1" }}eu-central{{ else if eq .region "nbg1" }}eu-central{{ else }}eu-central{{ end }}'
  - name: controlPlaneEndpoint
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/controlPlaneLoadBalancer/enabled
        valueFrom:
          variable: controlPlaneLoadBalancerEnabled
      - op: replace
        path: /spec/template/spec/controlPlaneEndpoint/host
        valueFrom:
          variable: controlPlaneEndpointHost
  - name: controlPlaneMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: controlPlaneMachineType
  - name: workerMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: workerMachineType
  # Mirrors the hub class (hetzner-mgmt-ubuntu-v1.yaml). The spoke templates
  # carried the key name as a LITERAL with no patch over it, so whatever string
  # sat in the template was what shipped — and on 2026-09-02 that was
  # zero-ops-mac-mini-debug, which does not exist in the Hetzner project. Every
  # spoke control-plane server failed with SSHKeyNotFound, so no CP was created,
  # the cluster never reached ControlPlaneInitialized, and SpokePool readiness
  # timed out after 49m with nothing naming the key as the cause.
  #
  # The hub carried the identical bad literal and was unaffected, because this
  # patch overwrote it before it reached the API. That asymmetry is the whole
  # bug: one class renders through a variable, the other shipped raw text.
  - name: sshKeyName
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/sshKeys/hcloud/0/name
        valueFrom:
          variable: hcloudSSHKeyName
  # The at-rest encryption provider configuration, appended here rather than
  # written into the control-plane template, because its Secret name has to carry
  # THIS cluster's name.
  #
  # WHY A PATCH AND NOT A LITERAL. A ClusterClass is shared by every cluster of its
  # class, so a Secret named in a template is one object serving all of them. v2
  # named `secret-encryption-config` in platform-capi and that is exactly what
  # happened: one key for N clusters, where the first rotation makes every other
  # cluster's etcd undecryptable. The key is per cluster by ADR-100 and per cluster
  # in the escrow by ADR-076, so its delivery object has to be per cluster too.
  #
  # WHY APPEND AND NOT REPLACE. A JSON patch that edits a file already in the list
  # needs an index, `/files/0/contentFrom/secret/name`. Indices are positional: the
  # day someone inserts a file above it, the patch rewrites that file's Secret
  # reference instead and the enc.yaml entry keeps the shared name. Appending owns
  # the whole entry and has no index to be wrong about.
  #
  # NOTHING RECONCILES THE SECRET ITSELF. It is written once by
  # `kakt encryption enable` from the key in this cluster's escrow. A value that
  # must not change under a running control plane has no business being reasserted
  # on a timer, which is why the ExternalSecret that used to do it was removed.
  - name: secretEncryptionConfig
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta1
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/files/-
        valueFrom:
          # 0600 and root: it is the key to every Secret in the cluster, and the API
          # server reads it as root before any workload exists.
          template: |
            {
              "path": "/etc/kubernetes/enc/enc.yaml",
              "owner": "root",
              "permissions": "0600",
              "contentFrom": {
                "secret": {
                  "name": "{{ .builtin.cluster.name }}-encryption-config",
                  "key": "enc.yaml"
                }
              }
            }
  # Kubernetes package versions are DERIVED, never declared.
  #
  # CAPI owns the version. Cluster.spec.topology.version flows to the control
  # plane and to each MachineDeployment, and kubeadm is told to join as that
  # version -- so the apt packages a node installs have to come from the same
  # authority. They were literals in the templates until 2026-11-05, drifted to
  # 1.35.10 against a v1.31.6 cluster, and produced a control-plane node that
  # installed kubelet 1.35.10 and could never join.
  #
  # Control plane and workers are patched SEPARATELY, from DIFFERENT builtins.
  # builtin.cluster.topology.version is deliberately used for neither: CAPI rolls
  # the control plane before the MachineDeployments, so during an upgrade the
  # effective versions differ by design, and the cluster-wide value is wrong for
  # whichever has not moved yet.
  #
  # Only the raw version is written. The templates strip the leading v and trim
  # the minor in shell, so this needs nothing from the template engine but
  # substitution.
  - name: controlPlaneKubernetesVersion
    description: Write the Kubernetes version the control plane is reconciled to.
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta1
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/files/-
        valueFrom:
          template: |
            {
              "path": "/etc/kubernetes/k8s-version",
              "owner": "root",
              "permissions": "0644",
              "content": "{{ .builtin.controlPlane.version }}"
            }
  - name: workerKubernetesVersion
    description: Write the Kubernetes version each MachineDeployment is reconciled to.
    definitions:
    - selector:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
        kind: KubeadmConfigTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
            - burst-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/files/-
        valueFrom:
          template: |
            {
              "path": "/etc/kubernetes/k8s-version",
              "owner": "root",
              "permissions": "0644",
              "content": "{{ .builtin.machineDeployment.version }}"
            }
  variables:
  - name: region
    required: true
    metadata: {}
    schema:
      openAPIV3Schema:
        type: string
        default: "hel1"
  - name: workerMachineType
    required: false
    metadata: {}
    schema:
      openAPIV3Schema:
        type: string
        default: "cx33"
  - name: controlPlaneMachineType
    required: false
    metadata: {}
    schema:
      openAPIV3Schema:
        type: string
        default: "cx33"
  - name: controlPlaneLoadBalancerEnabled
    required: false
    metadata: {}
    schema:
      openAPIV3Schema:
        type: boolean
        default: true
  - name: controlPlaneEndpointHost
    required: false
    metadata: {}
    schema:
      openAPIV3Schema:
        type: string
        default: ""
  # Same name and default as the hub's variable, so the two classes cannot
  # drift. mac-mini-ssh is the key that actually exists in the project — the hub
  # has provisioned against it throughout. An attached key is not an open door:
  # Hetzner installs only the public half for root and password auth is off, but
  # it is the one channel that survives a control-plane failure, which is when
  # it is needed (the reason 1bfa9d3f added a key here in the first place).
  - name: hcloudSSHKeyName
    required: false
    metadata: {}
    schema:
      openAPIV3Schema:
        type: string
        default: "mac-mini-ssh"
---
# ── spokepool-control-plane — the ONE control-plane template ─────────────────
# WS3: collapsed from the former v1..v7 chain (7 near-identical copies, ~1000
# lines of duplication). That copy-paste chain is why v7 silently lost the
# cilium-host-prep enable/gate (WS0.2) and why the worker bootstrap template
# drifted from the CP templates. There is now a single source of truth.
#
# CAPI treats KubeadmControlPlaneTemplate.spec.template.spec as IMMUTABLE once a
# Cluster references it. Editing this template therefore requires reprovisioning
# the spoke rather than rotating a version suffix — the deliberate dev-environment
# tradeoff that replaces the old version chain (ADR-046).
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
# At-rest encryption arrived here as a new template, not an edit (2026-10-02,
# ADR-003 section 6).
#
# The provider is an API server argument plus a file on every control-plane node,
# so adding it changes this template's spec -- and a template referenced by a
# Cluster is immutable or effectively so, so an edit the webhook rejects leaves
# ArgoCD wedged on a resource it cannot apply and cannot drop.
#
# ADOPTING A CHANGE HERE ROLLS THE CONTROL PLANE. Each node is replaced to pick
# up the argument and the file, which is the only way an API server flag takes
# effect. That is a procedure with a verification step, not a sync: see
# docs/runbooks/encrypt-secrets-at-rest.md.
kind: KubeadmControlPlaneTemplate
metadata:
  name: spokepool-control-plane
  namespace: platform-capi
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          networking:
            podSubnet: 10.244.0.0/16
            serviceSubnet: 10.96.0.0/12
          apiServer:
            extraArgs:
              cloud-provider: external
              # Kubernetes Secrets are encrypted at rest (ADR-003 section 6).
              #
              # THIS IS THE LINE v3 DELIBERATELY WITHHELD. It makes the API server
              # REQUIRE /etc/kubernetes/enc/enc.yaml: a path it cannot read is a
              # control plane that does not start. v3 shipped the file and the mount
              # and nothing that read them, so a wrong render was an ordinary healthy
              # node instead of a dead API server.
              #
              # That gate was cleared on nutgraf-01 on 2026-10-05: the v3 roll replaced
              # the control-plane node, the node self-assigned its providerID, and
              # /etc/kubernetes/enc/enc.yaml was on it as root-owned 0600, listing
              # secretbox before identity. The render is proven, so the argument can
              # depend on it.
              #
              # Without it the API server persists Secrets to etcd in plaintext, and
              # base64 is an encoding -- etcd data, backups and disk snapshots all
              # disclose every credential on the box.
              encryption-provider-config: /etc/kubernetes/enc/enc.yaml
            # The API server runs as a static pod, so a path outside the directories
            # kubeadm already mounts is invisible to it. Without this the process
            # fails to start on a file that exists on the node -- which reads as a
            # missing file rather than a missing mount.
            extraVolumes:
              - name: secret-encryption-config
                hostPath: /etc/kubernetes/enc
                mountPath: /etc/kubernetes/enc
                readOnly: true
                pathType: DirectoryOrCreate
          controllerManager:
            extraArgs:
              cloud-provider: external
              allocate-node-cidrs: "true"
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              node-labels: "instance.hetzner.cloud/provided-by=cloud"
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              node-labels: "instance.hetzner.cloud/provided-by=cloud"
        files:
        # THE ENCRYPTION PROVIDER CONFIGURATION IS NOT LISTED HERE. It is appended by
        # the `secretEncryptionConfig` patch in the ClusterClass above, because its
        # Secret name has to carry the cluster's name and a template is shared by
        # every cluster of its class.
        #
        # v2 named it `secret-encryption-config` right here, which is ONE Secret in
        # platform-capi for N clusters -- so every spoke would have read the same
        # key, and the first cluster to rotate would have made the others
        # undecryptable. A per-cluster value cannot be delivered by a shared object,
        # and a literal in a shared template is a shared object (ADR-100).
        #
        # It is appended rather than patched in place on purpose: a JSON patch into
        # this list needs an index, and an index silently rewrites whatever file
        # entry someone later inserts above it.
        - path: /etc/tailscale-authkey
          owner: root
          permissions: "0600"
          contentFrom:
            secret:
              name: tailscale-hybrid-psk
              key: authkey
        - path: /etc/tailscale-hostname
          owner: root
          permissions: "0600"
          contentFrom:
            secret:
              name: tailscale-hybrid-psk
              key: hostname
        - path: /etc/systemd/system/cilium-host-prep.service
          owner: root
          permissions: "0644"
          content: |
            [Unit]
            Description=Cilium host cgroup2+BPF prep (control-plane node)
            Before=containerd.service kubelet.service
            After=local-fs.target

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/bin/bash -c 'mkdir -p /run/cilium/cgroupv2 && mount -t cgroup2 none /run/cilium/cgroupv2 || true; mount --make-shared /run/cilium/cgroupv2 || true; mount -t bpf bpf /sys/fs/bpf || true; mount --make-shared /sys/fs/bpf || true'

            [Install]
            WantedBy=multi-user.target
        - path: /usr/local/bin/dynamic-node-ip.sh
          owner: root
          permissions: "0755"
          content: |
            #!/bin/sh
            # Re-assert kubelet --provider-id, --node-labels and --node-ip.
            # Idempotent. Survives kubeadm upgrade (which rewrites kubeadm-flags.env).
            #
            # ORDER IS LOAD-BEARING. Everything that does not need tailscale runs
            # before anything that does, because the tailscale checks below exit 0.
            # This script previously began with them, so on a node where tailscaled
            # was slow or absent it set NOTHING and said so by succeeding.
            FLAGS=/var/lib/kubelet/kubeadm-flags.env
            [ -f "$FLAGS" ] || exit 0

            # Self-assign providerID from Hetzner metadata.
            #
            # THIS BLOCK WAS MISSING FROM THIS TEMPLATE, and that is why a replacement
            # spoke control-plane node never joined. Every worker template and the hub
            # control-plane template carry it; this one did not, so the node came up
            # with no .spec.providerID, CAPI -- which matches Machines to Nodes BY
            # providerID -- left the Machine with an empty NODENAME, and the KCP roll
            # stalled on NodeHealthy=False/NodeProvisioning with nothing naming the
            # cause.
            #
            # Once --node-ip is a tailnet address the Hetzner CCM refuses to initialise
            # the node: cloud-node-controller validates
            # alpha.kubernetes.io/provided-node-ip against the addresses the cloud
            # reports (ExternalIP 37.x, InternalIP 10.0.x) and fails with
            #   provided node ip ... is not valid: failed to get node address from
            #   cloud provider that matches ip: 100.x.x.x
            # so it never writes the providerID itself. The instance id is
            # authoritative and served by the node's own metadata service, so kubelet
            # sets it directly and the CCM is off the critical path.
            if ! grep -q '\-\-provider-id=' "$FLAGS"; then
              ID="$(curl -fsS --max-time 5 http://169.254.169.254/hetzner/v1/metadata/instance-id 2>/dev/null)"
              if [ -n "$ID" ]; then
                sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--provider-id=hcloud:\/\/${ID} /g" "$FLAGS"
              fi
            fi

            # Inject --node-labels if not already present. Also independent of
            # tailscale, and also silently skipped while it sat below the gates.
            #
            # `|` IS THE DELIMITER, NOT `/`, AND THAT IS A BUG FIX. The label value
            # contains a slash -- instance.hetzner.cloud/provided-by=cloud -- so with
            # `s/.../.../g` the expression closed early and every copy of this line
            # failed with `sed: bad option in substitution expression`. It had never
            # worked, in any of the five templates carrying it, and nothing noticed
            # because kubeadm also sets the label from kubeletExtraArgs at join time
            # and sed's failure is not the script's exit status.
            #
            # Which is the whole reason the re-assertion exists: a kubeadm upgrade
            # rewrites kubeadm-flags.env, and after one the label would have been
            # gone with nothing to put it back.
            if ! grep -q '\-\-node-labels=' "$FLAGS"; then
              sed -i "s|KUBELET_KUBEADM_ARGS=\"|KUBELET_KUBEADM_ARGS=\"--node-labels=instance.hetzner.cloud/provided-by=cloud |g" "$FLAGS"
            fi

            # --node-ip = tailnet IPv4. From here down tailscale is required, and its
            # absence is not an error: kubelet keeps the address it already had.
            TS_BIN="${TS_BIN:-$(command -v tailscale 2>/dev/null || echo /opt/bin/tailscale)}"
            [ -x "$TS_BIN" ] || exit 0
            TS_IP="$($TS_BIN ip -4 2>/dev/null)" || exit 0
            [ -n "$TS_IP" ] || exit 0
            sed -i "s/ --node-ip=[0-9.]*//g" "$FLAGS"
            sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--node-ip=${TS_IP} /g" "$FLAGS"
            exit 0
        - path: /etc/systemd/system/kubelet.service.d/10-dynamic-node-ip.conf
          owner: root
          permissions: "0644"
          content: |
            [Unit]
            After=tailscaled.service
            Wants=tailscaled.service

            [Service]
            ExecStartPre=/usr/local/bin/dynamic-node-ip.sh
        preKubeadmCommands:
        - set -x
        - export CONTAINERD=2.4.2
        - export RUNC=1.5.3
        - export TAILSCALE=1.104.4
        # THE KUBERNETES VERSION IS NOT DECLARED HERE. It is read from
        # /etc/kubernetes/k8s-version, which the controlPlaneKubernetesVersion patch on the
        # ClusterClass writes from builtin.controlPlane.version -- the version CAPI
        # actually tells kubeadm to join as.
        #
        # A literal here was a second source of truth, and on 2026-11-05 the two
        # disagreed: the templates said 1.35.10 while Cluster.spec.topology.version was
        # still v1.31.6 (the composition's bump is rejected outright -- "version cannot
        # be increased from 1.31.6 to 1.35.10", four minors in one step). The node
        # installed kubelet 1.35.10, could not join a 1.31.6 control plane, never
        # registered, and the KCP roll stalled on NodeHealthy=False / NodeProvisioning
        # with nothing naming the cause.
        #
        # The version arrives as a FILE, not as a patched command. CAPI rejects a
        # jsonPatch that addresses an array element ("elements in arrays can not be
        # accessed in a replace operation"), and appending to preKubeadmCommands would
        # land after the apt install that needs it. cloud-init writes every file before
        # it runs any command, so an appended file is read correctly wherever it sits in
        # the list -- the same mechanism secretEncryptionConfig uses for enc.yaml.
        #
        # A missing file is fatal rather than defaulted. A node that guesses its own
        # Kubernetes version is the failure this replaced.
        - 'test -s /etc/kubernetes/k8s-version || { echo "FATAL: k8s version not injected"; exit 1; }'
        - 'export KUBERNETES_VERSION_RAW="$(cat /etc/kubernetes/k8s-version)"'
        - 'export KUBERNETES_VERSION="${KUBERNETES_VERSION_RAW#v}"'
        - 'export TRIMMED_KUBERNETES_VERSION="${KUBERNETES_VERSION%.*}"'
        - ARCH="$(dpkg --print-architecture)"
        - localectl set-locale LANG=en_US.UTF-8
        - localectl set-locale LANGUAGE=en_US.UTF-8
        - apt-get update -y
        - sed -i '/swap/d' /etc/fstab
        - swapoff -a
        - modprobe overlay && modprobe br_netfilter && sysctl --system
        - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.$ARCH
        - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.sha256sum
        - sha256sum --check --ignore-missing runc.sha256sum
        - install runc.$ARCH /usr/local/sbin/runc
        - rm -f runc.$ARCH runc.sha256sum
        - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz
        - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - sha256sum --check containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - tar -zxf containerd-$CONTAINERD-linux-$ARCH.tar.gz -C /usr/local
        - rm -f containerd-$CONTAINERD-linux-$ARCH.tar.gz containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
        - curl -fsSL https://raw.githubusercontent.com/containerd/containerd/v$CONTAINERD/containerd.service -o /etc/systemd/system/containerd.service
        - echo "net.ipv4.ip_forward = 1" >> /etc/sysctl.conf
        - sysctl -p
        - systemctl daemon-reload && systemctl enable containerd && systemctl start containerd
        # WS0.2 regression fix: v7 wrote /etc/systemd/system/cilium-host-prep.service
        # via files[] but never enabled it, and WantedBy=multi-user.target does not
        # start an un-enabled unit — so the shared cgroup2 mount was absent on every
        # boot. kube-proxy-replacement requires it and /run is tmpfs, so it must be
        # re-created at each boot. Fail closed if the mount is missing.
        - systemctl daemon-reload && systemctl enable cilium-host-prep.service && systemctl start cilium-host-prep.service
        - 'findmnt -n -t cgroup2 /run/cilium/cgroupv2 || { echo "cilium-host-prep FAILED"; exit 1; }'
        - mkdir -p /etc/apt/keyrings/
        - curl -fsSL https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
        - apt-get update
        - apt-get install -y kubelet="$KUBERNETES_VERSION-*" kubeadm="$KUBERNETES_VERSION-*" kubectl="$KUBERNETES_VERSION-*" && apt-mark hold kubelet kubectl kubeadm && systemctl enable kubelet
        - kubeadm config images pull --kubernetes-version $KUBERNETES_VERSION
        - echo 'source <(kubectl completion bash)' >>/root/.bashrc
        - echo 'export KUBECONFIG=/etc/kubernetes/admin.conf' >>/root/.bashrc
        - apt-get -y autoremove && apt-get -y clean all
        - curl -fsSLO https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE}_$ARCH.tgz
        - echo "$(curl -fsSL https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE}_$ARCH.tgz.sha256)  tailscale_${TAILSCALE}_$ARCH.tgz" | sha256sum --check
        - tar -xzf tailscale_${TAILSCALE}_$ARCH.tgz
        - install tailscale_${TAILSCALE}_$ARCH/tailscale /usr/bin/tailscale && install tailscale_${TAILSCALE}_$ARCH/tailscaled /usr/sbin/tailscaled
        - install -m 0644 tailscale_${TAILSCALE}_$ARCH/systemd/tailscaled.service /etc/systemd/system/tailscaled.service && install -m 0644 tailscale_${TAILSCALE}_$ARCH/systemd/tailscaled.defaults /etc/default/tailscaled
        - rm -rf tailscale_${TAILSCALE}_$ARCH tailscale_${TAILSCALE}_$ARCH.tgz && systemctl daemon-reload
        - systemctl enable --now tailscaled || true
        - 'if [ -s /etc/tailscale-hostname ]; then tailscale up --authkey="$(cat /etc/tailscale-authkey)" --hostname="$(cat /etc/tailscale-hostname)" --accept-dns=false; fi'
        - 'if [ -s /etc/tailscale-hostname ]; then for i in $(seq 1 30); do tailscale ip -4 >/dev/null 2>&1 && break; sleep 2; done; fi'
        - 'if [ -s /etc/tailscale-hostname ]; then echo "tailnet IP: $(tailscale ip -4)"; else echo "tailscale: disabled (no hostname)"; fi'
        postKubeadmCommands:
        - 'kubectl --kubeconfig=/etc/kubernetes/admin.conf delete daemonset -n kube-system kube-proxy || true'
        - 'kubectl --kubeconfig=/etc/kubernetes/admin.conf delete configmap -n kube-system kube-proxy || true'
        - 'kubectl --kubeconfig=/etc/kubernetes/admin.conf label nodes --all node.kubernetes.io/exclude-from-external-load-balancers- || true'
        # WS0.2: restored from v5. The external Hetzner CCM taints new nodes
        # node.cloudprovider.kubernetes.io/uninitialized until it reconciles them;
        # clearing it is idempotent and unblocks scheduling if the CCM lags.
        # NOT restored from v5 (deliberate): control-plane taint removal was reverted
        # by d74cbeaa, and the bootstrap DNAT rules + --advertise-address patch are
        # obsolete under routing-mode=tunnel.
        - 'kubectl --kubeconfig=/etc/kubernetes/admin.conf taint nodes --all node.cloudprovider.kubernetes.io/uninitialized- || true'
        - 'if [ -s /etc/tailscale-hostname ]; then systemctl daemon-reload && /usr/local/bin/dynamic-node-ip.sh && systemctl restart kubelet; fi'
        # WS0.1 (ADR-046): Tailscale is a NODE-LEVEL UNDERLAY ONLY. Cilium runs
        # routing-mode=tunnel, so cross-node pod traffic is VXLAN-encapsulated between
        # tailnet IPs and pod IPs never reach the wire. Advertising or accepting podCIDR
        # subnet routes is unnecessary AND harmful: tailscaled installs them into table 52,
        # whose ip rule (5270) precedes main (32766), shadowing Cilium's tunnel route for
        # host-originated traffic to remote pods. Deliberately no --advertise-routes here.
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: spokepool-control-plane-machine
  namespace: platform-capi
spec:
  template:
    spec:
      type: cx33
      imageName: ubuntu-24.04
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: spokepool-worker-machine
  namespace: platform-capi
spec:
  template:
    spec:
      type: cx33
      imageName: ubuntu-24.04

---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: spokepool-burst-machine
  namespace: platform-capi
spec:
  template:
    spec:
      type: cx33
      imageName: ubuntu-24.04

---
# Carries the ADR-046 invariant 6 mechanism the v1 template lacked.
#
# invariant 6 requires a routable Tailscale IP on every node that carries pod
# traffic, and Cilium derives the VXLAN tunnel endpoint from the node's
# InternalIP directly. With cloud-provider=external the hcloud CCM sets
# InternalIP to the node's PRIVATE network address, and nothing overrode it
# here — so a CAPI-provisioned worker registered 10.0.0.x, Cilium built its
# tunnel on that address, and home-lab nodes had no route to it.
#
# Observed 2026-09-02: a burst node resolved cluster DNS (CoreDNS runs on the
# Hetzner control plane, reachable over the private network) while every
# connection to a pod on a home node timed out — the sandbox harness failed with
# psycopg ConnectionTimeout against waypoint-pooler, which runs on a Flatcar
# worker. The control plane was unaffected because ONLY its template carried
# dynamic-node-ip.sh.
#
# The kubelet drop-in orders kubelet after tailscaled. Without that ordering the
# node can register before the tailnet address exists, which makes the fault
# intermittent rather than absolute.
#
# v2 rather than an edit: KubeadmConfigTemplate.spec is immutable, so changing
# v1 in place is rejected by the API server and leaves the Application
# permanently OutOfSync — the state spokepool-burst-bootstrap-v1 is already in.
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: spokepool-worker-bootstrap
  namespace: platform-capi
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
            node-labels: "workload-location=hetzner"
      files:
      - path: /usr/local/bin/dynamic-node-ip.sh
        owner: root
        permissions: "0755"
        content: |
          # Ported verbatim from the hub control plane's ClusterClass
          # (internal/assets/manifests/classes/hetzner-mgmt-ubuntu-v1.yaml), which has
          # been running this arrangement since ADR-046 §21.
          #
          # The part that matters, and that v2/v3 of this template lacked, is the
          # providerID self-assignment. Once --node-ip is a tailnet address the Hetzner
          # CCM refuses to initialise the node — it validates provided-node-ip against
          # the addresses the cloud reports and never writes .spec.providerID — and CAPI
          # matches Machines to Nodes BY providerID. The instance id is authoritative and
          # available from the node's own metadata service, so kubelet sets providerID
          # directly and CCM is no longer on the critical path for it.
          #
          # This is why the hub control plane holds BOTH a tailnet InternalIP and
          # providerID=hcloud://..., which no worker node had managed before.
          #
          # v3 tried to sequence around CCM instead — register privately, wait for the
          # uninitialized taint to clear, then switch. That is unnecessary: the hub does
          # not wait for CCM at all, and the first registration already carries the
          # tailnet node-ip.
          #!/bin/sh
          # Re-assert kubelet --node-ip = tailnet IPv4.
          # Idempotent, and survives kubeadm upgrades, which rewrite kubeadm-flags.env.
          TS_BIN="${TS_BIN:-$(command -v tailscale 2>/dev/null || echo /opt/bin/tailscale)}"
          FLAGS=/var/lib/kubelet/kubeadm-flags.env
          [ -f "$FLAGS" ] || exit 0
          [ -x "$TS_BIN" ] || exit 0
          TS_IP="$($TS_BIN ip -4 2>/dev/null)" || exit 0
          [ -n "$TS_IP" ] || exit 0
          sed -i "s/ --node-ip=[0-9.]*//g" "$FLAGS"
          sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--node-ip=${TS_IP} /g" "$FLAGS"
          # Self-assign providerID from Hetzner metadata.
          #
          # Once --node-ip is a tailnet address the Hetzner CCM refuses to
          # initialise the node: the cloud-node-controller validates
          # alpha.kubernetes.io/provided-node-ip against the addresses the cloud
          # reports (ExternalIP 37.x, InternalIP 10.0.x) and fails with
          #   provided node ip ... is not valid: failed to get node address from
          #   cloud provider that matches ip: 100.x.x.x
          # so it never writes .spec.providerID. CAPI matches Machines to Nodes
          # BY providerID, so the Machine keeps an empty NODENAME and pivot-move
          # times out on "all machines joined".
          #
          # The instance id is authoritative and available from the metadata
          # service on the node itself, so kubelet can set providerID directly and
          # the CCM is no longer on the critical path for it.
          if ! grep -q '\-\-provider-id=' "$FLAGS"; then
            ID="$(curl -fsS --max-time 5 http://169.254.169.254/hetzner/v1/metadata/instance-id 2>/dev/null)"
            if [ -n "$ID" ]; then
              sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--provider-id=hcloud:\/\/${ID} /g" "$FLAGS"
            fi
          fi
          exit 0
      - path: /etc/tailscale-authkey
        owner: root
        permissions: "0600"
        contentFrom:
          secret:
            name: tailscale-hybrid-psk
            key: authkey
      - path: /etc/tailscale-hostname
        owner: root
        permissions: "0600"
        contentFrom:
          secret:
            name: tailscale-hybrid-psk
            key: hostname
      preKubeadmCommands:
      - set -x
      - export CONTAINERD=2.4.2
      - export RUNC=1.5.3
      - export TAILSCALE=1.104.4
      # THE KUBERNETES VERSION IS NOT DECLARED HERE. It is read from
      # /etc/kubernetes/k8s-version, which the workerKubernetesVersion patch on the
      # ClusterClass writes from builtin.machineDeployment.version -- the version CAPI
      # actually tells kubeadm to join as.
      #
      # This is THIS MachineDeployment's version, not the cluster's. CAPI rolls the
      # control plane before the MachineDeployments, so during an upgrade the two
      # legitimately differ; the cluster-wide value would hand a worker a version its
      # own MachineDeployment has not moved to yet. See spokepool-control-plane for
      # the incident that produced this rule.
      #
      # The version arrives as a FILE, not as a patched command. CAPI rejects a
      # jsonPatch that addresses an array element ("elements in arrays can not be
      # accessed in a replace operation"), and appending to preKubeadmCommands would
      # land after the apt install that needs it. cloud-init writes every file before
      # it runs any command, so an appended file is read correctly wherever it sits in
      # the list -- the same mechanism secretEncryptionConfig uses for enc.yaml.
      #
      # A missing file is fatal rather than defaulted. A node that guesses its own
      # Kubernetes version is the failure this replaced.
      - 'test -s /etc/kubernetes/k8s-version || { echo "FATAL: k8s version not injected"; exit 1; }'
      - 'export KUBERNETES_VERSION_RAW="$(cat /etc/kubernetes/k8s-version)"'
      - 'export KUBERNETES_VERSION="${KUBERNETES_VERSION_RAW#v}"'
      - 'export TRIMMED_KUBERNETES_VERSION="${KUBERNETES_VERSION%.*}"'
      - ARCH="$(dpkg --print-architecture)"
      - localectl set-locale LANG=en_US.UTF-8
      - localectl set-locale LANGUAGE=en_US.UTF-8
      - apt-get update -y
      - sed -i '/swap/d' /etc/fstab
      - swapoff -a
      - modprobe overlay && modprobe br_netfilter && sysctl --system
      - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.$ARCH
      - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.sha256sum
      - sha256sum --check --ignore-missing runc.sha256sum
      - install runc.$ARCH /usr/local/sbin/runc
      - rm -f runc.$ARCH runc.sha256sum
      - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz
      - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
      - sha256sum --check containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
      - tar -zxf containerd-$CONTAINERD-linux-$ARCH.tar.gz -C /usr/local
      - rm -f containerd-$CONTAINERD-linux-$ARCH.tar.gz containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
      - mkdir -p /etc/containerd
      - containerd config default > /etc/containerd/config.toml
      - sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
      - curl -fsSL https://raw.githubusercontent.com/containerd/containerd/v$CONTAINERD/containerd.service -o /etc/systemd/system/containerd.service
      - echo "net.ipv4.ip_forward = 1" >> /etc/sysctl.conf
      - sysctl -p
      - systemctl daemon-reload && systemctl enable containerd && systemctl start containerd
      - mkdir -p /etc/apt/keyrings/
      - curl -fsSL https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
      - apt-get update
      - apt-get install -y kubelet="$KUBERNETES_VERSION-*" kubeadm="$KUBERNETES_VERSION-*" kubectl="$KUBERNETES_VERSION-*" && apt-mark hold kubelet kubectl kubeadm && systemctl enable kubelet
      - kubeadm config images pull --kubernetes-version $KUBERNETES_VERSION
      - echo 'source <(kubectl completion bash)' >>/root/.bashrc
      - echo 'export KUBECONFIG=/etc/kubernetes/admin.conf' >>/root/.bashrc
      - apt-get -y autoremove && apt-get -y clean all
      - curl -fsSLO https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE}_$ARCH.tgz
      - echo "$(curl -fsSL https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE}_$ARCH.tgz.sha256)  tailscale_${TAILSCALE}_$ARCH.tgz" | sha256sum --check
      - tar -xzf tailscale_${TAILSCALE}_$ARCH.tgz
      - install tailscale_${TAILSCALE}_$ARCH/tailscale /usr/bin/tailscale && install tailscale_${TAILSCALE}_$ARCH/tailscaled /usr/sbin/tailscaled
      - install -m 0644 tailscale_${TAILSCALE}_$ARCH/systemd/tailscaled.service /etc/systemd/system/tailscaled.service && install -m 0644 tailscale_${TAILSCALE}_$ARCH/systemd/tailscaled.defaults /etc/default/tailscaled
      - rm -rf tailscale_${TAILSCALE}_$ARCH tailscale_${TAILSCALE}_$ARCH.tgz && systemctl daemon-reload
      - systemctl enable --now tailscaled || true
      - 'if [ -s /etc/tailscale-hostname ]; then tailscale up --authkey="$(cat /etc/tailscale-authkey)" --hostname="$(cat /etc/tailscale-hostname)" --accept-dns=false; fi'
      # daemon-reload ONLY. The drop-in does the rest, at the right moment.
      #
      # This runs BEFORE kubeadm join, when /var/lib/kubelet/kubeadm-flags.env
      # does not exist yet: the script exits 0 harmlessly, and then
      # `systemctl restart kubelet` acts on an unconfigured kubelet. A non-zero
      # exit there fails the && chain, and a failed preKubeadmCommand aborts
      # cloud-init before kubeadm join is ever reached — the server boots,
      # BootstrapReady goes true, and no Node ever registers (v4, 2026-09-02).
      #
      # Nothing is lost by removing it. kubeadm join writes kubeadm-flags.env
      # and THEN starts kubelet; systemd runs ExecStartPre before ExecStart and
      # reads EnvironmentFile at ExecStart, so the drop-in rewrites the flags
      # and kubelet's FIRST registration already carries --node-ip and
      # --provider-id. The reload must stay so systemd has the drop-in loaded
      # before kubeadm starts the unit.
      - 'if [ -s /etc/tailscale-hostname ]; then systemctl daemon-reload; fi'
      - 'if [ -s /etc/tailscale-hostname ]; then for i in $(seq 1 30); do tailscale ip -4 >/dev/null 2>&1 && break; sleep 2; done; fi'
      - 'if [ -s /etc/tailscale-hostname ]; then echo "tailnet IP: $(tailscale ip -4)"; else echo "tailscale: disabled (no hostname)"; fi'
      postKubeadmCommands:
      # ADR-046 invariant 6, applied AFTER join.
      #
      # There is deliberately no kubelet systemd drop-in. Its
      # After=tailscaled.service made kubelet wait for tailscaled, and if
      # tailscaled is slow or unhealthy kubelet never starts, kubeadm join
      # times out and NO NODE EVER REGISTERS — the server boots,
      # BootstrapReady goes true, and CAPI sits on "Waiting for a node with
      # matching ProviderID to exist". That drop-in is the only structural
      # difference between v1 (which joins) and v2-v5 (which do not).
      #
      # Running here instead removes every way this can prevent a join:
      # kubeadm-flags.env exists, tailscaled is up, and a failure costs the
      # address rather than the node. The trade is that the flags are not
      # re-applied on reboot or kubeadm upgrade, which is the right trade for
      # a burst node — it is ephemeral and reaped within hours, and a node
      # that joins beats a node that would have survived a reboot it never has.
      - 'if [ -s /etc/tailscale-hostname ]; then /usr/local/bin/dynamic-node-ip.sh && systemctl restart kubelet || true; fi'
      # WS0.1 (ADR-046): Tailscale is a NODE-LEVEL UNDERLAY ONLY. Cilium runs
      # routing-mode=tunnel, so cross-node pod traffic is VXLAN-encapsulated between
      # tailnet IPs and pod IPs never reach the wire. Advertising or accepting podCIDR
      # subnet routes is unnecessary AND harmful: tailscaled installs them into table 52,
      # whose ip rule (5270) precedes main (32766), shadowing Cilium's tunnel route for
      # host-originated traffic to remote pods. Deliberately no --advertise-routes here.
