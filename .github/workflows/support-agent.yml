# Build and publish the Support Agent image.
#
# Same shape as every other component image here. It is separate from
# publish-platform-charts because the agent is a container the bundle REFERENCES,
# not content the bundle carries: a chart release does not rebuild it, and a code
# change to the agent does not need a bundle version.
name: support-agent

on:
  push:
    branches: [main, feat/**]
    paths:
      - cmd/support-agent/**
      - internal/support/**
      # This file. A workflow that does not watch itself cannot react to
      # its own change: when the image path moved to the kamarkat
      # organisation, every workflow was edited and not one of them ran,
      # so the new registry path stayed empty while the old one held the
      # last build.
      - .github/workflows/support-agent.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          # The repository root: the Dockerfile builds from the module, because
          # the agent's collection engine lives in internal/support and a context
          # of cmd/support-agent could not reach it.
          context: .
          file: cmd/support-agent/Dockerfile
          # amd64 only, for the reason recorded in the other image workflows:
          # every node in the fleet is x86, and these Dockerfiles do not
          # cross-compile, so a non-native leg runs under QEMU for nothing.
          platforms: linux/amd64
          push: true
          # Links the GHCR package to this repository. Without the link an org
          # package grants Actions access to no repository and CI is refused write
          # with a 403 on blob upload, whatever `packages: write` says -- which is
          # what every package re-created by hand at the 2026-11-04 org rename did.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}/support-agent:${{ github.sha }}
            ghcr.io/${{ github.repository }}/support-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The edit is re-derived from the branch tip on every attempt, and never
      # rebased. A build takes minutes, so main has usually moved on and a plain
      # push from the stale checkout is rejected:
      #
      #   ! [rejected]  main -> main (fetch first)
      #
      # which is what happens when ten image workflows pin back at once.
      # Rebasing looks like the fix and is not: two runs of THIS workflow rewrite
      # the same digest line in the same file, so the rebase conflicts and the
      # retry then fails on the unmerged files instead.
      #
      # Resetting to the tip and re-applying cannot conflict -- there is never a
      # divergent commit to merge -- and it is self-correcting: if a newer run
      # already pinned a newer digest, this one finds nothing to change and exits
      # rather than reverting it. Same loop as auth-proxy, kube-sbt, mcp-server
      # and postgres-partman.
      - name: Pin the digest just built, re-deriving from the branch tip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          apply() (
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          cd manifests/hub-core-services/support-agent
          kustomize edit set image "support-agent=ghcr.io/${{ github.repository }}/support-agent@${digest}"
          cd -
          # The spoke agent is a plain multi-document manifest, not a
          # kustomization, so its reference is rewritten in place.
          # Matches the digest form AND the :unbuilt placeholder. Matching only
          # @sha256 meant the FIRST run -- the one that replaces the placeholder
          # -- silently changed nothing, and the spoke shipped an unpullable tag
          # while the hub was correctly pinned.
          sed -i.bak -E \
            "s|image: ghcr\.io/kamarkat/kamarkat/support-agent(@sha256:[a-f0-9]+\|:[A-Za-z0-9._-]+)|image: ghcr.io/${{ github.repository }}/support-agent@${digest}|" \
            manifests/spoke/spoke-catalog/infra/support-agent.yaml
          grep -q "support-agent@${digest}" manifests/spoke/spoke-catalog/infra/support-agent.yaml || {
              echo "::error::the spoke image reference did not update; the pattern no longer matches"
              exit 1
          }
          rm -f manifests/spoke/spoke-catalog/infra/support-agent.yaml.bak
          ./scripts/package/embed-platform-assets.sh
          )

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME}"

            # apply runs in a subshell, so its own `exit` does not reach here.
            apply || exit 1

            git add manifests/hub-core-services/support-agent/kustomization.yaml \
                    manifests/spoke/spoke-catalog/infra/support-agent.yaml \
                    internal/platform/embedded
            if git diff --cached --quiet; then
              echo "digest already pinned on ${GITHUB_REF_NAME} -- nothing to do"
              exit 0
            fi

            git commit --quiet -m "chore(support-agent): update image to ${{ github.sha }}"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pinned on attempt ${attempt}"
              exit 0
            fi

            echo "attempt ${attempt} lost a push race; re-deriving from the new tip"
            sleep $((attempt * 5))
          done
          echo "::error::could not pin the image digest after 5 attempts"
          exit 1
