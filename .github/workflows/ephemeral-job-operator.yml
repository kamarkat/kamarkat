name: ephemeral-job-operator

on:
  push:
    branches: [main, feat/**]
    paths:
      - operators/ephemeral-job-operator/**
      # This file. A workflow that does not watch itself cannot react to
      # its own change: when the image path moved to the kamarkat
      # organisation, every workflow was edited and not one of them ran,
      # so the new registry path stayed empty while the old one held the
      # last build.
      - .github/workflows/ephemeral-job-operator.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7


      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # THE JOB'S OWN IDENTITY, not a person's.
          #
          # GITHUB_TOKEN is issued for this job and expires when it ends, and the
          # images live under this repository's own owner, which is the case it
          # covers. It replaced a shared PAT (GHCR_TOKEN, hardcoded to one
          # maintainer's username) that every image workflow depended on: when it
          # stopped being accepted, all ten failed at this step with
          #
          #   docker/login-action: GET https://ghcr.io/v2/: denied: denied
          #
          # and no image was rebuilt until someone noticed. There is nothing to
          # rotate here and no account to lose access.
          #
          # `packages: write` at the top of this file is what authorizes the push.
          # A package that predates this still carries its own Actions-access list,
          # and refuses an unlisted repository with a 403 on blob upload -- a
          # different boundary from this login, fixed in the package's settings
          # rather than here.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: operators/ephemeral-job-operator
          # amd64 only. Every node in the fleet is x86: Hetzner control planes and
          # the Flatcar home-lab workers alike, so an arm64 image is built and
          # pushed for nothing.
          #
          # It is not merely wasted time. None of these Dockerfiles cross-compile —
          # there is no --platform=$BUILDPLATFORM stage — so buildx runs the whole
          # non-native leg under QEMU. That is slow for the Go images and fatal for
          # the Node one, where pnpm install dies with "qemu: uncaught target
          # signal 4 (Illegal instruction)" and the build hangs.
          #
          # Restore arm64 by adding a cross-compiling builder stage first, not by
          # putting the platform back and emulating.
          platforms: linux/amd64
          push: true
          # Links the GHCR package to this repository. Without the link an org
          # package grants Actions access to no repository and CI is refused write
          # with a 403 on blob upload, whatever `packages: write` says -- which is
          # what every package re-created by hand at the 2026-11-04 org rename did.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}/ephemeral-job-operator:${{ github.sha }}
            ghcr.io/${{ github.repository }}/ephemeral-job-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The edit is re-derived from the branch tip on every attempt, and never
      # rebased. A build takes minutes, so main has usually moved on and a plain
      # push from the stale checkout is rejected:
      #
      #   ! [rejected]  main -> main (fetch first)
      #
      # which is what happens when ten image workflows pin back at once.
      # Rebasing looks like the fix and is not: two runs of THIS workflow rewrite
      # the same digest line in the same file, so the rebase conflicts and the
      # retry then fails on the unmerged files instead.
      #
      # Resetting to the tip and re-applying cannot conflict -- there is never a
      # divergent commit to merge -- and it is self-correcting: if a newer run
      # already pinned a newer digest, this one finds nothing to change and exits
      # rather than reverting it. Same loop as auth-proxy, kube-sbt, mcp-server
      # and postgres-partman.
      - name: Pin the digest just built, re-deriving from the branch tip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          apply() (
          # Both components ship the same image (ADR-108): the operator and
          # the preview-access service. Pinned together so they cannot drift.
          for d in manager preview-access; do
            (cd operators/ephemeral-job-operator/config/$d && \
              kustomize edit set image ephemeral-job-operator=ghcr.io/${{ github.repository }}/ephemeral-job-operator@${{ steps.build.outputs.digest }})
          done
          )

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME}"

            # apply runs in a subshell, so its own `exit` does not reach here.
            apply || exit 1

            git add operators/ephemeral-job-operator/config/manager/kustomization.yaml \
                    operators/ephemeral-job-operator/config/preview-access/kustomization.yaml
            if git diff --cached --quiet; then
              echo "digest already pinned on ${GITHUB_REF_NAME} -- nothing to do"
              exit 0
            fi

            git commit --quiet -m "chore(ephemeral-job-operator): update image to ${{ github.sha }}"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pinned on attempt ${attempt}"
              exit 0
            fi

            echo "attempt ${attempt} lost a push race; re-deriving from the new tip"
            sleep $((attempt * 5))
          done
          echo "::error::could not pin the image digest after 5 attempts"
          exit 1
