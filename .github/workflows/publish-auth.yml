name: zero-ops-auth

on:
  workflow_dispatch:
  push:
    # feat/** too, matching every component workflow in this repo.
    #
    # The branch filter was never what kept a feature branch from publishing --
    # the `publish` job below is gated on
    # `github.ref == 'refs/heads/main'` and cannot run from anywhere else. All the
    # filter did was skip VALIDATION, so a change to packages/auth pushed to a
    # feature branch got no typecheck, no tests and no build until it reached a PR.
    #
    # That is how zero-ops-auth 0.12.0 was pushed on 2026-09-28 and nothing ran.
    branches: [main, "feat/**"]
    paths:
      - "packages/auth/**"
      - ".github/workflows/publish-auth.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/auth/**"
      - ".github/workflows/publish-auth.yml"

jobs:
  validate-and-build:
    name: Validate & Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - name: Install dependencies
        working-directory: packages/auth
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: packages/auth
        run: pnpm typecheck
      - name: Test
        working-directory: packages/auth
        run: pnpm test
      - name: Lint
        working-directory: packages/auth
        run: pnpm --filter zero-ops-auth lint
      - name: Build
        working-directory: packages/auth
        run: pnpm build

  publish:
    name: Publish to npm
    needs: validate-and-build
    runs-on: ubuntu-24.04
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/'))) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - name: Install dependencies
        working-directory: packages/auth
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: packages/auth
        run: pnpm build
      - name: Check if version changed
        id: version-check
        working-directory: packages/auth
        shell: bash
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LATEST_VERSION=$(npm view "zero-ops-auth" version 2>/dev/null || echo "0.0.0")
          echo "Current version: $CURRENT_VERSION"
          echo "Latest published: $LATEST_VERSION"
          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "New version detected, will publish"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "Version already published, skipping"
          fi
      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: pnpm --filter zero-ops-auth publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
