# What the CAPI operator's provider fetch sees from a GitHub-hosted runner.
#
# WHY THIS EXISTS. A tenant's Day-0 fails at capi-init with
#
#   timeout waiting for CoreProvider/cluster-api
#
# and the operator reaches GitHub to fetch that provider's components: the
# CoreProvider declares a version and no fetchConfig, so the operator resolves
# the release through the GitHub API and downloads its assets. Unauthenticated
# API calls are limited per source IP and hosted runners share source IPs, which
# would produce exactly this symptom -- a provider that never reports Ready.
#
# That is a hypothesis, and this measures it rather than assuming it. It runs
# where the failure happens, needs no cluster, creates nothing and costs nothing.
#
# MEASURED 2026-11-16 (run 43871644095) -- the failure, reproduced:
#
#   PreflightCheckPassed=True   ProviderInstalled=True   installedVersion=v1.13.7
#   Ready=False (MinimumReplicasUnavailable)
#   capi-controller-manager-...  0/1  CrashLoopBackOff  6 restarts
#
# So the fetch is not the problem and never was: the operator downloaded the
# components and applied them. The controller those components deploy crashes on
# startup, and its readiness probe on :9440 is refused because nothing is
# listening. Its own log is what says why, and this probe now collects it.
#
# MEASURED 2026-11-16 (runs 43870533985, 43871005479):
#
#   pod -> api.github.com: HTTP 200   a pod inside Kind on this runner class
#                                     reaches the API the operator fetches from,
#                                     so node DNS and NAT are not the cause
#
# MEASURED 2026-11-16 (run 43870533985), and it settles the first question:
#
#   anonymous   limit 60, remaining 58   the runner's IP is nowhere near its quota
#   authenticated limit 5000             a credential would raise it, and nothing needs it to
#   core-components.yaml  HTTP 200, 1,156,126 bytes   egress to the assets works
#
# So the rate limit is NOT the cause, and no provider-fetch credential is
# warranted. What those three lines do NOT cover is the fetch the operator
# actually performs: kubectl and curl run on the RUNNER, while the operator runs
# in a pod inside Kind, and reaches the network through the node's own DNS and
# NAT. Job `capi-init` below closes exactly that gap.
#
# WHAT THE RESULT MEANS:
#
#   anonymous remaining: 0     the limit is reached on this runner's IP. The
#                              operator's fetch fails for that reason, and the
#                              fix is its documented provider-fetch credential.
#   anonymous remaining: high  the rate limit is NOT the cause. Look at egress
#                              and image pulls instead, with the diagnostics the
#                              installer now prints.
#   asset download fails       egress to the release assets is blocked or
#                              proxied, which no credential fixes.
#
# Delete this workflow once the question is settled. It is a probe, not a gate.
name: Provider fetch probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Anonymous — what the operator does today
        run: |
          set -euo pipefail
          echo "::group::API rate limit, unauthenticated"
          curl -sS -D- -o /dev/null \
            https://api.github.com/repos/kubernetes-sigs/cluster-api/releases/tags/v1.13.7 \
            | grep -iE '^(HTTP/|x-ratelimit|retry-after)' || true
          echo "::endgroup::"

      - name: Authenticated — whether a credential would change it
        env:
          # The run's own token, used for a read of a public repository. It is
          # NOT being introduced into the product: this answers whether
          # authentication is the difference, which decides whether the operator
          # needs a credential at all.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::API rate limit, authenticated"
          curl -sS -D- -o /dev/null -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/kubernetes-sigs/cluster-api/releases/tags/v1.13.7 \
            | grep -iE '^(HTTP/|x-ratelimit|retry-after)' || true
          echo "::endgroup::"

      - name: Can the components actually be downloaded
        run: |
          set -euo pipefail
          # The asset the operator installs CoreProvider from. Served from a
          # different host than the API, so this tests egress rather than quota.
          url=https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.13.7/core-components.yaml
          echo "::group::core-components.yaml"
          code=$(curl -sS -L -o /tmp/core-components.yaml -w '%{http_code}' --max-time 60 "$url")
          echo "HTTP ${code}, $(wc -c < /tmp/core-components.yaml) bytes"
          head -3 /tmp/core-components.yaml
          echo "::endgroup::"
          [ "$code" = "200" ] || { echo "::error::the operator cannot download its components (HTTP ${code})"; exit 1; }

  # The failing operation itself, in the environment where it fails.
  #
  # Job `probe` proved the runner host can reach GitHub. This installs what the
  # product installs -- the pinned cert-manager, the operator's own manifest and
  # the CoreProvider declaration this platform ships -- into a throwaway Kind
  # cluster on the same runner class, and then reports what the resource says
  # about itself. The operator fetches from inside a pod, which is the one path
  # no curl from the host can test.
  #
  # It creates nothing outside the runner and provisions no infrastructure.
  capi-init:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Versions this platform pins
        id: v
        run: |
          set -euo pipefail
          # Read from the source of truth rather than restated here, so a probe
          # cannot test a version the product does not ship.
          capi=$(grep -oE 'CAPIVersion = "[^"]+"' internal/kakt-cli/versions/versions.go | cut -d'"' -f2)
          cm=$(grep -oE 'CertManagerVersion = "[^"]+"' internal/kakt-cli/versions/versions.go | cut -d'"' -f2)
          # The node image the product pins. The first run of this probe used
          # kind's default instead, so it was exercising a different Kubernetes
          # version than any tenant ever gets.
          node=$(grep -oE 'kindNodeImage = "[^"]+"' internal/kakt-cli/bootstrap/kind.go | cut -d'"' -f2)
          echo "capi=$capi" >> "$GITHUB_OUTPUT"
          echo "certmanager=$cm" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "cluster-api $capi, cert-manager $cm, node $node"

      - name: Disposable cluster
        run: kind create cluster --name capi-probe --image "${{ steps.v.outputs.node }}" --wait 120s

      - name: cert-manager
        run: |
          set -euo pipefail
          kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${{ steps.v.outputs.certmanager }}/cert-manager.yaml"
          for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
            kubectl -n cert-manager rollout status "deployment/$d" --timeout=5m
          done

      - name: The operator and the CoreProvider this platform ships
        run: |
          set -euo pipefail
          kubectl apply --server-side -f internal/assets/manifests/core/capi-operator/install.yaml
          kubectl -n platform-capi rollout status deployment/capi-operator-controller-manager --timeout=5m

          # RETRIED, because the product retries. A Deployment reporting Available
          # says nothing about whether the operator's own webhook server has bound
          # its port: the first attempt of this probe failed with
          #
          #   failed calling webhook "vcoreprovider.kb.io": dial tcp ...:443:
          #   connect: connection refused
          #
          # 230ms before the operator logged "Serving webhook server". The
          # installer handles exactly this (applyWithWebhookRetry), so a probe
          # that does not is testing a race the product already survives -- and
          # it never reaches the state being investigated.
          for attempt in $(seq 1 30); do
            if out=$(kubectl apply -f internal/assets/manifests/core/capi-operator/providers/core-provider.yaml 2>&1); then
              echo "$out"; break
            fi
            case "$out" in
              *"failed calling webhook"*|*"connection refused"*|*"certificate signed by unknown authority"*)
                echo "attempt ${attempt}: webhook not serving yet, retrying"; sleep 2 ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
            [ "$attempt" = 30 ] && { echo "::error::the webhook never accepted the CoreProvider"; exit 1; }
          done

      - name: Does CoreProvider become Ready
        id: ready
        continue-on-error: true
        run: |
          set -euo pipefail
          for _ in $(seq 1 36); do
            status=$(kubectl -n platform-capi get coreprovider cluster-api \
              -o jsonpath="{.status.conditions[?(@.type=='Ready')].status}" 2>/dev/null || true)
            if [ "$status" = "True" ]; then echo "CoreProvider is Ready"; exit 0; fi
            sleep 10
          done
          echo "::error::CoreProvider/cluster-api never reported Ready — the tenant's failure, reproduced"
          exit 1

      - name: What the resource says about itself
        if: always()
        run: |
          echo "::group::conditions"
          kubectl -n platform-capi get coreprovider cluster-api \
            -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}) {.message}{"\n"}{end}' || true
          echo "::endgroup::"
          echo "::group::generation"
          kubectl -n platform-capi get coreprovider cluster-api \
            -o jsonpath='generation={.metadata.generation} observedGeneration={.status.observedGeneration} installedVersion={.status.installedVersion}{"\n"}' || true
          echo "::endgroup::"
          echo "::group::pods"
          kubectl -n platform-capi get pods -o wide || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl -n platform-capi get events --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::operator log"
          kubectl -n platform-capi logs deployment/capi-operator-controller-manager --tail=100 || true
          echo "::endgroup::"
          echo "::group::why the provider's controller is not running"
          for pod in $(kubectl -n platform-capi get pods \
              -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==false)]}{.metadata.name}{" "}{end}'); do
            echo "--- describe $pod"
            kubectl -n platform-capi describe pod "$pod" | tail -40 || true
            echo "--- $pod previous run"
            kubectl -n platform-capi logs "$pod" --previous --tail=80 || true
            echo "--- $pod current"
            kubectl -n platform-capi logs "$pod" --tail=80 || true
          done
          echo "::endgroup::"
          echo "::group::egress from inside the cluster"
          kubectl run egress-probe --image=curlimages/curl:8.11.1 --restart=Never --rm -i --quiet --timeout=120s -- \
            -sS -o /dev/null -w 'pod -> api.github.com: HTTP %{http_code}\n' \
            https://api.github.com/repos/kubernetes-sigs/cluster-api/releases/tags/${{ steps.v.outputs.capi }} || true
          echo "::endgroup::"

      - name: Fail if the provider never became ready
        if: steps.ready.outcome == 'failure'
        run: exit 1
