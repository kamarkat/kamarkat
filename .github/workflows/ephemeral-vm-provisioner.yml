name: ephemeral-vm-provisioner

on:
  push:
    branches: [main, feat/**]
    paths:
      - operators/ephemeral-vm-provisioner/**
      # The workflow watches its own definition.
      #
      # Without this a change to the build, the verification steps or the
      # digest-writing logic triggers no run, so a fix to CI cannot be validated
      # by CI — the next run happens whenever someone next touches the source,
      # against a workflow nobody has exercised. A broken gofmt check survived
      # two commits this way on 2026-09-02.
      - .github/workflows/ephemeral-vm-provisioner.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verify BEFORE publishing. The image is pinned by digest and deployed
      # straight from this build, so a failure caught here is a failure that
      # never reaches a spoke — and this provisioner creates real Hetzner
      # servers, so a bad build costs money as well as time.
      - uses: actions/setup-go@v5
        with:
          go-version-file: operators/ephemeral-vm-provisioner/go.mod
          cache-dependency-path: operators/ephemeral-vm-provisioner/go.sum

      - name: Verify
        working-directory: operators/ephemeral-vm-provisioner
        run: |
          go build ./...
          go vet ./...
          go test ./...
          # gofmt is checked rather than applied: CI must not rewrite the tree
          # it is validating, and a formatting diff here means the commit was
          # never formatted locally.
          #
          # Captured ONCE into a variable. The first version of this line ran
          # gofmt twice — testing one result and printing another — so a failure
          # could report an empty file list. Worse, it was authored through an
          # unquoted heredoc, which expanded the command substitution at write
          # time and baked a literal filename into the workflow: the test could
          # then never pass, and the list it printed was always empty.
          unformatted="$(gofmt -l . 2>/dev/null)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: operators/ephemeral-vm-provisioner
          # amd64 only, for the reasons documented at length in
          # ephemeral-job-operator.yml: every node in the fleet is x86, and these
          # Dockerfiles do not cross-compile, so a non-native leg runs under QEMU.
          platforms: linux/amd64
          push: true
          # Links the GHCR package to this repository. Without the link an org
          # package grants Actions access to no repository and CI is refused write
          # with a 403 on blob upload, whatever `packages: write` says -- which is
          # what every package re-created by hand at the 2026-11-04 org rename did.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}/ephemeral-vm-provisioner:${{ github.sha }}
            ghcr.io/${{ github.repository }}/ephemeral-vm-provisioner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The edit is re-derived from the branch tip on every attempt, and never
      # rebased. A build takes minutes, so main has usually moved on and a plain
      # push from the stale checkout is rejected:
      #
      #   ! [rejected]  main -> main (fetch first)
      #
      # which is what happens when ten image workflows pin back at once.
      # Rebasing looks like the fix and is not: two runs of THIS workflow rewrite
      # the same digest line in the same file, so the rebase conflicts and the
      # retry then fails on the unmerged files instead.
      #
      # Resetting to the tip and re-applying cannot conflict -- there is never a
      # divergent commit to merge -- and it is self-correcting: if a newer run
      # already pinned a newer digest, this one finds nothing to change and exits
      # rather than reverting it. Same loop as auth-proxy, kube-sbt, mcp-server
      # and postgres-partman.
      - name: Pin the digest just built, re-deriving from the branch tip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          apply() (
          cd operators/ephemeral-vm-provisioner/config
          kustomize edit set image ephemeral-vm-provisioner=ghcr.io/${{ github.repository }}/ephemeral-vm-provisioner@${{ steps.build.outputs.digest }}
          )

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME}"

            # apply runs in a subshell, so its own `exit` does not reach here.
            apply || exit 1

            git add operators/ephemeral-vm-provisioner/config/kustomization.yaml
            if git diff --cached --quiet; then
              echo "digest already pinned on ${GITHUB_REF_NAME} -- nothing to do"
              exit 0
            fi

            git commit --quiet -m "chore(ephemeral-vm-provisioner): update image to ${{ github.sha }}"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pinned on attempt ${attempt}"
              exit 0
            fi

            echo "attempt ${attempt} lost a push race; re-deriving from the new tip"
            sleep $((attempt * 5))
          done
          echo "::error::could not pin the image digest after 5 attempts"
          exit 1
