name: workspace-sync

on:
  push:
    branches: [main, feat/**]
    paths:
      - operators/workspace-sync/**
      # This file. A workflow that does not watch itself cannot react to
      # its own change: when the image path moved to the kamarkat
      # organisation, every workflow was edited and not one of them ran,
      # so the new registry path stayed empty while the old one held the
      # last build.
      - .github/workflows/workspace-sync.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: operators/workspace-sync/go.mod
          cache-dependency-path: operators/workspace-sync/go.sum

      # Tested before it is published, unlike the operator workflow beside this
      # one. This image holds the object-store credential and is the only thing
      # that can overwrite a user's workspace on restore, so shipping it on a
      # green docker build alone is a worse trade here than the extra minute.
      - name: Vet and test
        working-directory: operators/workspace-sync
        run: |
          go vet ./...
          go test ./... -race

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: operators/workspace-sync
          # amd64 only, for the reason documented at length in
          # ephemeral-job-operator.yml: every node in the fleet is x86, nothing
          # here cross-compiles, and the non-native leg runs under QEMU.
          platforms: linux/amd64
          push: true
          # Links the GHCR package to this repository. Without the link an org
          # package grants Actions access to no repository and CI is refused write
          # with a 403 on blob upload, whatever `packages: write` says -- which is
          # what every package re-created by hand at the 2026-11-04 org rename did.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}/workspace-sync:${{ github.sha }}
            ghcr.io/${{ github.repository }}/workspace-sync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The digest is written into the OPERATOR's config, not this component's:
      # workspace-sync has no Deployment of its own. It runs as an init
      # container and a sidecar that ephemeral-job-operator injects into every
      # sandbox pod (ADR-052 §14), so the reference that has to move is the
      # operator's WORKSPACE_SYNC_IMAGE.
      # The edit is re-derived from the branch tip on every attempt, and never
      # rebased. A build takes minutes, so main has usually moved on and a plain
      # push from the stale checkout is rejected:
      #
      #   ! [rejected]  main -> main (fetch first)
      #
      # which is what happens when ten image workflows pin back at once.
      # Rebasing looks like the fix and is not: two runs of THIS workflow rewrite
      # the same digest line in the same file, so the rebase conflicts and the
      # retry then fails on the unmerged files instead.
      #
      # Resetting to the tip and re-applying cannot conflict -- there is never a
      # divergent commit to merge -- and it is self-correcting: if a newer run
      # already pinned a newer digest, this one finds nothing to change and exits
      # rather than reverting it. Same loop as auth-proxy, kube-sbt, mcp-server
      # and postgres-partman.
      - name: Pin the digest just built, re-deriving from the branch tip
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          apply() (
          cd operators/ephemeral-job-operator/config/manager
          python3 - <<'PY'
          import os, re, pathlib, sys

          digest = os.environ["DIGEST"]
          # A tag here would defeat the point: the whole reason to pin is that
          # this image can overwrite a workspace on restore, and a moving
          # reference makes "which code did that" unanswerable after the fact.
          if not digest.startswith("sha256:"):
              sys.exit(f"expected a sha256 digest from buildx, got {digest!r}")
          ref = f"ghcr.io/${{ github.repository }}/workspace-sync@{digest}"

          p = pathlib.Path("manager.yaml")
          s = p.read_text()
          new, n = re.subn(
              r"(name: WORKSPACE_SYNC_IMAGE\n\s+value: ).*",
              lambda m: m.group(1) + ref,
              s,
          )
          # Fail loudly rather than publish an image nothing points at. A silent
          # no-op here ships a new agent that no fleet ever runs, and the only
          # symptom is that a fix appears not to have worked.
          if n != 1:
              sys.exit(
                  f"expected exactly 1 WORKSPACE_SYNC_IMAGE entry in manager.yaml, rewrote {n}"
              )
          p.write_text(new)
          print(f"pinned WORKSPACE_SYNC_IMAGE -> {ref}")
          PY
          )

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME}"

            # apply runs in a subshell, so its own `exit` does not reach here.
            apply || exit 1

            git add operators/ephemeral-job-operator/config/manager/manager.yaml
            if git diff --cached --quiet; then
              echo "digest already pinned on ${GITHUB_REF_NAME} -- nothing to do"
              exit 0
            fi

            git commit --quiet -m "chore(workspace-sync): update image to ${{ github.sha }}"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pinned on attempt ${attempt}"
              exit 0
            fi

            echo "attempt ${attempt} lost a push race; re-deriving from the new tip"
            sleep $((attempt * 5))
          done
          echo "::error::could not pin the image digest after 5 attempts"
          exit 1
