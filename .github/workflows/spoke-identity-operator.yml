name: spoke-identity-operator

on:
  push:
    branches: [main, feat/**]
    paths:
      - operators/spoke-identity-operator/**
      # This file. A workflow that does not watch itself cannot react to
      # its own change: when the image path moved to the kamarkat
      # organisation, every workflow was edited and not one of them ran,
      # so the new registry path stayed empty while the old one held the
      # last build.
      - .github/workflows/spoke-identity-operator.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: operators/spoke-identity-operator
          # amd64 only. Every node in the fleet is x86: Hetzner control planes and
          # the Flatcar home-lab workers alike, so an arm64 image is built and
          # pushed for nothing.
          #
          # It is not merely wasted time. None of these Dockerfiles cross-compile —
          # there is no --platform=$BUILDPLATFORM stage — so buildx runs the whole
          # non-native leg under QEMU. That is slow for the Go images and fatal for
          # the Node one, where pnpm install dies with "qemu: uncaught target
          # signal 4 (Illegal instruction)" and the build hangs.
          #
          # Restore arm64 by adding a cross-compiling builder stage first, not by
          # putting the platform back and emulating.
          platforms: linux/amd64
          push: true
          # Links the GHCR package to this repository. Without the link an org
          # package grants Actions access to no repository and CI is refused write
          # with a 403 on blob upload, whatever `packages: write` says -- which is
          # what every package re-created by hand at the 2026-11-04 org rename did.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}/spoke-identity-operator:${{ github.sha }}
            ghcr.io/${{ github.repository }}/spoke-identity-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The edit is re-derived from the branch tip on every attempt, and never
      # rebased. A build takes minutes, so main has usually moved on and a plain
      # push from the stale checkout is rejected:
      #
      #   ! [rejected]  main -> main (fetch first)
      #
      # which is what happens when ten image workflows pin back at once.
      # Rebasing looks like the fix and is not: two runs of THIS workflow rewrite
      # the same digest line in the same file, so the rebase conflicts and the
      # retry then fails on the unmerged files instead.
      #
      # Resetting to the tip and re-applying cannot conflict -- there is never a
      # divergent commit to merge -- and it is self-correcting: if a newer run
      # already pinned a newer digest, this one finds nothing to change and exits
      # rather than reverting it. Same loop as auth-proxy, kube-sbt, mcp-server
      # and postgres-partman.
      - name: Pin the digest just built, re-deriving from the branch tip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          apply() (
          cd operators/spoke-identity-operator/config/manager
          kustomize edit set image controller=ghcr.io/${{ github.repository }}/spoke-identity-operator@${{ steps.build.outputs.digest }}
          )

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME}"

            # apply runs in a subshell, so its own `exit` does not reach here.
            apply || exit 1

            git add operators/spoke-identity-operator/config/manager/kustomization.yaml
            if git diff --cached --quiet; then
              echo "digest already pinned on ${GITHUB_REF_NAME} -- nothing to do"
              exit 0
            fi

            git commit --quiet -m "chore(spoke-identity-operator): update image to ${{ github.sha }}"
            if git push --quiet origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pinned on attempt ${attempt}"
              exit 0
            fi

            echo "attempt ${attempt} lost a push race; re-deriving from the new tip"
            sleep $((attempt * 5))
          done
          echo "::error::could not pin the image digest after 5 attempts"
          exit 1
