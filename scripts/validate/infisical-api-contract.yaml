# The Infisical endpoints this platform calls, resolved to their COMPLETE route
# in the version the box deploys.
#
# WHY THIS FILE EXISTS. An endpoint constant in our Go source is checkable against
# Infisical's own source, but only on a workstation: reference-projects/ is
# gitignored, so CI has no copy of Infisical to check against. Recording the
# resolved route here splits the question in two, so each half runs where its
# evidence exists:
#
#   * in CI, every constant we ship must match the route recorded here, and the
#     tag here must match the image the box deploys. That catches a changed
#     constant and an Infisical bump taken without re-deriving the routes.
#   * on a workstation with reference-projects/infiscial/infisical, the check
#     RE-DERIVES each route from `git show <tag>:<file>` and fails on any
#     disagreement with this file -- so a transcription error here cannot
#     survive the next developer running the suite.
#
# WHAT CI DOES NOT ESTABLISH. Only the second half compares this file with
# upstream, and ordinary CI has no vendored Infisical, so a green CI run means
# "our constants match what is recorded here", NOT "what is recorded here matches
# Infisical". The check says so in its output rather than leaving the reader to
# infer it. Whenever the pinned version or a recorded route changes, re-run the
# suite where reference-projects is present -- that run is the only evidence this
# file is true, and it is reproducible from the tag alone.
#
# A ROUTER-LOCAL PATH IS NOT A PUBLIC ENDPOINT. `api` + every `mount` prefix +
# `local` is. `mount` is a LIST where a router is registered inside another one --
# /cert-manager then /applications -- because neither string is a prefix the index
# registers on its own. All of it is recorded because the mount is what made this
# necessary: on
# 2026-11-22 a grep for url strings containing "/memberships" reported that the
# membership endpoint did not exist, because the router that serves it is MOUNTED
# at /projects/:projectId/memberships and its own url is only
# /identities/:identityId. The conclusion -- that the grant had never worked --
# was wrong, and it moved an architecture review twice before being caught.
tag: "v0.167.12"

# Where the deployed tag is read from, so a bump cannot pass unnoticed.
deployed_tag_file: manifests/hub-core-services/infisical/values.yaml
deployed_tag_path: [infisical, image, tag]

# Where Infisical's source is, when it is present at all.
vendor: reference-projects/infiscial/infisical

endpoints:
  - name: identity create
    constants:
      - file: operators/hub-operator/internal/constant/endpoints.go
        symbol: APIEndpointIdentities
      - file: operators/spoke-identity-operator/internal/infisical/paths.go
        symbol: PathIdentities
    api: /api/v1
    mount: /identities
    local: /
    methods: [POST]
    index: backend/src/server/routes/v1/index.ts
    router: backend/src/server/routes/v1/identity-router.ts
    # The org role an identity is created with when the request omits it. Recorded
    # because our two creators both omit it, and what it defaults to decides what
    # a new identity can do before any project membership exists.
    notes: "role defaults to OrgMembershipRole.NoAccess in the router's schema"

  - name: project create and list
    # Recorded ahead of the per-cluster secrets project work, so that lifecycle is
    # written against a route this version serves rather than against an assumed
    # one. POST creates; GET lists, which is how a project is found by slug since
    # there is no find-by-slug route at this version.
    constants:
      - file: operators/hub-operator/internal/constant/endpoints.go
        symbol: APIEndpointProjects
      - file: operators/spoke-identity-operator/internal/infisical/paths.go
        symbol: PathProjects
    api: /api/v1
    mount: /projects
    local: /
    methods: [POST, GET]
    index: backend/src/server/routes/v1/index.ts
    router: backend/src/server/routes/v1/project-router.ts

  - name: project environment create
    # Created by HUB-OPERATOR, which owns the project because it writes the
    # secrets that go in it; the identity operator only looks the project up by
    # slug. The cluster's own environment is created explicitly: a project made with
    # Infisical's default environments gets dev/staging/prod, and a cluster
    # serving `stg` would select an environment one word away from `staging` and
    # find it empty -- so the lifecycle passes shouldCreateDefaultEnvs: false and
    # creates the declared slug itself.
    constants:
      - file: operators/hub-operator/internal/constant/endpoints.go
        symbol: APIEndpointProjectEnvironments
    api: /api/v1
    mount: /projects
    local: /:projectId/environments
    methods: [POST]
    index: backend/src/server/routes/v1/index.ts
    router: backend/src/server/routes/v1/project-env-router.ts

  - name: project environment by slug
    # How the environment step stays idempotent. There is a by-slug route for
    # environments, unlike for projects.
    constants:
      - file: operators/hub-operator/internal/constant/endpoints.go
        symbol: APIEndpointProjectEnvironmentSlug
    api: /api/v1
    mount: /projects
    local: /:projectId/environments/slug/:envSlug
    methods: [GET]
    index: backend/src/server/routes/v1/index.ts
    router: backend/src/server/routes/v1/project-env-router.ts

  - name: pki application by name
    # How the certificate issuer resolves the application it signs through, and
    # how the operator finds the application to scope an identity to. PKI
    # authorization is an application surface, not a project one.
    constants:
      - file: operators/spoke-identity-operator/internal/infisical/paths.go
        symbol: PathCertManagerApplicationByName
    api: /api/v1
    # Nested: /cert-manager, then /applications inside it.
    mount: [/cert-manager, /applications]
    local: /by-name/:name
    methods: [GET]
    index: backend/src/server/routes/v1/index.ts
    router: backend/src/server/routes/v1/pki-application-router.ts

  - name: pki application identity membership
    # The role that permits issuance, held on the application. A DIFFERENT route
    # from a project membership and not interchangeable with one: an identity with
    # the project role and not this cannot issue, and with this and not the project
    # role cannot resolve its certificate profile.
    constants:
      - file: operators/spoke-identity-operator/internal/infisical/paths.go
        symbol: PathCertManagerAppIdentity
      - file: internal/kakt-cli/infisical/paths.go
        symbol: PathCertManagerAppIdentityFmt
    api: /api/v1
    mount: [/cert-manager, /applications]
    local: /:applicationId/identities/:identityId
    methods: [POST, PATCH, DELETE]
    index: backend/src/server/routes/v1/index.ts
    router: backend/src/server/routes/v1/pki-application-membership-routers/identities-router.ts

  - name: identity project membership
    constants:
      - file: operators/hub-operator/internal/constant/endpoints.go
        symbol: APIEndpointProjectMemberships
      - file: operators/spoke-identity-operator/internal/infisical/paths.go
        symbol: PathProjectMembershipsIdentities
    api: /api/v1
    mount: /projects/:projectId/memberships
    local: /identities/:identityId
    # PATCH replaces the membership's whole role set -- membership-identity-service
    # deletes every membershipRole for the membership and inserts the given ones in
    # one transaction -- so it is how an unwanted role is removed, not added to.
    # GET reads the roles back. DELETE removes the membership outright.
    methods: [POST, PATCH, DELETE, GET]
    index: backend/src/server/routes/v1/index.ts
    router: backend/src/server/routes/v1/identity-project-membership-router.ts

# Routes Infisical still serves and we must NOT adopt. Recorded so "it exists" is
# never mistaken for "it is the one to call": both of these resolve, and only the
# endpoints above are current.
deprecated:
  - api: /api/v1
    mount: /projects
    local: /:projectId/identity-memberships/:identityId
    router: backend/src/server/routes/v1/deprecated-identity-project-membership-router.ts
    why: the superseded identity-membership router, still registered for compatibility
