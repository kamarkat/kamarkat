repos:
  - repo: local
    hooks:
      - id: helm-lint-environment-manager
        name: Helm Lint Environment Manager
        entry: bash -c '. scripts/lib/tool-path.sh && helm lint manifests/argocd/environment-manager/'
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: schema-validate-environment-manager
        name: Kubernetes Schema Validation
        entry: bash -c ". scripts/lib/tool-path.sh && set -o pipefail; helm template environment-manager manifests/argocd/environment-manager/ --set environmentRevision=dry-run --set environmentSlug=prod --set management.infisicalEnvironmentSlug=prod --set boxId=example-box --set provider=hetzner --set topology=single --set publicTlsIssuer=letsencrypt-prod --set hubDomain=dev.example.test --set previewDomain=example-preview.test --set 'alerting.emailTo[0]=alerts@example.test' --set instanceRepoURL=https://github.com/example-org/example-gitops | kubeconform -summary -ignore-missing-schemas"
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: helm-lint-values-yaml
        name: Helm Values YAML Lint
        entry: scripts/lint-helm-values-yaml.sh
        language: python
        additional_dependencies: ['yamllint']
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: workflow-secrets
        name: Workflow Secrets Declared And Forwarded
        entry: python3 scripts/validate/workflow-secrets.py .
        language: system
        pass_filenames: false
        files: '(\.github/workflows/.*|.*/gitops-template/\.github/workflows/.*|scripts/validate/workflow-secrets\.py)'
      - id: argocd-seed-parity
        name: ArgoCD Day-0 Seed Parity
        entry: scripts/validate-argocd-seed-parity.sh
        language: system
        pass_filenames: false
      - id: shipped-artifacts
        name: No Per-Box Identity In Shipped Artifacts
        entry: scripts/validate-shipped-artifacts.sh
        language: system
        pass_filenames: false
        files: '(manifests/argocd/environment-manager/.*|internal/kakt-cli/(components/installer\.go|versions/versions\.go))'
      - id: component-descriptors
        name: Component Descriptors
        entry: scripts/validate-component-descriptors.sh
        language: system
        pass_filenames: false
        files: '(manifests/argocd/components/.*|manifests/argocd/environment-manager/.*)'
      - id: cluster-name-contract
        name: Spoke cluster-name Contract
        entry: scripts/validate-cluster-name-contract.sh
        language: system
        pass_filenames: false
        files: '(manifests/argocd/environment-manager/.*|manifests/providers/.*/k8s/spokepool-.*-composition\.yaml)'
      - id: yamllint-all
        name: YAML Lint
        # language: python + additional_dependencies, NOT system.
        #
        # As a system hook this ran whatever `yamllint` PATH happened to offer, so a
        # commit from an editor or GUI -- which inherits a minimal PATH and never
        # sourced a login shell -- died with
        #
        #   xargs: yamllint: No such file or directory
        #
        # while the same commit from a terminal passed. pre-commit now creates the
        # environment itself, so the hook behaves identically for everyone and needs
        # nothing installed. The xargs wrapper went with it: pre-commit already
        # passes filenames as arguments.
        entry: yamllint -c .yamllint.yaml
        language: python
        additional_dependencies: [yamllint==1.35.1]
        pass_filenames: true
        types: [yaml]
        files: '\.yaml$'
      - id: validate-embedded-yaml
        name: Validate Embedded YAML (stringData block scalars)
        # always_run, because the alternative is a hook that skips on most commits
        # and is therefore never seen to pass. The script discovers the files the
        # pattern below selects when it is given none, so running unconditionally
        # checks all 23 of them rather than checking nothing and reporting success.
        always_run: true
        # language: python + additional_dependencies, NOT system.
        #
        # `python3` as a system hook is whichever interpreter PATH resolves, and
        # from a GUI commit that is /usr/bin/python3, which has no PyYAML:
        #
        #   ModuleNotFoundError: No module named 'yaml'
        #
        # The developer's own python3 (a pyenv shim here) had it, so this passed in
        # a terminal and failed in the editor. pre-commit now owns the interpreter
        # and the dependency, which is the only way this validator runs the same way
        # for everyone.
        entry: python scripts/validate-embedded-yaml.py
        language: python
        additional_dependencies: [pyyaml==6.0.2]
        pass_filenames: true
        types: [yaml]
        files: 'manifests/.*/k8s/.*\.yaml$|manifests/.*/spoke-bootstrap/.*\.yaml$|internal/assets/manifests/addons/.*\.yaml$'
      - id: kustomize-build-providers
        name: Kustomize Build (provider cells + spoke catalog)
        # hetzner/base is consumed by BOTH cells, so a change there must build both.
        # The previous hook watched only manifests/providers/hybrid/, so edits to
        # hetzner/base/ or hetzner/ could break ArgoCD sync ungated.
        # spoke-catalog is here because it was not anywhere. It is a kustomize root
        # of ~330 objects carrying every vendored spoke operator, and a break in it
        # fails ArgoCD sync on every spoke -- yet no hook built it, so an edit to
        # its kustomization or a re-vendor of one of its charts was checked by
        # nothing until a cluster tried to sync.
        entry: bash -c '. scripts/lib/tool-path.sh && for d in manifests/providers/hybrid manifests/providers/hetzner manifests/spoke/spoke-catalog/infra; do kubectl kustomize --enable-helm "$d" >/dev/null || { echo "kustomize build failed for $d - broken YAML will fail ArgoCD sync"; exit 1; }; done'
        language: system
        pass_filenames: false
        files: 'manifests/providers/(hybrid|hetzner)/.*|manifests/spoke/spoke-catalog/.*'
      - id: hub-operator-build
        name: Build Hub Operator
        entry: bash -c ". scripts/lib/tool-path.sh && cd operators/hub-operator && make build"
        language: system
        pass_filenames: false
        files: 'operators/hub-operator/.*\.go$'
      - id: embedded-platform-assets
        name: The Embed Set Carries Every Script Day-0 Reaches
        # WHAT THIS ASKS NOW. The embedded tree is generated and NOT committed
        # (.gitignore covers manifests/, scripts/ and _operators/), and both
        # build-cli.sh and publish.sh regenerate it before they read it -- so it
        # cannot drift from its source, and the drift this hook was written for
        # is no longer reachable.
        #
        # It asked that question anyway, by syncing to a temporary tree and
        # diffing it against internal/platform/embedded. On a clean checkout that
        # directory holds four .go files and the synced tree holds 286, so the
        # diff always differed: the hook could never PASS, the way the version
        # before it could never FAIL. It took a push to main to find out, because
        # until 2026-11-22 nothing ran it outside a workstation whose tree
        # happened to be populated.
        #
        # The question that still has meaning is completeness: does the embed set
        # carry every script and manifest Day-0 and the validators reach? That is
        # what runtime-script-closure.py asks, and embed-platform-assets.sh runs
        # it and exits non-zero on a missing one. So the generator IS the check,
        # and it can both pass and fail.
        entry: bash -c '. scripts/lib/tool-path.sh && ./scripts/package/embed-platform-assets.sh'
        language: system
        pass_filenames: false
        # Any manifest, not the embed set restated. The set lives in
        # scripts/package/embed-platform-assets.sh and has changed since; the
        # narrower pattern this replaces named four directories and omitted
        # manifests/spoke/spoke-bootstrap/cilium-addon-template.yaml, which IS
        # embedded -- so editing the Cilium artifact that carries the ADR-075
        # mtu and devices values triggered nothing and the embedded copy went
        # stale in silence. A superset cannot under-trigger, and the check costs
        # a quarter of a second, so over-triggering is the cheaper mistake.
        files: '^(manifests/.*|internal/platform/embedded/.*)'
