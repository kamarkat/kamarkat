---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spoke-identity-operator-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - identity.kamarkat.io
  resources:
  - spokemachineidentities
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - identity.kamarkat.io
  resources:
  - spokemachineidentities/finalizers
  verbs:
  - update
- apiGroups:
  - identity.kamarkat.io
  resources:
  - spokemachineidentities/status
  verbs:
  - get
  - patch
  - update
