apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoke-identity-operator
  namespace: platform-security
  labels:
    control-plane: spoke-identity-operator
spec:
  selector:
    matchLabels:
      control-plane: spoke-identity-operator
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: spoke-identity-operator
    spec:
      serviceAccountName: spoke-identity-operator
      containers:
      - name: manager
        image: controller
        env:
        # THIS box's Infisical. The spoke ClusterIssuer this operator renders used
        # to name the platform's, from a compile-time constant, so every spoke's
        # certificates were signed by a stranger -- or, on a tenant's box, not
        # signed at all: the issuer reports "healthcheck failed: ... EOF" and every
        # Certificate naming it stays pending. Written into infisical-auth by Day-0
        # from the box's own HubEnvironment domain (ADR-051).
        - name: SECRET_STORE_URL
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: url
        - name: SECRET_STORE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: client-id
        - name: SECRET_STORE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: client-secret
        - name: SECRET_STORE_ORGANIZATION_ID
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: orgId
        - name: SECRET_STORE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: projectId
        - name: SECRET_STORE_SECRETS_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: secretsProjectId
              optional: true
        args:
        - --infisical-url=http://infisical-standalone-infisical.platform-security.svc:8080
        - --infisical-org-id=$(SECRET_STORE_ORGANIZATION_ID)
        - --infisical-project-id=$(SECRET_STORE_PROJECT_ID)
        - --infisical-secrets-project-id=$(SECRET_STORE_SECRETS_PROJECT_ID)
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
