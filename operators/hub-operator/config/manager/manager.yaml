apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-operator
  namespace: system
  labels:
    control-plane: hub-operator
    app.kubernetes.io/name: hub-operator
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      control-plane: hub-operator
      app.kubernetes.io/name: hub-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: hub-operator
        app.kubernetes.io/name: hub-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        env:
        # Bootstrap Configuration from ConfigMap
        - name: CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: hub-bootstrap-config
              key: CLUSTER_ID
        - name: CLUSTER_REGION
          valueFrom:
            configMapKeyRef:
              name: hub-bootstrap-config
              key: CLUSTER_REGION
        # ADR-078 add.5 §4: where each cluster's log bucket is created -- the
        # box's region, the same object storage its database backups use.
        - name: OBJECT_STORAGE_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: hub-bootstrap-config
              key: OBJECT_STORAGE_ENDPOINT
              optional: true
        - name: OBJECT_STORAGE_REGION
          valueFrom:
            configMapKeyRef:
              name: hub-bootstrap-config
              key: CLUSTER_REGION
        # The box's escrow (Infisical Cloud), outside the box: kubeconfigs, Cluster
        # API trust roots and the management-state backup key
        # (ADR-076). optional throughout: a box may be built without one, and the
        # operator reports that rather than crash-looping on a missing Secret.
        - name: ESCROW_PROVIDER_URL
          valueFrom:
            secretKeyRef:
              name: hub-operator-escrow-credentials
              key: ESCROW_PROVIDER_URL
              optional: true
        - name: ESCROW_PROVIDER_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: hub-operator-escrow-credentials
              key: ESCROW_PROVIDER_PROJECT_ID
              optional: true
        - name: ESCROW_PROVIDER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: hub-operator-escrow-credentials
              key: ESCROW_PROVIDER_CLIENT_ID
              optional: true
        - name: ESCROW_PROVIDER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hub-operator-escrow-credentials
              key: ESCROW_PROVIDER_CLIENT_SECRET
              optional: true
        # The box's OpenBao (ADR-117): the listener CA it is verified against, and
        # a ServiceAccount token for audience "openbao", rotated by the kubelet and
        # re-read on every login.
        volumeMounts:
          - name: openbao-trust
            mountPath: /etc/openbao/trust
            readOnly: true
          - name: openbao-token
            mountPath: /var/run/secrets/openbao
            readOnly: true
      volumes:
        - name: openbao-trust
          configMap:
            name: openbao-listener-trust
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 3600
                  path: token
      serviceAccountName: hub-operator
      terminationGracePeriodSeconds: 10
