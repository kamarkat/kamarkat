apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-production
spec:
  domain: nutgraf.in
  tls:
    issuer: letsencrypt-prod
    email: ops@nutgraf.in
  observability:
    victoriaMetrics:
      retentionPeriod: 90d
    grafanaAlloy:
      scrapeInterval: 15s
  database:
    namespace: platform-data
    # Login roles whose passwords OpenBao generates and rotates (ADR-117 §7.3).
    roles:
    - name: hub_zitadel
      database: zitadel
      # The application's own cluster (ADR-112).
      clusterRef: zitadel-db
  oauth:
    clients:
    - clientId: mcp-server
      clientName: "MCP Server"
      redirectUris:
      - "https://mcp.dev.nutgraf.in/callback"
      grantTypes:
      - authorization_code
      - refresh_token
      responseTypes:
      - code
