apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-production
spec:
  domain: nutgraf.in
  tls:
    issuer: letsencrypt-prod
    email: ops@nutgraf.in
  observability:
    victoriaMetrics:
      retentionPeriod: 90d
    grafanaAlloy:
      scrapeInterval: 15s
  database:
    # The bootstrap cluster: Infisical's own, which the operator itself depends on.
    clusterRef: infisical-db
    namespace: platform-data
    roles:
    - name: hub_zitadel
      database: zitadel
      # The application's own cluster (ADR-112). Required: a role provisioned on
      # another application's cluster is one this application cannot use.
      clusterRef: zitadel-db
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
    - name: openmeter
      database: openmeter
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
  oauth:
    clients:
    - clientId: mcp-server
      clientName: "MCP Server"
      redirectUris:
      - "https://mcp.dev.nutgraf.in/callback"
      grantTypes:
      - authorization_code
      - refresh_token
      responseTypes:
      - code
  secrets:
    infisical:
      projectSlug: hub-platform
      # The management secret scope (ADR-111 Revision 7 §2), not a workload
      # environment: this is where the hub's OWN credentials live.
      environmentSlug: management
