# Adds namespace to all resources.
namespace: platform-ops

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
# namePrefix: hub-operator-

# Labels to add to all resources and selectors.
# labels:
# - includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
- ../certmanager
# [WEBHOOK] SpokePool admission. Listed from 2026-11-22; before that the
# configurations in ../webhook were never delivered, so hub-operator's provider
# resolution was not in force on any box and nothing said so -- see the comment
# on the patch below.
- ../webhook
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
# - ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Protect the /metrics endpoint and Webhook Server with NetworkPolicy.
# Only Pod(s) running a namespace labeled with 'metrics: enabled' will be able to gather the metrics.
# Only CR(s) which requires webhooks and are applied on namespaces labeled with 'webhooks: enabled' will
# be able to communicate with the Webhook Server.
# - ../network-policy

# Uncomment the patches line if you enable Metrics
patches:
# [ARGOCD] Add sync-wave annotation to CRD for proper sequencing
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "0"
  target:
    kind: CustomResourceDefinition
    name: hubenvironments.ops.nutgraf.in
# [ARGOCD] Add sync-wave annotation to Deployment for proper sequencing
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "1"
  target:
    kind: Deployment
    name: hub-operator
# Replicas stay at the base manifest's 1. This used to patch it to 2 under a
# bare "[CUSTOM] Patch replica count" with no reasoning, and the second pod was
# never doing anything: the operator takes a leader-election lease
# (6b46dbfb.nutgraf.in), one pod holds it, and the other idles as a warm standby.
#
# What that standby bought was a faster failover -- seconds, instead of a pod
# reschedule -- for a controller that sits in no request path. What it cost was a
# second 256Mi+ pod on every hub. On a hybrid hub it did not even buy the
# failover: there is one worker, so both replicas land on the same node and die
# together with it.
#
# This is not environment-gated, because it cannot be here: the component
# descriptor (manifests/argocd/components/03/hub-operator.yaml) is read by
# ArgoCD's git file generator as plain YAML, not rendered by the
# environment-manager chart, so .Values.environmentSlug is not in scope. Making
# it vary per environment means giving boundary-03 descriptors a patch mechanism
# they do not have -- a larger change than this is worth.
#
# So prod drops to one replica too, and that is the deliberate part: a
# kubebuilder operator at replicas: 1 is the upstream scaffold's own default, and
# the base manifest here has always said 1.
# [CUSTOM] Add image pull secret for GHCR
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull-secret
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append the Tenant Identity Service address
#
# Unset means this environment does not provision tenant identity, and the
# reconciler skips it — an issuer with no notion of a tenant has nothing to
# create, so absence is a configuration rather than a fault.
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: IDENTITY_SERVICE_URL
        # Port 80 — the SERVICE port, not the container's.
        #
        # The Service publishes 80 and targets the container's named "http"
        # port, which is 8080. Dialling 8080 at the ClusterIP reaches nothing,
        # and nothing rejects it either: the connection simply hangs until the
        # caller's timeout, so it surfaces as "context deadline exceeded" and
        # looks like a slow or unreachable service rather than a wrong port.
        #
        # The NetworkPolicy beside that service correctly names 8080, because
        # policy ports are the POD's. The two numbers are both right and are not
        # interchangeable.
        value: "http://kube-sbt.platform-ops.svc.cluster.local:80"
  target:
    kind: Deployment
    name: hub-operator
# Note: the escrow env vars (ESCROW_PROVIDER_*) are already defined in
# config/manager/manager.yaml — not duplicated here.
# [CUSTOM] Patch resource requests/limits for production
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 512Mi
  target:
    kind: Deployment
    name: hub-operator
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# Uncomment the patches line if you enable Metrics and CertManager
# [METRICS-WITH-CERTS] To enable metrics protected with certManager, uncomment the following line.
# This patch will protect the metrics with certManager self-signed certs.
# - path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# [WEBHOOK] The webhook server's port and serving certificate.
#
# This patch was commented out, ../webhook was not in resources, and main.go
# registered nothing -- three halves of one omission, which is why it read as
# deliberate for three weeks. The Deployment had `ports: []` and no cert mount,
# so even a registered webhook had nothing to serve on.
#
# The CA bundle is injected by cert-manager from the annotation on each
# configuration in ../webhook rather than by the scaffold's `replacements`
# block below: certmanager/certificate.yaml already names platform-ops in its
# dnsNames, so the namespace is not a variable here and assembling it from
# field paths would only hide where it comes from.
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment
    name: hub-operator

