---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
# The SpokePool validating webhook reads the Composition the provider registry
# names, to establish that this box carries it and that it composes SpokePool.
# Read-only: compositions are delivered by GitOps and are not this operator's to
# write.
- apiGroups:
  - apiextensions.crossplane.io
  resources:
  - compositions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - validatingwebhookconfigurations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cluster.x-k8s.io
  resources:
  - clusters
  - machines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - identity.zeroops.io
  resources:
  - spokemachineidentities
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nutgraf.in
  resources:
  - ainativesaases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nutgraf.in
  resources:
  - ainativesaases/status
  - spokepools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - nutgraf.in
  resources:
  - spokepools
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - ops.nutgraf.in
  resources:
  - hubenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.nutgraf.in
  resources:
  - hubenvironments/finalizers
  verbs:
  - update
- apiGroups:
  - ops.nutgraf.in
  resources:
  - hubenvironments/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - get
  - list
  - watch
