---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hubenvironments.ops.nutgraf.in
spec:
  group: ops.nutgraf.in
  names:
    kind: HubEnvironment
    listKind: HubEnvironmentList
    plural: hubenvironments
    singular: hubenvironment
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HubEnvironment is the Schema for the hubenvironments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HubEnvironment
            properties:
              boxId:
                description: |-
                  BoxID is the logical hub: this box, for as long as it exists (ADR-111 §1).

                  Separate from ClusterName because one field was carrying two lifetimes. The
                  box's identity keys what must survive a cluster being replaced -- the escrow
                  path holding the secret store's master keys and the identity provider's
                  encryption key, and the external-dns owner id that decides which records are
                  this box's to publish. The CLUSTER's identity keys what is replaced with it:
                  the WAL archive prefix, the CAPI object names, the admin kubeconfig and the
                  at-rest encryption key.

                  While the two were one value, a hub could not be replaced without re-keying
                  everything the box owns, which is why ClusterName's comment below had to say
                  it is pinned forever. Declared rather than defaulted from ClusterName: a
                  default would make the first successor inherit its predecessor's cluster name
                  as the box id on one box and not another, and the value is unchangeable once
                  anything has been written under it.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              clusterName:
                description: |-
                  ClusterName is this box's cluster, as CAPI knows it and as the escrow keys
                  cluster-scoped artefacts by (e.g. nutgraf-hub).

                  This is the CLUSTER, not the box: a successor hub carries a new one, while
                  BoxID above stays. Artefacts that must outlive the cluster are keyed by the
                  box; see escrow.Identity.

                  Declared rather than derived from metadata.name. HubEnvironment is a
                  cluster-scoped singleton always named "hub-environment", and that name was
                  being used as the cluster's identity: the admin kubeconfig was looked for at
                  platform-capi/hub-environment-kubeconfig, which CAPI never creates, so it
                  was never escrowed on any box; and the master keys went to the escrow path
                  /hub-operator/hub-environment, a constant, so every box in a shared escrow
                  project overwrote the same entry while `soloz kubeconfig` read
                  /hub-operator/<cluster> and found nothing.
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              database:
                description: Database configuration for CNPG cluster and roles
                properties:
                  clusterRef:
                    description: |-
                      ClusterRef is the box's BOOTSTRAP cluster: the one Infisical's own database
                      lives on (e.g., infisical-db).

                      It is not a default for roles. Each application owns its own cluster (ADR-112)
                      and declares it on the role, so the only thing a box-level name can mean is the
                      cluster the operator itself depends on: Day-0 waits for it, the generated
                      bootstrap secrets address it, and its CA is the one Infisical is handed.
                    type: string
                  namespace:
                    description: Namespace of the CNPG Cluster
                    type: string
                  roles:
                    description: Roles to be created in the database
                    items:
                      description: DatabaseRole defines a database role specification
                      properties:
                        clusterRef:
                          description: |-
                            ClusterRef is the CNPG Cluster this role lives on. REQUIRED.

                            Named per role because that is the grain reality has: a box runs one cluster per
                            platform application (ADR-112) and a role exists on exactly one of them.
                            Reconciling or rotating it against another cluster either fails or, worse,
                            succeeds against the wrong application's database.

                            Required rather than defaulted for that second case. A role whose cluster is
                            assumed is provisioned somewhere plausible and silently wrong, and the API is
                            where that is cheapest to refuse.
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        database:
                          description: Database name where the role has permissions
                          type: string
                        name:
                          description: Name of the database role
                          pattern: ^[a-z_][a-z0-9_]*$
                          type: string
                        permissions:
                          description: Permissions granted to the role (e.g., SELECT,
                            INSERT, UPDATE, DELETE)
                          items:
                            type: string
                          type: array
                      required:
                      - clusterRef
                      - database
                      - name
                      type: object
                    type: array
                required:
                - clusterRef
                - namespace
                type: object
              domain:
                description: Domain is the base domain for the Hub cluster (e.g.,
                  nutgraf.in)
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              environment:
                description: |-
                  Environment is the platform environment identity for this Hub and the single
                  authority for it. Every environment-scoped value — the public DNS zone, the
                  secret store's project environment, and anything added later — derives from
                  this field rather than declaring its own copy.
                enum:
                - dev
                - stg
                - prod
                - ephemeral
                type: string
              oauth:
                description: OAuth configuration for Hydra clients
                properties:
                  clients:
                    description: Clients to be registered with Hydra
                    items:
                      description: OAuthClient defines an OAuth client specification
                      properties:
                        clientId:
                          description: ClientID is the unique identifier for the OAuth
                            client
                          type: string
                        clientName:
                          description: ClientName is the human-readable name for the
                            OAuth client
                          type: string
                        grantTypes:
                          description: GrantTypes are the allowed OAuth grant types
                          items:
                            type: string
                          type: array
                        redirectUris:
                          description: RedirectURIs are the allowed redirect URIs
                            for the client
                          items:
                            type: string
                          type: array
                        responseTypes:
                          description: ResponseTypes are the allowed OAuth response
                            types
                          items:
                            type: string
                          type: array
                      required:
                      - clientId
                      - clientName
                      type: object
                    type: array
                type: object
              observability:
                description: Observability configuration for metrics and monitoring
                properties:
                  grafanaAlloy:
                    description: GrafanaAlloy configuration
                    properties:
                      scrapeInterval:
                        default: 30s
                        description: ScrapeInterval for metrics collection (e.g.,
                          "30s", "15s")
                        type: string
                    type: object
                  victoriaMetrics:
                    description: VictoriaMetrics configuration
                    properties:
                      retentionPeriod:
                        default: 30d
                        description: RetentionPeriod for metrics storage (e.g., "30d",
                          "90d")
                        type: string
                    type: object
                type: object
              secrets:
                description: Secrets configuration for Infisical backup
                properties:
                  infisical:
                    description: Infisical configuration for secret backup
                    properties:
                      environmentSlug:
                        default: prod
                        description: EnvironmentSlug is the Infisical environment
                          identifier
                        type: string
                      projectSlug:
                        default: hub-platform
                        description: ProjectSlug is the Infisical project identifier
                        type: string
                    type: object
                type: object
              tls:
                description: TLS configuration for the Hub cluster
                properties:
                  email:
                    description: Email for Let's Encrypt notifications
                    format: email
                    type: string
                  issuer:
                    description: Issuer is the cert-manager ClusterIssuer name
                    type: string
                required:
                - email
                - issuer
                type: object
            required:
            - database
            - domain
            - environment
            type: object
            x-kubernetes-validations:
            - message: 'domain must be the environment''s own zone: for a non-production
                environment, domain must begin with that environment as its leftmost
                label (ADR-051 env-as-zone)'
              rule: self.environment == 'prod' || self.domain.startsWith(self.environment
                + '.')
            - message: 'production must use the apex domain unlabelled: domain must
                not begin with a non-production environment label (ADR-051 env-as-zone)'
              rule: self.environment != 'prod' || !(['dev.','stg.','ephemeral.'].exists(p,
                self.domain.startsWith(p)))
            - message: 'secrets.infisical.environmentSlug must equal spec.environment:
                environment identity has a single authority and services consume it
                (ADR-043 single authority per domain)'
              rule: '!has(self.secrets) || !has(self.secrets.infisical) || !has(self.secrets.infisical.environmentSlug)
                || size(self.secrets.infisical.environmentSlug) == 0 || self.secrets.infisical.environmentSlug
                == self.environment'
          status:
            description: status defines the observed state of HubEnvironment
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the HubEnvironment resource.
                  Standard condition types:
                  - SecretZeroGenerated: Secret Zero bootstrap secrets have been created
                  - SecretsBackedUp: Secrets have been uploaded to Infisical
                  - OAuthClientsRegistered: OAuth clients have been registered with Hydra
                  - Ready: All phases complete successfully
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed HubEnvironment
                format: int64
                type: integer
              phase:
                description: |-
                  Phase represents the high-level lifecycle phase of the HubEnvironment
                  Valid phases: Provisioning, Available, Degraded, Failed
                  - Provisioning: Controllers are actively converging, pods may be NotReady
                  - Available: Readiness contract met, system is fully operational
                  - Degraded: System was Available, but a dependency dropped or drifted
                  - Failed: Terminal failure requiring manual intervention
                enum:
                - Provisioning
                - Available
                - Degraded
                - Failed
                type: string
              uploadedSecrets:
                description: |-
                  UploadedSecrets tracks which secrets have been uploaded to Infisical
                  This prevents re-uploading secrets that already exist
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
