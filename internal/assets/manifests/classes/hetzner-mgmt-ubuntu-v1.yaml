apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: hetzner-mgmt-ubuntu-v1
  namespace: platform-capi
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: hetzner-mgmt-control-plane-v5
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: hetzner-mgmt-ubuntu-control-plane-machine
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: hetzner-mgmt-ubuntu-cluster
  workers:
    machineDeployments:
    - class: default-worker
      template:
        bootstrap:
          ref:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: KubeadmConfigTemplate
            name: hetzner-mgmt-worker-bootstrap-v2
        infrastructure:
          ref:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            name: hetzner-mgmt-ubuntu-worker-machine
  variables:
  - name: region
    required: true
    schema:
      openAPIV3Schema:
        type: string
        default: hel1
  - name: imageId
    required: true
    schema:
      openAPIV3Schema:
        type: string
        default: ubuntu-24.04
  # The OIDC provider the API server accepts tokens from.
  #
  # Variables rather than literals in the template, for the reason the SSH key
  # taught us: a literal nothing overrides is a value nobody is reviewing, and
  # these two in particular go stale the moment the platform changes issuer —
  # silently, because a wrong issuer does not stop the cluster, it only stops
  # people logging into it.
  #
  # They are also the ONLY way to change these flags without replacing the
  # control-plane template. KubeadmControlPlaneTemplate.spec is immutable, so a
  # literal edit is rejected outright and needs a new template plus a class
  # repoint; a patch is rendered into the generated KubeadmControlPlane instead,
  # which the topology controller updates in place.
  #
  # Empty by default, and the patch below is off when they are. That is what a
  # fresh bootstrap needs: the issuer runs ON this cluster, so at the moment the
  # control plane is created it does not exist yet and cannot be pointed at.
  # OIDC is enabled afterwards by setting these, which costs one control-plane
  # rollout and is a deliberate act rather than a bootstrap that half-works.
  - name: oidcIssuerURL
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
  - name: oidcClientID
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: ""
  # ADR-046: on the hybrid cell the hub runs NO Hetzner workers — worker capacity
  # comes from the Flatcar home-lab nodes, which join manually after the bootstrap
  # finishes. During boundary-01..05 the control plane is therefore the only node
  # that exists, so it must be schedulable or every platform workload sits Pending
  # and the bootstrap stalls.
  #
  # Defaults to false so the pure-Hetzner hub (2 cx33 workers) keeps its
  # control-plane taint exactly as tested. Only the hybrid driver turns it on.
  # The spoke is unaffected and deliberately keeps its taint (d74cbeaa).
  - name: controlPlaneSchedulable
    required: false
    schema:
      openAPIV3Schema:
        type: boolean
        default: false
  - name: hcloudControlPlaneMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: cpx31
  - name: hcloudWorkerMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: cpx31
  - name: hcloudNetwork
    required: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          enabled:
            type: boolean
          cidrBlock:
            type: string
          subnetCidrBlock:
            type: string
          networkZone:
            type: string
  - name: hcloudSSHKeyName
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: "mac-mini-ssh"
  patches:
  # Point the API server at the platform's OIDC issuer.
  #
  # `add` on an existing key replaces it, so this overrides whatever the template
  # carries — which is how the flags move without touching the immutable
  # template at all.
  #
  # oidc-groups-claim is REMOVED rather than set. Kubernetes needs a flat string
  # array, and an issuer that models authorisation as roles granted within an
  # organisation emits a NESTED object instead; pointing the flag at it yields
  # no groups, and pointing it at a claim that does not exist makes every login
  # groupless while looking configured. Until that mapping exists, RBAC binds to
  # the username (email) and the flag says nothing rather than something false.
  #
  # enabledIf requires BOTH values. Half-configured OIDC is worse than none: the
  # API server would start, accept the flag it has, and reject every token for
  # the one it lacks.
  - name: oidcProvider
    enabledIf: "{{ if and .oidcIssuerURL .oidcClientID }}true{{ end }}"
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta1
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/oidc-issuer-url
        valueFrom:
          variable: oidcIssuerURL
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/oidc-client-id
        valueFrom:
          variable: oidcClientID
      - op: remove
        path: /spec/template/spec/kubeadmConfigSpec/clusterConfiguration/apiServer/extraArgs/oidc-groups-claim
  # An empty taint list is kubeadm's declarative "register this node with no
  # taints". Preferred over letting the default control-plane taint apply and
  # removing it afterwards in a postKubeadmCommand, which races the scheduler
  # placing the first pods. enabledIf keeps the patch off entirely unless the
  # hybrid driver asks for it.
  - name: controlPlaneSchedulable
    enabledIf: "{{ if .controlPlaneSchedulable }}true{{ end }}"
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta1
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/initConfiguration/nodeRegistration/taints
        value: []
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/joinConfiguration/nodeRegistration/taints
        value: []
  - name: region
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/controlPlaneRegions
        valueFrom:
          template: "[{{ .region | quote }}]"
      - op: add
        path: /spec/template/spec/controlPlaneLoadBalancer/region
        valueFrom:
          variable: region
  - name: sshKeyName
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/sshKeys/hcloud/0/name
        valueFrom:
          variable: hcloudSSHKeyName
  - name: imageControlPlane
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/imageName
        valueFrom:
          variable: imageId
  - name: imageWorker
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          machineDeploymentClass:
            names: ["default-worker"]
      jsonPatches:
      - op: replace
        path: /spec/template/spec/imageName
        valueFrom:
          variable: imageId
  - name: controlPlaneMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: hcloudControlPlaneMachineType
  - name: workerMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          machineDeploymentClass:
            names: ["default-worker"]
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: hcloudWorkerMachineType
  - name: hcloudNetwork
    enabledIf: "{{ if .hcloudNetwork.enabled }}true{{end}}"
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/hcloudNetwork
        valueFrom:
          variable: hcloudNetwork
  # The at-rest encryption provider configuration, appended here rather than written
  # into the control-plane template, because its Secret name has to carry THIS
  # cluster's name.
  #
  # WHY A PATCH AND NOT A LITERAL. A ClusterClass is shared by every cluster of its
  # class, so a Secret named in a template is one object serving all of them. v2
  # named `secret-encryption-config` in platform-capi and that is exactly what it
  # was: one key for N clusters, where the first rotation makes every other
  # cluster's etcd undecryptable. The key is per cluster by ADR-100 and per cluster
  # in the escrow by ADR-076, so its delivery object has to be per cluster too.
  #
  # WHY APPEND AND NOT REPLACE. A JSON patch that edits a file already in the list
  # needs an index, `/files/0/contentFrom/secret/name`. Indices are positional: the
  # day someone inserts a file above it, the patch rewrites that file's Secret
  # reference instead and the enc.yaml entry keeps the shared name. Appending owns
  # the whole entry and has no index to be wrong about.
  #
  # NOTHING RECONCILES THE SECRET ITSELF. It is written once by
  # `kakt encryption enable` from the key in this cluster's escrow. A value that
  # must not change under a running control plane has no business being reasserted
  # on a timer, which is why the ExternalSecret that used to do it was removed.
  - name: secretEncryptionConfig
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta1
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/files/-
        valueFrom:
          # 0600 and root: it is the key to every Secret in the cluster, and the API
          # server reads it as root before any workload exists.
          template: |
            {
              "path": "/etc/kubernetes/enc/enc.yaml",
              "owner": "root",
              "permissions": "0600",
              "contentFrom": {
                "secret": {
                  "name": "{{ .builtin.cluster.name }}-encryption-config",
                  "key": "enc.yaml"
                }
              }
            }
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerClusterTemplate
metadata:
  name: hetzner-mgmt-ubuntu-cluster
  namespace: platform-capi
spec:
  template:
    spec:
      controlPlaneEndpoint:
        host: ""
        # ADR-046 §25.1: 6443, NOT 443. controlPlaneEndpoint.port becomes the LB's
        # listen port for the apiserver, and a Hetzner LB cannot carry two services
        # on one listen_port. Leaving this at 443 silently discards the
        # extraServices 443 entry below — the defect that left the spoke without
        # HTTPS ingress from §17.4 until §25.
        port: 6443
      controlPlaneLoadBalancer:
        enabled: true
        type: lb11
        region: hel1
        port: 6443
        # ADR-046 §25.3: public ingress rides the CAPH-managed LB so it is owned by
        # the cluster lifecycle and deleted with the cluster (§23), instead of a
        # CCM `type: LoadBalancer` Service whose address can be recycled onto an
        # unrelated cluster's apiserver while DNS still points at it.
        #
        # destinationPort == listenPort: the hub proxy binds these ports on the host
        # pinned to the control-plane node (§25.2 — the only server CAPH can target
        # on a hybrid hub; home workers carry unmanaged:// providerIDs).
        #
        # NOTE: extraServices exposes only {protocol,listenPort,destinationPort} —
        # there is no proxyProtocol field, so PROXY protocol is OFF (§17.4).
        extraServices:
        - protocol: tcp
          listenPort: 80
          destinationPort: 80
        - protocol: tcp
          listenPort: 443
          destinationPort: 443
      controlPlaneRegions: []
      hcloudNetwork:
        enabled: true
        cidrBlock: "10.0.0.0/16"
        networkZone: eu-central
      hetznerSecretRef:
        name: hetzner-credentials
        key:
          hcloudToken: hcloud
          sshKey: hcloud-ssh-key-name
      sshKeys:
        hcloud:
          - name: zero-ops-mac-mini-debug
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
# v2 rather than an edit (2026-10-02, ADR-003 section 6).
#
# At-rest encryption of Kubernetes Secrets is an API server argument plus a file on
# every control-plane node, so it changes this template's spec — and this file
# already records that KubeadmControlPlaneTemplate.spec is immutable. A new NAME
# avoids an apply the webhook rejects, which would otherwise leave the provisioner
# deleting and recreating a template the running cluster references.
#
# Adopting it ROLLS THE MANAGEMENT CLUSTER's control plane. The provider is only
# picked up by a process start, and the management cluster is where the secret
# store's own credentials, the identity provider's, and every tenant's provisioning
# material live: see docs/runbooks/encrypt-secrets-at-rest.md.
kind: KubeadmControlPlaneTemplate
metadata:
  name: hetzner-mgmt-control-plane-v5
  namespace: platform-capi
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              cloud-provider: external
              # Kubernetes Secrets are encrypted at rest (ADR-003 section 6).
              #
              # THIS IS THE LINE v3 DELIBERATELY WITHHELD, and on this cluster it is
              # the riskiest line in the file: it makes the API server REQUIRE
              # /etc/kubernetes/enc/enc.yaml, and a management plane that does not
              # start is the thing every other cluster is repaired from.
              #
              # The spoke cleared the v3 gate first, on 2026-10-05, which is the whole
              # reason this is acceptable here: the render was observed on a real
              # replaced node before any API server depended on it.
              #
              # THE HUB STILL GOES SECOND. Roll the spoke to v4 and confirm encrypted
              # writes in etcd BEFORE adopting this class. A failed roll on a workload
              # cluster leaves this cluster up to repair it; the reverse does not hold.
              #
              # And unlike the spoke's, THIS class is synced by nothing -- it lives in
              # the CLI's embedded assets and reaches a cluster only through
              # `kakt encryption enable --apply-class`. Promoting a bundle does not
              # adopt it.
              encryption-provider-config: /etc/kubernetes/enc/enc.yaml
              oidc-issuer-url: https://auth.dev.nutgraf.in
              oidc-client-id: d32a30f0-f2b1-4a11-b3e9-d1e0aec4af6d
              oidc-username-claim: email
              oidc-groups-claim: groups
              # Concurrency caps, sized for a 2 vCPU control plane.
              #
              # The defaults (400 / 200) are for a machine with cores to spare.
              # Here the API server is the largest consumer on the node by a wide
              # margin -- 2180 MiB of 3809 MiB allocatable and 329m at rest,
              # spiking far higher while ArgoCD reconciles fifty Applications --
              # and when it saturates, it stops answering fast enough for the
              # leases its own control plane depends on. Admitting less work
              # concurrently is what keeps those answers inside their deadline;
              # the queued requests wait rather than failing.
              max-requests-inflight: "200"
              max-mutating-requests-inflight: "100"
            # The API server runs as a static pod, so a path outside the directories
            # kubeadm already mounts is invisible to it. Without this the process
            # fails to start on a file that exists on the node, which reads as a
            # missing file rather than a missing mount.
            extraVolumes:
              - name: secret-encryption-config
                hostPath: /etc/kubernetes/enc
                mountPath: /etc/kubernetes/enc
                readOnly: true
                pathType: DirectoryOrCreate
          controllerManager:
            extraArgs:
              cloud-provider: external
              # Leader election, relaxed -- and on this topology that costs
              # nothing.
              #
              # These components crash-looped here: 26 restarts on the
              # controller-manager, 23 on the scheduler, every one of them
              #
              #   error retrieving resource lock kube-system/kube-controller-manager:
              #     Get .../leases/...?timeout=5s: context deadline exceeded
              #   failed to renew lease: timed out waiting for the condition
              #   "leaderelection lost"
              #
              # The 5s request timeout is renewDeadline/2. Under load the API
              # server on the same 2 vCPU node cannot answer a lease GET inside
              # it, so the component concludes it lost an election it was the
              # only candidate in, exits, and takes every controller with it.
              # A Deployment stayed at observedGeneration=1 for a spec written
              # minutes earlier because nothing was running to act on it.
              #
              # The hub runs ONE control-plane replica (ADR-046's topology
              # table). There is no second instance to fail over to, so a short
              # renew deadline buys no availability whatsoever -- it only decides
              # how quickly a transient API stall becomes a crash loop. Raising
              # it trades failover speed that does not exist for tolerance that
              # is needed.
              leader-elect-lease-duration: 60s
              leader-elect-renew-deadline: 40s
              leader-elect-retry-period: 10s
          scheduler:
            extraArgs:
              # Same reasoning as controllerManager above, same failure, same
              # single-replica topology.
              leader-elect-lease-duration: 60s
              leader-elect-renew-deadline: 40s
              leader-elect-retry-period: 10s
          etcd:
            local:
              dataDir: /var/lib/etcd
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              max-pods: "120"
              resolv-conf: /etc/kubernetes/resolv.conf
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              max-pods: "120"
              resolv-conf: /etc/kubernetes/resolv.conf
        files:
          # THE ENCRYPTION PROVIDER CONFIGURATION IS NOT LISTED HERE. The
          # `secretEncryptionConfig` patch above appends it, because its Secret name
          # has to carry this cluster's name and a template is shared by every
          # cluster of its class. v2 named `secret-encryption-config` here, which is
          # one object in platform-capi for every cluster of this class (ADR-100).
          #
          # On the first build that Secret lives in the temporary bootstrap cluster;
          # after the pivot it lives here and a replacement node is provisioned by a
          # control plane that already holds the file on disk. On a full rebuild it
          # comes from the escrow (ADR-076 `secret-encryption-key`) — a new key
          # against a restored etcd would leave every Secret in it undecryptable.
          # ADR-046 invariant 6. Cilium builds its VXLAN tunnel endpoint from the
          # node's InternalIP. A home-lab worker's only InternalIP is its tailnet
          # address, and it cannot route the hub CP's Hetzner private IP — from a
          # home node, `ip route get 10.0.0.3` leaves via the house gateway. Pod
          # traffic is then dead in one direction and anything cross-node fails
          # (CNPG reports it as "Instance Status Extraction Error").
          #
          # So the control plane must advertise its TAILNET address as node-ip,
          # exactly as the spoke CP already does (spokepool-clusterclass-v1.yaml).
          #
          # These files are inert on a pure-Hetzner hub: the secret is created with
          # empty values there, and every command below is guarded on
          # `[ -s /etc/tailscale-hostname ]`.
          - path: /etc/tailscale-authkey
            owner: root
            permissions: "0600"
            contentFrom:
              secret:
                name: tailscale-hybrid-psk
                key: authkey
          - path: /etc/tailscale-hostname
            owner: root
            permissions: "0600"
            contentFrom:
              secret:
                name: tailscale-hybrid-psk
                key: hostname
          - path: /usr/local/bin/dynamic-node-ip.sh
            owner: root
            permissions: "0755"
            content: |
              #!/bin/sh
              # Re-assert kubelet --provider-id and --node-ip.
              # Idempotent, and survives kubeadm upgrades, which rewrite kubeadm-flags.env.
              #
              # ORDER IS LOAD-BEARING. Everything that does not need tailscale runs
              # before anything that does, because the tailscale checks below exit 0.
              # The providerID block used to sit AFTER them, so on a node where
              # tailscaled was slow or absent this script set no providerID and
              # reported success -- the same failure that cost the spoke a
              # control-plane roll, where the block was missing outright.
              FLAGS=/var/lib/kubelet/kubeadm-flags.env
              [ -f "$FLAGS" ] || exit 0

              # Self-assign providerID from Hetzner metadata.
              #
              # Once --node-ip is a tailnet address the Hetzner CCM refuses to
              # initialise the node: the cloud-node-controller validates
              # alpha.kubernetes.io/provided-node-ip against the addresses the cloud
              # reports (ExternalIP 37.x, InternalIP 10.0.x) and fails with
              #   provided node ip ... is not valid: failed to get node address from
              #   cloud provider that matches ip: 100.x.x.x
              # so it never writes .spec.providerID. CAPI matches Machines to Nodes
              # BY providerID, so the Machine keeps an empty NODENAME and pivot-move
              # times out on "all machines joined".
              #
              # The instance id is authoritative and available from the metadata
              # service on the node itself, so kubelet can set providerID directly and
              # the CCM is no longer on the critical path for it. It is also why this
              # runs before the tailscale gates: nothing here needs the tailnet.
              if ! grep -q '\-\-provider-id=' "$FLAGS"; then
                ID="$(curl -fsS --max-time 5 http://169.254.169.254/hetzner/v1/metadata/instance-id 2>/dev/null)"
                if [ -n "$ID" ]; then
                  sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--provider-id=hcloud:\/\/${ID} /g" "$FLAGS"
                fi
              fi

              # --node-ip = tailnet IPv4. From here down tailscale is required, and
              # its absence is not an error: kubelet keeps the address it had.
              TS_BIN="${TS_BIN:-$(command -v tailscale 2>/dev/null || echo /opt/bin/tailscale)}"
              [ -x "$TS_BIN" ] || exit 0
              TS_IP="$($TS_BIN ip -4 2>/dev/null)" || exit 0
              [ -n "$TS_IP" ] || exit 0
              sed -i "s/ --node-ip=[0-9.]*//g" "$FLAGS"
              sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--node-ip=${TS_IP} /g" "$FLAGS"
              exit 0
          - path: /etc/systemd/system/kubelet.service.d/10-dynamic-node-ip.conf
            owner: root
            permissions: "0644"
            content: |
              [Unit]
              After=tailscaled.service
              Wants=tailscaled.service

              [Service]
              ExecStartPre=/usr/local/bin/dynamic-node-ip.sh
          - path: /etc/sysctl.d/99-cilium.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              net.ipv4.conf.lxc*.rp_filter = 0
          - path: /etc/modules-load.d/crio.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              overlay
              br_netfilter
          - path: /etc/sysctl.d/99-kubernetes-cri.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              net.bridge.bridge-nf-call-iptables  = 1
              net.bridge.bridge-nf-call-ip6tables = 1
              net.ipv4.ip_forward                 = 1
          - path: /etc/sysctl.d/99-kubelet.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              vm.overcommit_memory=1
              kernel.panic=10
              kernel.panic_on_oops=1
          - path: /etc/kubernetes/resolv.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              nameserver 1.1.1.1
              nameserver 1.0.0.1
              nameserver 2606:4700:4700::1111
          - content: |
              [Unit]
              Description=containerd container runtime
              Documentation=https://containerd.io
              After=network.target local-fs.target dbus.service

              [Service]
              ExecStartPre=-/sbin/modprobe overlay
              ExecStart=/usr/local/bin/containerd

              Type=notify
              Delegate=yes
              KillMode=process
              Restart=always
              RestartSec=5

              LimitNPROC=infinity
              LimitCORE=infinity
              TasksMax=infinity
              OOMScoreAdjust=-999

              [Install]
              WantedBy=multi-user.target
            owner: root:root
            path: /etc/systemd/system/containerd.service
            permissions: "0744"
        preKubeadmCommands:
          - set -x
          - export CONTAINERD=2.4.2
          - export RUNC=1.5.2
          - export TAILSCALE=1.104.4
          - export KUBERNETES_VERSION=1.35.10
          - export TRIMMED_KUBERNETES_VERSION=1.35
          - ARCH="$(dpkg --print-architecture)"
          - localectl set-locale LANG=en_US.UTF-8
          - localectl set-locale LANGUAGE=en_US.UTF-8
          - apt-get update -y
          - sed -i '/swap/d' /etc/fstab
          - swapoff -a
          - modprobe overlay && modprobe br_netfilter && sysctl --system
          - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.$ARCH
          - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.sha256sum
          - sha256sum --check --ignore-missing runc.sha256sum
          - install runc.$ARCH /usr/local/sbin/runc
          - rm -f runc.$ARCH runc.sha256sum
          - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz
          - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
          - sha256sum --check containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
          - tar -zxf containerd-$CONTAINERD-linux-$ARCH.tar.gz -C /usr/local
          - rm -f containerd-$CONTAINERD-linux-$ARCH.tar.gz containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
          - mkdir -p /etc/containerd
          - containerd config default > /etc/containerd/config.toml
          - sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
          - systemctl daemon-reload && systemctl enable containerd && systemctl start containerd
          - mkdir -p /etc/apt/keyrings/
          - curl -fsSL https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
          - apt-get update
          - apt-get install -y kubelet="$KUBERNETES_VERSION-*" kubeadm="$KUBERNETES_VERSION-*" kubectl="$KUBERNETES_VERSION-*" && apt-mark hold kubelet kubectl kubeadm && systemctl enable kubelet
          - kubeadm config images pull --kubernetes-version $KUBERNETES_VERSION
          - echo 'source <(kubectl completion bash)' >>/root/.bashrc
          - echo 'export KUBECONFIG=/etc/kubernetes/admin.conf' >>/root/.bashrc
          - apt-get -y autoremove && apt-get -y clean all
          # Tailscale must be up BEFORE kubeadm registers the node, so the kubelet's
          # first registration already carries the tailnet node-ip.
          #
          # EVERY step is guarded on a non-empty hostname file, including the install
          # itself. A pure-Hetzner hub gets the empty Secret, so it downloads nothing
          # and runs no daemon — the files above are present but inert. (The shared
          # spoke ClusterClass still installs unconditionally; not changed here
          # because that is a separately tested path.)
          - 'if [ -s /etc/tailscale-hostname ]; then curl -fsSLO https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE}_$ARCH.tgz && echo "$(curl -fsSL https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE}_$ARCH.tgz.sha256)  tailscale_${TAILSCALE}_$ARCH.tgz" | sha256sum --check && tar -xzf tailscale_${TAILSCALE}_$ARCH.tgz && install tailscale_${TAILSCALE}_$ARCH/tailscale /usr/bin/tailscale && install tailscale_${TAILSCALE}_$ARCH/tailscaled /usr/sbin/tailscaled && install -m 0644 tailscale_${TAILSCALE}_$ARCH/systemd/tailscaled.service /etc/systemd/system/tailscaled.service && install -m 0644 tailscale_${TAILSCALE}_$ARCH/systemd/tailscaled.defaults /etc/default/tailscaled && rm -rf tailscale_${TAILSCALE}_$ARCH tailscale_${TAILSCALE}_$ARCH.tgz && systemctl daemon-reload; fi'
          - 'if [ -s /etc/tailscale-hostname ]; then systemctl enable --now tailscaled || true; fi'
          - 'if [ -s /etc/tailscale-hostname ]; then tailscale up --authkey="$(cat /etc/tailscale-authkey)" --hostname="$(cat /etc/tailscale-hostname)" --accept-dns=false; fi'
          - 'if [ -s /etc/tailscale-hostname ]; then for i in $(seq 1 30); do tailscale ip -4 >/dev/null 2>&1 && break; sleep 2; done; fi'
          # ADR-046 §WS0.1: Tailscale is a NODE-LEVEL UNDERLAY ONLY. No
          # --advertise-routes and no --accept-routes: tailscaled would install pod
          # CIDRs into table 52 and collide with Cilium's datapath (addendum 17.1).
          - 'if [ -s /etc/tailscale-hostname ]; then echo "tailnet IP: $(tailscale ip -4)"; else echo "tailscale: disabled (no hostname)"; fi'
        postKubeadmCommands:
          # kubeadm wrote kubeadm-flags.env during init, before tailscale existed on
          # the very first boot. Re-assert node-ip + provider-id and restart so the
          # Node advertises the tailnet address home workers can actually reach.
          - 'if [ -s /etc/tailscale-hostname ]; then systemctl daemon-reload && /usr/local/bin/dynamic-node-ip.sh && systemctl restart kubelet; fi'
          # With a tailnet node-ip the CCM cannot validate the address and leaves
          # node.cloudprovider.kubernetes.io/uninitialized in place forever, so
          # nothing can schedule. Clearing it is idempotent and is exactly what the
          # spoke ClusterClass already does (spokepool-clusterclass-v1.yaml).
          - 'if [ -s /etc/tailscale-hostname ]; then kubectl --kubeconfig=/etc/kubernetes/admin.conf taint nodes --all node.cloudprovider.kubernetes.io/uninitialized- || true; fi'
          # ADR-046 §23 item 2 / §25.4: kubeadm sets this on control-plane nodes and
          # the CCM honours it by registering no backends. It does NOT affect the
          # CAPH-managed LB (CAPH registers server targets regardless), so it is not
          # on the §25 ingress path — mirrored from the spoke ClusterClass so any
          # future CCM `type: LoadBalancer` Service on the hub can reach the only
          # Hetzner node.
          - 'kubectl --kubeconfig=/etc/kubernetes/admin.conf label nodes --all node.kubernetes.io/exclude-from-external-load-balancers- || true'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: hetzner-mgmt-ubuntu-control-plane-machine
  namespace: platform-capi
spec:
  template:
    spec:
      type: cx33
      imageName: ubuntu-24.04
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: hetzner-mgmt-worker-bootstrap-v2
  namespace: platform-capi
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
            max-pods: "220"
            resolv-conf: /etc/kubernetes/resolv.conf
            # workload-location is half of the ADR-046 §11 placement class, and it
            # was missing here while every hub overlay selected on it.
            #
            # manifests/hub-core-services/providers/hetzner/{database,redis}
            # pin `workload-location: hetzner`, and no hub node carried the label --
            # so on a pure-Hetzner hub platform-db selected a label nothing had and
            # stayed Pending. The spoke ClusterClass has always set it
            # (spokepool-clusterclass-v1.yaml); the hub class never did, and the
            # assumption is written down in the CSI manifest: "No-op on a
            # pure-Hetzner hub, where no node carries workload-location."
            #
            # node-role.kubernetes.io/worker is NOT set here: NodeRestriction
            # forbids a kubelet self-registering a node-role label. It arrives from
            # the node-labeler DaemonSet instead (internal/assets/manifests/addons).
            node-labels: "workload-location=hetzner"
      files:
        - path: /etc/sysctl.d/99-cilium.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            net.ipv4.conf.lxc*.rp_filter = 0
        - path: /etc/modules-load.d/crio.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            overlay
            br_netfilter
        - path: /etc/sysctl.d/99-kubernetes-cri.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            net.bridge.bridge-nf-call-iptables  = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward                 = 1
        - path: /etc/sysctl.d/99-kubelet.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            vm.overcommit_memory=1
            kernel.panic=10
            kernel.panic_on_oops=1
        - path: /etc/kubernetes/resolv.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            nameserver 1.1.1.1
            nameserver 1.0.0.1
            nameserver 2606:4700:4700::1111
        - content: |
            [Unit]
            Description=containerd container runtime
            Documentation=https://containerd.io
            After=network.target local-fs.target dbus.service

            [Service]
            ExecStartPre=-/sbin/modprobe overlay
            ExecStart=/usr/local/bin/containerd

            Type=notify
            Delegate=yes
            KillMode=process
            Restart=always
            RestartSec=5

            LimitNPROC=infinity
            LimitCORE=infinity
            TasksMax=infinity
            OOMScoreAdjust=-999

            [Install]
            WantedBy=multi-user.target
          owner: root:root
          path: /etc/systemd/system/containerd.service
          permissions: "0744"
      preKubeadmCommands:
        - set -x
        - export CONTAINERD=2.4.2
        - export RUNC=1.5.2
        - export KUBERNETES_VERSION=1.35.10
        - export TRIMMED_KUBERNETES_VERSION=1.35
        - ARCH="$(dpkg --print-architecture)"
        - localectl set-locale LANG=en_US.UTF-8
        - localectl set-locale LANGUAGE=en_US.UTF-8
        - apt-get update -y
        - sed -i '/swap/d' /etc/fstab
        - swapoff -a
        - modprobe overlay && modprobe br_netfilter && sysctl --system
        - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.$ARCH
        - curl -fsSLO https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.sha256sum
        - sha256sum --check --ignore-missing runc.sha256sum
        - install runc.$ARCH /usr/local/sbin/runc
        - rm -f runc.$ARCH runc.sha256sum
        - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz
        - curl -fsSLO https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - sha256sum --check containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - tar -zxf containerd-$CONTAINERD-linux-$ARCH.tar.gz -C /usr/local
        - rm -f containerd-$CONTAINERD-linux-$ARCH.tar.gz containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
        - systemctl daemon-reload && systemctl enable containerd && systemctl start containerd
        - mkdir -p /etc/apt/keyrings/
        - curl -fsSL https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
        - apt-get update
        - apt-get install -y kubelet="$KUBERNETES_VERSION-*" kubeadm="$KUBERNETES_VERSION-*" kubectl="$KUBERNETES_VERSION-*" && apt-mark hold kubelet kubectl kubeadm && systemctl enable kubelet
        - apt-get -y autoremove && apt-get -y clean all
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: hetzner-mgmt-ubuntu-worker-machine
  namespace: platform-capi
