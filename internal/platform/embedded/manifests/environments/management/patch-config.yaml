apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-bootstrap-config
  namespace: platform-ops
data:
  CLUSTER_ID: "hub-dev"
  # The management secret scope (ADR-111 Revision 7 §2), the same value the
  # HubEnvironment beside this file declares. Overwritten at render from
  # `management.infisicalEnvironmentSlug` so one input reaches both.
  INFISICAL_ENVIRONMENT_SLUG: "management"
  INFISICAL_PROJECT_SLUG: "hub-platform"
  INFISICAL_SECRETS_PROJECT_SLUG: "hub-secrets"
  CLUSTER_REGION: ""
