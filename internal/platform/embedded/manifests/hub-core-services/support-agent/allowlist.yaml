# What the Support Agent may collect, and what it may emit.
#
# ADR-077 makes this the privacy boundary. Not anonymisation: hashing a cluster
# name leaves identifying material in labels, image references, node names,
# annotations, addresses and error strings, so the bound has to be what is
# gathered rather than how it is disguised.
#
# Two levels, and both are needed:
#
#   collectors  -- WHERE evidence comes from, and the schema of what comes back.
#                  Each runs a defined query whose result shape is known in
#                  advance. An agent that issued a caller-supplied query and
#                  shipped the response would have an allowlist filtering labels
#                  over an unbounded payload, which is a preference rather than
#                  a boundary.
#   emit        -- WHICH fields of that known schema leave the cluster. Default
#                  exclusion: a field nobody listed is a field that does not go.
#
# Every entry carries why it is collected. An unannotated list of two hundred
# fields is not a contract anyone can check; it is a list nobody reads. The
# spoke catalogue's field declaration already works this way and says why.
#
# The tenant may SUBTRACT from this in their cluster values (`support.deny`).
# The platform can only add by publishing a bundle version, which reaches them
# as a pull request they merge or do not (ADR-064).
apiVersion: v1
kind: ConfigMap
metadata:
  name: support-agent-allowlist
  namespace: platform-ops
  labels:
    app.kubernetes.io/name: support-agent
    app.kubernetes.io/component: support
data:
  allowlist.yaml: |
    # ── Platform identity and version ──────────────────────────────────────
    # ADR-067: the bundle version and the component versions it resolved to are
    # what a maintenance proposal is reasoned from. Without them a support case
    # begins by asking the tenant what they are running.
    - collector: bundle-version
      source:
        kind: artefact
        path: clusters/*/bundle.yaml
      schema: [bundleVersion, chart, targetRevision]
      emit: [bundleVersion, targetRevision]

    # ── Reconciliation health ──────────────────────────────────────────────
    # Whether what the tenant declared is what is running. Drift and sync
    # failure are the first thing any platform diagnosis needs.
    - collector: application-health
      source:
        kind: metrics
        namespace: platform-ops
        service: argocd-applicationset-controller-metrics
        port: 8080
        query: argocd_app_info
      schema: [name, project, sync_status, health_status, dest_server]
      # NOT `name`: an Application's name can carry a tenant's own naming, and
      # the counts and statuses answer "is this box reconciling" without it.
      emit: [project, sync_status, health_status]

    # ── Policy state ───────────────────────────────────────────────────────
    # ADR-067 names policy violations explicitly. The count and the policy are
    # platform facts; the resource that violated one is the tenant's.
    - collector: policy-violations
      source:
        kind: metrics
        namespace: platform-ops
        service: kyverno-reports-controller-metrics
        port: 8080
        query: kyverno_policy_results_total
      schema: [policy_name, policy_type, rule_result, resource_namespace, resource_name]
      emit: [policy_name, policy_type, rule_result]

    # ── Certificate expiry ─────────────────────────────────────────────────
    # A certificate nobody renewed is the most common way a healthy-looking box
    # stops serving, and it is entirely predictable from this one series.
    - collector: certificate-expiry
      source:
        kind: metrics
        namespace: platform-ops
        service: cert-manager-metrics
        port: 8080
        query: certmanager_certificate_expiration_timestamp_seconds
      # `value` is the sample's own number. The expiry is the series' VALUE and no
      # label carries it, so a schema naming `expiration_timestamp` projected
      # nothing under a field that read as reviewed -- the one number this
      # collector exists for never left the box.
      schema: [name, namespace, issuer_name, value]
      # The DNS names on a certificate are the tenant's hostnames. The expiry and
      # the issuer are what support needs.
      emit: [issuer_name, value]

    # ── Backup health ──────────────────────────────────────────────────────
    # ADR-014 makes the platform responsible for the databases it ships, and
    # ADR-077 names this series as the evidence. A backup that silently stopped is
    # a fault the tenant cannot be expected to notice and the platform cannot be
    # accountable for without seeing.
    #
    # ONE COLLECTOR PER CLUSTER, because `service` is one name and a box runs one
    # cluster per platform application (ADR-112). A Service selecting every CNPG
    # pod in the namespace would be worse than this repetition: a scrape resolves
    # to a single endpoint, so it would report one arbitrary cluster's backup as
    # though it covered all of them.
    #
    # Each cluster's instance exporter is reached through a Service declared beside
    # the cluster itself, in <application>/database/, so an application that ships
    # its database ships the thing that watches it.
    - collector: backup-health-infisical
      source:
        kind: metrics
        namespace: platform-data
        service: infisical-db-metrics
        port: 9187
        query: cnpg_collector_last_available_backup_timestamp
      # `value` is the sample's own number: the timestamp is the series' value and
      # no label carries it. The cluster is this collector's own name, so nothing
      # here depends on a label the exporter may or may not attach.
      schema: [value]
      emit: [value]

    - collector: backup-health-zitadel
      source:
        kind: metrics
        namespace: platform-data
        service: zitadel-db-metrics
        port: 9187
        query: cnpg_collector_last_available_backup_timestamp
      # `value` is the sample's own number: the timestamp is the series' value and
      # no label carries it. The cluster is this collector's own name, so nothing
      # here depends on a label the exporter may or may not attach.
      schema: [value]
      emit: [value]

    - collector: backup-health-grafana
      source:
        kind: metrics
        namespace: platform-data
        service: grafana-db-metrics
        port: 9187
        query: cnpg_collector_last_available_backup_timestamp
      # `value` is the sample's own number: the timestamp is the series' value and
      # no label carries it. The cluster is this collector's own name, so nothing
      # here depends on a label the exporter may or may not attach.
      schema: [value]
      emit: [value]

    - collector: backup-health-credits
      source:
        kind: metrics
        namespace: platform-data
        service: credits-db-metrics
        port: 9187
        query: cnpg_collector_last_available_backup_timestamp
      # `value` is the sample's own number: the timestamp is the series' value and
      # no label carries it. The cluster is this collector's own name, so nothing
      # here depends on a label the exporter may or may not attach.
      schema: [value]
      emit: [value]

    # ── Node capacity ──────────────────────────────────────────────────────
    # Pressure and allocatable capacity, which is what an upgrade pre-flight
    # verdict (ADR-067) is reasoned from.
    - collector: node-pressure
      source:
        kind: metrics
        # kube-state-metrics, NOT metrics-server. kube_node_status_condition is a
        # kube-state-metrics series; metrics-server's own /metrics describes
        # metrics-server, so this collector returned nothing on every box and said
        # so only in the payload's Skipped map (ADR-077 addendum 4, decision 13).
        #
        # kube-state-metrics is required collection machinery, not part of the
        # selectable observability capability (ADR-066 addendum 4), and it lives in
        # platform-ops rather than platform-observability for that reason. So this
        # dependency survives a tenant disabling the backend -- which is what
        # ADR-078 §8 requires of anything support evidence rests on -- and the
        # collector names no namespace gate 82 forbids.
        namespace: platform-ops
        service: kube-state-metrics
        port: 8080
        query: kube_node_status_condition
      schema: [node, condition, status]
      # NOT `node`: a node name carries the cluster name and often the tenant's.
      # The condition counts say whether this box is under pressure.
      emit: [condition, status]
