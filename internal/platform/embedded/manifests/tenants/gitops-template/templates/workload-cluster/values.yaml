# What this cluster was declared as -- the RECORD of it, not its controls.
#
# Nothing renders from this file. The chart reads the management cluster's
# values.yaml, applications declare themselves in environments/<env>/<app>/, and
# what this cluster actually runs is its claim, infrastructure/spokepool.yaml. So
# every value here is read by people and by the CLI, and editing one changes
# nothing on the cluster by itself; the per-value notes below say where the
# control is.
#
# It is kept because a cluster that is only a claim cannot say who owns it, which
# stage it serves, or what it was sized as -- and `kakt tenant add-cluster` has
# all three at declaration time.
# The tenant that owns this cluster (ADR-064). Written here rather than inferred
# from the repository name because a cluster instance names exactly one owning
# tenant, and a validator cannot assert that about a fact it has to guess.
tenantId: <TENANT_ID>

# This cluster's name.
#
# Written here rather than left for the chart to derive. What the chart derives
# when this is absent is `<environmentSlug>-<provider>`, which is identical on
# every cluster built from the same pair -- a category, not a name. The hub's
# values.yaml carries it for the same reason and says so at greater length.
#
# It is one of three independent facts, and conflating any two of them removes a
# capability the platform has:
#
#   clusterName      this Kubernetes cluster, one of a kind. Keys the WAL archive
#                    prefix, the node and object names, and the escrow scope of
#                    this incarnation (ADR-111 1).
#   environmentSlug  which promotion stage this cluster serves. Several clusters
#                    may serve one (ADR-082), which is what lets a replacement
#                    cluster be built, restored and verified beside the one it
#                    replaces before anything is cut over.
#   cellId           where an application goes, declared by the application in
#                    environments/<env>/<app>/values.yaml. The cluster publishes
#                    it as a label; the application names it.
clusterName: <CLUSTER_NAME>

# The promotion stage this cluster serves.
#
# NOT a destination. An application under environments/stg/ is not placed here
# because this says `stg` -- it is placed on the cell it names, and this is what
# says that cell is a legitimate home for a staging application. Two clusters may
# carry the same slug.
environmentSlug: <ENVIRONMENT>
provider: <CLOUD_PROVIDER>
region: <CLOUD_REGION>
environmentRevision: <BUNDLE_VERSION>
# The ACME issuer this cluster's public certificates come from, as declared.
#
# The issuer in force is the box's: boundary 06 reads the management cluster's
# `publicTlsIssuer`, because one ArgoCD serves every cluster in the repository.
publicTlsIssuer: <PUBLIC_TLS_ISSUER>
# Cloud worker nodes this cluster was declared with, as `kakt tenant add-cluster
# --workers` set them.
#
# A record, not the control. The count the cluster runs is nodePool.count in
# infrastructure/spokepool.yaml; to scale, edit that and commit.
# Nothing scales it for you, so a node briefly unreachable does not answer with
# a bill. A hybrid cluster buys no cloud workers: its capacity is the machines
# listed in that same file.
workers: <WORKER_COUNT>



platformRepoURL: <PLATFORM_REPO_URL>

# This repository, recorded for the same reason as the rest of this file. It is
# the management cluster's own values.yaml that boundaries 05 and 06 read it from
# (ADR-062), and the chart refuses to render without it there.
instanceRepoURL: <GITOPS_REPO_URL>

# Cells group this tenant's clusters for policy (ADR-064). A cell is a label:
# it holds no compute, pins no version, and owns nothing. A cluster may belong to
# several and receives the union of their policy.
cells: []

workloads: {}
# Where this cluster's stateful services run (ADR-046 §11, ADR-075).
#
# A placement class is a pair -- a `workload-location` nodeSelector and the
# storage class provisionable on nodes carrying it -- selected as one name so the
# two cannot drift:
#
#   hetzner  cloud nodes,   hcloud-volumes
#   hybrid   on-prem nodes, local-path
#
# Empty means this cluster's provider. Set `hybrid` once you have joined on-prem
# nodes and want your platform data on them.
#
# This is NOT a reschedule. local-path is node-pinned and has no snapshots, so a
# stateful service changing class is recreated and restored from backup. Read the
# migration runbook before editing this on a cluster that holds data.
placement:
  class: ""

# On-prem nodes (ADR-075). Machines on your own premises, joining this cluster
# over your Tailscale tailnet.
#
# A capability, not a property of the provider: enable it whenever you want the
# capacity, disable it when you do not. The datapath every box runs is already
# sized for it, so turning it on costs no cluster-wide change.
#
# Two things to know before enabling on a cluster that already exists. Nodes join
# the tailnet when they join the cluster, so existing nodes keep the addresses
# they registered with -- completing the arrangement means replacing the control
# plane. And the platform cannot see the other half: a machine on your premises,
# running the join. This value says the cluster will accept them.
onPrem:
  enabled: false
  # Your tailnet, e.g. acme.ts.net. Required when enabled.
  tailnet: ""

