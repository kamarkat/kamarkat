extends: default

rules:
  indentation:
    spaces: 2
    indent-sequences: whatever

  # Block scalars inside helmValues contain Lua code (ArgoCD health checks)
  # and YAML exemplars (resource.exclusions) with their own indentation rules.
  # Checking their content produces false positives. The outermost YAML
  # structure is validated by yq -P normalization. The Lua/YAML content
  # inside block scalars is validated at Helm render time by argo-cd chart.
  # check-multi-line-strings: true

  line-length:
    max: 120
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    level: warning

  document-start: disable

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  comments:
    min-spaces-from-content: 1

  empty-lines:
    level: warning

ignore: |
  # Helm chart templates (Go text/template) are validated by helm lint/kubeconform, not yamllint.
  # A GLOB, not a list of the charts that happen to exist today. Enumerating them
  # meant a new chart's templates were linted as plain YAML until someone
  # remembered to add a line -- which is how platform-spoke-gateway failed on its
  # first commit. The rule above is about a CLASS of file, so the pattern says so.
  manifests/tenants/charts/*/templates/
  manifests/argocd/environment-manager/templates/
  manifests/hub-core-services/*/templates/
  manifests/hub-core-services/**/charts/
  manifests/spoke/**/charts/
  spoke-catalog-hybrid/templates/
  internal/kube-sbt/providers/gitops/helm-chart/templates/
  # Go text/template assets are not valid plain YAML until rendered.
  internal/assets/manifests/addons/crs.yaml
  internal/assets/manifests/secrets/hetzner-credentials.yaml
  # Vendored upstream CRDs and install manifests. These are third-party content
  # reproduced verbatim so the platform can pin and mirror them; they are not
  # ours to reformat, and re-wrapping a line would make the next vendor bump a
  # conflict instead of a copy. They accounted for ~20k of the ~20.4k findings
  # this config produced before being listed here, which made the remaining four
  # real ones unreadable.
  manifests/spoke/spoke-catalog/infra/kyverno/crd.yaml
  manifests/spoke/spoke-catalog/infra/crds/
  manifests/spoke/spoke-catalog/infra/crossplane/crd.yaml
  manifests/spoke/spoke-catalog/infra/external-secrets/crd.yaml
  manifests/spoke/spoke-catalog/infra/cloudnative-pg/crd.yaml
  manifests/hub-core-services/eso/crds/
  internal/assets/manifests/core/
  # Auto-generated CRDs (from make manifests) — third-party schema descriptions
  # that cannot be wrapped without breaking kubectl apply / kubeconform.
  operators/hub-operator/config/crd/bases/ops.nutgraf.in_hubenvironments.yaml
  # Cloud-init runcmd blocks contain shell commands and URLs that cannot be
  # split across lines without breaking execution.
  internal/assets/manifests/classes/hetzner-mgmt-ubuntu-v1.yaml
  # Documentation, including snapshots taken during incident investigations.
  # These are records of what a file looked like at a moment, not manifests the
  # platform applies, and some are Go templates that never parse as plain YAML.
  docs/
